name: "RubyEvents"

services:
  rails-app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    # Start sshd through the devcontainers sshd feature's init script, then idle.
    # Without this, `docker compose up` runs a bare `sleep infinity` and leaves
    # port 2222 dead - only the devcontainer CLI runs the init script.
    command: /usr/local/share/ssh-init.sh sleep infinity
    depends_on:
      - typesense
    environment:
      - RAILS_ENV=development
      - NODE_ENV=development
      - TYPESENSE_HOST=typesense
      - TYPESENSE_PORT=8108
    ports:
      - "3000:3000"
      # The devcontainers sshd feature listens on 2222 *inside* the container
      # (see /etc/ssh/sshd_config), so the host port must map to 2222, not 22.
      - "2222:2222"
    volumes:
      - ..:/rubyevents:cached # Mounts the local project directory
      - node_modules:/rubyevents/node_modules # Prevents overwriting node_modules so yarn install works correctly
      # Orca-managed worktrees live here. A named volume (not a host bind) keeps
      # them container-local and survives container recreation - only
      # `docker compose down -v` discards them.
      - worktrees:/worktrees
    stdin_open: true
    tty: true

  typesense:
    image: typesense/typesense:29.0
    container_name: rubyevents-typesense
    restart: unless-stopped
    ports:
      - "8108:8108"
    volumes:
      - typesense-data:/data
    environment:
      - TYPESENSE_DATA_DIR=/data
      - TYPESENSE_ENABLE_CORS=true
    command: ["--data-dir", "/data", "--api-key", "xyz", "--enable-cors", "true"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8108/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  node_modules:
  typesense-data:
    driver: local
  worktrees:
    driver: local
