  description: |-
    Turbo and Hotwire can be some of the most effective tools to build user interfaces for the web, specially when used with Rails. However, shifting paradigms from Javascript-first frameworks like React back to server-side rendered HTML is not simple. The mental models, tools and techniques are different.

    In this workshop, we'll go back to the basics and revisit all the building blocks needed to create modern, interactive user experiences with Ruby on Rails using Turbo and Stimulus.

    We'll build an example application that will be progressively enhanced using different tools. To do that, we'll learn how to navigate Turbo and Stimulus' documentation, as well as the codebase for turbo-rails, which provides extra documentation and insights into how some pieces work.
  speakers:
    - Julián Pinzón Eslava
