  description: |-
    Your cleverest code is probably overfitting. A simple rule that ignores almost everything routinely beats a sophisticated model that uses all the data — and it's not a fluke, it's a theorem. We'll trace the same maths that explains overfitting in machine learning straight back to how minds make good decisions, and figure out what it says about every premature abstraction you've ever written. A talk about why throwing information away is sometimes the smartest thing you can do.
  speakers:
