  date: "2026-10-29"
  video_provider: "scheduled"
  video_id: "amy-delves-ruby-melbourne-2026-10-29"
  description: |-
    After many years, I've been having fun building out a few ruby based apps. This talk is about the lessons I've been learning along the way and how I've been tackling the problems encountered. It's a high level talk rather than going deep onto any specific topic involved.

    - Why Rails really isn't the answer.
    - Databases and storage.
    - Authentication and Authorisation.
    - Docker for local development.
    - Hosting in production.
    - What to tackle and leave out.
    - Marketing and getting users.
