  title: "Experiments in Engineering without reading code"
  date: "2026-10-29"
  video_provider: "scheduled"
  video_id: "ben-taylor-ruby-melbourne-2026-10-29"
  description: |-
    This year I've been trying to figure out whether it's possible to do high quality Engineering work without reading code. In 2025, using Vibe Coding, our Science Writers built 50 new interactive websites that help high school students understand Science. This was great, but it put a large burden on our engineering team. So we've started building automated systems to improve the quality of this work. This talk is about that process, and some other ways that I'm playing around with these ideas.

    I've previously delivered versions of this talk for AI Engineer, YOW! Tech Leaders, MelbJS, and PyConAU. I'll customise and update the talk for the Melbourne Ruby audience.
