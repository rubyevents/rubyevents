description: |-
  *Happy new year everyone.*

  Let's hang out next week. There's a bunch of things.

  Oleksandr Simonov proposed a short talk about the intricacies of using GraphQL in a replicated Postgres setup.

  We received a 300 USD grant from Ruby Central supporting the meetup activities, so continuous pizza supply is secured. And maybe we can get a meetup page going. Let's see if there are some ideas.

  Also, https://tallinn.ruby.ee is moving forward as a community hub, based on OnRuby. It currently needs some auth provider config, and i'm working on it so it will be available already during the meetup.

