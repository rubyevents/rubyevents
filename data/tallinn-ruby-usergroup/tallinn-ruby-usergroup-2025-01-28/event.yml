  nothing fixed really, but lightning talk kind of things are encouraged. One goal is to get a bunch together to go to next year's BalticRuby in Riga, so it's a good place to think about and practice a talk or workshop. Besides that it's more of a hang out, talk, meet, or possibly side project space.

