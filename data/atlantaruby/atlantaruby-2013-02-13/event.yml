description: |-
  The Atlanta Ruby Meetup is our monthly main event.

  Schedule:

  6:30-7:00 Food / Networking
  7:15 til ~9:00: Presentations

  We are meeting at the Centergy Building (Hodges Room, 3rd floor) in Tech Square, next to GA Tech (map (http://maps.google.com/maps?f=q&hl=en&geocode=&time=&date=&ttype=&q=75+5th+St+NW,+Atlanta,+Fulton,+Georgia+30308,+United+States&sll=33.776148,-84.384897&sspn=0.012967,0.007575&ie=UTF8&ll=33.776169,-84.386501&spn=0.012967,0.007575&z=17&iwloc=addr&om=1)).

  This month we'll be hearing from Brian Mann about his experience building large single page apps with Backbone.js (http://backbonejs.org) and Rails (http://rubyonrails.org). Also, James Dabbs (http://www.jdabbs.com) will be teaching us how to build FFI extensions (https://github.com/ffi/ffi).

  Stick around afterwards for a drinkup sponsored by CodeGuard (https://codeguard.com) at the Barrelhouse (http://www.barrelhouseatl.com).

  Interested in Speaking? Want to show off your Ruby project or Ruby-related technology? Want to suggest a topic? Let us know!

  Parking on the street is limited. If you are willing to walk a few blocks you can likely find a spot.
  There is $1.5/hour parking in a surface lot across the street near Barnes and Noble. Credit cards accepted. The once collapsed parking deck connected to the building is back in service! Cheapest parking is the surface lot across from The Cheetah, I believe they are $4/day cash only.

  The Midtown Marta station is a few blocks away, the Tech Trolley (free) runs from it to the door of the Centergy Building.
