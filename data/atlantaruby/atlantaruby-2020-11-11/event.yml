description: |-
  This month's VIRTUAL presentation is by our special guest Ayush Newatia:

  "You may have heard that cookies security is hard with the need to worry special flags and encryption. Actually, Ruby on Rails makes it super simple to securely store data in cookies. In this talk I'll explain the different types of cookies supported by Rails and what Rails does under the hood to secure the data they contain."

  Ayush has over 6 years of experience in software development. He worked on projects for world renowned brands such as Dyson and Tag Heuer and was also on the iOS team at TransferWise for 2 years. He now specialises in Ruby on Rails because its awesome and is excited to share about cookie security!

  Find him online at https://twitter.com/ayushn21

