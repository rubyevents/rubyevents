description: |-
  The Atlanta Ruby Meetup is our monthly main event.

  NOTE: We'll be doing another alternative format since last months format was a huge hit. I'm calling this one "Hidden Gems". Essentially, volunteers from the audience can sign up a gem they think is great but maybe isn't super well known. Each volunteer then gets 3 minutes to come up, pull up the GitHub readme, give an informal perspective as to why they love that gem, and take questions. NO prepared presentations!

  We're also going to be raffling away some Raspberry Pi units as well as a JetBrains annual IDE license. If you haven't come to the meetup in a while, this is probably a good one to restart with!

  ----

  We'll be at the Atlanta Tech Village community room courtesy of Atlanta Tech Village. Our food and drinks are now sponsored by Rigor. Additionally, parking will be validated for 2 hours courtesy of Rigor!

