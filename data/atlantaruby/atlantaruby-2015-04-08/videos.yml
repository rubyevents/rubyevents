  description: |-
    Did you really think you could make changes to the database by editing the schema file? Who are you, Amelia Bedelia?" The silly mistakes we all made when first learning Rails may be funny to us now, but we should remember how we felt at the time. New developers don't always realize senior developers were once beginners too and may assume they are the first and last developer to mix up when to use the rails and rake commands. This talk is a lighthearted examination of the kinds of common errors many Rails developers make and will dig into why so many of us make the same mistakes.

    A week before Railsconf 2015, Kylie Stradey, presented her practice run of her talk on helping beginners learn to program in Ruby, called “Amelia Bedelia Learns To Code,” inspired by the children’s series by Peggy Parish and Herman Parish (https://en.wikipedia.org/wiki/Amelia_Bedelia).

    You can learn more about Kylie’s journey to Railsconf on her blog post “Amelia Bedelia Learns to Rails Conf” at
    http://kyfast.net/talks/2015/05/14/amelia-bedelia-learns-to-railsconf.

    The first half of the video is the presentation and then starting at 19:24, the group discussion begins.

    Kylie is a regular contributor to the Atlanta Ruby community, works as a consultant at Big Nerd Ranch, and you can learn more about her latest activities at http://kyfast.net.

    This video was recorded at the April, 2015, meeting of the Atlanta Ruby Users’ Group. You can find the ATLRUG at http://www.atlrug.com. The video itself has been sponsored as part of Rietta’s Development Community Initiatives program, learn more at https://rietta.com/community.
