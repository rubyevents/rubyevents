  description: |-
    Ken Johnson, the Chief Technology Officer at nVisium.com, presents on the OWASP Rails Goat Project, an open source training project to help developers learn about appsec in a Rails context. In other words, it’s a vulnerable version of the Ruby on Rails Framework. It includes vulnerabilities from the OWASP Top 10, as well as some "extras" that the initial project contributors felt worthwhile to share. This project is designed to educate both developers, as well as security professionals.

    Learn more about Railsgoat at https://github.com/OWASP/railsgoat
    and https://www.owasp.org/index.php/OWASP_Rails_Goat_Project

    About nVisium at https://nvisium.com/

    Ken is on Twitter at https://twitter.com/cktricky and Github at https://github.com/cktricky

    This presentation was recorded at the September, 2014, meeting of the Atlanta Ruby Users' Group. Learn more about our community at http://www.atlrug.com. The video itself has been sponsored as part of Rietta’s Development Community Initiatives program, learn more at https://rietta.com/community.
