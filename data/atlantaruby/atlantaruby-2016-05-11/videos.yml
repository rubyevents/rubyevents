    Slides: https://github.com/deepcerulean/passive_record

    Passive_Record is a fast, in-memory data store for applications that do not need a full SQL database. By implementing a simplified subset of ActiveRecord’s interface in pure Ruby, it provides an extremely lightweight platform where you can use the best features of ActiveRecord without the overhead.

