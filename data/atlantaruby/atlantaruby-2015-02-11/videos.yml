  description: |-
    Slides at: http://goo.gl/gQtDKk

    A talk about the router in Ruby on Rails, which directs inbound requests to particular controllers and actions within a Rails application. The Rails router is responsible for generating and interpreting URLS, it is implemented by Journey as nondeterministic finite automata (NFA), but to aid in understanding, Andy teaches about implementing a regular expression engine using deterministic finite automata (DFA). No computer science degree is needed and you will see live code examples that you can run on your own.

    Andy is a computer scientist and regular contributor to the Atlanta Ruby Users' Group community. You can learn more about him and his latest activities at https://twitter.com/alindeman and https://github.com/alindeman. His personal homepage is at http://www.andylindeman.com.

    This video was recorded at the February, 2015, meeting of the Atlanta Ruby Users’ Group. You can find the ATLRUG at http://www.atlrug.com. The video itself has been sponsored as part of Rietta’s Development Community Initiatives program, learn more at https://rietta.com/community.
