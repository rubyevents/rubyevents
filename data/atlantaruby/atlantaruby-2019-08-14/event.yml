  Presentation:
  Title: Rails and Webpacker: A Case Study

  Webpacker has been available in new Rails apps for a while now, and any day now with the release of Rails 6 it will be the default compiler for JavaScript. But why do we need another JavaScript compiler? What does Webpacker bring to the table? And what does it look like on a real project?

  To explore these questions, I (Josh) would like to share a project we just released built with Rails and Webpacker. It’s a CMS application that uses normal Rails server-rendered pages and jQuery for most pages, but Webpacker and React for a few extra-interactive pages. We’ll talk about how to set up Webpacker, options for JavaScript libraries that work with Webpacker, how Webpacker differs from other frontend JavaScript development, look at the final result in the app, and end with resources you can use to learn more.

  Interested in Speaking? Want to show off your Ruby project or Ruby-related technology? Want to suggest a topic? Let us know!
