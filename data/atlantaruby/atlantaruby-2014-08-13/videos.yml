    Frank Rietta, M.S. Information Security, is the CEO of a development agency with team members here in Atlanta, GA, and in Nashville, TN. Rietta works primarily with startup companies that are building out their web app and infrastructure. Our latest projects are involving Ruby on Rails 4 on the backend with AngularJS based front-end clients.

    Whenever you’re considering the security of a system, ask three questions:
    1. Secure against what?
    2. What is the worst thing that can happen?
    3. Compared to what alternative?

