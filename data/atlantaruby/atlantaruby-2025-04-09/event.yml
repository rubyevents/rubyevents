description: |-
  Join the Atlanta Ruby Users Group (ATLRUG) online for our monthly main event!
  This month, we're thrilled to have Thomas Breland explore two exciting topics:

  * **Rails on WebAssembly (WASM):** Witness the power of running a full Ruby on Rails application entirely within your browser! Thomas will demonstrate how the entire server stack can operate in a virtual machine-like environment, opening up new possibilities for web development.
  * **Portfolio on a Budget:** Learn how to leverage GitHub Pages for hosting, implement simple GitHub Actions pipelines, and discover other cost-effective solutions for showcasing your work. Perfect for those looking to build a professional portfolio without breaking the bank!

  **Schedule:**

  * 6:30 PM - 7:00 PM: Virtual Networking & Chat - Connect with fellow Ruby enthusiasts on Google Meet!
  * 7:00 PM - 7:45 PM: Main Presentation by Thomas Breland
  * 7:45 PM - 8:00 PM: Q&A and Open Discussion

  **Key Takeaways:**

  * Discover the potential of running Rails in the browser with WASM.
  * Learn practical tips for hosting your portfolio affordably.
  * Gain insight into using GitHub Pages and GitHub Actions for streamlined deployment.

  **Interested in Speaking?**
  Do you have a Ruby project, technology, or topic you'd like to share with the ATLRUG community? We're always looking for speakers! Let us know if you're interested in presenting or have a suggestion.

  **Join us for an evening of learning and networking!**
