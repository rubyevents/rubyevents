  description: |-
    Ricky Smith joined us to talk about http/2 or H2. He describes how H2 compares to HTTP 1.1, how H2 is an improvement, the HTTP 1.1 tricks you need to stop doing right now.  Also, what Ruby devs need to know to run H2 and why you shouldn’t use H2 Push.

