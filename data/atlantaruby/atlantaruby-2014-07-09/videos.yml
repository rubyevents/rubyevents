    Luigi Montanez, the founding engineer of the viral content website http://upworthy.com, gives a fascinating insight into what it takes to manage the growth of a startup’s web app in the face of very high traffic. Their backend is built upon Ruby on Rails with an effective use of the Fastly CDN to deliver very high performance at scale. You’ll have to watch the talk to learn more!

