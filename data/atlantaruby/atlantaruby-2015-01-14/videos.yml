    A talk about the challenges of single page application built using Ruby on Rails and AngularJS together. He talks about how their team would choose a different approach if the choice if they were to do it again.

    Tejus Parikh is a co-founder and the CTO at Rivalry, which provides analytics; reports; and allows sales managers to coach their sales reps. They aim to build an application that is more useful than Salesforce, email, and spreadsheets.

