    An introduction to Elixir, its roots in Erlang, and the Phoenix Web Framework. Elxir has a lot to offer in that it solves a lot of problems that the Ruby language and Ruby on Rails framework have.

    Paul is a regular contributor to the Atlanta Ruby community, works as an integrations developer at BitPay, Inc., bringing bitcoin transactions to more businesses. You can learn more about his latest activities at http://johnpdaigle.com.

