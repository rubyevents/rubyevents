  description: |-
    Rupak Ganguly, the Technical Director at CenturyLink Labs, presents on http://panamax.io, an open source management system for Docker. Directly working with Docker can be very challenging and in many cases one must his apps on his own. Panamax is a containerized app creator with an open-source app marketplace hosted in GitHub. Panamax provides a friendly interface for users of Docker, Fleet & CoreOS.

    Learn more about Panamax at http://panamax.io
