description: |-
  LOCATION CHANGE: 2nd Floor Community Room

  This month Rupak Ganguly will be telling us about Panamax -- Docker Management for Humans. Panamax is an open-source project that makes deploying complex containerized apps as easy as drag-and-drop.

  Find out how its functionality will enhance your use of Docker and simplify common pain points. Docker is good, but Panamax makes it awesome. Rupak will introduce Panamax, and take you on a journey where you will create containerized applications, and then share the applications with your friends.

  Panamax lets you create and run your application locally, and then one-click deploy your applications to a remote infrastructure using an Agent/Adaptor architecture. He will also touch upon the basic architecture and underpinnings of Panamax.

  Panamax is open-source, written in Ruby, so you can also learn how to contribute and stay involved as new features are added.

  Learn more at http://panamax.io (http://panamax.io/) and checkout this cool video: http://ow.ly/AJVxd

  Our friends at Springbot (http://www.springbot.com/) were kind enough to sponsor a keg for the meetup. Get there early for some tasty beer.

  Schedule:

  6:30-7:00 Food / Beer / Networking
  7:15 til ~9:00: Presentations

  We are meeting at the Centergy Building (Hodges Room, 3rd floor) in Tech Square, next to GA Tech (map (http://maps.google.com/maps?f=q&hl=en&geocode=&time=&date=&ttype=&q=75+5th+St+NW,+Atlanta,+Fulton,+Georgia+30308,+United+States&sll=33.776148,-84.384897&sspn=0.012967,0.007575&ie=UTF8&ll=33.776169,-84.386501&spn=0.012967,0.007575&z=17&iwloc=addr&om=1)).

  Interested in Speaking? Want to show off your Ruby project or Ruby-related technology? Want to suggest a topic? Let us know!

  Parking on the street is metered. Tickets until 10pm.
  There is $1.5/hour parking in a surface lot across the street near Barnes and Noble. Credit cards accepted. The once collapsed parking deck connected to the building is back in service! Cheapest parking is the surface lot across from The Cheetah, I believe they are $4/day cash only.

  The Midtown Marta station is a few blocks away, the Tech Trolley (free) runs from it to the door of the Centergy Building.
