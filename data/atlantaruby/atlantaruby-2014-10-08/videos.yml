    A talk about how to be really efficient at getting your Rails site up and running when you do not have a lot of time and do not have a lot of money. Andy shares based on his experience getting online activism brought up to a modern era. Unlike traditional business environments that scale over time, these situations are punctuated with extreme traffic spikes the day of the event and then nothing in between.

    Andy Slocum is a principle consultant at ThoughtWorks, an Agile development company that prides itself as a “community of passionate individuals whose purpose is to revolutionize software design, creation and delivery, while advocating for positive social change.”

    You can learn more about Andy and his latest activities at https://twitter.com/andyflip and ThoughtWorks at http://www.thoughtworks.com.

