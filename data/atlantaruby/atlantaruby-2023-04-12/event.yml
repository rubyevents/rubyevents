  The Atlanta Ruby Meetup is our monthly ONLINE main event.

  Nelson Jovel will be presenting on his open sourcing of the codebase he has been working on that runs the following sites:

  * [https://mciea-beta.herokuapp.com/welcome](https://mciea-beta.herokuapp.com/welcome)

  * [https://www.hals-dashboard.com](https://www.hals-dashboard.com/)/
  * [https://ecp-sqm-dashboard.herokuapp.com](https://ecp-sqm-dashboard.herokuapp.com/)/

  He said "In short I want to talk about the history of the project and how rails helped make it a success. The first version was a proof of concept done in rails by a single developer. A company was contracted to do the work to flesh out the dashboard but $100K later, no working software was delivered. A different company took over the project, used rails get the project up and running. That took three months, it was a success and I have been the sole developer of the project since."

