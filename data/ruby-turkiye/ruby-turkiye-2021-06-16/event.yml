description: |-
  Merhaba!

  İki haftada bir düzenlediğimiz Akşam Oturmalarımızın yedincisi ile sizler ile birlikteyiz. Bu oturmamızda Sentry'den Burak Yiğit Kaya bizlere JStanbul 2021 için hazırladığı Vale Anahtarı ile Paket Çıkma başlıklı konuşmasını yapacak. Sunum dili Türkçe olacak ve sonrasında sorularımızı sorabileceğiz. Sonrasında vaktimiz kalırsa kendi aramızda sohbetimize devam edebiliriz.

  Sunum başlığını biraz daha açabilir miyiz?

  Sentry'nin desteklediği 96 farklı SDK ve kendi self-hosted sürümünün düzenli ve güvenli olarak yayınlanmasını sağlayan, içinde bolca GitHub Actions, JavaScript, YAML, ve bir tutam da Bash barındıran dokunaklı bir otomasyon hikayesi.

  Tamamen özgür bir ortamda Ruby ve bilgisayar bilimlerine dair konuları konuştuğumuz, yer yer gündemi değerlendirdiğimiz buluşmamıza sizi de bekleriz.

