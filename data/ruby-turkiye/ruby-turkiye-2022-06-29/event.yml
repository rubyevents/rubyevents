description: |-
  Merhaba!

  Akşam Oturmalarımızın onüçüncüsü ile sizler ile birlikteyiz. Bu oturmamızda Intercom'dan Murat Toygar Optimizing Resource Utilization for Ruby processes başlıklı sunumuyla bizlerle. Sunum dili Türkçe olacak ve sonrasında sorularımızı sorabileceğiz. Sonrasında vaktimiz kalırsa kendi aramızda sohbetimize devam edebiliriz.

  Sunum başlığını biraz daha açabilir miyiz?

  Ruby ile geliştirdiğiniz projeyi yayına aldınız ama RAM kullanımınız gittikçe artıyor mu? CPU yetmemeye mi başladı? Belki hata sizde değil, ondadır(configler). Bunun gibi bazı problemlerimizi ikinci makineyi açmadan, sunucuyu yeniden başlatmadan çözebiliriz. Nasıl mı, cevabı bu sunumda. :)

  Tamamen özgür bir ortamda Ruby ve bilgisayar bilimlerine dair konuları konuştuğumuz, yer yer gündemi değerlendirdiğimiz buluşmamıza sizi de bekleriz.

