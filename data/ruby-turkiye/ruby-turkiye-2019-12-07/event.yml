  Merhaba,

  2019'un son buluşması için bir cumartesi günü daha bir araya geliyoruz. Bu buluşmamızda bizlere Tamay Eser Uysal "StimulusJS ile varolan HTML'inizi interaktif hale getirin" başlıklı sunumu ile Stimulus'a giriş yapacak ve bir Rails projesinde Stimulus'u nasıl kullanabiliriz bu konulardan bahsedecek. Sonrasinda Paraşüt ekibinden Murat Toygar "Sidekiq-crypt (an alternative to Sidekiq::Enterprise::Crypto)" başlıklı sunumu ile bizlere sidekiq ile redis’e yazılan hassas job argümanlarını redis üzerinde şifrelenmiş olarak tutmaya olanak sağlayan gem'den ve geliştirme süreçlerinden bahsedecek. Yeniliklerden haberdar olmak ve güzel insanlarla tanışıp, sohbet etmek istiyorsanız hepinizi bekliyoruz.
