  Merhaba!

  İki haftada bir düzenlediğimiz Akşam Oturmalarımızın yedincisi ile sizler ile birlikteyiz. Bu oturmamızda Intercom'dan Murat Toygar bizlere A Case Study - Active Record Transactions in a Multi-DB Environment başlıklı bir konuşma yapacak. Sunum dili Türkçe olacak ve sonrasında sorularımızı sorabileceğiz. Sonrasında vaktimiz kalırsa kendi aramızda sohbetimize devam edebiliriz.

