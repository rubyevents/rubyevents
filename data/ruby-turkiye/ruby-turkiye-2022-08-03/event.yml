description: |-
  Merhaba!

  Akşam Oturmalarımızın ondördüncüsü ile sizler ile birlikteyiz. Bu oturmamızda Fabrikatör'den Demirhan Aydın Bir SaaS uygulamasında veri analizi altyapısı oluşturma yolculuğu sunumuyla bizlerle. Sunum dili Türkçe olacak ve sonrasında sorularımızı sorabileceğiz. Sonrasında vaktimiz kalırsa kendi aramızda sohbetimize devam edebiliriz.

  Konuşmanın özetini Demirhan Aydın'ın kaleminden dinleyelim:

  Çoğu B2B SaaS uygulaması müşterilerine analitik rapor özelliği sunar. Analitik rapor ihtiyacı kimi zaman basit, kimi zamansa oldukça karmaşık olabilir. Bu sunum, temel analitik raporlama özelliğinin nasıl büyüyebileceği, bir geliştirici olarak üzerinde çalışırken ne tür zorluklarla karşılaşabileceğiniz ve hangi araçları kullanabileceğiniz hakkında olacaktır.

  Tamamen özgür bir ortamda Ruby ve bilgisayar bilimlerine dair konuları konuştuğumuz, yer yer gündemi değerlendirdiğimiz buluşmamıza sizi de bekleriz.

  Görüşmek üzere.
