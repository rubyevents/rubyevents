description: |-
  Merhaba!

  İki haftada bir düzenlediğimiz Akşam Oturmalarımızın yedincisi ile sizler ile birlikteyiz. Bu oturmamızda Shopify'dan Ufuk Kayserilioğlu bizlere Yazılım Fikirlerinin Gelgitleri başlıklı konuşmasını yapacak. Sunum dili Türkçe olacak ve sonrasında sorularımızı sorabileceğiz. Sonrasında vaktimiz kalırsa kendi aramızda sohbetimize devam edebiliriz.

  Sunum başlığını biraz daha açabilir miyiz?

  Bilgisayar mühendisliği ve yazılım, araştırma alanları olarak göreceli olarak yeni olmalarına rağmen, zamanın kum tanelerinde kaybolmuş veya keşfedilmeyi bekleyen birçok muazzam fikir barındırmaktadırlar. Geçmişten gelen bu fikirlerin bazıları günümüzde ufak değişikliklerle yeniden canlanırken, bazı fikirler ise unutulmuşluktan pas tutmaya devam ediyorlar. Gelin hep birlikte geçmişten gelen bazı fikirlerin ışıklarının sektörümüzün geleceğini nasıl aydınlatabileceğine bakalım.

  Tamamen özgür bir ortamda Ruby ve bilgisayar bilimlerine dair konuları konuştuğumuz, yer yer gündemi değerlendirdiğimiz buluşmamıza sizi de bekleriz.

