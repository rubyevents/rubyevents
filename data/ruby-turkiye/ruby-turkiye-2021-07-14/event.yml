description: |-
  Merhaba!

  İki haftada bir düzenlediğimiz Akşam Oturmalarımızın onuncusu ile sizler ile birlikteyiz. Bu oturmamızda Craftbase'dan Lemi Orhan Ergin bizlere Yazılımın Modüler Yapıya Evrimi başlıklı konuşmasını yapacak. Sunum dili Türkçe olacak ve sonrasında sorularımızı sorabileceğiz. Sonrasında vaktimiz kalırsa kendi aramızda sohbetimize devam edebiliriz.

  Sunum başlığını biraz daha açabilir miyiz?

  Bir uygulamayı en değerli kılan şey onun doğru çalışması değil, sürdürülebilir bir şekilde geliştirilebilmesidir der bir büyüğümüz. Hepimiz bu sözün doğruluğunu kariyerimizde bir çok kez çalışan çamur topları geliştirerek ispat etmişizdir. Büyük umutlarla başlanan projelerin zaman içinde içine düştüğü çıkmaz hepimizin yüreğini acıtırken, yine yeniden baştan yazmak harici bir öneri getirememek de bir o kadar umudumuzu kırıyor.

  Backend dünyasında 20. senesini dolduran Lemi, çamur topundan modüler mimariye uzanan yazılımın evrim sürecini sizlerle paylaşmak istiyor.

  Tamamen özgür bir ortamda Ruby ve bilgisayar bilimlerine dair konuları konuştuğumuz, yer yer gündemi değerlendirdiğimiz buluşmamıza sizi de bekleriz.

  Görüşmek üzere
