description: |-
  Hello Rubyists!

  Come and join us for another Talks and Drinks! Catawiki is having us over for a fun evening with talks, drinks and pizza.

  For this edition we planned following:

  Julik Tarkhanov : Sending large files via HTTP

  ...about how WeTransfer pushes over 6 gigabytes per second in streaming downloads, from Ruby.

  Dax Huiberts : How to lean on Postgresql

  ...about experiences with basics like how to do proper validations and foreign key constraints, all the way to placing logic in advanced views and use them as simple rails models.

  Find them on Github: julik (https://github.com/julik) and daxhuiberts (https://github.com/daxhuiberts).

  Idea for the evening:

  18:30 - 19:00 Gathering, pizza and drinks

  19:15 - 19:30 Sponsors talking : Catawiki and WeWork

  19:30 - 20:00 Julik Tarkhanov : Sending large files via HTTP

  20:00 - 20:15 Break

  20:20 - 20:50 Dax Huiberts : How to lean on Postgresql

  20:50 - 21:30 Social with more drinks

  Food and drinks will be provided (big thanks Catawiki!) and you'll have all the opportunities to talk to fellow developers.

  The building is wheelchair accessible and there is an elevator to take you up to the 4th floor.

  See you there!
