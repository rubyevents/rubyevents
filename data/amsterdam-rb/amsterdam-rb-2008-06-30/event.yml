description: |-
  The first "special" Amsterdam.rb: instead of the usual pub night, TTY Internet Solutions hosted the group at their office on the Kerkstraat 342 and put their presentation facilities at the group's disposal. Doors opened at 19:30, the programme started at 20:00, and about 25 people attended for roughly six presentations.

  Two more presentations were announced but their speakers were never named on the list: a quick overview of the Sellaband.com test framework, and a demo of Rushtest, a Ruby implementation of Quicktest.
