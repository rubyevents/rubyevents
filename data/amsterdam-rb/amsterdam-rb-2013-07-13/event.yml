  The Amsterdam.rb community, in partnership with Quintel Intelligence, is proud to announce an introductory Ruby on Rails course with a duration of one day and free of charge.

  There are no prerequisites, and the course will start with some theory, followed by Ruby programming principles and an introduction to the Rails Framework. In its first installment, it will be open to 6 students.

  By the end of the course, students will:
  Be able to build their first simple application in Rails
  Know where to look up answers to all their questions
  Meet other developers in Amsterdam with the same level
  Be having fun!

