description: |-
  The first ACK — the Amsterdam Coders Kollective — proposed by Remco van 't Veer as a counterpart to the monthly beer-and-socialising nights: a language-agnostic, laptops-required "screen peeking dinner" on the top floor of the Openbare Bibliotheek Amsterdam near Central Station, from 18:00.

  Topics that first evening included Ioke, Io, Clojure, Emacs, Vi, the concept of futures in Io and Ruby, and Ruby Shoes. ACK went on to run on the second Monday of the month alongside the regular Amsterdam.rb meetings.
