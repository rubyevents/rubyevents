description: |-
  In place of the regular monthly meeting, Amsterdam.rb ran a Ruby BarCamp as a side event of the Kings of Code conference. Wes Oldenbeuving and Julio Javier Cicchelli organised it at Escape Studio on the Rembrandtplein: doors at 12:30, unconference from 13:00 to 17:00, drinks until 18:00. Free entrance, with 50 seats reserved for Kings of Code ticket holders.

  The venue was sponsored by Rock & Code, Wes Oldenbeuving and Filip Slagter; the drinks by 80beans. Being an unconference there was no fixed schedule, but six sessions were announced up front.
