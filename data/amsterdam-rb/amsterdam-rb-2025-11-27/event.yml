  18:00: Doors open, have a drink and some food
  19:00: Opening statements
  First talk: "Writing Ruby Code with AI, No Bugs Allowed!" by Marten Schilstra
  Second talk: "Using weighted resource distribution in Sidekiq queues" by Jan van der Pas
  Socializing and networking

