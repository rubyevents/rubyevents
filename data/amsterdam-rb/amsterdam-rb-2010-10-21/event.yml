description: |-
  A joint event with the Ruby And Rails conference, held in a separate room at De Bekeerde Suster after the first conference day. Iain Hecker coined the name "Gem Session", by analogy with a jam session.

  The format the organisers landed on — "Ignite cherry picking" — mixed short lightning talks with the audience gathering around the presenter to throw ideas, comments and suggestions at their project, so that speakers got direct feedback rather than just applause. Holder arranged the location.
