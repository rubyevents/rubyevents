description: |-
  The very first Amsterdam.rb meeting, held at De Bekeerde Suster near the Nieuwmarkt. About 15 Rubyists showed up. Sam Aaron and Remco van 't Veer picked the venue on the mailing list and announced the group through rubyenrails.nl, Holland on Rails, Fingertips and ruby-talk.

  Afterwards the attendees introduced themselves on the list, kicking off the tradition of a monthly meeting on the last Monday of the month.
