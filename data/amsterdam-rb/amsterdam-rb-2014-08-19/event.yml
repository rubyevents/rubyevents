  On Tuesday, August 19th we're having a night full of Talks & Drinks at the Springest (http://www.springest.nl/) HQ! We'll start at 19:00 and pizza and drinks will be sponsored by Questionmark (http://www.thequestionmark.org/).

  Speakers:

  André Arko (Bundler core team member (https://bundler.io/); remote talk)
  Lies, Damn Lies, and Metrics

  "Measuring things is good, because it means you know what’s going on. Right? This talk is about the surprising ways that measuring things doesn’t mean you know what’s going on, with some extra discussion about things that most people don’t measure, even though they are vital to their business."

  Dirkjan Bussink (GitHubber (http://github.com/))
  Timezones for (Ruby) developers

  "Every year when daylight saving time changes, developers cry out in horror. Why is that? I’ll be talking about the do’s and don’ts for working with time and to (partially) keep your sanity."
