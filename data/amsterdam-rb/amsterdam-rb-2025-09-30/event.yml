description: |-
  Hello Rubyists! 🏖️👋

  Get ready for the September meetup at Beequip! This time we'll be in Rotterdam in collaboration with Rotterdam.rb! This is a different city than we're used to, but we hope you'll join us there 😄 Group up, travel together, and carpool. Join our Slack to find fellow travelers.

  Join us for talks and chats with people from the community. Anyone interested in learning more about Ruby and the local tech community is welcome to join!

  Program

  18:00: Doors open, have a drink and some food
  19:00: Opening statements
  First talk: Derk-Jan Karrenbeld - Embrace the patch: When OSS fails or you need to backport a fix.
  Second talk: Bob Smits - A company implemented more than 300 state machine events. This is what happened.
  Socializing and networking

  This month's meetup will take place at Beequip! They will also provide the delicious food and drinks to power us through the evening 😋
  This location is accessible, no stairs required, but make sure to use the entrance on the Willemskade for access to the elevator.

  There will be no stream this time, so be sure to join in person.

  Cheers,
  Tom, Arno and Aidan

  PS. If you are interested in giving a talk, let us know. Learn more about giving a talk at the Amsterdam Ruby meetup.

  Cover photo by Adrien Olichon.
