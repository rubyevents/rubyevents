description: |-
  Hello Rubyists!

  Come and join us for another talks and drinks! This edition is specially themed towards GraphQL and in honor of our GraphQL hack day. ➜ https://www.meetup.com/Amsterdam-rb/events/241877303/

  We’ll have various presentations from the participants of the hack day. Robert Mosolgo himself, the author of graphql-ruby and GitHub employee, will hold a presentation. HackerOne will hold a presentation on securing GraphQL endpoints for their vulnerability disclosure platform. We’re adding more speakers to the evening, so stay tuned! Are you a GraphQL implementer, and would like to give a talk and share your experience? Please ping us!

  GraphQL is a rapidly growing API technology made by Facebook that is used by companies like IFTTT, Shopify, GitHub, Zendesk.

  Planning for the evening:

  19:00 drinks & kickoff by Robert Mosolgo.
  19:30 show & tell by various GraphQL implementers.

  Looking forward to see you all!
