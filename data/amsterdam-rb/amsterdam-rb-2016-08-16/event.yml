description: |-
  Hello Rubyists!

  Come and join us for another Talks and Drinks!

  We're having two topics:

  Willian van der Velde will present the basics of GraphQl, the `.js` implementations and how to setup a GraphQl endpoint in your Rails (/Ruby) application and his experiences.

  Arjan Scherpenisse and Marten Schilstra will talk about Elixir, Arjan's focus will be Phoenix and then especially channels. Compared to Rails it has the ability to do things in real time easily. Marten will show you the business value of starting using Elixir/Phoenix over Ruby/Rails.

  Some snacks and drinks will be provided and you'll have all the opportunities to talk to fellow developers.

  Door opens 1900, the talks will start 1930-ish.
