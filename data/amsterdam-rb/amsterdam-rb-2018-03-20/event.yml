description: |-
  Lovely Rubyists! ❤️

  This time we have 2 special talks planned for you by 2 founders. Have you ever considered to start your own company or have your ever thought about launching a new product?
  Catch a glimpse of expectations versus reality. We'll have some beer and pizza ready for you, fully sponsored by Ikbenfrits 🎈(Thank you!!)

  Program:

  18:30 Doors open, pizza time

  19:00-19:30 Thijs Cadier - Reporting Live from the Ramp of Death

  Lying on the beach and enjoying the 4-hour work week: who wouldn’t like the recurring revenue stream of a SaaS business? It’s why many start building a SaaS company “on the side”, only to find out they don’t make enough money to buy a latte and fall back to getting paid by the hour. They’re stuck on the long, slow Ramp of Death.

  Coming to you live from the trenches of running an organically growing SaaS for five years, this is an honest –and sometimes brutal– story of perseverance, sacrifice and reward. Find out how to overcome the ramp, and why it isn’t as bad as you might think.

  19:30 Break

  20:00-20:30 Joost Schulze - Life after Rubyists: a practical survival guide

  What to do when working with a Ruby codebase - without Ruby developers. Three Lessons learned as a founder/developer. Don’t expect me to tell you the in’s and out’s of Ruby. However, do expect me to tell a practical story about how to maximize the output of a software project with minimal knowledge.

  20:30-22:00 Networking and drinks

  See you there! ❗️RSVP? What? Oh, that thing you update if you are not going to a meetup, so others get a fair shot at attending? Yes!
