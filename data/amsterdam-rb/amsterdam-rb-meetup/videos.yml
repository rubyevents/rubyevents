  description: |-
    Dear Ruby friends,

    We're excited to invite you for two inspiring talks, pizza and drinks.

    Sponsored and hosted by WeTransfer! ❤️

    Program

    18:00 Doors open 🍕

    19:00 Pauline Vos (@vanamerongen) - Git Legit

    Pauline is a software engineer at Werkspot in Amsterdam. If you're fighting with Git on a regular basis, you might not be using it optimally. Pauline will share some hands-on experience that will make your day-to-day life as a Git user easier. You'll learn how to keep your history clean through atomic commits and interactive rebase options, how to easily pinpoint a certain time in your history using bisect, and more.

    19:30 Break

    20:00 Ivan Zarea - The 👍: there and back again

    Ivan is a Lead Architect at YoungCapital. A creator of Pubquizzes, Ivan has volunteered to do a hyperactive interactive talk about the journey of an HTTP request from your browser to your Rails app and back again. You probably know _some_ of the individual pieces, but we'll put them together, covering things like DNS, SSL, nginx, Puma, Rails routing and a bit of the database layer.

    20:30-21:30 Networking

    If you're hungry for more Ruby knowledge, join us at EuRuKo2019 (https://euruko2019.org) in Rotterdam on the 21st and 22nd if June.

    See you there & bring a colleague! ❤️

