  date: "2013-02-19"
  video_provider: "not_recorded"
  video_id: "amsterdamrb-meetup-february-2013"
  description: |-
    On Tuesday, February 19th we're having our Ruby Hack Night at Publitas.com (https://www.publitas.com/) (Zeeburgerpad 5). We'll start at 19:00 and our event host Publitas.com will provide us with food and drinks. Since we’re close to the IJ Brewery (http://www.brouwerijhetij.nl/homepage-nl/onze-nieuwe-brouwerij/), there will be no shortage of beer! :)

    What to do on a Ruby Hack Night?

    Work on your own project
    You have this project you've been working on, but you could use some fresh insights or help with the nasty regex. Maybe you just want to chat about going with a relational or document-oriented database for your use case. Whatever it is, ask others to team up and collaborate.

    Work on open-source
    You maintain a gem that is in dire need for some love or you’ve found a bug in a gem you use daily. Go at it solo or in a group, tackle those GitHub issues and create a pull request. Help out the community and be on your way to become a Ruby Hero! If you don't know where to start, ask the more experienced Rubyists to join.

    You're new to Ruby
    At this meetup there will be extra love for our beginning and aspiring Rubyists. Sjoerd Andringa will lead a special beginners group to help you get started with Ruby. Don’t be shy, let no question go unanswered!

    You’re an expert wanting to help others
    You know your way around any Ruby code you’re up against, but you don't know what to work on. Chances are someone working on any of the above can need some support. Help them out with your expertise. An important goal of our community is to help other Rubyists, both beginners and experts. Help them get their questions answered.

    Let us know what you plan to do!
    We're not on a rigid schedule, but we would like to know what you plan to do at the Hack Night (you can use the RSVP form field). You don't have to be too specific; we're just using this to allocate desks and other logistical stuff. It's totally fine to come up with something on the spot too. We will start at 19:10 sharp.

    There's room for a maximum of 40 people coding. There will be a waiting list, so please change your status to "not going" if you change your mind. It will enable someone else to attend.

    Looking forward to seeing you all!

    Dax, Guillermo, Roy and Sjoerd.

