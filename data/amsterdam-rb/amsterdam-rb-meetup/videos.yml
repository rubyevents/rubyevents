- id: "amsterdamrb-meetup-october-2008"
  title: "Amsterdam.rb Meetup October 2008"
  raw_title: "Next meeting @ Innovation Factory!"
  event_name: "Amsterdam.rb Meetup October 2008"
  date: "2008-10-27"
  video_provider: "not_recorded"
  video_id: "amsterdamrb-meetup-october-2008"
  description: |-
    Following TTY's example, Innovation Factory hosted the group at De Lairessestraat 180 in Oud Zuid, starting at 20:00. Harm Aarts, Sam Aaron and Martijn organised it and lined up four presentations of at most 20 minutes each:

    - Selenium RC interface testing for a really big Dutch site
    - QuickCheck/RushCheck with lots of randomness
    - HAppS/formlets/arrowlets
    - RESTful app cloud, forget big monolithic applications, welcome to the future

    The speakers were never named on the mailing list. Remco van 't Veer's write-up afterwards noted that, unusually, none of the talks were about Ruby or Rails.

    https://groups.google.com/g/amsterdam-rb/c/iYqN59AcNlA
