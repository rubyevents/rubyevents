- id: "amsterdamrb-meetup-march-2017"
  title: "Amsterdam.rb Meetup March 2017"
  raw_title: "Talks & Drinks"
  event_name: "Amsterdam.rb Meetup March 2017"
  date: "2017-03-21"
  video_provider: "children"
  video_id: "amsterdamrb-meetup-march-2017"
  description: |-
    Hello Rubyists! 😻

    We will gather again for an evening of talks and drinks.

    So far, there are two confirmed speakers:

    Processing streaming data at a large scale with Kafka

    Thijs Cadier, infrastructure overlord @AppSignal (https://twitter.com/AppSignal)

    Using a standard Rails stack is great, but when you want to process streams of data at a large scale you'll hit the stack's limitations. What if you want to build an analytics system on a global scale and want to stay within the Ruby world you know and love?
    In this talk we'll see how we can leverage Kafka to build and painlessly scale an analytics pipeline. We'll talk about Kafka's unique properties that make this possible, and we'll go through a full demo application step by step. At the end of the talk you'll have a good idea of when and how to get started with Kafka yourself.

    Ivan Zarea(@minivaaan (https://twitter.com/minivaaan)), software engineer @YoungCapital

    Having a fun time building your own efficient machine learning system with Redis

    This event will be hosted at LeWagon (https://www.lewagon.com/).

    Le Wagon brings technical skills to creative people by organising bootcamps to learn how to code.

    See you all there!

    https://www.meetup.com/amsterdam-rb/events/237870093/
