description: |-
  Hello Rubyists!

  Come and join us for Talks and Drinks!

  First Speaker: Jeroen Visser, CTO at Uberous

  With the release of Rails 5 on its way, Jeroen will present about the new features it ships.

  Second speaker: Cecile Veneziani, teacher at Le Wagon

  How to use form objects in your Rails Applications, to extract validations from models and to easily have validations per context.

  Third speaker: Julik from WeTransfer will tell about Apiculture, their toolkit for building REST API endpoints on top of Sinatra

  Unfortunately, Corey Haines is unavailable as a speaker, though we had him on schedule. He's too many time zones away during the meetup.

  As usual pizza and beer will be provided, and you'll have all the opportunities to talk to fellow developers.
