description: |-
  After a short period of silence Amsterdam.rb is back with Talks & Drinks! This Tuesday, October 27, at 7pm. The place to be is Rokin 75's top floor. Food and drinks will be sponsored by Codaisseur (http://www.codaisseur.com).

  Speakers

  • Vincent Oord from Cocoon is going to tell us about a new way to find a job as a developer

  • Martijn Bleeker and Tom de Bruijn from Keplar will talk about scaling an API for high traffic by using a CDN.

  • If there's time after that, Wouter de Vos will talk about how we teach beginners about code using Ruby.

  Call for speakers

  We'd like to hear from you if you are interested in giving a (short) talk at this meetup or a future one. Get in touch, also if the topic isn't strictly Ruby related. We'd still love to hear about it.
