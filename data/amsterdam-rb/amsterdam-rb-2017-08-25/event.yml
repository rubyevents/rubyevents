  Hello Rubyists! Come and join us on the GraphQL hack day!

  During the day we’ll be hacking on GraphQL-ruby powered projects together with Robert Mosolgo (GitHub), the author of graphql-ruby! In the evening there will be drinks, and GraphQL-themed talks by various GraphQL implementers. GraphQL is a rapidly growing API technology made by Facebook that is used by companies like IFTTT, Shopify, GitHub, Zendesk. Sounds interesting or are you implementer? Come join us & le us know what you want to hack on here: https://github.com/emilebosch/graphql-hackathon-ams/issues/1

  09:00 doors open
  09:30 kickoff hack day and pitch of the hack topics ( https://github.com/emilebosch/graphql-hackathon-ams/issues/1 )
  12:00 lunch
  18:00 pizza
