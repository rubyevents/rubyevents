description: |-
  Dear Ruby friends,

  We're doing this again! An exciting meetup where you can learn more about Ruby. Think you know the basics? Then let's dive deeper.

  We're excited to invite you for two inspiring talks, pizza and drinks.

  Sponsored and hosted by Catawiki and UpCloud! (New location, new office!) ❤️

  Program

  18:00 Doors open 🍕

  19:00 Jeff Kreeftmeijer - Metaclasses in Ruby

  Jeff is a developer at AppSignal in Amsterdam. He's working with Ruby (and Elixir) on a daily basis and writes educational articles for the AppSignal's Ruby and Elixir newsletters.
  Through examining metaclasses, we'll learn how class and instance methods work in Ruby. Along the way, discover the difference between defining a method by passing an explicit "definee" and using class << self or instance_eval. Let's go!

  19:30 Break

  20:00 Ahmed Shahin - Rack middlewares: The Ins and Outs

  Ahmed is a Software Engineer at Young Capital, he will give us a short talk about Rack middlewares: How powerful they are, their usage with web frameworks such as Rails, and how-to build your own middleware, and things to take into account while you are building your custom middleware.

  20:30-21:30 Networking

  ⚠️Limited spots available! ⚠️

  If you're hungry for more Ruby knowledge, join us at EuRuKo2019 (https://euruko2019.org) in Rotterdam on the 21st and 22nd if June.

  See you there & bring a colleague! ❤️
