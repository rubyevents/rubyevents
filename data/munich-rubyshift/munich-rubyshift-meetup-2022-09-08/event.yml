  AGENDA

      Welcome & Announcements (10')
      Location/Food & Drinks Sponsor Slot (5')
      Talk 1 incl. Q&A: Pavel Grachev: "Three Things we do well at Workpath"
      Talk 2 incl. Q&A: Bogdans Laidins: "Bringing Confidence with Review Apps"
      Food & Drinks (sponsored by Workpath), Socializing (open end/as long as the location permits)

  TALKS
  Talk 1: Three Things we do well at Workpath
  Feasibility studies, refinements, QA, Continuous Delivery — everyone of us knows how the SDLC works, we know best practices and we listen to cool smart people speaking at conferences.
  Pavel will share some bits of Workpath's journey as a growing startup trying to apply modern methodologies and a bit of common sense. Some learnings that felt surprising, what worked for them, and what didn't.
  About our speaker
  Pavel Grachev is a Team Lead at Workpath.

  Talk 2: Bringing Confidence with Review Apps
  Review Apps provide a fully functional preview of feature branch changes, creating an ephemeral environment for your merge requests. This allows designers, product owners, QA and other stakeholders to get involved in the feedback process as quickly as possible, improving the fidelity and speed of review. DataGuard's road to adoption of Review Apps began with an open source alternative to Heroku, moving on to using Humanitec, a full-fledged platform orchestrator.
  About our speaker
  Bogdans Laidins is a Lead Engineer at DataGuard.
