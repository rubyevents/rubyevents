- id: "sri-vishnu-totakura-munich-rubyshift-meetup-2023-03-09"
  title: "Best practices we employ for a scalable Rails app"
  event_name: "Ruby Meetup March 2023"
  date: "2023-03-09"
  language: "English"
  video_provider: "not_recorded"
  video_id: "sri-vishnu-totakura-munich-rubyshift-meetup-2023-03-09"
  description: |-
    Zavvy has grown from a simple Rails app to a huge suite of B2B applications all served with a single Rails app with ~150 API endpoints, models and presenters with a complex inter-connection between apps. As a startup speed of release is crucial, quality is not a tradeoff, security with complex authenticate and authorization logic is a must. This has not been easy but we are proud of what we setup as our best practices/standards and we would like to show you how we kept things simple and made it very easy to achieve all these goals.

    About our speaker
    Sri Vishnu Totakura is the CTO of Zavvy.
  speakers:
    - Sri Vishnu Totakura
