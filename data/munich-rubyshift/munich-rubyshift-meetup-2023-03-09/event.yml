description: |-
  Dear Munich Rubyists,

  were closing in on Episode 2 of 2023's meetups!

  This time, we'll visit Zavvy, who will host the meetup and also give one of the talks of the evening. We'll also have Hanami's creator Luca Guidi joining us from remote as a special guest to give us a tour of Hanami 2.0.

  DATE & LOCATION

  Date and Time: March 9, from 19:00 CEST
  Location: Zavvy GmbH (@Mindspace), Herzogspitalstraße 24, 80331 Munich

  AGENDA

      Welcome & Announcements
      Location/Food & Drinks Sponsor Slot
      Food & Drinks (sponsored by Zavvy)
      Talk 1 incl. Q&A: Luca Guidi: "Hanami 2.0: a framework for a new Ruby era"
      Break
      Talk 2 incl. Q&A: Sri Vishnu Totakura: "Best practices we employ for a scalable Rails app"
      Socializing (open end/as long as the location permits)

  TALKS

  Talk 1: "Hanami 2.0: a framework a new Ruby era"
  Note: This talk will be held remotely

  About our speaker
  Luca Guidi is a Backend Architect at Toptal and the creator of the Hanami framework.

  Talk 2: "Best practices we employ for a scalable Rails app"
  Zavvy has grown from a simple Rails app to a huge suite of B2B applications all served with a single Rails app with ~150 API endpoints, models and presenters with a complex inter-connection between apps. As a startup speed of release is crucial, quality is not a tradeoff, security with complex authenticate and authorization logic is a must. This has not been easy but we are proud of what we setup as our best practices/standards and we would like to show you how we kept things simple and made it very easy to achieve all these goals.

  About our speaker
  Sri Vishnu Totakura is the CTO of Zavvy.
