  🎤 Rubèn Suet – »Object Modelling with Git«
  This talk is to share my experience learning how Git works behind the scenes. How it tracks the files, how it stores inside Git with Objects, what happens when we are creating a new branch. Everyone who uses Git can attend and understand the Talk, so the scope it's not just for Rubyists. If you know how all objects in Git are working, then it's a good talk to remember all the process. If you didn't pay attention to know it, then this talk can be very interesting to see together what are these great benefits that Git is providing to us.

