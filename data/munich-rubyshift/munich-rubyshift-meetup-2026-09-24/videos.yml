  title: "Testing LLM Agent Conversations with rspec-agents"
  event_name: "Ruby Meetup September 2026"
  date: "2026-09-24"
  language: "English"
  video_provider: "not_recorded"
  video_id: "frederik-fix-munich-rubyshift-meetup-2026-09-24"
  description: |-
    LLM-based agents present unique challenges in terms of validation. The indeterminacy of their outputs makes it impossible to use traditional deterministic assertions. This talk presents the rspec-agents plugin that uses simulated conversations along with rubric-based checks to evaluate the performance of these agents.
  speakers:
    - Frederik Fix

- id: "henning-koch-munich-rubyshift-meetup-2026-09-24"
  title: "429 Too Many Pull Requests"
  event_name: "Ruby Meetup September 2026"
  date: "2026-09-24"
  language: "English"
  video_provider: "not_recorded"
  video_id: "henning-koch-munich-rubyshift-meetup-2026-09-24"
  description: |-
    Coding agents made work trivial to start and hard to finish. The bottleneck has moved to the one resource that didn't scale: an experienced human who has to read the diff and sign off on it. This talk is about reviewing less and understanding more: a workflow where pull requests contain no surprises and every diff I read is worth my time.
  speakers:
    - Henning Koch
