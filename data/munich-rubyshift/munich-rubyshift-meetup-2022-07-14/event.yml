  Dear Munich Rubyists,

  I don't know about you, but I think it's high time that we meet again!

  The first meetup in almost 2 years has been tentatively scheduled for July 14. (I've moved it from the 2nd Wednesday to the 2nd Thursday of the month, because several people in the past have mentioned that Wednesday isn't ideal.)

  DATE & LOCATION

  Date and Time: July 14, from 19:00 CEST
  Location: DataGuard Office (5th Floor), Dachauer Str. 65, 80335 Munich

  AGENDA

      Welcome & Announcements (10')
      Location/Food & Drinks Sponsor Slot (5')
      Raounak Sharma: How we reduced its public API's response time by 86% (45')
      Talk incl. Q&A (15‘, intended for 1st time/inexperienced speaker)
      Food & Drinks (sponsored by DataGuard), Socializing (open end/as long as the location permits)

  TALKS
  Talk 1: How we reduced its public API's response time by 86%
  At the time of product launch, our most important API endpoint was taking around 5 seconds in production. It wasn’t related to tech-stack or a particular database/cloud issue nor did we have very bad code quality or any N+1 query issues. Instead, it turned out to be the cumulative result of small mistakes in some services. In this talk, we will see how we arrive at those mistakes, and how you can avoid them earlier on in the development process.

  About our speaker
  Raounak has been working with Ruby for the past 5 years, and actively contributing to the Ruby community since 2018. This time has made him focus more on the performance of the software. He has implemented and led projects in the performance optimization area as a senior software engineer. Recently he has moved to Dresden, Germany and is looking forward to meeting new people.

