description: |-
  We've got 2 speakers:

  Marco Otto-Witte (https://twitter.com/marcoow): Software Engineer and Consultant from Munich. Has strong background in web development with Ruby on Rails as well as JavaScript, iOS etc.

  Talk Description: Authentication is usually one of the first things everybody comes across when starting a new project. While it's pretty much a solved problem in classic Rails applications (see devise etc.) things are not as simple when it comes to client side MVC frameworks. Ember.SimpleAuth is a library for Ember.js that tries to solve most problems.

  Patrick Mulder (https://twitter.com/mulpat): I am very much interested in all things Unix, and good OOP (often in Ruby). I am also impressed by the performance of Node.js, and new approaches for client-server architectures. I blog at http://thinkingonthinking.com and am working currently on a book "Developing Web Applications with Backbone.js".

  Talk Description: We've got Ruby 2 since some months, Ruby 2.1 just released, and a bunch of legacy code bases require some older Ruby versions... that can quickly become a mess. In this talk, I want to explore some part of the Ruby ecosystem that deals with infrastructure: Chef and Vagrant.
