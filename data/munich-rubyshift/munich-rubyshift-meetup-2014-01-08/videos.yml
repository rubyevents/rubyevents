  description: |-
    Authentication is usually one of the first things everybody comes across when starting a new project. While it's pretty much a solved problem in classic Rails applications (see devise etc.) things are not as simple when it comes to client side MVC frameworks. Ember.SimpleAuth is a library for Ember.js that tries to solve most problems.

    About the speaker: Software Engineer and Consultant from Munich. Has strong background in web development with Ruby on Rails as well as JavaScript, iOS etc.
