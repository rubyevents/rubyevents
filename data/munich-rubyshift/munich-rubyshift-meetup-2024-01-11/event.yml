description: |-
  Dear Munich Rubyists,

  the year is coming to an end – which means, it's almost time for the first Meetup of 2024!

  Just like in 2023, our friends from Freeletics will be the hosts of the year's frist meetup! One of the talks will be given by yours truly -- I'll talk about simplifying our overall backend/frontend setups using InertiaJS. The 2nd talk is currently TBD -- we might have one from our hosts themselves, but if you do have something ready to go, please get in touch. :-)

  DATE & LOCATION

  Date and Time: January 11, from 19:00 CEST
  Location: Freeletics GmbH, Berg-Am-Laim-Strasse 111, 81673 Munich

  AGENDA

      Welcome & Announcements
      Location/Food & Drinks Sponsor Slot
      Talk 1 incl. Q&A: Clemens Kofler: "Inertia -- The healthy middleground between a Rails Monolith and a Single Page Application?"
      Break
      Talk 2 incl. Q&A: Khaled Muamar: "Intuitive Client Errors Driven by Backend"
      Food & Drinks (sponsored by Freeletics), Socializing (open end/as long as the location permits)

  TALKS

  Talk 1: "Inertia -- The healthy middleground between a Rails Monolith and a Single Page Application?"
  Can we strike a balance between the simplicity of a Rails Monolith and the flexibility that a Single Page Application? And can we do so while keeping both Backend Rubyists and Frontend React/Vue people reasonably happy? Let's find out together.
  About our speaker
  Clemens Kofler is a Director of Engineering at DataGuard.

  Talk 2: "Intuitive Client Errors Driven by Backend"
  About our speaker
  Khaled Muamar is a Backend Engineer at Freeletics.
