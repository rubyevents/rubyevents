  'Fast and furious. Slow and functional' Anna BulenkovaHow Anna benchmarked declarative and imperative solutions in Ruby.

  JRuby: the business perspectiveLeif GensertJRuby is often portrayed as the Ruby with brilliant Garbage Collection and native threads but poor startup time and large memory overhead. But how can JRuby really help you in a project, especially when you deal with large corporations that live in the Java world.

  Design Patterns - A Ruby PerspectiveMathias Huber
  I'll give a digest of Russ Olsen's 2007 book "Design Patterns in Ruby". It applies 14 of the 23 "Gang of Four" patterns to Ruby and suggests 3 additional Ruby-specific patterns. In the discussion part you are invited to talk about your favourite pattern or your least favourite pattern, antipatterns, enterprise patterns, maybe why you don't like patterns ...

