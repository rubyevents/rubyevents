  🎤 Kivanc Semen und Ference Brose – Ruby in Legal Tech: An Evening at DataGuard

  The leading legal tech company DataGuard invites you to get to know the machine learning supported platform (reference number at the European Patent Office: Q0144EP). Founder and managing director Kivanc Semen and Ference Brose will give exciting insights and look forward to discussion and exchange with the guests. Food and drinks will of course be provided.

  Kivanc Semen reports on his experience as an entrepreneur and how the idea for a technology-based approach to data protection came about.
  Ference Brose looks behind the curtain of the platform and explains how DataGuard's technology works and what role Ruby plays.

