  Dennis Herr (TUM, experteer.com): "Experella-Proxy, a load balancing reverse proxy"
  Service-oriented architectures can be quite tricky to handle. Routing logic is hard to setup or modify and often needs to be configured in a low-level programming language. So we decided to build a load balancing reverse proxy in Ruby. The presentation will cover motivation & requirements to build a reverse proxy, simple use cases, an introduction to Experella-Proxy and features to aim for.

