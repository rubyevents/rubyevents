description: |-
  Dear Munich Rubyists,

  the September edition of our meetup is coming!

  Before diving into the details, let me start with an apology: On fairly short notice, I unfortunately couldn't attend the last meetup at our friends from Experteer due to a family-related issue. This unfortunately coincided with a meetup where we had no talk lined up, so I couldn't even give the backup talk that I had prepared. From what I heard from our host Valentin, it was still a nice meetup with interesting conversations -- but I'm still sorry that the meetup didn't go as planned.

  Anyway, back to the topic at hand: The September meetup!

  This time, Le Wagon Munich will be our host for location, food & drinks and they'll also have their own Bruno Brunckhorst give a talk about using Neural Networks with Ruby/Rails.

  I'm also looking for an optional 2nd speaker to give a short(er) talk in addition to the main talk => let me know if you're interested or know someone who might be interested.

  DATE & LOCATION

  Date and Time: September 14, from 19:00 CEST

  Location: Le Wagon Munich, Balanstrasse 73, building 21A, 4th floor, 81541 Munich, Germany

  As the neue Balan campus is quite extensive, here some tips to make sure everyone gets here without issues:

  The easiest way to locate us is to pop the location in Google Maps, the pin is very accurate.

  When coming by U-Bahn (Karl Preis Platz) take the entrance onto the campus from Claudius Keller Straße. after 150meters, you will find Haus 21A on your left hand side.

  For those arriving by car, there is a large parking garage located on campus, by the northern entrance (St. Martin Straße 112).

  AGENDA

      Welcome & Announcements
      Location/Food & Drinks Sponsor Slot
      Food & Drinks (sponsored by Le Wagon)
      Talk 1 incl. Q&A: Rails Unwired: Neural Networks in Ruby (Bruno Brunckhorst, Program Manager & Data Scientist @ Le Wagon)
      Break
      Talk 2 incl. Q&A: TBD
      Socializing (open end/as long as the location permits)

  TALKS

  Talk 1: Rails Unwired: Neural Networks in Ruby

  This will be a beginner-friendly talk on the topic of Neural Networks and how to connect them with Ruby/Rails.

  About our speaker

  Bruno Brunckhorst is a Program Manager & Data Scientist at Le Wagon in Munich.

  Talk 2: TBD

