  Wes and Thijs from AppSignal (https://www.appsignal.com) fame will come visit Groningen and speak during this edition. They also look for Elixir-minded attendants.

  Talk Thijs
  What if you want to build an analytics system on a global scale and want to stay within the Ruby world you know and love? In this talk we'll see how we can leverage Kafka to build and painlessly scale an analytics pipeline. We'll talk about Kafka's unique properties that make this possible, and we'll go through a demo application step by step.

