  MongoDB

  Peter van der Meulen (http://www.meetup.com/Groningen-rb/members/122494662/) gaat tijdens deze editie vertellen over NoSQL databases zoals MongoDB (http://www.mongodb.org). Aan de hand van een interactief voorbeeld met MongoDB laat hij zien hoe een Ruby on Rails applicatie zonder Active Record framework met NoSQL database opgebouwd kan worden.

  Er is nog ruimte voor een (paar) korte talk(s) na de presentatie over MongoDB.

  Presentatie begint om 20:00 in het Launch Café (http://www.launchcafe.nl).
