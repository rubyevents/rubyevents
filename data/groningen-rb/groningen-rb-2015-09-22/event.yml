  BYOD

  Bring your own laptop. We're going to put our hands on actual development. Our friends from Launch Café (https://www.launchcafe.nl/)/Founded in Groningen (http://www.foundedingroningen.com/) have challenged us to think about a place or platform that would bring Groningen more (tech-)startup fame. Discuss it with us, bring your own ideas and build something in one evening!

