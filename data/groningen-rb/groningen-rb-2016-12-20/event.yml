  Bring you own laptop Christmas edition

  Like every year, we are going to solve Christmas programming puzzles. This year we are helping Santa to find the stolen stars. As Santa mentioned in his letter to us:

  "Santa's sleigh uses a very high-precision clock to guide its movements, and the clock's oscillator is regulated by stars. Unfortunately, the stars have been stolen... by the Easter Bunny. To save Christmas, Santa needs you to retrieve all fifty stars by December 25th."

  You can start helping Santa right now at https://adventofcode.com but we're going to bundle our forces during this meetup to come up with different solutions.

  See you December 20th in Launch Café!

  Ivan

  P.S. We're not limited to Ruby ;)
