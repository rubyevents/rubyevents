  Tijdens deze meetup gaan wij met elkaar, onder begeleiding van Mark IJbema (https://twitter.com/markijbema), een kleine competitie aan, genaamd Code golf (http://en.wikipedia.org/wiki/Code_golf).

  De bedoeling is dat je een bepaalde opdracht/probleem/algoritme met zo weinig mogelijk code uitprogrammeert. Prijs is een eeuwige roem!

  Neem dus je laptop mee!

  Huishoudelijke mededeling

  Onze locatie sponsor Launch Café is druk bezig met het verbouwen van de Grand Café - gedeelte waar Groningen.rb vaak plaats vindt. Daarom houden wij Groningen.rb dit keer op de eerste verdieping van het Launch Café. Deuren blijven gesloten gedurende de hele avond. Ik zal daarom regelmatig naar beneden lopen om jullie binnen te laten. Er is een bel aanwezig, maar de kans dat die boven gehoord wordt is klein.

  Bel mij daarom als je voor de deur staat: 0624813939 of voeg mij van te voren (tijdelijk) toe op Find My Friends (https://itunes.apple.com/us/app/find-my-friends/id466122094?mt=8) (iPhone gebruikers). Mijn handle is ivandm@me.com. Dan ontvang ik een bericht als je er bent!

  Verzoek is ook als je het Launch Café verlaat, laat het dan ook weten. Dan loop ik mee naar beneden.

  Tot morgen!
