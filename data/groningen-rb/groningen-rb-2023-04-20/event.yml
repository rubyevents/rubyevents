  Speakers

  1. How music works, using Ruby by Thijs Cadier (https://www.linkedin.com/in/thijscadier/) from AppSignal (https://www.appsignal.com/)
  That strange phenomenon where air molecules bounce against each other in a way that somehow comforts you, makes you cry, or makes you dance all night: music. Since the advent of recorded audio, a musician doesn’t even need to be present anymore for this to happen (which makes putting “I will always love you” on repeat a little less awkward).
  Musicians and sound engineers have found many ways of creating music, and making music sound good when played from a record. Some of their methods have become industry staples used on every recording released today. Let’s look at what they do and reproduce some of their methods in Ruby!
  Thijs Cadier, co-founder of AppSignal from Amsterdam, the Netherlands. Been programming in Ruby since discovering Rails when it was still in beta in 2005. Been producing music as a serious hobby for a couple of years now, and using Ruby as a way of actually learning to understand what I’m doing.

  2. Ruby on Rythm by Rick van Dijk (https://www.linkedin.com/in/rickvdijk/) from Baseflow (https://www.baseflow.com/)
  In this talk, Rick van Dijk, Lead Mobile Developer at Baseflow, is going to talk about creating music with Ruby. In his spare time, Rick is a DJ and producer that started experimenting with live music programming. In a workshop setting, you will start creating your own track, all in Ruby. You don't want to miss this one, since you might be the next famous programming DJ!
  Are you ready to create music with Ruby? Make sure to bring your laptop. In advance we'd like you to install Sonic Pi on your device. You can download it right here (Windows an Mac only, sorry Linux): https://sonic-pi.net (https://sonic-pi.net/)

