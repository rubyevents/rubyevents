  Hey all!

  This meeting we'll have a mix of different talks:

  Remon (https://twitter.com/r51) will recap RailsConf (http://railsconf.com/) which he is attending at the time of writing.

  Marten (https://twitter.com/mveldth) will try to bridge the gap between your favorite editor and browser. He'll show the development workflow in ClojureScript (https://github.com/clojure/clojurescript).

  Erik (https://twitter.com/hackteck) is going to tell about architecture of ClubCollect (https://www.clubcollect.com/) which is a payment platform for sport clubs.

  We probably will have an old friend of Groningen.rb calling in from Sweden.

  Have fun and adore (https://hackerone.com/) our (http://www.catawiki.nl/) sponsors (http://www.launchcafe.nl/).

  Ivan

