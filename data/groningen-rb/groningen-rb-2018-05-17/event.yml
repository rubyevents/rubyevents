  Dear members of Groningen.rb and Elixir |> Groningen,

  We have missed you! And you might very well have missed us as well. It has been very long since the last editions of the Ruby and Elixir meetups have been held.
  We have been very busy with a couple of tremendously exciting but time-consuming projects. Really nice, but we could have kept you informed better than we did; our sincere excuses for this.

  Now, it is time to kick-start a new season of awesome meetups! On the 17th of May, at 19:00, you are welcome to join us at the Mauritsstraat 1 for the first new meetup.
  This meetup will be a combined Elixir and Ruby meetup, without one speaker, but instead a round of Lightning Talks!

  What is a Lightning Talk, you might ask? A Lightning Talk is a short presentation of no more than five minutes that can be about anything you think the other attendees might find interesting.
  You might plan for this, but doing it spontaneously is also an option.

  Besides this, the rest of the evening will be a nice opportunity to catch up with everyone (and maybe meet some new people?).
  We'll bring drinks and snacks for you all!

  See you there,

  Wiebe-Marten and Rene from Panache/Resilia
