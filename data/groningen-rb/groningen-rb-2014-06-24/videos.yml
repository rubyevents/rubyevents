  description: |-
    Ivan vertelt kort over de OpenCPU gem (https://github.com/roqua/opencpu) die bij RoQua (http://roqua.nl/) ontwikkeld is.

    OpenCPU (https://www.opencpu.org/) is een platform dat een JSON API biedt voor R-scripts. R taal wordt vaak gebruikt om statistische berekeningen uit te voeren. OpenCPU zorgt ervoor dat deze berekeningen over de nodes verdeeld kunnen worden om zware statistische berekeningen sneller en efficienter te kunnen uitvoeren.
