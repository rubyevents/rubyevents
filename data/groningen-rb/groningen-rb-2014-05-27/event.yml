  Fernand Geertsema (https://twitter.com/fgeertsema) vertelt over Phantom.js (http://phantomjs.org/). Phantom.js is een headless WebKit browser scriptable met Javascript en vormt daarmee een ideale toepassing voor het testen van de websites, screen captures maken van je web-content, automatiseren van websites, monitoren van netwerken etc etc.

  Talk #2

  Willian van der Velde (https://twitter.com/WillianvdVelde) is onlangs naar RailsConf (http://www.railsconf.com/) geweest. In vijftien minuten flitst Willian er zo'n vijfentwintig Ruby on Rails wetenswaardigheden doorheen.

