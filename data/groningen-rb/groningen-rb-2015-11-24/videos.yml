  title: "Using micro services to decompose Catawiki's Mothership"
  date: "2015-11-24"
  language: "English"
  video_provider: "not_recorded"
  video_id: "marco-jansen-groningen-rb-2015-11-24"
  description: |-
    During the last year Catawiki implemented a micro services architecture that we now use to migrate our existing Rails 2 application (our mothership) to smaller Rails 4 applications and services. Using this architecture we can also now quickly develop new functionalities like our home grown ab-framework that can make use of existing functionalities. New functionality is not only developed in Rails, but also in iOS and Android (for the apps) and React (for single page applications). During this talk we share our learnings and explain our migration strategy that is based on the good old StanglerApplication pattern as described by Martin Fowler.
