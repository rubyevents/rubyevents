  Hey everyone! On the 20th of December, we'll hold an Advent of Code session: everyone is invited to come and puzzle using their programming language(s) of choice to solve this year's Advent of Code code puzzles. Doing this together is a lot of fun, because not only will we be writing solutions (in many different languages), we will also compare and discuss them!

  This meetup will be held at the office of Payt (Ubbo Emmiussingel 21), where there's enough desk space for everyone: bring your laptop!

  See you there,
