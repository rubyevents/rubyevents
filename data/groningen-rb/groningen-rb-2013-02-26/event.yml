  Ook in 2013 gaat Groningen.rb door met het evangeliseren van Ruby - de programmeertaal met ongekende mogelijkheden en toch waarmee je heel snel een werkende prototype neer kan zetten.

  24 februari is Ruby 2.0 uitgekomen - 20 jaar na de eerste public release. Daarnaast komt Rails 4 ook steeds dichter bij. Tijdens deze bijeenkomst ga ik (Ivan) de features toelichten van Ruby 2.0 en Rails 4 RC-1.

