  AppSignal

  AppSignal (https://appsignal.com/) is door 80beans (http://www.80beans.com/nl) ontwikkeld als een side-project. Dit side-project loopt inmiddels wat uit de hand: met 3.000.000.000 requests per maand moet dit toch wel gaan schalen.

  AppSignal is een web-app dat Ruby on Rails ontwikkelaars helpt om inzicht te krijgen van de error-messages, performance, web-gebeurtenissen, deployments, verschillen in hosts enzovoort.

  Thijs Cadier (https://twitter.com/thijsc) - AppSignal co-founder - gaat ons vertellen over de groei en de schaalbaarheid van AppSignal.

