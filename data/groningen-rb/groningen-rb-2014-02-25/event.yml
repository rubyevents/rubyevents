  Mark IJbema (https://twitter.com/markijbema) gaat vertellen over React (http://facebook.github.io/react/). React is een view-layer framework dat icm de verschillende frontend Javascript frameworks gebruikt kan worden, bijvoorbeeld met Backbone.

  Angular.js

