  Hoi allen!

  De bedoeling was dat wij tijdens deze meetup zouden gaan barubycuen. Helaas was de weersvoorspelling voor 26 augustus in de afgelopen weken alles behalve gunstig. Uitgaande van the worst case scenario (niet te verwarren met een barbecue worst!) heb ik een en ander niet kunnen voorbereiden.

  De voorspelling voor morgen avond is nu aangepast en schijnt dat het weer beter wordt. Ik heb daarom besloten om deze meetup te verplaatsen naar een andere leuke locatie, namelijk De Noorderzon.

  "Beers and laughs" editie dus!

  Tijd: 20:00
  Plaats: Spiegelterras, gelegen in het Noorden van het Noorderplantsoen.

  P.S. Voor de barbecue liefhebbers: er staat een (extreem dure voor een festival) barbecue tent nabij het Spiegelterras.

  P.P.S. Eten en drinken wordt dit keer niet gesponsord ;)
