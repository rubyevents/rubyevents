description: |-
  Op 10 Januari is het alweer tijd voor de 3e editie van Groningen.rb.

  Het zal deze keer plaats vinden op: Praediniussingel 41, dat is dus een andere locatie! Adix (http://www.adix.nl/) - de rails hosters in Groningen - zijn zo gastvrij om een prachtige ruimte in hun grachtenpand beschikbaar te stellen voor onze meet-up.

  Dit keer is er geen lezing, maar zal er daadwerkelijk gelivecode gaan worden! Hoe en wat blijft nog een een verrassing, maar het wordt tof! Ook voor niet-zo-into-Ruby-mensen zal het een leuke avond worden en valt er in ieder geval een boel op te steken!

  Mocht je van plan zijn te komen, tweet dat dan vooral even, dan weten we hoeveel mensen we ongeveer kunnen verwachten. Niet-twitteraars zijn natuurlijk ook van harte welkom.

  Tot 10 Januari!
  @egbrt
