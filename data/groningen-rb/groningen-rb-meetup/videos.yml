    Leren Doseren

    Leren Doseren (http://www.lerendoseren.nl/) - een app voor de verpleegkundigen om op een speelse manier doseringen van de medicijnen beter te leren uitrekenen.

    Marthyn Olthof (https://twitter.com/Marthyn) - de ontwikkelaar van Leren Doseren - vertelt over de app, de technische en design uitdagingen tijdens de ontwikkeling van de app, maar ook over de gamification dat het leuker maakt om sommetjes te oefenen.

    OpenCPU Ruby gem

    Ik, Ivan (https://twitter.com/ivdma), vertel kort over de OpenCPU gem (https://github.com/roqua/opencpu) die bij RoQua (http://roqua.nl/) ontwikkeld is.

    OpenCPU (https://www.opencpu.org/) is een platform dat een JSON API biedt voor R-scripts. R taal wordt vaak gebruikt om statistische berekeningen uit te voeren. OpenCPU zorgt ervoor dat deze berekeningen over de nodes verdeeld kunnen worden om zware statistische berekeningen sneller en efficiënter te kunnen uitvoeren.

    Aanvang 19:45

    Tot dan!
