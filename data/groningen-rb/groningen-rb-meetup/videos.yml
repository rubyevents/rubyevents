- id: "groningen-rb-meetup-2022-12-15"
  title: "Groningen.rb Reboot"
  event_name: "Groningen.rb - December 2022"
  date: "2022-12-15"
  language: "English"
  video_provider: "children"
  video_id: "groningen-rb-meetup-2022-12-15"
  description: |-
    https://www.meetup.com/groningen-rb/events/289886611/

    Groningen.rb Reboot.

    Four years ago we held our last Groningen.rb meetup. It was a small wintery edition where we solved puzzles presented us by the Advent of Code (https://adventofcode.com/) using Ruby.

    Some winters and a pandemic further there are still a decent amount of companies in Groningen and surroundings who use Ruby.

    So let's meet again and share what we've done in the past years!

    Speakers

    Ditching Rails database abstractions in favor of native Postgres.
    by Nicke van Oorschot of Payt (https://www.paytsoftware.com/).

    Rails has a great built-in database abstraction library – ActiveRecord – which takes care of things like relationships, validations etc. But in some cases Rails falls short. Nicke is going to tell where Rails fell short and how Payt moved some abstractions to the database layer.

    Practices for faster tests
    by Tetiana Chupryna of GitLab (https://about.gitlab.com/).

    Fast and reliable tests are a base for efficient software development. Tetiana will share some tips and tricks that can help you to speed up your own RSpec test suites.

    Details

    Doors open at 19:45.
    First speaker starts at 20:00. Please be on time.
    The bar will be open. First three drinks are on us.

    Please keep in mind to unregister yourself in case of you can't attend the meetup so other people can RSVP.

    Sponsors

    PayPro (https://www.paypro.nl/)
    Online payments for entrepreneurs that want maximum growth and ease of use.

    Payt Software (https://www.paytsoftware.com/nl/)
    The most complete smart accounts receivable management software.

    Ideas

    During the meetup we will be collecting your ideas to make the next meetup even more attractive. So please use the post-its to let us know one of the following:
    - you'd like to speak at the meetup;
    - you know someone who you'd like to nominate to present;
    - there is a gem/tool/architecture/etc you want to hear about;
    - or any other free-form feedback.

    See you December 15th!
