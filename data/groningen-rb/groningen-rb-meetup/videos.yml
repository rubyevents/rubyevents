  description: |-
    Jawel, hij komt er! En wel op 11 oktober. Reserveer die avond alvast in Google Calendar en tweet even dat je er bij bent.

    We kunnen wederom terecht op het kantoor van mediaCT (http://mediact.nl) op Zuiderpark 22, Peter Berkenbosch (http://twitter.com/pberkenbosch) zal een lightning talk doen over Behavior Driven Development met Cucumber (http://cukes.info/)

    Groningen.rb is een evenement met het doel de verschillende Ruby en Rails projecten en talenten in het noorden van het land in kaart te brengen.

    Natuurlijk ben je ook welkom als je geen twitter hebt, kom gewoon langs!

    Binnenkort meer nieuws.

    Tot 11 Oktober!
