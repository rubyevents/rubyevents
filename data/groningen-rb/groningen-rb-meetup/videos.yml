    Data-Driven Development

    Geïnspireerd door http://booking.com zijn we bij Catawiki (http://catawiki.nl) op dit moment bezig met het opzetten van innovatieteams. Dit zijn teams die een duidelijk doel hebben en die volledig zelfstandig nieuwe features en verbeteringen die ze zelf bedenken implementeren en in productie valideren met behulp van A/B-testing. In deze presentatie deel ik onze eerste bevindingen. O.a. over hoe de teams zijn opgezet, hoe we ons datawarehouse aan het inrichten zijn en over onze ervaringen met A/B-testing tools, zowel open-source (bijv. Split) als commerciële tools (bijv. Optimizely). De A/B-testing tools laat ik ook zien d.m.v. een korte demo.

