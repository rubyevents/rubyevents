    Hey all,

    This edition we'll be hosting some short talks.

    Henk van der Veen (https://twitter.com/hampei) on Omniscient (http://omniscientjs.github.io)
    Do fast top-down rendering embracing immutable data. With cursors into immutable data structures, components can easily swap their own piece of data inside the larger immutable data structure only to render components that actually have changed their data layer.

    Fernand Geertsema (https://twitter.com/fgeertsema) on React Redux

    Redux is a predictable state container for JavaScript apps. It helps you write applications that behave consistently, run in different environments (client, server, and native), and are easy to test.

    Ivan (https://twitter.com/ivdma) on React Relay (https://facebook.github.io/relay/) and GraphQLA Javascript framework for building data-driven React applications.

    You?

    We are still looking for some more Ruby or Rails related talks!

    As usual we starting at 20:00 (doors open at 19:45).

    See you there!

    Ivan
