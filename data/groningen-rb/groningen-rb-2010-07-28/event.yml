description: |-
  Voor alle rubyboeren en railsninja's in het noorden des lands

  Heb je ooit wel eens van Ruby gehoord of werk je dagelijks met Rails? Kom dan op 28 Juli naar Groningen! Dan zal namelijk de allereerste Groningen.rb gaan plaatsvinden. Onder het genot van het een paar ijskoude pilsjes, zul je te weten komen hoe groot de noordelijke Ruby wereld is en wat er daarbinnen zoal gebeurt.

  MediaCT (http://mediact.nl) heeft een prachtige ruimte in hun herenpand ter beschikking gesteld, dit is gevestigd op Zuiderpark 22. Daarnaast nemen ze ook nog eens het eerstje rondje op hun rekening! De rest van de drankjes wordt gesponsord door Credeble (http://credeble.com).

  Als je van plan bent te komen, laat het dan op Twitter even weten met de hashtags #groningenrb #ikbenerbij. Geen twitter? Geen probleem, je bent alsnog van harte welkom!

  Tot 28 Juli!
