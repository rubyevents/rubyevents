    - id: "shinta-koyanagi-picorubykaigi-2026"
      title: "Building a Penlight Controller with PicoRuby"
      original_title: "PicoRubyで作る制御ペンライト"
      date: "2026-10-31"
      video_provider: "scheduled"
      video_id: "shinta-koyanagi-picorubykaigi-2026"
      description: |-
        2025年12月、サンリオピューロランドの新パレードに合わせてリリースされた「ワンダーリボンライト」を手にして、「これはどうやって制御されているんだろう」と気になって調べ始めたのが、このプロジェクトのきっかけです。調べてみると、思いのほか奥が深い世界でした。

        これ、PicoRuby で再現出来るんじゃないかと思ったのでやってみることにしました。実用可能な自作制御ペンライトをつくるというのがゴールとなります。

        コンサート会場で運営側から一斉制御される「制御ペンライト」には、赤外線（PixMob など）、独自 RF（FreFlow や Xylobands などの 920MHz/2.4GHz 帯）、BLE（アプリ連携）、そして音響と、複数の方式が実用されています。各方式をメーカー公式資料・総務省の技適データベース・電波法を調べて比較検討した結果、本作ではワンダーリボンライトと同じ音響方式（ほぼ非可聴の制御トーン 18.5〜19.5kHz・4-FSK を音楽に重畳し、ペンライトの MEMS マイクで復調する方式）を選びました。

        選んだ理由は3つあります。(1) 送信インフラが不要で、会場の PA だけで送出できること。(2) 音は電波法の「電波」に該当せず、免許も技適も不要なため、個人製作の数台を合法に会場で使えること。(3) エレキギターのエフェクトチェーン最終段で、演奏者自身がリアルタイムに制御トーンを重畳できること（既存の商用音響制御製品は音源への事前埋め込み型が主流です）。

        信機は RP2350（Raspberry Pi Pico 2）+ PDM MEMS マイク（SPH0641LU4H-1）+ WS2812B。PDM 取り込み〜CIC デシメーション〜Goertzel 検出というリアルタイム制約のあるホットパスを C/PIO 層で、フレーム同期・コマンド解釈・発光パターンの状態遷移を PicoRuby 層で担う2層構成です。

        ショーケースでは以下を展示します

        - (1) 体験デモ（机上の QR コードをご自身のスマホで読み取ってデモサイトを開き、ボタンを押すと制御トーンが鳴って、目の前のペンライトが光ります）
        - (2) きっかけとなったワンダーリボンライト実機との比較展示
        - (3) 制御方式の比較・電波法/技適調査・物理層/フレーム構成の設計資料
        - (4) 10/16 にライブハウス（渋谷 La.mama）で数台を来場者に貸し出す実地テストの実測データ（個体別の復調成功率など）
      speakers:
        - Shinta Koyanagi

    - id: "tarosa-picorubykaigi-2026"
      title: "Running Ruby on a ¥290 Microcontroller — Challenges with UIAPruby and Can Satellites"
      original_title: "290円のマイコンでRubyを動かす ― UIAPrubyと缶サットへの挑戦"
      date: "2026-10-31"
      video_provider: "scheduled"
      video_id: "tarosa-picorubykaigi-2026"
      description: |-
        290円の格安マイコン「UIAPduino」をRubyでプログラムするためのUIAPrubyを開発しています。
        290円にこだわるのは、電子工作のハードルを下げ、思いついたアイデアをいくつでも形にできるようにしたいからです。
        今回、その実践例として「LeanSat にくまる君」という缶サットを製作しています。LeanSatは、必要な機能に絞ったシンプルな缶サットという意味です。「にくまる君」は、価格290円から名付けました。
        機体は直径64.5mm、全長122.5mm。290円のUIAPduino、25円のCdSセル3個、90円のI2C EEPROM、単4電池3本と電池ケースというシンプルな構成です。
        今年のミッションは、3個の光センサだけで缶サットの状態をどこまで検出できるかを試すことです。最大のサクセスクライテリアは落下速度の推定です。落下時の気流で回転するフィンが光センサの前を横切ることで生じる明暗の周期を測定し、その回転速度から落下速度を推定します。晴天時には、太陽光を利用して機体の向き、回転、揺れなどを読み取れる可能性も検証します。
        この缶サットは2026年9月12日の宇宙甲子園近畿地方大会で、大会の打ち上げシステム確認を兼ねた最初の缶サットとして打ち上げる予定です。CFP応募時点ではまだ結果は出ていません。Showcaseでは、UIAPduinoと「LeanSat にくまる君」の実機、UIAPrubyによる計測・記録の仕組みを紹介し、打ち上げに成功した場合は取得データや打ち上げ映像も紹介します。期待どおりに動作しなかった場合も、その結果や改善点を共有します。
        また現在、「子供向け URB Block プログラミング」の開発も始めています。ブロックで作ったプログラムをRubyコードへ変換し、UIAPduinoで実行できる仕組みです。
      speakers:
        - Tarosa

    - id: "kubo-token-picorubykaigi-2026"
      title: "Pico-Pico Sound with PicoRuby — Building a Synthesizer Controlled by Ruby"
      original_title: "PicoRubyでピコピコサウンド -Rubyで制御するシンセサイザを作る-"
      date: "2026-10-31"
      video_provider: "scheduled"
      video_id: "kubo-token-picorubykaigi-2026"
      description: |-
        PicoRubyでのHello worldといえばLチカでしょう。そしてその次の一歩としてPWM信号をスピーカーに繋いで音を出すサンプルを作ったことがある人は多いかもしれません。この音を出す仕組みを改良してより複雑な音色をリアルタイムで制御できればーーつまり演奏できればさらに楽しいでしょう。
        演奏できる電子楽器といえばアナログシンセがあります。しかしこれは個人で製作するにはアナログ回路の知識や電子工作機材の準備、部品の厳選などが必要となり、なかなかハードルが高いです。とくに楽器としての心臓部である、指定した周波数の信号を生成する回路は、調達が困難な部品を必要とすることもあり製作難易度が高いです。
        ラズパイPicoがあればこういったアナログ回路の難しい部分をソフトウェアに肩代わりしてもらえます。
        アナログシンセは複数のモジュールから構成されます。音色を決定する波形を生成するVCO、音量を制御するVCA、音色に変化を加えるVCF、さらにその後さまざまな加工を行うモジュールなど。これらのモジュールは電圧信号で制御されます。この電圧信号をPicoRubyから操作すれば、複雑な制御はソフトウェアで可能になります。
        みなさんが普段PicoRubyでやりとりする信号はI2CやUARTなどのデジタル信号が多いでしょう。しかしシンセ製作ではアナログ信号を使います。決められた規格の信号からは外れて、自分の出したい音の波形を作る必要があります。PicoRubyからPWM信号を出し、それを音楽的に活用できる"音"に変換する過程を追いかけることで、アナログ回路の楽しさを知っていただければと思います。
      speakers:
        - Kubo Token

