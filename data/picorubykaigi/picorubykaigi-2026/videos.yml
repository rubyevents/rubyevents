- id: "yoh-osaki-picorubykaigi-2026"
  title: "Building a PicoRuby Development Environment with PicoRuby"
  original_title: "PicoRubyで作るPicoRuby開発環境"
  date: "2026-10-31"
  start_time: "15:20"
  end_time: "15:40"
  language: "Japanese"
  video_provider: "scheduled"
  video_id: "yoh-osaki-picorubykaigi-2026"
  description: |-
    PicoRuby(.wasm)で作られたPicoRubyの開発ツールとしては、R2P2 Web Terminalがあります。
    R2P2 Web TerminalはPicoRuby上で動くRubyのコードを書くことができます。
    しかし、実際のPicoRubyによるマイコンボードの開発においてはC言語の実装が必要になるケースが多くあります。
    mrbgemを開発する場合、C言語のライブラリを呼びだす必要がある場合、パフォーマンス要件や低レイヤを直接制御する場合などC言語で実装する必要があるケースがあります。
    しかし、C言語で開発した機能をPicoRubyに組み込むにはPicoRubyのイメージのビルドが必要になります。ビルド環境を構築するのはPicoRubyの開発におけるひとつの大きなハードルです。

    ここで言うPicoRubyの開発環境とは、R2P2 Web TerminalのようなWebブラウザ上で動く

    - C言語のファイルの編集ができて
    - ビルドが可能な
    - ビルドしたイメージをマイコンにインストールできる

    ような開発環境を目指しています。

    本トークでは、PicoRubyの開発環境の開発の進捗と技術的な解説を行ないます。
  speakers:
    - Yoh Osaki

- id: "yuhei-okazaki-picorubykaigi-2026"
  title: "Growing PicoRuby's Ecosystem on ESP32"
  date: "2026-10-31"
  start_time: "15:45"
  end_time: "16:05"
  language: "Japanese"
  video_provider: "scheduled"
  video_id: "yuhei-okazaki-picorubykaigi-2026"
  description: |-
    R2P2-ESP32はPicoRubyのESP32向けプラットフォームです。

    これまでESP32を使ってPicoRubyをはじめるにはいくつかの障壁がありました。具体的には「ファームウェアの書き込み方法がわかりにくい」「ビルドのために開発環境(ESP-IDF)をインストールする必要がある」「実機上でのデバッグ手段がない」といった点です。

    こうした障壁を取り除くべく、入門者がより始めやすくなるエコシステムを整備しています。具体的な取り組みは次の3つです。

    1. R2P2-ESP32 Web Installer
       実機に対してブラウザから直接ファームウェアを書き込む仕組み
    2. Dockerベースのビルドサポート
       ESP-IDFをインストールしなくても、R2P2-ESP32をビルドできるようにする機能
    3. yuuu/picoruby-debug
       実機上でRubyのdebug gemライクなデバッグ体験を提供するmrbgem

    これらの取り組みにより、「動かす」「カスタマイズする」「デバッグする」という開発の一連の流れを、入門者でも無理なく体験できるようになりました。

    それぞれの利用方法と実現方法、技術的な工夫点についてもお話しします。
    このトークをきっかけに、ぜひESP32を使ってPicoRubyに入門してください！
  speakers:
    - Yuhei Okazaki

