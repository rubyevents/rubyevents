  talks:
    - id: "ivy-njuguna-african-ruby-community-meetup-june-2025"
      title: "Security on Rails"
      event_name: "African Ruby Community Meetup June 2025"
      date: "2025-06-12"
      video_provider: "not_recorded"
      video_id: "ivy-njuguna-african-ruby-community-meetup-june-2025"
      description: |-
        Ruby on Rails is designed with security in mind, offering built-in protections against common web vulnerabilities like **SQL injection**, **XSS**, and **CSRF**. It encourages best practices through features like **Strong Parameters**, **encrypted credentials**, and **secure defaults** in views and database interactions. While Rails handles much of the heavy lifting, developers still need to stay vigilant by validating input, keeping dependencies updated, and following secure coding practices.
      speakers:
        - Ivy Njuguna

