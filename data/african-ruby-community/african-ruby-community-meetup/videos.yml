  talks:
    - id: "fh-ndiritu-african-ruby-community-meetup-september-2025"
      title: "The Modern Rails Blueprint: A Practical Look at Hotwire and Solid Gems"
      event_name: "African Ruby Community Meetup September 2025"
      date: "2025-09-13"
      video_provider: "not_recorded"
      video_id: "fh-ndiritu-african-ruby-community-meetup-september-2025"
      description: |-
        Rails defaults have evolved over the last few versions to do away with json APIs, Javascript-rich frontends, Sidekiq/Resque and Redis/Memcached.
        What are the replacements? How do they work? And how can you replace and start using them?
        We shall be performing these upgrades on a boring Rails App to give it a fresh look!
      speakers:
        - FH Ndiritu

- id: "african-ruby-community-meetup-october-2025"
  title: "African Ruby Community Meetup October 2025"
  event_name: "African Ruby Community Meetup October 2025"
  date: "2025-10-11"
  video_provider: "children"
  video_id: "african-ruby-community-meetup-october-2025"
  description: |-
    https://www.meetup.com/african_ruby_community/events/310428682
  talks:
    - id: "nduati-kagiri-african-ruby-community-meetup-october-2025"
      title: "From Rails to Ruby: Building Something Fun Without Rails"
      event_name: "African Ruby Community Meetup October 2025"
      date: "2025-10-11"
      video_provider: "not_recorded"
      video_id: "nduati-kagiri-african-ruby-community-meetup-october-2025"
      description: |-
        When most developers think of Ruby, they think of Rails. But Ruby is much more than its most famous framework. In this talk, we’ll step away from the Rails mindset and explore how to build something fun and practical using just Ruby itself.
        We’ll look at how Ruby’s expressive syntax, built-in standard library, and flexible object model make it a joy to prototype outside the Rails world. This session is designed to stretch your perspective on what Ruby can do, highlight lightweight approaches to problem-solving, and inspire you with demo-friendly examples that anyone can try.
      speakers:
        - Nduati Kagiri

