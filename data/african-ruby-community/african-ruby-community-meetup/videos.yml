  title: "African Ruby Community Meetup February 2025"
  event_name: "African Ruby Community Meetup February 2025"
  date: "2025-02-20"
  video_provider: "children"
  video_id: "african-ruby-community-meetup-20-february-2025"
  description: |-
    https://www.meetup.com/african_ruby_community/events/306152803
  talks:
    - id: "nemwel-nyandoro-african-ruby-community-meetup-20-february-2025"
      title: "Enhancing Ruby on Rails Applications with Stimulus JS"
      event_name: "African Ruby Community Meetup February 2025"
      date: "2025-02-20"
      video_provider: "not_recorded"
      video_id: "nemwel-nyandoro-african-ruby-community-meetup-20-february-2025"
      description: |-
        Hello there! I am Nemwel Boniface, a Software developer and a Ruby programming language enthusiast. I am excited to take you through Stimulus JS, a minimal yet powerful JavaScript framework that brings reactivity to server-rendered applications without the complexity of modern front-end frameworks. In this talk, I'll explore how Stimulus integrates seamlessly with Ruby on Rails, enhancing user experience while keeping your application fast and maintainable. We'll cover key concepts, compare it with other libraries such as React, and demonstrate real-world use cases. Whether you're new to Stimulus or looking to level up your Rails interactivity, this session will equip you with the knowledge to get started! Looking forward to sharing this and learning with you all!
      speakers:
        - Nemwel Nyandoro

