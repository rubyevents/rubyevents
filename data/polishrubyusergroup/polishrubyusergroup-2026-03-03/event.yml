  PLRUG Warsaw Meetup - We're Back! 💎🍕

  After a few months of break, Polish Ruby User Group (PLRUG) Warsaw is finally back!

  On March 3rd, 2026, we're returning with a classic, standalone edition of our meetup - more intimate, more relaxed, and closer to our roots.

  In recent months, most of our meetups were part of larger multi-community event - Behind The Code. This time, we're going solo - which means more space for conversations, networking, and that unique PLRUG atmosphere we've all been missing.

  What else to expect?
  🤝 Plenty of time to connect with fellow Rubyists
  🍕 Pizza and drinks on us
  💬 A relaxed, community-first vibe

  Whether you're a long-time PLRUG regular or haven't joined us in a while - this is the perfect moment to come back.

