  PLRUG Warsaw Meetup – Back After the Summer Break! 💎

  Summer is over, and PLRUG Warsaw is finally back! 🎉

  After a little break, we're getting the Warsaw Ruby community together again for an evening of great talks, interesting conversations, and the relaxed atmosphere we all know and love.

  On October 28th, we're returning to Hashtag Lab - one of our favorite meetup venues, where we've already shared some fantastic evenings with fellow Rubyists.

  And this time, we've got a particularly strong lineup waiting for you!

  🎤 Our speakers

  💎 Cezary Kłos
  How I gave my AI agents their own machines - and why you should too
  💎 Maciej Gajewski
  Through the Prism Glass
  💎 Chris Hasiński
  Everything is open source
  💎 Maciej Mensfeld
  Zen and the Art of a Million Containers

  The talk titles are still under wraps, but we'll be revealing them very soon. Stay tuned!

  🍕 More than just talks

  As always, PLRUG is about much more than presentations.
