  And of course, we'll take care of the essentials:

  🍕 Delicious pizza from Pizzeria na Barskiej
  🥤 Free drinks and refreshments
  🤝 Plenty of networking in a friendly, informal atmosphere

  📍 When & where?

  📅 October 28th, 2026
  🕕 18:00–21:00
  📍 Hashtag Lab – The Contemporary Music Space
  ul. Barska 29, Warsaw

