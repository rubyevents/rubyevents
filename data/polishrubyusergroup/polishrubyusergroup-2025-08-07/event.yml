description: |-
  Rubyists of Warsaw, mark your calendars!

  The next Polish Ruby User Group (PLRUG) Warsaw Meetup is just around the corner, and this one is going to be truly special. On August 7th (Thursday), from 18:00 to 21:00, we’re joining forces with Venture Café Warsaw to be part of their flagship event – Thursday Gathering #238: BEHIND THE CODE (https://venturecafewarsaw.org/event/thursday-gathering238/).

  What’s the idea?

  Five tech meetups. One space. Countless conversations.
  Alongside PLRUG, the evening will also host WarsawJS, PyWaw, Cloud Native Warsaw, and Golang Warsaw – all happening simultaneously at CIC Warsaw (ul. Chmielna 73).

  This is your chance not only to learn something new from Ruby presentations, but also to connect with developers from other communities, broaden your horizons, and make meaningful connections.

  📍 When & Where?

  🗓 Date: 07.08.2025 (Thursday)
  🕕 Time: 18:00 – 21:00
  📌 Location: CIC Warsaw, ul. Chmielna 73, Warsaw

  🗣 Agenda – PLRUG Warsaw
  Talks:

  1. Adding MCP to a legacy web application
  by Cezary Kłos
  2. Serious growth. Serious business. Powered by a monolithic Rails application
  by Tomasz Stachewicz

  This is a free event and open to everyone. Whether you're a seasoned Rubyist or just Ruby-curious, join us for an evening of knowledge, sharing, and community.

  In order to attend this meetup, you have to sign up to the event on Venture Café Warsaw website:

  https://venturecafewarsaw.org/event/thursday-gathering238/

  But don't worry - if you forget to do so, it'll be possible to sign up at the entrance on the day of the meetup.

  Don’t forget to also explore other rooms, network during breaks, and enjoy the atmosphere of Thursday Gatherings at Venture Café Warsaw.
  See you there! 🚀
