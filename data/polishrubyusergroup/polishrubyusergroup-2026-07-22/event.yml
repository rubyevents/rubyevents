description: |-
  ⚠️ Limited to 20 participants. Official registration is required via Lu.ma: https://luma.com/b8jn0glb

  PLRUG Ruby Warsaw Hackathon

  This time, we’re doing something a little different.

  Instead of our usual PLRUG Warsaw meetup format, we’re inviting the Ruby community to spend an evening building, experimenting, and solving a challenge together.

  Join us for a hands-on Ruby hackathon at the Visuality office in Warsaw.

  Important: registration via Lu.ma is required

  Because of the hackathon format, this event has a limited capacity of 20 participants.

  To join the hackathon, please register here:

  https://luma.com/b8jn0glb

  Please note: clicking “Attend” on Meetup does not guarantee your spot. The official participant list is managed through Lu.ma.

  Your registration means taking one of the limited available spots, so please sign up only if you’re planning to attend. If your plans change, no worries - just cancel your registration as soon as possible so someone from the waitlist can join.

  What to expect

  The hackathon will last 4 hours and will take place in a friendly, informal setting.

  You’ll work on a challenge prepared by us, but the exact topic will be revealed only on-site.

  No spoilers for now, but you can expect something fun, practical, and Ruby-related.

  You don’t need to prepare anything in advance. Just bring your laptop and curiosity.

  We’ll take care of the rest: coffee, drinks, food, and a comfortable space to work in.

  Practical details

  Date: Wednesday, July 22, 2026
  Time: 18:00–22:00
  Location: Visuality office, Wisła Plaza, Ludna 2, Warsaw
  Capacity: 20 participants
  Official registration: https://luma.com/b8jn0glb
  What to bring: your laptop
  Provided by Visuality: coffee, drinks, food and hackathon space

  After the hackathon

  The official part ends at 22:00, but if the weather and the group are up for it, we’ll continue the evening somewhere nearby by the Wisła - with space for relaxed conversations, networking and hanging out with fellow Rubyists.

  Who is it for?

  This event is for people who enjoy Ruby, Rails, programming, learning by doing, and spending time with a friendly tech community.

  You don’t need to be an expert to join - but you should be comfortable enough with Ruby or Rails to participate in a hands-on coding session.

  Come build something with us.
