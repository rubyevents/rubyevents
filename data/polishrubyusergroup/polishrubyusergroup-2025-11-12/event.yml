description: |-
  PLRUG Warsaw Meetup @ Behind the Code #3

  We’re back at Behind the Code - the event where several of Warsaw’s top tech communities meet under one roof!

  On November 12th, join us at CIC Warsaw (Chmielna 73) for another edition of PLRUG (Polish Ruby User Group), organized by Visuality, as part of Venture Café Warsaw’s fantastic initiative.

  This time, we’ve prepared three great talks covering patterns, protocols, and practical architecture insights from experienced Rubyists:

  💎 Agenda:

  - Kamil Szymański - Domain Storytelling and beyond
  - Mateusz Woźniczka - Ravens, Seals, and Trusted Scrolls: A Maester's Guide to TLS and DNS
  - Łukasz Reszke - Storing data as sequence of facts in Ruby on Rails

  As always, there’ll be plenty of time for networking, discussions, and a relaxed chat with other Ruby developers.
  Join us, share ideas, and meet the people shaping the Ruby community in Warsaw!

  📍 Where: CIC Warsaw, Chmielna 73
  🗓️ When: Tuesday, November 12th, 18:00
