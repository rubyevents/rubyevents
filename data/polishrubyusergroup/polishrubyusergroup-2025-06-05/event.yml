description: |-
  We're back - and we've missed you! 🚀

  After two months of silence (and one emotional office move), we're thrilled to announce that PLRUG meetups are back - and we're returning with fresh energy, a new venue, and the same old love for Ruby and the community that makes it shine.

  📆 When? June 5th, 18:00
  📍 Where? Południk Zero - a cozy travel-themed café in Warsaw (https://poludnikzero.pl/)

  Our March meetup was the last one hosted at our beloved office on Odolańska Street. Since then, we've been settling into our new space - but unfortunately, it's no longer fit for meetups. So this time, we're heading into town and embracing a new vibe.

  ### What's on the agenda?

  We've already got some exciting stuff lined up:
  🎤 Michał Łęcicki - “Shit Happens: Handling Mistakes 101”
  ⚡️ Lightning talks by Paweł Strzałkowski and Mateusz Woźniczka
  …and more talks are on the way - we're still finalizing the agenda, but rest assured: it's going to be a good one!

  ### As always:

  🍕 We'll bring snacks
  🍺 There'll be drinks
  💬 You bring the conversation

  So come hang out, chat Ruby, meet old friends (and new ones), and let's get this community rolling again.

  We couldn't wait to see you all again - and now, finally, it's happening.

  See you on June 5th!
