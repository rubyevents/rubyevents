  The Boston Ruby Group is a community of software engineers and Ruby language enthusiasts. Software developers of all levels are welcome! At security, tell them you are going to a Boston Ruby Meetup event at the CIC on the 18th floor.

  Learning From Ancestry

  Our May meeting features Keenan Brock, maintainer of a few active record centric gems (Ancestry, Active_hash, VirtualAttributes)

  Using Ancestry as a case study, we’ll walk through Postgres features most Rails apps haven’t reached for: stored generated columns, partial indexes, covered indexes, like clauses, collation, ltree, and array containment. We’ll talk about benchmarking techniques and changing a gem from implementation-focused to business-focused.

  Schedule

  6:00pm: Pizza and refreshments will be available.

  6:30pm: Talks begin.

