- id: "jeremy-weiskotten-bostonrb-2010-09-14"
  title: "Haml, Sass, and Compass for Sane Web Development"
  date: "2010-09-14"
  video_provider: "not_recorded"
  video_id: "jeremy-weiskotten-bostonrb-2010-09-14"
  description: |-
    HTML and CSS are ubiquitous on the web, but they were mostly created in a vacuum. Haml, Sass, and Compass provide helpful abstractions and utilities to remove some of the repetition and noise in your code for rapid development and easier maintenance. We'll discuss the basics and general syntax, then dive into some code to see how it really works.
  speakers:
    - Jeremy Weiskotten

- id: "steve-masterman-brian-kaney-bostonrb-2010-09-14"
  title: "Clarity with REST and Inherited Resources"
  date: "2010-09-14"
  video_provider: "not_recorded"
  video_id: "steve-masterman-brian-kaney-bostonrb-2010-09-14"
  description: |-
    Many Rails apps these days strive to be RESTful. But as complexity builds, exceptions are made, which can lead to a slippery slope toward fat controllers and complicated routing. We will try to add some clarity and look at REST fundamentals (it's more than GET, POST, PUT, and DELETE), resource-oriented design, inherited resources and the accepts-nested-attributes-for pattern with some realistic examples.
  speakers:
    - Steve Masterman
    - Brian Kaney
