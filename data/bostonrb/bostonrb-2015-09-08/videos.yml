- id: "conner-wingard-bostonrb-2015-09-08"
  title: "React on Rails"
  date: "2015-09-08"
  video_provider: "not_recorded"
  video_id: "conner-wingard-bostonrb-2015-09-08"
  description: |-
    React is a powerful JS (I know!) library for building user interfaces. Our goal is to build a blogging app with markdown editor and live HTML preview powered by Ruby on Rails and React. 
    In doing so we will learn what makes React more than yet another JS library blowing up Hacker News.
  speakers:
