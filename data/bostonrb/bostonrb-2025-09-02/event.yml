  Using safety_mailer to send email … safely

  Bill Kirtley, Distinguished Engineer at VitalSpark AI

  Have you ever accidentally sent email from a development environment? The safety_mailer gem is a quick way to ensure that your development and staging environments can send email to recipients you want to receive them, and not to those you don’t.

  Real-time collaboration with Rails, AnyCable and Yjs

  Jp Camara, Principal Software Engineer at Wealthbox

  Let's build collaborative features in Rails using AnyCable and Yjs! This talk will teach you how to implement real-time, Google Docs style collaboration while maintaining Rails patterns. It covers conflict free data types, scaling challenges, and production-grade implementation strategies for synchronized experiences.

