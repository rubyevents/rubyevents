- id: "fable-tales-bostonrb-2015-10-13"
  title: "Mocking Language"
  date: "2015-10-13"
  video_provider: "not_recorded"
  video_id: "fable-tales-bostonrb-2015-10-13"
  description: |-
    What’s a mock? What’s a stub? How about a spy? Or a double? 

    There are a lot of different tools to create isolated tests in RSpec. The terms aren’t necessarily totally clear. In this talk, we’ll look at what the different kinds of test isolation tools in RSpec are for, some testing smells they can create, and how to fix those smells. This talk will be perfect for those already a little familiar with RSpec and looking to improve their testing skills.
  speakers:
