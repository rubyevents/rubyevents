- id: "marko-anastasov-rubyconf-brazil-2014"
  title: "Improve your Rails application design with better TDD"
  date: "2014-08-29"
  start_time: "11:00"
  end_time: "11:45"
  language: "English"
  track: "Sala 1"
  video_provider: "not_recorded"
  video_id: "marko-anastasov-rubyconf-brazil-2014"
  description: |-
    Do your controller specs suffer from complicated setups? Are some parts of the system “too hard to test”? Difficulty in testing is often a sign that we could improve our application design. How to use tests to refactor in the real world when time is scarce? Can we have too much - or too little - of certain kinds of tests? The presentation will be based on concrete, before & after examples of Rails-based test and implementation. We’ll see that every problem is an opportunity to write better code and that there are guidelines that transcend any framework.
  speakers:
    - Marko Anastasov

