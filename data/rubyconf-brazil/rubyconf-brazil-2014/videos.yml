- id: "rishi-jain-rubyconf-brazil-2014"
  title: "Build, Debug and Prosper"
  date: "2014-08-28"
  start_time: "14:00"
  end_time: "14:45"
  language: "Portuguese"
  track: "Sala 1"
  video_provider: "not_recorded"
  video_id: "rishi-jain-rubyconf-brazil-2014"
  description: |-
    There were around 140000 ruby developers in the world 4 years ago. And the rate at which IT industry(particularly ruby and rails community) had grown in the past 4 years, it is safe to assume that this number would be much much higher, but lets proceed assuming 140000 ruby developers.
    As of 1-apr-2014 17:15 IST, there are 70,000 ruby gems available for download. So, the average number of ruby gem per developer comes out to be 0.50 Lets accept it, this is not a very impressive figure. So,what has stopped us from building gems and helping the ruby community grow? It could be one of the following reasons:

      Its like sending a space ship to Mars - complicated process
      I can't do that, it's only for experts - calibre
      Who has the time? I work 24x7 - busy
      There are people already doing it, why should I work hard for it and open source it. I am not that crazy - lazy
      Is it really needed, it's so trivial? - useless

    During the course of the talk, I am going to explain how ridiculously easy it is to build and publish a gem, what are various security issues you should be aware of and how does building open-source software helps in your career growth? After this talk, I hope we all will try to improve upon the figure of 0.50 !!
  speakers:
    - Rishi Jain

- id: "cezar-carvalho-pereira-rubyconf-brazil-2014"
  title: "iOS on Rails"
  date: "2014-08-28"
  start_time: "14:00"
  end_time: "14:45"
  language: "Portuguese"
  track: "Sala 2"
  video_provider: "not_recorded"
  video_id: "cezar-carvalho-pereira-rubyconf-brazil-2014"
  description: |-
    Muitas aplicações mobile de hoje necessitam de um componente servidor, que suporta desde sincronização de dados a notificações até in app purchases. Apesar da Apple fornecer uma boa solução na forma do novo CloudKit no iOS 8, ainda existem muitos motivos para desenvolvedores iOS melhorarem suas capacidades de desenvolvimento web e implementar o backend de seus próprios aplicativos. Ao mesmo tempo, a imensa popularidade da plataforma iOS é incentivo o suficiente para que desenvolvedores web invistam na mesma.
    Das muitas formas que se pode construir APIs para aplicações móveis, Rails se sobressai como uma solução efetiva e confiável. Paralelo a isso, o atrito causado por transitar da mentalidade necessária ao desenvolvimento web para iOS tende a ser reduzido com o surgimento da Swift, uma linguagem de programação moderna e com similaridades a Ruby em muitos aspectos.
    Nesta palestra, vou apresentar uma maneira limpa de construir APIs JSON amigáveis com Rails, e como utilizar Swift para implementar as aplicações iOS que funcionam com elas.
  speakers:
    - Cezar Carvalho Pereira

- id: "vipul-a-m-prathamesh-sonpatki-rubyconf-brazil-2014"
  title: "Building an ORM with AReL: Walking up the (AS)Tree"
  date: "2014-08-28"
  start_time: "14:45"
  end_time: "15:30"
  language: "English"
  track: "Sala 1"
  video_provider: "not_recorded"
  video_id: "vipul-a-m-prathamesh-sonpatki-rubyconf-brazil-2014"
  description: |-
    We all love ActiveRecord. Its amazing. But how exactly does ActiveRecord handle generating complex SQL queries? How Joins, Associations and Table Relations are handled? Most of this raw power comes from ARel. ARel is packed up with many features for complex query generation. Lets build our own ORM on top of ARel to see it in action.
    In the process we will also explore about how ActiveRecord hooks up with ARel. This talk describes Relational Algebra, Object and Collection modelling of ARel using a tiny ORM at its base. At the end of talk you will be equipped with better understanding of ARel and AR as an ORM.
  speakers:
    - Vipul A M
    - Prathamesh Sonpatki

- id: "eduardo-fiorezi-rubyconf-brazil-2014"
  title: "Convenção na criação e no deploy de aplicações Rails"
  date: "2014-08-28"
  start_time: "14:45"
  end_time: "15:30"
  language: "Portuguese"
  track: "Sala 2"
  video_provider: "not_recorded"
  video_id: "eduardo-fiorezi-rubyconf-brazil-2014"
  description: |-
    Quanto tempo você ou sua empresa leva para criar e colocar no ar um aplicativo RubyOnRails? O uso de convenções dentro da sua equipe irá ajudar a disseminar o conhecimento e facilitar o deploy de aplicações. Saiba quais serviços não podem faltar em um projeto que está em seu início e como eles podem te ajudar no dia a dia a chegar ao ponto de gastar apenas 5 minutos na criação de um novo projeto. Esta palestra irá te auxiliar nas decisões sobre padrões de testes, integração continua e no uso da convenção na escolha de ferramentas.
  speakers:
    - Eduardo Fiorezi

- id: "sebastian-sogamoso-rubyconf-brazil-2014"
  title: "SOLID principles through tests"
  date: "2014-08-28"
  start_time: "16:00"
  end_time: "16:45"
  language: "Portuguese"
  track: "Sala 1"
  video_provider: "not_recorded"
  video_id: "sebastian-sogamoso-rubyconf-brazil-2014"
  description: |-
    We care about writing quality code, we have read the definition of SOLID principles several times and we know how important they are for writing good OO code, but are we really following those principles? Is there a pragmatic way of following them in our day to day jobs or are they just some principles a few computer scientists wrote?
    Fortunately there is, SOLID principles are not just good ideas , they are intended to help us write better code, enjoy our jobs more and be happy programmers. So, where should we start? We should start where we always do. By writing tests, yes, for real. As Kent Beck says "TDD doesn't drive good design. TDD gives you immediate feedback about what is likely to be bad design", so we need to go a step further.
    In this talk we will see how writing tests is not just doing TDD is about having good test coverage, it's also about driving our code towards good design, one that follows SOLID principles.
  speakers:
    - Sebastian Sogamoso

- id: "lucas-martins-rubyconf-brazil-2014"
