- id: "carlos-antonio-da-silva-rubyconf-brazil-2014"
  title: "Truques que o Rails não te contou"
  date: "2014-08-29"
  start_time: "13:15"
  end_time: "14:00"
  language: "Portuguese"
  video_provider: "not_recorded"
  video_id: "carlos-antonio-da-silva-rubyconf-brazil-2014"
  description: |-
    Rails já existe por cerca de 10 anos, e cada vez mais aplicações são criadas todos os dias. Depois de trabalhar em muitos projetos diferentes, alguns criados por colegas, e muitos outros legados, começamos a encontrar alguns padrões, onde pessoas tendem a escrever muito código que a framework já provê. Não importa se é um time pequeno ou grande, ou se muitos desenvolvedores são iniciantes ou mais experientes, é comum encontrar código da aplicação fazendo algo que o Rails já oferece, criando duplicação desnecessária e introduzindo bugs. Mesmo em nossos próprios pull requests, é comum ver alguém usando uma funcionalidade que ninguém conhecia e começar a pensar que isso teria sido muito útil em outras situações.
    Esta palestra tem como objetivo mostrar essas funcionalidades não tão conhecidas do Rails, desde queries do ActiveRecord, até helpers de Views não muito bem documentados (mas muito úteis), que podem ajudar a escrever código mais conciso e entregar valor mais rápido. Tanto desenvolvedores iniciantes, quanto mais experientes deveriam assistir e aprender alguns truques do Rails.
  speakers:
    - Carlos Antonio da Silva

