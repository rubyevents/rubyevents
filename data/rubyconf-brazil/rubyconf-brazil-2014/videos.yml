- id: "koichi-sasada-rubyconf-brazil-2014"
  title: "Growing the Ruby Interpreter"
  date: "2014-08-29"
  start_time: "09:00"
  end_time: "09:45"
  language: "English"
  video_provider: "not_recorded"
  video_id: "koichi-sasada-rubyconf-brazil-2014"
  description: |-
    I'm working on improving quality of the Ruby interpreter, especially performance at Heroku, Inc. The Ruby intepreter consists of many components, such as virtual machine, memory management (including garbage collection) and threading. We had introduced a fast virtual machine called YARV in Ruby 1.9, rebuilt the threading feature using native threads in Ruby 1.9, and new GC algorithms, particularly generational garbage collection in Ruby 2.1. In this presentation, I will show you our contributions for the Ruby interpreter and current activities. I will also introduce Ruby 2.2, the next release of Ruby.
  speakers:
    - Koichi Sasada

- id: "travis-douce-rubyconf-brazil-2014"
  title: "Integration Testing SOA Rails Apps"
  date: "2014-08-29"
  start_time: "10:15"
  end_time: "11:00"
  language: "English"
  track: "Sala 1"
  video_provider: "not_recorded"
  video_id: "travis-douce-rubyconf-brazil-2014"
  description: |-
    Writing tests are hard, but writing integration tests for Service Oriented Architecture (SOA) is harder. In this talk, we'll start by describing what SOA is, why integration testing SOA apps is necessary, and why it is inherently difficult to accomplish. Next we'll look at some commonly used approaches for implementing integration testing in SOA (stubbing http requests, VCR). We'll then look at some emerging techniques and tools (RemoteFactoryGirl and offshore) that better enable us write integration tests for SOA. Finally, we'll walk through a simple SOA and it's associated integration testings.
  speakers:
    - Travis Douce

