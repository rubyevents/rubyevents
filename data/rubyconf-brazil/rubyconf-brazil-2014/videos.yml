- id: "matt-campbell-rubyconf-brazil-2014"
  title: "“There’s a Bootcamp for That”: How Immersive Web Development Schools are Changing the Game"
  date: "2014-08-29"
  start_time: "14:45"
  end_time: "15:30"
  language: "English"
  track: "Sala 1"
  video_provider: "not_recorded"
  video_id: "matt-campbell-rubyconf-brazil-2014"
  description: |-
    The purpose of my talk is to share the perspective of a brand new, “bootcamp”-educated developer and member of the RoR community. I think that in many ways my story - leaving an “old school” job out of pure boredom, enrolling in a web dev bootcamp, and coming out the other end employed and loving it - is representative of some important trends in our industry today.
    Take these questions for example:

      First of all, why does everyone want to be a programmer?!
      I attended a web development “bootcamp,” many of which are sprouting up left and right these days. Is software development particularly well-suited to produce junior level professionals after a mere 3 months of intensive education? If so, why?
      What are the implications of having more and more junior developers enter the workforce? Do we benefit (via more code being written, perhaps) or suffer (via lots of poor quality or broken code floating around, perhaps) as a result?
      Do coding bootcamps actually work? What aspects of bootcamps can we steal & implement as part of our work environments to constantly be improving? 
      We must always have a beginner’s mindset and remain humble. New programming languages are great for this, as they challenge how we think about writing code.
      Software development is the best industry/profession/career in the world - what can we do to keep attracting good, talented people, and moving our community towards greatness? 
      As Bret Victor says, new technologies don’t just appear - we make them appear collectively by striving to reach for what our imaginations create. The more minds we have writing code, the cooler the stuff we’re all going to make. 
      Let your interests & problems guide your hacking (in that order).
  speakers:
    - Matt Campbell

- id: "hanneli-tavante-rubyconf-brazil-2014"
  title: "Dores de cabeça com Java? Torquebox!"
  date: "2014-08-29"
  start_time: "14:45"
  end_time: "15:30"
  language: "Portuguese"
  track: "Sala 2"
  video_provider: "not_recorded"
  video_id: "hanneli-tavante-rubyconf-brazil-2014"
  description: |-
    Existem algumas coisas que desenvolvedores não podem se esquivar, como trabalhar com diferentes linguagens que podemos ou não gostar. Este cenário pode acontecer com um desenvolvedor Ruby que precisa trabalhar com Java em um sistema legado, ou um sistema com muitas funcionalidades já implementadas em Java, e não há outro jeito de construir um novo projeto em puro Ruby, do zero. Já passou por esta situação? É bom se vc gosta de Java e sua forma de codificação, mas o que acontece se você não gosta? Dores de cabeça, estômago, e todas as piadas de Java vêm à mente.
    Antes que você pense que está amaldiçoado, você pode escolher algumas alternatives de continuar escrevendo código Ruby e integrar com projeto escrito em Java. Esta palestra vai mostrar como você pode ser produtivo escrevendo sistemas poliglotas, em particular sistemas Ruby + Java com a força do Torquebox.
    Os tópicos principais são:

      Não existe linguagem perfeita - alguns são do mundo Java, outros do mundo Ruby
      Sistemas não precisam pertencer a uma única linguagem
      Por que as pessoas têm medo de misturar mais de uma linguagem?
      Primeiros experimentos com Ruby e Java
      Torquebox, uma solução melhor e mais rápida
      Por que Torquebox 3 é a versão mais rápida?
      Ruby + Java no Torquebox na nuvem! - Trabalhos futuros
