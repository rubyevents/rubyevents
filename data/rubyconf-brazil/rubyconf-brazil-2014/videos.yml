- id: "pedro-franceschi-rubyconf-brazil-2014"
  title: "Fazendo mágica com ElasticSearch"
  date: "2014-08-28"
  start_time: "11:00"
  end_time: "11:45"
  language: "Portuguese"
  track: "Sala 1"
  video_provider: "not_recorded"
  video_id: "pedro-franceschi-rubyconf-brazil-2014"
  description: |-
    Quando uma aplicação começa a ficar grande e complexa, fazer buscas nos seus models torna-se uma tarefa complicada. Efetuar as buscas diretamente no banco de dados é um processo lento, ineficiente e que permite pouca ou nenhuma maleabilidade sobre a forma com que a busca é feita. Surge então o ElasticSearch, uma engine de busca utilizada por empresas como Github, Twitter e 4square para indexar e buscar literalmente milhões de documentos em tempo real. Nessa palestra, explicarei quando, como e porque utilizar o ElasticSearch para facilmente indexar e efetuar buscas complexas nos seus models.
  speakers:
    - Pedro Franceschi

- id: "miguel-di-ciurcio-filho-rubyconf-brazil-2014"
  title: "Como estender o Puppet usando Ruby"
  date: "2014-08-28"
  start_time: "11:00"
  end_time: "11:45"
  language: "Portuguese"
  track: "Sala 2"
  video_provider: "not_recorded"
  video_id: "miguel-di-ciurcio-filho-rubyconf-brazil-2014"
  description: |-
    Puppet é a ferramenta de automação mais utilizada, que dá aos administradores de sistema, o poder de automatizar tarefas repetitivas e manter todo o sistema configurado com consistência. Puppet utiliza uma linguagem de configuração poderosa e bem projetada, utilizada para declarar e modelar o estado dos recursos administrado pelo Puppet. Além disso, é um dos projetos open source e enterprise de maior sucesso escritos em Ruby.
    A linguagem Puppet não é adequada para algumas atividades de implantação da aplicação. Se alguns comandos específicos da aplicação precisam ser executados, a situação pode ficar feira. Por isso, a linguagem Puppet pode ser estendida usando Ruby, para criar tipos de recursos, funções e fatos personalizados. Nesta palestra, faremos uma breve introdução ao Puppet e mostraremos como você pode fazer com que suas configurações escritas em Puppet sejam muito mais claras e legíveis, usando API's nativas do Ruby para o trabalho pesado.
  speakers:
    - Miguel Di Ciurcio Filho

- id: "ben-langfeld-rubyconf-brazil-2014"
  title: "Design de software de qualidade para seus servidores de dados"
  date: "2014-08-28"
  start_time: "13:15"
  end_time: "14:00"
  language: "Portuguese"
  track: "Sala 1"
  video_provider: "not_recorded"
  video_id: "ben-langfeld-rubyconf-brazil-2014"
  description: |-
    DevOps é a metodologia que funde as comunidades de desenvolvimento e operações para formar uma super-disciplina com o melhor das experiência de ambos oa lados da força, colaborando para obter o melhor dos dois mundos, como estabilidade, flexibilidade, eficiência e agilidade na administração de aplicações de larga escala. DevOps é sobre automatizar a monotonia o dia-a-dia e ir mais longe, unir atividades feitas manualmente por operações com as melhores práticas de desenvolvimento, principalmente em relação a testes automáticos e agilidade.
    Mas isso ainda não é suficiente para todos saberem o que devem fazer. Existe muita informação sobre problemas enfrentados por DevOps, assim como materiais introdutórios, mas há pouca coisa sobre "o que você deve fazer".
    Nesta palestra, resolveremos este problema e vamos preparar você para embarcar nesta jornada de DevOps, com noites de sono mais felizes e novas funcionalidades para seus usuários. Falaremos sobre Puppet e Chief, testes e turbulência, robôs e armas nucleares. Se você iniciou como DevOps e precisa saber de alguma coisa, ou ainda se atrapalha com Puppet, essa palestra é para você.
  speakers:
    - Ben Langfeld

