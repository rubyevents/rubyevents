  description: |-
    Os modelos de trabalho tem se transformado - para o bem e para o mal. Nós de tecnologia estamos cada vez mais explorando o formato de trabalho remoto, mas será que isso é mesmo o futuro? É pra todo mundo? Como ser produtivo num mundo de distrações?
    Vamos desbravar todas as possibilidade de trabalhar remoto - sem firula, sem glamour e cheio de lições que aprendi nas minhas experiências pessoais.
  speakers:
    - Carol Soares

- id: "caio-salgado-rubyconf-brazil-2019"
  title: "Além do limite! Usando toda a potência da sua CPU."
  date: "2019-11-28"
  start_time: "14:45"
  end_time: "15:30"
  language: "Portuguese"
  track: "Auditório"
  video_provider: "not_recorded"
  video_id: "caio-salgado-rubyconf-brazil-2019"
  description: |-
    Multithread, concorrência, paralelismo... Podemos ir muito além na performance da nossa aplicação, aproveitando o máximo da infra que temos disponível. No ruby, todas as implementações tem a capacidade de produzir códigos concorrentes, mas cada uma possue suas limitações e vantagens. Desde o Global Interpreter Lock (GIL) até estruturas de dados naturalmente thread safe. Nessa talk, vamos descobrir como usar essas ferramentas e que a própria linguagem nos disponibiliza, no mri, jruby e truffleruby.
  speakers:
    - Caio Salgado

