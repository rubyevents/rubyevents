- id: "daniel-dias-rubyconf-brazil-2019"
  title: "Começando a modelar sua aplicação Ruby com DDD"
  date: "2019-11-29"
  start_time: "10:30"
  end_time: "11:15"
  language: "Portuguese"
  track: "Sala Fork"
  video_provider: "not_recorded"
  video_id: "daniel-dias-rubyconf-brazil-2019"
  description: |-
    Entender e codificar requisitos do "mundo real" para um software muitas vezes é uma tarefa de complicada e que demanda muito tempo. Uma estratégia atacar esses problemas é modelar o software através do Domain Driven Design e utilizar os seus elementos para projetar e estruturar o seu código a partir de uma linguagem comum, úbiqua, entre os envolvidos no projeto de forma a que ela reflita como o domínio ("mundo real') se comporta, mostrando exemplos e códigos de como aplicar em seu código.
  speakers:
