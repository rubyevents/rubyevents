- id: "franze-jr-rubyconf-brazil-2019"
  title: "Rails: the dark side"
  date: "2019-11-28"
  start_time: "10:30"
  end_time: "11:15"
  language: "Portuguese"
  track: "Auditório"
  video_provider: "not_recorded"
  video_id: "franze-jr-rubyconf-brazil-2019"
  description: |-
    Rails é maravilhoso, usado tanto em grandes aplicações, como em pequenas. Todos o amam. De fato, tudo isto é verdade. Porém, Rails não possui nenhum problema? Não há nada de ruim no “Melhor Framework web”? Nesta talk, iremos ver que nem tudo são flores. Há muita coisa ruim no Rails e além do mais, iremos ver como as pessoas utilizam o Framework seguindo o Rails guide, achando que estão fazendo tudo certo, mas na verdade a pessoa só está complicando sua vida mais na frente.  Callbacks do Active Record, Modelos gordos que podem te dar muita dor de cabeça, serviços fazendo muito mais do que o necessário, e más decisões arquiteturais comumente usadas. Irei também ao mostrar tudo isso, dizer como venho tentando evitar tais decisões de forma que possamos ter menos dores de cabeça no futuro.
  speakers:
    - Franzé Jr

- id: "breno-gazzola-rubyconf-brazil-2019"
  title: "Anti-SPA: Aplicações dinâmicas em Stimulus, Turbolinks e UJS"
  date: "2019-11-28"
  start_time: "10:30"
  end_time: "11:15"
  language: "Portuguese"
  track: "Sala Fork"
  video_provider: "not_recorded"
  video_id: "breno-gazzola-rubyconf-brazil-2019"
  description: |-
    Single Page Applications (SPAs) trouxeram benefícios reais, como interfaces rápidas, fluidas, e que não precisam de atualizar a página inteira para mostrar resultados. Entretanto, elas não são adequadas a todos os casos de uso, e em alguns tipos de aplicação chegam a ser uma regressão em termos de simplicidade e produtividade. Felizmente, com a introdução do Stimulus, Rails agora tem um framework que proporciona a velocidade e interatividade de uma SPA, mas com uma fração da curva de aprendizado e complexidade.

    Esta é uma palestra sobre como usar o Stimulus para desenvolver aplicações web, baseada nas lições aprendidas usando o framework no frontend de uma aplicação com mais de 1,8M de usuários mensais.
  speakers:
    - Breno Gazzola

