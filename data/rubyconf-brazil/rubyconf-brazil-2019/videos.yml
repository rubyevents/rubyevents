- id: "thaly-sanches-rubyconf-brazil-2019"
  title: "Como gerenciar meu tempo e minha energia nesse tanto de coisas que preciso fazer?"
  date: "2019-11-29"
  start_time: "10:30"
  end_time: "11:15"
  language: "Portuguese"
  track: "Sala Codamos"
  video_provider: "not_recorded"
  video_id: "thaly-sanches-rubyconf-brazil-2019"
  description: |-
    No mundo atual, e muito comum as pessoas que trabalham com tecnologia precisarem estar sempre se atualizando e estudando sobre o mercado enquanto trabalham full time em uma empresa.
    Muitas vezes as pessoas acabam se enrolando com um monte de atividades que precisam fazer e não conseguem se organizar para cumprir esses compromissos, por estar sempre sem tempo e sempre sem energia.
    Esse problema se agrava quando a pessoa tem algum transtorno mental como ansiedade e/ou depressão, e tem de a ficar mais desmotivada ainda de fazer as coisas que precisam ser feitas.
    Outro ponto é caso a pessoa faça parte de um recorte social em situação de vulnerabilidade social, que pode dificultar ainda mais a organização na hora de gerenciar tempo e energia para cumprir com os compromissos.
    Na palestra vamos debates ferramentas, reflexoes e formas que nos entender como nos funcionamos e a como podemos gerenciar nosso tempo e nossa energia.
  speakers:
    - Thaly Sanches

- id: "mauricio-pereiro-flavio-correia-rubyconf-brazil-2019"
  title: "Existe teste de acessibilidade digital?"
  date: "2019-11-29"
  start_time: "11:15"
  end_time: "12:00"
  language: "Portuguese"
  track: "Auditório"
  video_provider: "not_recorded"
  video_id: "mauricio-pereiro-flavio-correia-rubyconf-brazil-2019"
  description: |-
    Vamos apresentar porque devemos garantir testes de acessibilidade, o que são esses testes e quais as coberturas, quais os componentes que devem ser avaliados garantindo a melhor experiência para o usuário.
    Já sabemos que existe todo um mercado atuando na acessibilidade digital, mas quais critérios e quais os métodos para realizar os testes de acessibilidade digital? Como podemos garantir que a experiência do usuário será atendida? Esta e outras perguntas poderão ser esclarecidas com esta palestra. Nosso objetivo é apresentar de forma clara e objetiva como funcionam os testes de acessibilidade digital
