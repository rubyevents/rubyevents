- id: "willian-molinari-rubyconf-brazil-2019"
  title: "De mongo, Rails 3 e VPS para Postgres, Rails 5 e Heroku"
  date: "2019-11-29"
  start_time: "14:00"
  end_time: "14:45"
  language: "Portuguese"
  track: "Auditório"
  video_provider: "not_recorded"
  video_id: "willian-molinari-rubyconf-brazil-2019"
  description: |-
    Há mais de 3 anos eu trabalho algumas horas por mês em uma aplicação Rails 3 como freelancer. Essa palestra vai mostrar como foi o processo de migração saindo de:
    •	Rails 3
    •	VPS (Linode)
    •	MongoDB + geolocation
    •	Gems internas
    •	Assets em disco local
    •	Necessidade do banco de prod para desenvolver (seed era muito complicado e nunca fizeram)
    •	Sistemas externos (Sparkey)
    •	Sistema de tradução com monkey patch baseado em queries no banco
    Para:
    •	Rails 5 (talvez 6 em breve)
    •	Heroku
    •	Postgres + postgis
    •	Nenhuma gem interna
    •	Seed com dados necessários para desenvolvimento
    •	Assets no s3
    •	Traduções para 17 linguas em memória
    Vou falar do que funcionou bem, o que funcionou mal, como foi o processo de convencer as pessoas de que a mudança era necessária, quanto tempo durou, e quais os resultados para quem já pensou em fazer algo do tipo.
  speakers:
    - Willian Molinari

- id: "juliana-dias-rubyconf-brazil-2019"
  title: "Sopa de letrinhas no desenvolvimento de software."
  date: "2019-11-29"
  start_time: "14:00"
  end_time: "14:45"
  language: "Portuguese"
  track: "Sala Fork"
  video_provider: "not_recorded"
  video_id: "juliana-dias-rubyconf-brazil-2019"
  description: |-
    DRY, SOLID, YAGNI... O que é essa sopa de letrinhas em desenvolvimento de software?
    Provavelmente você já tenha ouvido falar destas e demais siglas, mas vocês sabem o que elas realmente significam?
    Vocês colocam ou já colocaram alguma delas em prática no seu dia a dia?
    Nesta talk irei apresentar alguns destes conceitos para que assim que conhecermos poderemos aplicar (ou não) no nosso dia a dia de desenvolvimento de software
