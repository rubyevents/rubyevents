- id: "ludmila-pontremolez-rubyconf-brazil-2019"
  title: "Powering Tax Filings&Payments to all U.S. states w/ Sidekiq"
  date: "2019-11-29"
  start_time: "17:00"
  end_time: "18:00"
  language: "Portuguese"
  track: "Auditório"
  video_provider: "not_recorded"
  video_id: "ludmila-pontremolez-rubyconf-brazil-2019"
  description: |-
    Nos EUA, cada estado tem muita liberdade para fazer suas próprias leis, inclusive tributárias. As variações regionais são enormes: o estado da Pennsylvania, por exemplo, tem leis tributárias a nível municipal; o estado de Nevada não possui imposto estadual; no estado de Nova Iorque, empregadores pagam impostos diferentes para funcionários que moram dentro e fora de Manhattan. Esses são apenas alguns exemplos que demonstram a complexidade das leis tributárias nos EUA. Agora imagine criar software que dê suporte para todas essas especificidades? O time de Payroll da fintech Square enfrentou esse desafio usando Ruby on Rails.  Nessa palestra, vamos mergulhar em como Sidekiq Workers são usados para pagar e declarar impostos para centenas de milhares de clientes nos 50 estados dos EUA, com um time de 15 engenheiros.
  speakers:
    - Ludmila Pontremolez
