- id: "lucas-uyezu-rubyconf-brazil-2019"
  title: "O que você precisa saber sobre tipagem estática"
  date: "2019-11-28"
  start_time: "09:30"
  end_time: "10:30"
  language: "Portuguese"
  track: "Auditório"
  video_provider: "not_recorded"
  video_id: "lucas-uyezu-rubyconf-brazil-2019"
  description: |-
    A bala de prata da vez é a tipagem estática, seja através de novas linguagens ou de plugins de checagem de tipos para linguagens de tipagem dinâmica. Nós passamos meses implementando checagem de tipos no nosso projeto e nesta palestra você vai saber o que melhorou, o que piorou e o que você deve ter em mente quando for embarcar nessa jornada.
