- id: "jonatas-davi-paganini-rubyconf-brazil-2019"
  title: "Live coding: Grepping Ruby code like a boss"
  date: "2019-11-29"
  start_time: "14:45"
  end_time: "15:30"
  language: "English"
  track: "Auditório"
  video_provider: "not_recorded"
  video_id: "jonatas-davi-paganini-rubyconf-brazil-2019"
  description: |-
    Our favorite language allows us to implement the same code in several ways. Because of that, it becomes tough to search and find the target code only with regular expressions.

    I'd like to present node pattern, a searching DSL that can help you build complex searches directly in the AST nodes as regexes do for plain strings.

    The presentation will be a live coding tour of how to use the tool and create your searching patterns.

    I'll also show how to manipulate the code in the target nodes, allowing us to refactor the source code in an automated way.
    I'll share a few funny stories about how I refactored thousands of files in a week.
  speakers:
    - Jônatas Davi Paganini

