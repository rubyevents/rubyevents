- id: "isaac-pereira-rubyconf-brazil-2019"
  title: "Mantendo e Evoluindo REST APIs com OpenAPI Spec 3.0"
  date: "2019-11-28"
  start_time: "11:15"
  end_time: "12:00"
  language: "Portuguese"
  track: "Sala Fork"
  video_provider: "not_recorded"
  video_id: "isaac-pereira-rubyconf-brazil-2019"
  description: |-
    Expor serviços através de REST APIs preservando a sanidade - sua e de seus utilizadores, sejam pessoas ou microserviços, internos ou externos - é uma tarefa dolorosa. Manter documentações válidas, fornecer bibliotecas para consumo da API nas linguagens necessárias e garantir a integridade das interfaces independentemente de mudanças da aplicação são atividades que exigem esforço cotidiano do desenvolvedor. Nessa talk você poderá conhecer o OpenAPI Specification (OAS) e como utilizá-lo para melhorar a Dev Experience do seu time ao projetar, manter e evoluir APIs.
  speakers:
    - Isaac Pereira

- id: "narrativas-no-desenvolvimento-de-software-rubyconf-brazil-2019"
