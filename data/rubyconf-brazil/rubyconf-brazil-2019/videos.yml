- id: "thiago-pradi-rubyconf-brazil-2019"
  title: "Criando uma nova aplicação Rails em 2019"
  date: "2019-11-28"
  start_time: "14:00"
  end_time: "14:45"
  language: "Portuguese"
  track: "Sala Fork"
  video_provider: "not_recorded"
  video_id: "thiago-pradi-rubyconf-brazil-2019"
  description: |-
    Iniciar uma nova aplicação web pode ser bastante desafiante, visto a quantidade de alternativas e de escolhas necessárias.
      Desde a versão 0.1 do Rails quatorze anos atrás, vários frameworks web similares apareceram e muitos desenvolvedores se perguntam se o Rails ainda é uma boa alternativa em 2019.
      Esta palestra irá te convencer que sim - e apresentar os motivos que o Rails ainda é uma ótima alternativa para uma nova aplicação web.
      A talk irá abordar questões de arquitetura de aplicações web modernas (Integração com frameworks JavaScript, WebSockets, Formato de  API, performance),
      bem como as novas funcionalidades inclusas no Rails 6 que acabou de ser lançado.
  speakers:
    - Thiago Pradi

- id: "carol-soares-rubyconf-brazil-2019"
