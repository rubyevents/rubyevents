- id: "elaine-naomi-watanabe-rubyconf-brazil-2019"
  title: "Decodificando o code review"
  date: "2019-11-28"
  start_time: "15:30"
  end_time: "16:15"
  language: "Portuguese"
  track: "Sala Codamos"
  slides_url: "https://speakerdeck.com/elainenaomi/rubyconf-br-decodificando-o-code-review"
  video_provider: "not_recorded"
  video_id: "elaine-naomi-watanabe-rubyconf-brazil-2019"
  description: |-
    Quando iniciamos a jornada como pessoa desenvolvedora, temos infinitas possibilidades para explorar, desde as boas práticas de design de código a questões como criação de interfaces, integrações com serviços, etc. E, por mais que nos preparemos para tudo, acabamos deixando de lado questões mais humanas em prol de questões mais técnicas. No entanto, o fator humano gera grande impacto na qualidade do software gerado, seja a curto ou a longo prazo. E o processo de code review traz, indiretamente, esse assunto em pauta.

    Nessa palestra, vamos discutir o code review, analisando como a forma como a comunicação pode afetar não só a qualidade do software mas também a interação entre as pessoas.
  speakers:
    - Elaine Naomi Watanabe

- id: "alex-oliveira-rubyconf-brazil-2019"
  title: "Should I Compose or Should I Inherit?"
  date: "2019-11-28"
  start_time: "17:00"
  end_time: "18:00"
  language: "English"
  track: "Auditório"
  video_provider: "not_recorded"
  video_id: "alex-oliveira-rubyconf-brazil-2019"
  description: |-
    Both Composition and Inheritance have their benefits, but people often use them  for the wrong reasons. Inheritance for code reusability? That's a recipe for disaster (and code that is hard to change). Inheritance for describing things that correlate by type? That is helpful.

    And in the end, it all depends on your goals and the tradeoffs you're willing to make.

    This talk is intended for junior and intermediary developers.
  speakers:
    - Alex Oliveira

