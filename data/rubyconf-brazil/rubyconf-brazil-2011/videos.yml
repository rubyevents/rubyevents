- id: "ivan-moscoso-rubyconf-brazil-2011"
  title: "Groupon, Ruby (and the Great Divide)"
  date: "2011-11-04"
  start_time: "09:40"
  end_time: "10:30"
  language: "English"
  video_provider: "not_recorded"
  video_id: "ivan-moscoso-rubyconf-brazil-2011"
  description: |-
    Great teams can build great companies, but the effort that goes into it is rarely linear. Groupon was built with Ruby on Rails at its core, and growing from thousands to millions of users in two years is a testament to the power and flexibility of the tools and practices we chose as a team.  But progress along that path was often a struggle.

    This talk will cover how the team in the U.S. adapted our technology stack during an initial period of immense growth, describing crucial inflection points in our history (the good, and the bad) and how the architecture and development practices evolved to support those needs.
  speakers:
    - Ivan Moscoso

