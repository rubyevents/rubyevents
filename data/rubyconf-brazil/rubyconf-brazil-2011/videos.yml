- id: "david-a-black-rubyconf-brazil-2011"
  title: "Is Ruby Easy?"
  date: "2011-11-03"
  start_time: "09:20"
  end_time: "10:10"
  language: "English"
  video_provider: "not_recorded"
  video_id: "david-a-black-rubyconf-brazil-2011"
  description: |-
    Ruby has a somewhat mixed reputation when it comes to ease of use and accessibility to programmers -- and, oddly enough, to non-programmers. Its "magic" and meta-powers are often seen as barriers to entry and progress. At the same time, the belief that Ruby is based on a universal POLS (Policy of Least Surprise) persists, and it isn't unusual to hear annoyance expressed when learning Ruby proves to be harder than falling off a log. This talk will explore and troubleshoot notions of ease of use, intuitiveness, and programmer friendliness, all in relation to Ruby the language and Ruby the programming-cultural entity.
  speakers:
    - David A. Black

- id: "ricardo-bernardelli-fernando-hamasaki-de-amorim-rubyconf-brazil-2011"
  title: "Multitenancy em Rails: Cortando custos e aumentando capacidade"
  date: "2011-11-03"
  start_time: "10:40"
  end_time: "11:30"
  language: "Portuguese"
  track: "Room 1"
  video_provider: "not_recorded"
  video_id: "ricardo-bernardelli-fernando-hamasaki-de-amorim-rubyconf-brazil-2011"
  description: |-
    Algumas decisões que parecem boas no começo de um projeto, com o tempo mostram que possuem vantagens mas também deficiências.

    A loja virtual WebStore, desenvolvida pela Locaweb, é um exemplo de produto que nasceu com uma arquitetura suficiente para o momento inicial, como dívida técnica conhecida, que após um ano de projeto tornou-se inviável.

    A palestra apresenta o desafio da equipe de desenvolvimento de SaaS de mudar a arquitetura do produto. Falando em números, antes a WebStore possuía 1.000 clientes, distribuídos em 12 servidores.

    Após estudar as poucas alternativas de multitenancy em Rails e escolher uma opção não tão usual, foi possível acomodar mais de 4.000 clientes em apenas um servidor, pagando a dívida técnica a tempo de aumentar o número de clientes.
  speakers:
    - Ricardo Bernardelli
    - Fernando Hamasaki de Amorim

- id: "marcos-toledo-rubyconf-brazil-2011"
  title: "Surpresas no uso de Concorrência em Rails"
  date: "2011-11-03"
  start_time: "10:40"
  end_time: "11:30"
  language: "Portuguese"
  track: "Room 2"
  video_provider: "not_recorded"
  video_id: "marcos-toledo-rubyconf-brazil-2011"
  description: |-
    Com o uso cada vez mais frequente de múltiplos servidores e processamento em lote, problemas que somente ocorrem quando tarefas específicas rodam em paralelo se tornam cada vez mais prováveis de acontecer.

    Nesta palestra Marcos fala sobre algumas limitações de concorrência do Rails que você precisa conhecer, incluindo por que você nunca deve confiar no Rails para checar por não-duplicação (unicidade), por que MySQL não consegue fazer trava otimista por padrão e como corrigí-lo, como escolher entre travas otimistas e pessimistas, como processos paralelos podem causar "deadlocks" mesmo que você não esteja usando travas, por que você nunca deve ter atributos serializados em registros que podem ser editados em paralelo, e quando o rails pode concluir suas transações antes de ela terminar caso seu processo multi-threaded seja finalizado e como prevení-lo de deixar seu banco de dados em um estado inconsistente.
  speakers:
    - Marcos Toledo

- id: "nick-sutterer-rubyconf-brazil-2011"
  title: "Hypermedia - The Missing Ingredient in REST"
  date: "2011-11-03"
  start_time: "11:30"
  end_time: "12:20"
  language: "English"
  track: "Room 1"
  video_provider: "not_recorded"
  video_id: "nick-sutterer-rubyconf-brazil-2011"
  description: |-
    REST is an architectural style for distributed systems. However, many implementations forget about the distributed part of REST and simply map CRUD operations to HTTP verbs in a monolithic application.

    Why not split this up into a truely distributed system, where applications use REST for communication? Real REST. Where clients travel on hypermedia routes using the REST APIs from the services.

    While discussing the concepts of hypermedia-driven APIs, we'll explore the Roar gem that makes both REST representations and hypermedia fun.
  speakers:
    - Nick Sutterer

