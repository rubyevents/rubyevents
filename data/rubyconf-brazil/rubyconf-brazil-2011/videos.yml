  end_time: "18:00"
  language: "Portuguese"
  track: "Room 2"
  video_provider: "not_recorded"
  video_id: "robson-junior-roberto-pepato-rubyconf-brazil-2011"
  description: |-
    Aplicar geografia em uma aplicação qualquer é meramente questão de criatividade. Mas se a criatividade flui o que falta são ferramentas. Atualmente temos cases de sucesso da popularização e democratização dos sistemas de informação geográfica (GIS) como Google Maps e Foursquare. Mas GIS não é simplesmente geocodificar um endereço ou traçar uma rota. Você já parou para pensar como adicionar o fator “geografia” em sua aplicação? Quais as possibilidades? Quais ferramentas suportam isso de fato? Apresentaremos ferramentas e técnicas para você adicionar desde uma simples geocodificação até controlar a energia de um país inteiro.
  speakers:
    - Robson Júnior
    - Roberto Pepato

- id: "leonardo-borges-rubyconf-brazil-2011"
  title: "A Cloud contra as enchentes, ou como Ruby On Rails salvou o dia na Austrália"
  date: "2011-11-04"
  start_time: "18:00"
  end_time: "18:50"
  language: "Portuguese"
  track: "Room 1"
  video_provider: "not_recorded"
  video_id: "leonardo-borges-rubyconf-brazil-2011"
  description: |-
    Fortes enchentes atingiram a Austrália no final de 2010, causando mortes e bilhões de dólares em danos.
    Em resposta ao desastre o Governo de  Queensland planejou um teleton nacional para arrecadar doações para as vítimas das enchentes.
    Porém, eles não estavam preparados para a carga que estava por vir.

    Nessa sessão vou mostrar como tiramos vantagem da "cloud" para desenvolver a aplicação de doações do teleton em 48 horas,
    recebendo mais de 30 milhões de  dólares em doações - mesmo com todo o ceticismo ao longo do projeto.

    Também vou discutir e mostrar alguns truques e problemas importantes para quem trabalha com uma plataforma PaaS, como o Heroku.
    Se você não tem certeza se cloud computing é sério o suficiente para o seu negócio, essa sessão vai te fazer mudar de idéia.
  speakers:
    - Leonardo Borges

- id: "daniel-lopes-rubyconf-brazil-2011"
  title: "Código Melhor através de Design de Interface"
  date: "2011-11-04"
  start_time: "18:00"
  end_time: "18:50"
  language: "Portuguese"
  track: "Room 2"
  slides_url: "https://speakerdeck.com/danielvlopes/better-software-through-the-ui-design-rubyconf-br-2011"
  video_provider: "not_recorded"
  video_id: "daniel-lopes-rubyconf-brazil-2011"
  description: |-
    Cada software tem suas próprias peculiaridades mas todos eles tem uma coisa em comum: sua complexidade irá crescer.

    Desenvolvedores tendem a pensar em modelos, tabelas e estruturas de dados. Eles constróem o software por esse ponto de vista. Designers tendem a pensar em telas e navegação mas normalmente seu trabalho somente acontece no começo ou no fim do projeto.

    Nesta apresentação discutiremos, com exemplos reais, como simplificar o código através do design de interface e navegação. Como evitar doenças como "crud-ificação" ou "resource-ficação". Como não cuidar do fluxo e telas pode afetar negativamente seus modelos, controllers, views, javascript e experiência geral de seus desenvolvedores e usuários.
  speakers:
    - Daniel Lopes

