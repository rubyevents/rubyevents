- id: "douglas-campos-rubyconf-brazil-2011"
  title: "JRuby on Steroids"
  date: "2011-11-04"
  start_time: "14:10"
  end_time: "15:00"
  language: "Portuguese"
  track: "Room 1"
  video_provider: "not_recorded"
  video_id: "douglas-campos-rubyconf-brazil-2011"
  description: |-
    O JRuby sempre foi famoso pela sua excelente performance, por diversas vezes superando em performance as outras implementações de Ruby.

    Recentemente o Java 7 foi lançado, causando um verdadeiro burburinho entre os desenvolvedores de linguagens dinâmicas baseadas na JVM.

    Nessa sessão vou mostrar quais foram as novidades trazidas pelo Java 7, e como o JRuby se aproveita delas; Qual o real impacto de termos invocações dinâmicas na JVM, qual foi a abordagem do time do JRuby ao explorar essas melhorias, e principalmente, como você pode tirar benefício disso tudo ao executar suas aplicações no JRuby. Palestra com foco técnico mais aprofundado.
  speakers:
    - Douglas Campos

- id: "rafael-felix-rubyconf-brazil-2011"
  title: "Aplicativos Rails dinâmicos com Backbone.js"
  date: "2011-11-04"
  start_time: "14:10"
  end_time: "15:00"
  language: "Portuguese"
  track: "Room 2"
  video_provider: "not_recorded"
  video_id: "rafael-felix-rubyconf-brazil-2011"
  description: |-
    O uso pesado de JavaScript em aplicações web se tornou muito comum. No mundo Ruby on Rails não é diferente. Apesar de existirem diversos metodos para auxiliar no desenvolvimento dessas aplicações mais interativas, ainda existem uma mescla grande de código Ruby com JavaScript.

    Nessa palestra Rafael falará sobre Backbone.js, um framework JavaScript MVC, que propõe uma separação simples de código JavaScript com o código do backend. Rafael irá mostrar os conceitos do Backbone.js mesclando teoria e código e concluindo com exemplos de integração de Ruby on Rails e Backbone
  speakers:
    - Rafael Felix

