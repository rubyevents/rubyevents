- id: "lucas-hungaro-rubyconf-brazil-2011"
  title: "SOLID através de BDD - um guia prático para Rubistas"
  date: "2011-11-03"
  start_time: "14:30"
  end_time: "15:20"
  language: "Portuguese"
  track: "Room 2"
  video_provider: "not_recorded"
  video_id: "lucas-hungaro-rubyconf-brazil-2011"
  description: |-
    Já conhecemos muitos dos benefícios do BDD para design de código. Mas há algo que deveríamos fazer mais: ouvir a voz de nossas suítes de testes.
    Nessa palestra mostrarei como você pode fazer isso enquanto aprendemos a identificar e resolver os seguintes problemas através do BDD:
     Alto acoplamento Baixa coesão Overmocking Domínios anêmicos Programação Orientada a Objetos mal aplicada (ou: como aplicar SOLID através do BDD)
    Veremos como todos esses problemas estão interconectados e como resolvê-los e colher benefícios como testes que rodam mais rápido, código flexível e tempo de manutenção reduzido.
  speakers:
    - Lucas Húngaro

- id: "martyn-loughran-rubyconf-brazil-2011"
  title: "From the event loop to the distributed system"
  date: "2011-11-03"
  start_time: "15:20"
  end_time: "16:10"
  language: "English"
  track: "Room 1"
  video_provider: "not_recorded"
  video_id: "martyn-loughran-rubyconf-brazil-2011"
  description: |-
    Generally people don't wake up one day and build a scalable distributed system. We certainly didn't! Pusher started as a single process with a single event loop. I'll share some of my experience scaling Pusher, showing how you can manage complexity in an event driven application, and sharing some strategies we used to expand beyond a single process, and to recover automatically from failure.
  speakers:
    - Martyn Loughran

- id: "diogo-biazus-rubyconf-brazil-2011"
  title: "YesSQL, como as funcionalidades avançadas do PostgreSQL podem ajudar o desenvolvedor Rails"
  date: "2011-11-03"
  start_time: "15:20"
  end_time: "16:10"
  language: "Portuguese"
  track: "Room 2"
  video_provider: "not_recorded"
  video_id: "diogo-biazus-rubyconf-brazil-2011"
  description: |-
    Desenvolvedores Rails tradicionalmente evitaram usar funcionalidades específicas de bancos relacionais, preferindo construir muito da lógica de negócios nos modelos da aplicação. No entanto existem muitos casos onde o PostgreSQL oferece vantagens sobre as soluções mais populares.

    Esta palestra será sobre três casos interessantes onde a aproximação do banco de dados pode levar a uma melhor performance e código mais elegante.
     Hstore vs NoSQL / dados serializados Earthdistance vs Geokit With recursive vs Nested sets
  speakers:
    - Diogo Biazus

- id: "roberto-rodriguez-artavia-rubyconf-brazil-2011"
  title: "Ruby on Rails Applications without Page Reloading"
  date: "2011-11-03"
  start_time: "16:40"
  end_time: "17:30"
  language: "English"
  track: "Room 1"
  video_provider: "not_recorded"
  video_id: "roberto-rodriguez-artavia-rubyconf-brazil-2011"
  description: |-
    Facebook, Twitter, Google+ and many Mobile Apps have a Javascript Frontend that provide for great user experiences and make Traditional Web Apps that require page reload after page reload look slow and boring.

    By leveraging the thrust of Javascript, Rails(RoR) and Ruby communities, a new breed of web applications has emerged that is transforming , in an exponential way , our online experiences.

    With these innovative libraries it is possible to create Javascript Applications backed by Rails that use very similar Syntax to Ruby along with Controllers, Models and Views with a modular file structure that becomes concatenated into one production ready javascript file automatically.

    Those interested in how to build Javascript MVC Applications and those who want to be introduced to the technologies that makes it possible should walk away with a clear picture on how to proceed.

    The session introduces the importance of Single Page Applications from an UX viewpoint and then move into demos / tutorial and code review of Single Page Applications.

    Using Rails 3.1 newest additions like Haml, Coffeescript, Saas and the Asset Pipeline is really fun to build beautiful, structured Client Side Application using Javascript Object Oriented Programming and Model-View-Controller Frameworks.

    "Javascript Applications don't need to be a spaghetti of Jquery selectors"; but rather a structured MVC application that is easy to maintain and quick to develop.

    In this session I explain how to use Spine JS (an alternative to Backbone.js ) to create Javascript Single Page Applications that connects asynchronously to a Rails and MongoDB Backend.

    Initially we will examine a Hello World CRUD application that connects with a standard Rails Rest API, then move on to a Single Page Application that uses Infinite Scrolling and given enough time we will review the code of a Real-World Offline-Online Remote Application for Salesman that are on the road.

    The code for each application and several boiler-plates will available in GitHub @rodriguezartav after the conference; I will also be providing a One Page step-by-step Getting Started Tutorial including Documentation and Resources so that attendees can get started building single page apps right away.

    If you have any questions about the content of the session feel free to contact me via twitter.
  speakers:
    - Roberto Rodriguez Artavia

- id: "ivan-acosta-rubio-rubyconf-brazil-2011"
  title: "Replicating ActiveRecord objects to MongoDB"
  date: "2011-11-03"
  start_time: "16:40"
  end_time: "17:30"
  language: "English"
  track: "Room 2"
  video_provider: "not_recorded"
