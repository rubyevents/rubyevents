- id: "felipe-roveran-ribeiro-rubyconf-brazil-2017"
  title: "From Rack to 502"
  date: "2017-11-17"
  start_time: "11:50"
  end_time: "12:40"
  language: "Portuguese"
  track: "Sala 2"
  video_provider: "not_published"
  video_id: "felipe-roveran-ribeiro-rubyconf-brazil-2017"
  description: |-
    HTTP error 502 is very frequent and sometimes really annoying, as its causes can be very hidden and difficult to investigate.
    In this talk we will see an overview of what happens since we send a request to the server until it is processed by Rails.
    During this process, we will walk through web-servers and application-servers, comparing and understand their purpose and how to configure them.
    With this, we will be able to identify the exact point where HTTP 502 comes to place and then detect its causes.
    We will explore different ways to identify the root cause and, to do so, building a rack middleware capable of tracking time-consuming requests and logging relevant info.
    At the end, we will see a few root-causes and even more advanced Postgres’ tools like vacuum and query-planner.
  speakers:
    - Felipe Roveran Ribeiro
  additional_resources:
    - name: "Eventials"
      title: "Recording on Eventials"
      type: "video"
      url: "https://www.eventials.com/locaweb/from-rack-to-502-com-felipe-roveran-ribeiro/"

