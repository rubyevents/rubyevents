- id: "andre-luis-rubyconf-brazil-2017"
  title: "Effective Rails Instrumentation"
  date: "2017-11-18"
  start_time: "11:50"
  end_time: "12:40"
  language: "Portuguese"
  track: "Sala 1"
  video_provider: "not_published"
  video_id: "andre-luis-rubyconf-brazil-2017"
  description: |-
    Text walls on our logging aggregators, cryptic error messages and cold sweat on your face. A customer is on call a bug is hiding in plain sight. Sounds familiar? Yes, to me too.

    Having a proper instrumentation helps you not only in those critical moments, but it’s part of our daily routine of keeping an application healthy. Tools and practices for diagnosing, reproduce and observe the internals a running system should be part of any toolbox. The good news: Rails can help you with that!

    On this talk I’ll explain how to effectively use those tools, augmenting the signal to noise ratio and improve your response quality. From batteries included in Rails to some missed opportunities from your favorite service that can save your life.
