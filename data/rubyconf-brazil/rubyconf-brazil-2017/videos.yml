- id: "samuel-giddins-rubyconf-brazil-2017"
  title: "Bundling Bundler 2.0"
  date: "2017-11-17"
  start_time: "11:00"
  end_time: "11:50"
  language: "English"
  track: "Sala 1"
  video_provider: "not_published"
  video_id: "samuel-giddins-rubyconf-brazil-2017"
  description: |-
    I’m @segiddins. For the past couple of years, I’ve been the primary committer to Bundler and RubyGems, and this summer I’m working towards making Bundler 2.0 a reality. A culmination of several years of work, hundreds of hours of discussion, and ~6000 issues worth of experience, Bundler 2.0 is the best Bundler yet (or so we hope). Along the way, we’ve encountered many hurtles – backwards compatibility, community expectations, lack of developer time, and lack of process – that have al contributed to this release being so drawn out. In overcoming those challenges, we’ve had to change the way we develop Bundler, and in doing so have learned lessons that are going to be applicable to all Ruby developers.
