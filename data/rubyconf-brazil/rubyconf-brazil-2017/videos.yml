  description: |-
    It’s funny to think that software development, like in the fashion world, somehow, works in cycles. Trends come and go all the time and as a result, new programming languages, frameworks, services, libs are born but just a few remain relevant enough to mature and keep a community grow stronger and healthier.

    Go is an open source programming language created at Google by Robert Griesemer, Rob Pike, and Ken Thompson whereas Ruby was conceived in the nighties, by Yukihiro Matsumoto. Both, Ruby and Go, are strongly growing and becoming go-to programming languages choices for developers/companies around the world.

    In this talk, we will compare the languages against each other and see how a Rubyists can start and become productive with Go
