- id: "jonatas-davi-paganini-rubyconf-brazil-2017"
  title: "Manipulating Ruby Abstract Syntax Tree"
  date: "2017-11-17"
  start_time: "15:20"
  end_time: "16:10"
  language: "Portuguese"
  track: "Sala 1"
  video_provider: "not_published"
  video_id: "jonatas-davi-paganini-rubyconf-brazil-2017"
  description: |-
    You’re using Ruby everyday but have you checked how Ruby parse your code?
    In this talk I’ll show you how Ruby code is tokenized and parsed. Then, we’ll go deeply on the code representation: the Abstract Syntax Tree.
    Access this meta data about the code can be useful for code metrics and automated checks about syntax, code style and anything your mind can invent about code manipulation.
    Handing the AST is possible to search for some meta code and replace systematically.
    We’ll see how how tools like RuboCop does it and also how you can create your own patterns to check code systematically.
  speakers:
    - Jônatas Davi Paganini
  additional_resources:
    - name: "Eventials"
      title: "Recording on Eventials"
      type: "video"
      url: "https://www.eventials.com/locaweb/manipulating-ruby-abstract-syntax-tree-com-jonatas-davi-paganini/"

- id: "artur-caliendo-prado-rubyconf-brazil-2017"
  title: "Real-Time Monitoring with Grafana, StatsD and InfluxDB"
  date: "2017-11-17"
  start_time: "15:20"
  end_time: "16:10"
  language: "Portuguese"
  track: "Sala 2"
  video_provider: "not_published"
  video_id: "artur-caliendo-prado-rubyconf-brazil-2017"
  description: |-
    We can take a glimpse at our applications or we can truly see them. We have a choice.

    Our path is laden with problems and, when they arise, the first place to run is the log. The log is straightforward when the systems are small, but when we start to scale… the more users we get, the more data we will have to go through, and finding what we need is like staring at a well-stocked library, looking at the book titles, wondering which one could possibly have the information we need.

    I’d like to suggest an alternative: the combination of StatsD, a platform that collects data to build statistics, and Grafana. It allows us to create beautiful, interactive dashboards that support pluggable panels.

    This talk is not only focused on the theory behind these tools but also in the experience we had with them at Youse. I will present the tools (and the alternative tools too), explain how to use them and show the code we need to measure the events we want to track. A chart will be build from scratch, starting with an event on the system and ending in a beautiful dashboard.

    All the code is in Ruby. We use Ruby on Rails on our applications and we found good open source libraries to build and maintain the monitoring system.
  speakers:
    - Artur Caliendo Prado
  additional_resources:
    - name: "Eventials"
      title: "Recording on Eventials"
      type: "video"
      url: "https://www.eventials.com/locaweb/real-time-monitoring-with-grafana-statsd-and-influxdb-com-artur-caliendo-prado/"

