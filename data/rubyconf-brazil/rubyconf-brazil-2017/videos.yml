  description: |-
    The Octopus gem (https://github.com/thiagopradi/octopus) is the most commonly used library for sharding and replication with ActiveRecord. The library is a result of work done during the 2010 Ruby Summer of Code, and completes seven years of existence in 2017. In this talk, I will talk about how the project started, how its development was carried out and what lessons were learned during the seven years of existence. These lessons will cover a few different areas, from ActiveRecord internals to management details of an open-source project.
