  track: "Sala 3"
  video_provider: "not_published"
  video_id: "nicolas-martin-di-tada-rubyconf-brazil-2017"
  description: |-
    Crystal is a statically-typed, compiled language, that achieves performance close to c/c++ while having a syntax as readable as Ruby. It was born five years ago, as a challenge to a long-held assumption: that a programming language can either be easy to understand by humans or compile to fast programs.

