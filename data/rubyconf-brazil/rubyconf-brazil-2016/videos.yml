- id: "bryan-helmkamp-rubyconf-brazil-2016"
  title: "Lições Aprendidas sobre Qualidade de Código"
  date: "2016-09-23"
  start_time: "09:00"
  language: "English"
  video_provider: "not_published"
  video_id: "bryan-helmkamp-rubyconf-brazil-2016"
  description: |-
    Nós começamos o Code Climate com uma simples hipótese: análise estática pode ajudar desenvolvedores a lançar código melhor, mais rápido. Cinco anos depois analisamos mais de 80 mil repositórios a cada dia, de diversas linguagens de programação diferentes, e pelo caminho aprendemos muito sobre qualidade de código - o que significa, por que você quer isso, como conseguir isso, e mais. Esta palestra vai cobrir alguns dos insights mais surpreendentes, incluindo o que torna a métrica de código valiosa, quando código difícil de manter pode ser preferível, e a principal coisa que previne a maioria dos desenvolvedores de manter a qualidade pelo tempo
  speakers:
    - Bryan Helmkamp

