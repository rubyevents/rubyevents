- id: "jerry-d-antonio-rubyconf-brazil-2016"
  title: "A Jornada de Concorrência do Ruby"
  date: "2016-09-23"
  start_time: "17:45"
  language: "English"
  video_provider: "not_published"
  video_id: "jerry-d-antonio-rubyconf-brazil-2016"
  description: |-
    O modelo de concorrência para uma linguagem é intimamente ligada às suas características, e Ruby está numa classe de linguagens que tornam concorrência difícil. Mas eu amo Ruby e você também. Então como tornamos concorrência mais fácil em Ruby sem abandonar o que amamos? Bibliotecas como Concurrency Ruby fazem isso abraçando a linguagem, fornecendo garantias fortes e encorajando design de práticas provadas. Guilds, o modelo de concorrência proposto para Ruby 3, levam isso ao próximo nível. Esta apresentação será uma viagem pelo passado do Ruby, seu presente e o futuro. Vamos apresentar as ferramentas necessárias para construir aplicações concorrentes hoje, dar alguns insights sobre o que está por vir e dar um roadmap de como chegar lá.
  speakers:
    - "Jerry D'Antonio"

