  video_provider: "not_published"
  video_id: "akira-matsuda-rubyconf-brazil-2016"
  description: |-
    Vou apresentar diversos exemplos de como as pessoas no Japão vem usando Ruby, como Ruby ajuda a realizar seus trabalhos.

    Ou o que nos faz ainda usar a linguagem e não mudar para outras novas, como Elixir.

