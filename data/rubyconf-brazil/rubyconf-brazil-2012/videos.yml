- id: "bruce-williams-rubyconf-brazil-2012"
  title: "For the Love of Code"
  date: "2012-08-30"
  start_time: "09:20"
  end_time: "10:10"
  language: "English"
  video_provider: "not_recorded"
  video_id: "bruce-williams-rubyconf-brazil-2012"
  description: |-
    A little novelty is a good thing. It keeps us learning, it makes us laugh, it keeps us sharp and on our toes. It makes us want to wake up tomorrow and open our editors to do it all over again. Between our debates on process, good design, and the next feature around the corner, are we still making space for silly experiments, new and unusual technologies, exciting languages with foreign concepts -- the random creative hackery that made us fall in love with code in the first place?

    Maybe, just maybe, we can attend to the Serious Business of being "real" software developers and not lose our sense of adventure in the bargain. Maybe we shouldn't settle for anything less.
  speakers:
    - Bruce Williams

