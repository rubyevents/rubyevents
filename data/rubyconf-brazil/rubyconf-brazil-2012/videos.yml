  speakers:
    - Dalton Pinto

- id: "hiro-asari-rubyconf-brazil-2012"
  title: "Failure is not an option: or, How I learned to read logs and love stack trace"
  date: "2012-08-31"
  start_time: "15:50"
  end_time: "16:40"
  language: "English"
  track: "Room 1"
  video_provider: "not_recorded"
  video_id: "hiro-asari-rubyconf-brazil-2012"
  description: |-
    In a world where everything worked as designed—software ran without defect, hardware never failed, OS never panicked; users read the complete and comprehensive documentation, understood them fully and used the software as intended—there will be no need for technical support. We don't live in that world.

    A first step in technical support is understanding the problem (both technical and human), and address them in a most appropriate manner.

    In this talk, we will go over the basics of troubleshooting, tips on how to do it efficiently, and some pitfalls to avoid if you are to write Ruby code that produces meaningful stack trace when things do inevitably go wrong.
  speakers:
    - Hiro Asari

- id: "mauricio-linhares-de-aragao-junior-rubyconf-brazil-2012"
  title: "O melhor dos mundos - Reunindo Ruby, Java e uma arquitetura orientada a serviços para construir a melhor ferramenta possível"
  date: "2012-08-31"
  start_time: "15:50"
  end_time: "16:40"
  language: "Portuguese"
  track: "Room 2"
  video_provider: "not_recorded"
  video_id: "mauricio-linhares-de-aragao-junior-rubyconf-brazil-2012"
  description: |-
    Nesta apresentação vamos entender como a OfficeDrop saiu de uma aplicação Rails única, responsável por executar todo o processamento de documentos de ponta a ponta, para duas aplicações separadas (Ruby/Rails e Java/Scala) e sem compartilhar em códigos que se comunicam através de filas no Resque uma API RESTful.

    O objetivo é demonstrar como é possível (e melhor) construir aplicações menores, focadas em um único objetivo, usando as ideias da Arquitetura Orientada a Serviços, que vai resultar em bases de código menores de serem mantidas, ciclos de testes menores e aplicações que fazem uma única coisa e a fazem bem (seguindo também a filosofia do UNIX). Além de facilitar a sua vida na hora de escolher as tecnologias, podendo escolher a melhor tecnologia para resolver o seu problema em vez de se prender a uma única plataforma.

    Vamos ver como a aplicação era originalmente, os problemas que uma base de código com alguns anos de idade e desenvolvida por pessoas diferentes (algumas que não estão mais na empresa), o crescimento descontrolado do código e quais foram os passos que tomamos pra conseguir separar as coisas e facilitar a nossa vida na manutenção, evolução e testes da nossa plataforma.
  speakers:
    - Maurício Linhares de Aragão Junior

