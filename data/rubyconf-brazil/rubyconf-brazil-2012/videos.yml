- id: "jose-valim-rubyconf-brazil-2012"
  title: "Vamos falar sobre concorrência"
  date: "2012-08-31"
  start_time: "09:40"
  end_time: "10:30"
  language: "Portuguese"
  track: "Room 1"
  video_provider: "not_recorded"
  video_id: "jose-valim-rubyconf-brazil-2012"
  description: |-
    "Há um bom tempo, threads vêm sendo o modo padrão de se obter concorrência com múltiplos processadores. Entretanto, a complexidade em manipular threads e "estado" tem afetado negativamente a forma como os desenvolvedores veem concorrência. Felizmente, linguagens de programação como Clojure e Erlang introduzem novos paradigmas que tornam mais fácil trabalhar com concorrência."

    Nesse talk, José Valim discutirá o papel que 'estado' desempenha em ambientes concorrentes e introduzir diferentes paradigmas para concorrência com múltiplos processadores, como Atores e Software Transactional Memory, explicando os seus trade-offs e a importância destes novos paradigmas para os desenvolvedores.
  speakers:
    - José Valim

- id: "michael-buffington-rubyconf-brazil-2012"
  title: "Infinite Excitebike"
  date: "2012-08-31"
  start_time: "09:40"
  end_time: "10:30"
  language: "English"
  track: "Room 2"
  video_provider: "not_recorded"
  video_id: "michael-buffington-rubyconf-brazil-2012"
  description: |-
    Let's build a multiplayer version of a classic 8-bit console motorcycle racing game using Rails, Javascript, Websockets, super strong magnets, and lots of pixels!

    Michael Buffington has been obsessed with the classic NES console game, Excitebike, for almost 30 years. For almost the same amount of time he's also been obsessed with turning the game into one where thousands of people can race together on an infinitely long track for the rest of their lives (or for just a minute or two if they just sort of like it or are busy or something). For nearly 30 years the possibility of this Excitebike nirvana has been too difficult to attain.

    Not anymore. The year is 2012, web technologies are absolutely incredible, and it's time to get serious.

    Join Michael as he tells the story of the technologies that make it possible. Technologies like Ruby on Rails, Websockets, and Javascript.
  speakers:
    - Michael Buffington

- id: "brandon-keepers-rubyconf-brazil-2012"
  title: "Why Our Code Smells"
  date: "2012-08-31"
  start_time: "11:00"
  end_time: "11:50"
  language: "English"
  track: "Room 1"
  video_provider: "not_recorded"
  video_id: "brandon-keepers-rubyconf-brazil-2012"
  description: |-
    Odors are communication devices. They exist for a reason and are usually trying to tell us something. Our code smells and it is trying to tell us what is wrong.

    I have been on a quest with a few coworkers to uncover why our code smells. In this talk, I will walk through code from projects that I work on every day, looking for smells that indicate problems, understanding why it smells, what the smell is trying to tell us, and how to refactor it.
  speakers:
    - Brandon Keepers

- id: "carlos-antonio-da-silva-rubyconf-brazil-2012"
  title: "Escrevendo aplicações melhores com Active Model"
  date: "2012-08-31"
  start_time: "11:00"
  end_time: "11:50"
  language: "Portuguese"
  track: "Room 2"
  slides_url: "https://speakerdeck.com/plataformatec/escrevendo-aplicacoes-melhores-com-active-model"
  video_provider: "not_recorded"
  video_id: "carlos-antonio-da-silva-rubyconf-brazil-2012"
  description: |-
    O Active Model foi adicionado ao Rails 3 como uma maneira de abstrair a interação entre as camadas de controller e model. Com o tempo, ele começou a acumular alguns módulos bastante convenientes, com o objetivo de compartilhar implementações que poderiam ser usadas por diferentes modelos e ORMs, como a lógica de validações que hoje é compartilhada entre ORMs como Active Record e Mongoid.

    Nesta palestra vamos aprender mais sobre a tão falada API do Active Model, como ela tem sido usada em alguns ORMs e outros projetos Open Source, como utilizá-la em nossas aplicações para resolver problemas típicos envolvendo regras de negócio, e vamos conhecer as mudanças do Active Model com o Rails 4.
  speakers:
    - Carlos Antonio da Silva

- id: "rafael-franca-rubyconf-brazil-2012"
