- id: "caue-guerra-rubyconf-brazil-2012"
  title: "Desenvolvimento de Jogos Multi-Plataforma com Rails: Insights das trincheiras"
  date: "2012-08-31"
  start_time: "17:10"
  end_time: "18:00"
  language: "Portuguese"
  track: "Room 2"
  video_provider: "not_recorded"
  video_id: "caue-guerra-rubyconf-brazil-2012"
  description: |-
    Uke é uma empresa de jogos que cresceu muito rapidamente. O segredo de seu sucesso é a tecnologia: HTML5 + CSS3 combinado com clientes nativos, permitindo releases em multiplas plataformas (a companhia atualmente suporta iOS, Android, Facebook e Blackberry) e melhorias constantes. Tudo isso movido a Ruby on Rails.

    Nessa palestra, eu irei mostrar os desafios em tal crescimento, a tecnologia que é usada para suportar nossos 200K usuários diários (e 10K em qualquer momento do dia), além dos esforços para se aproximar de uma arquitetura mais RESTful, facilitando a criação de novos jogos.

    Se você está interessa em criar um jogo, eu espero que essa palestra lhe dê algumas dicas.
  speakers:
