  description: |-
    Have you ever wanted to run a commercial PaaS on your laptop? Have you ever wanted to modify how it works?

    This talk will take you though the basic components of the Cloud Foundry PaaS, describe how they are used in cloudfoundry.com - and finally do a deep-dive into how Micro Cloud Foundry works, including the process we use to build it.

