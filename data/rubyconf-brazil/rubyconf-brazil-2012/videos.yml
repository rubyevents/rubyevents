  description: |-
    "Cryml é uma linguagem de markup (em desenvolvimento), inspirada no Dryml e escrita em C.

    O objetivo dela é ser agnóstica quanto à linguagem de programação, porém limpa e simples.

    Ela se parece com HTML comum, apesar de estender tipos de de atributos, sem sintaxes estranhas como {{}} ou qualquer outra coisa que não se pareça com HTML.

