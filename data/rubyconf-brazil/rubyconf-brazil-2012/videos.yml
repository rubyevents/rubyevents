  video_provider: "not_recorded"
  video_id: "rodrigo-franco-rubyconf-brazil-2012"
  description: |-
    "Todo mundo sabe que testes de interface são muito chatos. Voce precisa, por exemplo, ter certeza de que a imagem certa estará no local correto, e que  o posicionamento da mesma estará certinho. Deixamos então vários bugs passarem despercebidos porque falta uma maneira mais fácil de encontrá-los."

