  speakers:
    - Thomaz Leite

- id: "toby-crawley-rubyconf-brazil-2012"
  title: "Simple scalability with JRuby & TorqueBox"
  date: "2012-08-31"
  start_time: "14:10"
  end_time: "15:00"
  language: "English"
  track: "Room 1"
  video_provider: "not_recorded"
  video_id: "toby-crawley-rubyconf-brazil-2012"
  description: |-
    TorqueBox is an open source project that combines JRuby with the JBoss Application Server to form a fast, scalable application server for Rack/Rails applications. It exposes features traditionally found in Java application servers to Ruby, such as:


    Background processing
    Job scheduling
    Long-running daemons
    Caching
    Clustering
    XA transactions
    WebSockets



    We'll examine the above features via a live coding demonstration, followed by a quick tour of some of the other non-Java application servers we're working on at Red Hat, and how they can easily inter-operate with TorqueBox via messaging.
  speakers:
    - Toby Crawley

- id: "tyler-brock-rubyconf-brazil-2012"
  title: "MongoDB & Ruby"
  date: "2012-08-31"
  start_time: "14:10"
  end_time: "15:00"
  language: "English"
  track: "Room 2"
  video_provider: "not_recorded"
  video_id: "tyler-brock-rubyconf-brazil-2012"
  description: |-
    This talk explores MongoDB in the Ruby ecosystem. If you're using
    MongoDB with Ruby, you should first know a few things about the Ruby
    driver. So in the first part of the session, we'll provide an overview
    of the driver, show how to use it with replica sets, and cover some
    common gotchas. We'll talk about some of the advantages of using JRuby
    with MongoDB and describe the Ruby driver support for that platform.
    And finally, we'll look at the most popular object mappers in Ruby,
    adumbrate their respective features, and describe just what to
    consider before you start using one.
  speakers:
    - Tyler Brock

- id: "bruno-oliveira-rubyconf-brazil-2012"
