- id: "thomaz-leite-rubyconf-brazil-2012"
  title: "Aplicações mais simples"
  date: "2012-08-31"
  start_time: "11:50"
  end_time: "12:40"
  language: "Portuguese"
  track: "Room 2"
  video_provider: "not_recorded"
