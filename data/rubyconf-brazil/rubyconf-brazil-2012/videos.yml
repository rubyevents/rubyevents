- id: "dalton-pinto-rubyconf-brazil-2012"
  title: "Repensando Linguagens de Markup com o Cryml"
  date: "2012-08-31"
  start_time: "15:00"
  end_time: "15:50"
  language: "Portuguese"
  track: "Room 2"
  video_provider: "not_recorded"
