- id: "eduardo-shiota-yasuda-rubyconf-brazil-2012"
  title: "Arquitetura do Front-end em Aplicações de Larga Escala"
  date: "2012-08-30"
  start_time: "15:20"
  end_time: "16:10"
  language: "Portuguese"
  track: "Room 1"
  video_provider: "not_recorded"
  video_id: "eduardo-shiota-yasuda-rubyconf-brazil-2012"
  description: |-
    "Para desenvolver um site institucional simples ou um hotsite pequeno, não é preciso muito mais que um pouco de HTML, um ou dois arquivos de CSS, alguns arquivos de JavaScript, e um sistema de CMS. No entanto, à medida que a complexidade de um site aumenta, o código passa a se tornar cada vez mais extenso, complexo, difícil de ser organizado, o projeto acaba virando um grande "spaghetti code".

    Para garantir que isso não aconteça, é necessário implementar uma estrutura sólida para o HTML, CSS e JavaScript, de modo que os componentes da aplicação funcionem independentemente e sejam facilmente mantidos e modificados. Nesta palestra, irei mostrar como elaborar uma arquitetura de front-end que sustente uma aplicação de larga escala."
  speakers:
    - Eduardo Shiota Yasuda

- id: "guilherme-silveira-ricardo-valeriano-rubyconf-brazil-2012"
  title: "Como não escrever o projeto lixo do futuro"
  date: "2012-08-30"
  start_time: "15:20"
  end_time: "16:10"
  language: "Portuguese"
  track: "Room 2"
  video_provider: "not_recorded"
  video_id: "guilherme-silveira-ricardo-valeriano-rubyconf-brazil-2012"
  description: |-
    "Escolhida uma arquitetura apropriada, agora é a hora do código. Todos nós temos idéias geniais em um projeto e, no ano seguinte, aquela idéia vira o pesadelo dos outros. Como deixar de abusar? E do que deixar de abusar? Como encontrar o ponto de não-retorno?

    Não fazemos coisas nojentas, mas cada dia usamos tecnologias mais “chiques”. Como pode ser que continuamos a culminar com o mesmo tipo de lixo 10 anos depois?

    "Durante o desenvolvimento, decisões de código e design influenciam a qualidade de tal forma que o mais importante em um projeto é o código. Veremos como evitar escrever lixo, e o que é lixo, em qualquer linguagem. Se você está cansado de mudar de projeto, linguagem e framework e sempre se encontrar frente ao mesmo problema (manutenção), discutiremos a raiz disso." prometem Guilherme Silveira e Ricardo Valeriano."
  speakers:
    - Guilherme Silveira
    - Ricardo Valeriano

