  description: |-
    Nesta palestra, Danilo Sato e Carlos Villela irão compartilhar suas experiências em projetos Ruby na ThoughtWorks. Tendo visto aplicações entre 10s e 10,000s linhas de código, trabalhado com times pequenos e times grandes, com nenhum ou milhares de testes automatizados, em Ruby puro ou Rails com Oracle ou SqlServer, desenvolvendo e fazendo deploy em ambiente Windows ou gerenciando a infraestrutura para fazer deploy em 1000s de servidores. Danilo e Carlos irão compartilhar alguns truques e dicas de como evitar situações estressantes ao desenvolver e entregar projetos Ruby em ambientes corporativos.
