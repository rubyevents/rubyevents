- id: "cassio-marques-rubyconf-brazil-2012"
  title: "Linguagens Dinâmicas são Melhores para Implementar OO"
  date: "2012-08-30"
  start_time: "16:40"
  end_time: "17:30"
  language: "Portuguese"
  track: "Room 2"
  slides_url: "https://speakerdeck.com/cassiomarques/linguagens-dinamicas-sao-melhores-para-implementar-oo-1"
  video_provider: "not_recorded"
  video_id: "cassio-marques-rubyconf-brazil-2012"
  description: |-
    Pretendo mostrar porque considero linguagens com tipagem dinâmica melhores para implementar diversos elementos de programação orientada à objetos quando comparadas com linguagens com tipagem estática, além de abordar aspectos como coesão, aderência a contratos, APIs públicas, composição e testabilidade.

    A idéia é mostrar porque linguagens dinâmicas são mais indicadas para modelar as complexas regras de negócio existentes na maior parte dos softwares desenvolvidos comercialmente.

    O público alvo desta palestra inclui tanto desenvolvedores que já conhecem Ruby como pessoas que estão vindo de outras linguagens e que queiram aprender mais sobre como o Ruby resolve alguns problemas relacionados à orientação a objetos.
  speakers:
    - Cássio Marques

- id: "josh-kalderimis-rubyconf-brazil-2012"
  title: "It's not how good your app is, it's how good you want it to be"
  date: "2012-08-30"
  start_time: "17:30"
  end_time: "18:20"
  language: "English"
  video_provider: "not_recorded"
  video_id: "josh-kalderimis-rubyconf-brazil-2012"
  description: |-
    This talk is part story, part code, and part mustache.

    Travis CI is a distributed continuous integration system running over 7,000 tests daily. For us to get a true insight into what is going on behind the scenes we have had to come a long way by integrating and building both tools and libraries so that Travis and its many parts are not just a black box of information.

    Reading logs and using NewRelic is not new, but far from enough, especially when it comes to apps which are composed of many smaller apps, like Travis. How do you track and visualize requests being processed by multiple services? How do you silence verbose logs while not losing the core of the message? And how do you aggregate, visualize and share metrics?

    A lot of how we track, manage, and visualize what is going on in Travis has been created as a set of internal tools and by using a range of awesome services, but core to a lot of this is ActiveSupport Notifications and Travis Instrumentation.

    This session will give insight to how Travis is composed and connected, as well as shedding light on how simple it can be to gain more visibility into even a complex, distributed system like Travis, as well as your applications too.
  speakers:
    - Josh Kalderimis

