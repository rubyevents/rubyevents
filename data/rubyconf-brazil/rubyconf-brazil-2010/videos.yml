- id: "norman-clarke-rubyconf-brazil-2010"
  title: "8 Bits and Beyond: Encodings in Ruby 1.9"
  date: "2010-10-27"
  start_time: "11:00"
  end_time: "12:00"
  language: "English"
  video_provider: "not_recorded"
  video_id: "norman-clarke-rubyconf-brazil-2010"
  description: |-
    Ruby 1.9 is unusual among contemporary programming languages in that it allows you to choose the encoding used internally for strings. This feature gives Ruby 1.9 great power and flexibility for internationalization, but can be a source of problems and confusion, particularly for Ruby developers making the change from 1.8.

    This talk will briefly go over the general concepts behind Ruby 1.9’s Encoding API, and explain the motivations behind the design decisions Ruby made. We’ll then spend most of the talk looking at the encoding-related challenges that you may face developing web applications in Ruby 1.9, and what you can do to avoid problems.
  speakers:
    - Norman Clarke

- id: "charles-nutter-rubyconf-brazil-2010"
  title: "JRuby: The Best of Both Worlds"
  date: "2010-10-27"
  start_time: "11:00"
  end_time: "12:00"
  language: "English"
  video_provider: "not_recorded"
  video_id: "charles-nutter-rubyconf-brazil-2010"
  description: |-
    JRuby is an excellent Ruby implementation, built atop the JVM and leveraging all the JVM’s best features. But it’s also an excellent JVM language, allowing you to use Java libraries from Ruby, integrate with legacy libraries and applications, and deploy Ruby apps anywhere you’d deploy Java apps like application servers, Google’s AppEngine, and on Android mobile devices.

    In this talk, Charles will show why JRuby’s such a JRuby a powerful tool for your toolkit, with demos of JVM tools, real concurrent threading, and the latest performance improvements. He’ll also demonstrate how to use Java libraries, how to deploy a Rails app to any Java server (or run it with a lightweight Ruby-friendly server), and how to build mobile applications using JRuby on Android. Finally, he’ll talk about how JRuby can help you bring Ruby to the Java world, and how you can help JRuby succeed.
  speakers:
    - Charles Nutter

- id: "blaine-cook-rubyconf-brazil-2010"
  title: "Software Social para Robôs"
  date: "2010-10-27"
  start_time: "12:00"
  end_time: "13:00"
  language: "English"
  video_provider: "not_recorded"
  video_id: "blaine-cook-rubyconf-brazil-2010"
  description: |-
    A web, antes uma coleção de páginas conectadas por links, é hoje uma representação ativa de nossas vidas. Interações sociais, brigas diárias e celebrações, e os frutos de nosso trabalho, tudo compartilhado online. O problema é que no meio da experimentação com essas tecnologias, nós perdemos algumas das mais importantes propriedades da web no caminho. Centralização de atenção na web significa que experiências com novas formas na internet são mais difícies do que antes.

    Nessa palestra, exploraremos a web emergente de mensagens. Começando sobre como comunicações sociais funcionam na web hoje, vamos mergulhar em diversos padrões emergentes que permitem trocas ricas de conteúdo (e emoção) para ocorrer sem depender de qualquer “Ministro Central de Planejamento” de uma empresa. Vamos também discutir segurança e privacidade no contexto dessa fronteira social, e como as aproximações aplicadas aqui podem ser extendidas para outros contextos através da web.
  speakers:
    - Blaine Cook

- id: "david-chelimsky-rubyconf-brazil-2010"
  title: "Maintaining balance while reducing duplication"
  date: "2010-10-27"
  start_time: "12:00"
  end_time: "13:00"
  language: "English"
  video_provider: "not_recorded"
  video_id: "david-chelimsky-rubyconf-brazil-2010"
  description: |-
    The DRY Principle (Don’t Repeat Yourself) suggests that “every piece of knowledge must have a single, unambiguous, authoritative representation within a system.” A powerful guideline, but it is often heeded without a clear understanding of its underlying motivations, nor consideration for other principles that might lead the code in other directions.

    In this talk, we’ll explore duplication in code in a variety of forms and the risks associated with each. We’ll look at strategies for reducing duplication without sacrificing design basics like encapsulation, low coupling, and high cohesion. We’ll look at other principles that are often left behind in the name of keeping the code DRY, and how to balance them to keep your code flexible and maintainable.
  speakers:
    - David Chelimsky

- id: "rodrigo-franco-rubyconf-brazil-2010"
  title: "Trabalhando remotamente em uma equipe global – Ferramentas da profissão"
  date: "2010-10-27"
  start_time: "14:30"
  end_time: "15:30"
  language: "Portuguese"
  video_provider: "not_recorded"
  video_id: "rodrigo-franco-rubyconf-brazil-2010"
  description: |-
    Nesta palestra, Rodrigo irá guiá-lo através das melhores ferramentas e práticas utilizadas por várias equipes ágeis. Nós todos usamos github ou basecamp, mas quando é hora de analisar o desempenho dos membros de nossa equipe, você sabe o que fazer? Se a sua equipe iria se beneficiar de algum tipo de ferramenta de acompanhamento de tempo, qual opção escolheria? Dúzias de aplicativos estão disponíveis para serem testados, mas você realmente tem tempo para se registrar e julgar cada um deles? Rodrigo fez isso e irá partilhar os resultados com você.
