- id: "guilherme-silveira-anderson-leite-rubyconf-brazil-2010"
  title: "O melhor dos dois mundos: funcional e orientado a objetos"
  date: "2010-10-27"
  start_time: "17:00"
  end_time: "18:00"
  language: "Portuguese"
  video_provider: "not_recorded"
  video_id: "guilherme-silveira-anderson-leite-rubyconf-brazil-2010"
  description: |-
    Exceto Chuck Norris, nada resolve todos os problemas de maneira elegante. O lado funcional de Ruby permite uma sintaxe adequada em diversos momentos, enquanto a orientação a objetos em outros momentos. Passaremos por uma série de exemplos de código escrito em uma das duas maneiras, código que pode ser horrendo ou razoavelmente compreensível, mas que ao passar ao outro estilo de programação alcança um estado maior de graça, balanceando testabilidade, adaptabilidade, facilidade de manutenção, acoplamento etc. O programador não precisa ser somente poliglota, mas utilizar os recursos adequados da linguagem que se encaixam com cada problema enfrentado.
  speakers:
    - Guilherme Silveira
    - Anderson Leite

- id: "carlos-brando-rubyconf-brazil-2010"
  title: "Desenvolvimento de Aplicações Sociais com Rails"
  date: "2010-10-27"
  start_time: "17:00"
  end_time: "18:00"
  language: "Portuguese"
  video_provider: "not_recorded"
  video_id: "carlos-brando-rubyconf-brazil-2010"
  description: |-
    Desenvolver para as plataformas OpenSocial e Facebook pode parecer um mundo diferente, em primeiro lugar. Depois de trabalhar durante vários meses com estas plataformas, Carlos Brando desenvolveu um framework integrado para Rails 3 que permite o desenvolvimento de aplicações sociais sem dor. Este framework será lançado como código aberto durante a RubyConf Brasil. Durante esta palestra você aprenderá como criar uma aplicação Orkut (OpenSocial) e Facebook a partir do zero usando este framework open-source (chamado Sociably) e Rails 3.
  speakers:
    - Carlos Brando

