- id: "emerson-macedo-rubyconf-brazil-2010"
  title: "Gerenciamento de Configuração em projetos Ruby"
  date: "2010-10-26"
  language: "Portuguese"
  video_provider: "not_recorded"
  video_id: "emerson-macedo-rubyconf-brazil-2010"
  description: |-
    O propósito dessa apresentação é mostrar como podemos ter Gerenciamento de Configuração no mundo Ruby. Ele vai apresentar os conceitos de Gerenciamento de Configuração, com uma breve explicação de como as empresas vêm fazendo isso até então. Então, falará sobre a maneira mais limpa usando ferramentas que tornam isso possível.

    Ele falará sobre alguns campos de Gerenciamento de Configuração:

    Gerenciamento de Infraestrutura com Chef

    Ruby Version Manager (RVM)

    Gerenciamento de Dependência de Gems com Bundler

    Gerenciamento de Código Fonte com Git

    Gerenciamento de Instalação com Capistrano

    Gerenciamento de Construção com Sistema de Integração Contínua

    Ele também falará sobre como mover de um processo manual, passo a passo, para essas novas técnicas e ainda estar no meio de problemas políticos ou quando estamos lidando com empresas tradicionais.
  speakers:
    - Emerson Macedo
