- id: "lucas-hungaro-rubyconf-brazil-2010"
  title: "A Coisa Real – o que funciona e o que não funciona em uma aplicação Rails em produção"
  date: "2010-10-26"
  start_time: "17:00"
  end_time: "18:00"
  language: "Portuguese"
  video_provider: "not_recorded"
  video_id: "lucas-hungaro-rubyconf-brazil-2010"
  description: |-
    Nesta palestra mostrarei algumas técnicas e soluções para problemas comuns no mundo “real” de aplicações Rails. Durante os últimos três anos tenho trabalhado com aplicações escritas em Ruby (com e sem Rails) e enfrentando alguns problemas em relação ao desempenho, escalabilidade, decisões de arquitetura e de manutenção do código e com isso desenvolvi algumas formas de lidar com esses problemas, que eu vou mostrar nessa palestra por meio de código e exemplos reais. Então, essa não é uma palestra comum de “boas práticas”.
  speakers:
    - Lucas Húngaro

