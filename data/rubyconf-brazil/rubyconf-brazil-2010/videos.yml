- id: "evan-phoenix-rubyconf-brazil-2010"
  title: "Rubinius para Você"
  date: "2010-10-27"
  start_time: "09:30"
  end_time: "10:30"
  language: "English"
  video_provider: "not_recorded"
  video_id: "evan-phoenix-rubyconf-brazil-2010"
  description: |-
    Rubinius é um ambiente moderno para executar código Ruby que fornece muitas facilidades para tornar sua vida como desenvolvedor mais fácil. Desde introspecção profunda até ferramentas avançadas de profiling, nós nos esforçamos para fazer um sistema que torna fácil escrever código Ruby rápido. Eu irei discutir diversas dessas facilidades fazendo demonstrações para usar essas ferramentas em cenários ao vivo.
