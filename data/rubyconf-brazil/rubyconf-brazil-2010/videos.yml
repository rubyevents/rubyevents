- id: "gleicon-moraes-rubyconf-brazil-2010"
  title: "O Programador Disléxico (toolkits de rede assíncrona, modelos concorrentes, pensamento não seqüencial)"
  date: "2010-10-26"
  start_time: "14:30"
  end_time: "15:30"
  language: "Portuguese"
  video_provider: "not_recorded"
  video_id: "gleicon-moraes-rubyconf-brazil-2010"
  description: |-
    Programação assíncrona, Map/Reduce, modelos de agentes … por quê? O código parece horrível, as coisas não fazem sentido …

    Nesta palestra ele vai explicar o que está acontecendo ultimamente em toolkits de rede (como EventMachine para Ruby) e porque é basicamente o mesmo que está acontecendo em Python, Javascript (Node.js). Os benefícios às vezes não são claros e parece que a complexidade não pode valer a pena.

    Além disso, ele vai falar um pouco sobre como filas de mensagens, como o modelo concorrente tipo do Erlang (atores) e Map/Reduce podem nos dar idéias sobre como quebrar tarefas pesadas de processamento em pedaços gerenciáveis.
  speakers:
    - Gleicon Moraes

- id: "jose-valim-rubyconf-brazil-2010"
  title: "Rails 2.3, 3.0 e 3.1: Passado, Presente e Futuro"
  date: "2010-10-26"
  start_time: "14:30"
  end_time: "15:30"
  language: "Portuguese"
  video_provider: "not_recorded"
  video_id: "jose-valim-rubyconf-brazil-2010"
  description: |-
    No final de 2008, os dois maiores frameworks existentes na comunidade Ruby (Rails & Merb) decidiram se juntar e anunciaram o começo de uma série de esforços que resultou no Rails 3.0. Desde o anúncio, a comunidade foi cercada de dúvidas de como seria o futuro desses frameworks. Iria o Rails mudar a sua filosofia? Quais conceitos Merb traria para o Rails?

    Hoje, quase dois anos depois, Rails 3 foi lançado e continua inovando. Nessa apresentação, José Valim irá discutir o que mudou nesses dois últimos anos, o que Merb trouxe para a comunidade Rails e mostrará o que está por vir!
  speakers:
    - José Valim

