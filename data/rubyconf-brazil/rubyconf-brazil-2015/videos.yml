- id: "filipe-costa-filipebarcos-rubyconf-brazil-2015"
  title: "Rust for Rubyist"
  date: "2015-09-18"
  start_time: "15:00"
  end_time: "15:45"
  language: "Portuguese"
  track: "Workshop Trail 3"
  slides_url: "https://speakerdeck.com/filipebarcos/rust-for-rubysts"
  video_provider: "not_recorded"
  video_id: "filipe-costa-filipebarcos-rubyconf-brazil-2015"
  description: |-
    I've being playing a bit with Rust in the last couple of months and I'm liking it so far. Rust is an Open Source programming language, which started from a necessity from the Mozilla team to have a better (safer) language to develop a rendering engine for Firefox.

    We have some big names from Ruby Community ""playing"" with Rust, Steve Klabnik, Yehuda Katz and some others. Also Yehuda's company, Tilde, is adopting Rust in production for Skylight.

    Rust is definitely a different language when compared to Ruby, but still pretty interesting. I found myself interested on it to try something different. I believe that learning is an amazing process, and the act of learning something completely different is really helpful for you, because you can open you thinking to new ideas not explored by you yet. Rust done this to me and to my understanding of the Ruby language.

    In this talk, I want to present some key and basic concepts of Rust and also give some comparison with Ruby. Concepts of ownership, borrowing, immutability and a few other would be covered here, a long with some basic explanation of how Rust handles memory allocations.
  speakers:
    - Filipe Costa @filipebarcos

- id: "eduardo-mourao-rubyconf-brazil-2015"
  title: "Ruby na Aviação: Buidling avionics in Ruby and dealing with its restrictions"
  date: "2015-09-18"
  start_time: "16:15"
  end_time: "17:00"
  language: "Portuguese"
  track: "Auditorium 1"
  video_provider: "not_recorded"
  video_id: "eduardo-mourao-rubyconf-brazil-2015"
  description: |-
    The core softwares that are used to controll essential flight system are build in languages like Ada and C. Real time execution and predictability are key requirements when building systems when system failures can have horrible consequences, but the programming language of choice has little to do with this requirements.

    In this talk we'll see how and where Ruby can be used in software shipped on aircrafts. What are the restrictions and how to detect and handle memory leaks and garbage collection. In practice we will build a basic panel that can be used in flight and we will watch it being used by me (in a real aircraft).
  speakers:
    - Eduardo Mourão

