- id: "rodrigo-urubatan-ferreira-jardim-rubyconf-brazil-2015"
  title: "Rich interfaces with Rails and React.JS"
  date: "2015-09-19"
  start_time: "12:15"
  end_time: "13:00"
  language: "Portuguese"
  track: "Auditorium 2"
  video_provider: "not_recorded"
  video_id: "rodrigo-urubatan-ferreira-jardim-rubyconf-brazil-2015"
  description: |-
    This days it is important to create applications with rich interfaces, and taking full advantage of resources like AJAX and partial content replacement of the DOM.

    In this talk we will see how to implement this with React.JS to create interface based components.

    Facilitating code reuse and enabling integration with Rails, enabling the pages to be rendered on the server or on the client, improving the application performance since the first page load.

    The lecture will start with a simple application in rails using React.JS to implement an ajax frontend

    Implementing a simple listing and editing for a model using components to modularize the UI and make it easier iteration with the backend

    After demonstrating the loss of performance while waiting for data in the first rendering, I'll show how to render the components in the server using the same Javascript code.

    Featuring also some ideas on how to improve the performance of the frontend and how to optimize queries on the back end for complex data models.
  speakers:
    - Rodrigo Urubatan Ferreira Jardim

