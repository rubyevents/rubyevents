    We will share the experiences and challenges we face in "search for the perfect search". The goal is not to be a step-by-step implementation, but rather a description of the main problems and approaches we used to solve them with ElasticSearch at Leroy Merlin.
  speakers:
    - Guilherme Guitte

- id: "vinicius-feitosa-pacheco-rubyconf-brazil-2015"
  title: "Hey ho let's Go"
  date: "2015-09-19"
  start_time: "15:15"
  end_time: "16:00"
  language: "Portuguese"
  track: "Workshop Trail 3"
  video_provider: "not_recorded"
  video_id: "vinicius-feitosa-pacheco-rubyconf-brazil-2015"
  description: |-
    A trip through the Go programming language created by Google. Starting by the basic concepts, passing through tests and finishing with high performance micro services. All of this sailing the fantastic ecosystem of Go.
  speakers:
    - Vinicius Feitosa Pacheco

- id: "brandon-hilkert-rubyconf-brazil-2015"
  title: "A Path to Services"
  date: "2015-09-19"
  start_time: "16:00"
  end_time: "16:45"
  language: "English"
  track: "Auditorium 1"
  video_provider: "not_recorded"
  video_id: "brandon-hilkert-rubyconf-brazil-2015"
  description: |-
    Old applications can easily grow out of control. Over the last few years we’ve heard about techniques to organize, improve and simplify our Monolithic Rails applications. Microservices have gotten a lot of attention latest. They’re not a cure-all. However, if implemented properly, microservices can ensure boundaries within an application are respected.

    Most microservice implementations involve the addition of a messaging queue like RabbitMQ. But do they have to? What if we could leverage Sidekiq to handle real-time service communication?

    This talk will explore how PipelineDeals moved from an 8 year-old monolithic Rails application to a microservice-based architecture with over the past 2 years. It will touch on inter-service communication, building for resiliency, leveraging tools we already know and love, and deciding which parts of the application are worthy of separation.
  speakers:
    - Brandon Hilkert

- id: "jonatas-davi-paganini-rubyconf-brazil-2015"
  title: "ø downtime deployments"
  date: "2015-09-19"
  start_time: "16:00"
  end_time: "16:45"
  language: "Portuguese"
  track: "Auditorium 2"
  video_provider: "not_recorded"
  video_id: "jonatas-davi-paganini-rubyconf-brazil-2015"
  description: |-
    Software as a service (SASS) can't stop. Customers and third party applications is coming to communicate with your system all the time. High availability is not a desired feature. It's required.

    Thinking about this context, the software development workflow needs to answer some questions before start deploying crazy new features:

    How can we keep our services running all the time and deploy new fixes on the code without stop?

    How can we deliver new features without stop servers or schedule maintenances?

    How can we deliver high availability and migrate big data at the same time?

    How can we avoid headaches planning reversible changes and adaptative rollouts?
  speakers:
    - Jônatas Davi Paganini

- id: "vinicius-almeida-rubyconf-brazil-2015"
  title: "We need to talk about jQuery"
  date: "2015-09-19"
  start_time: "16:00"
  end_time: "16:45"
  language: "Portuguese"
  track: "Workshop Trail 1"
  video_provider: "not_recorded"
  video_id: "vinicius-almeida-rubyconf-brazil-2015"
  description: |-
    Why all that anger, son? Sit here, let's talk about a library used on two-thirds of Internet sites.

    Hypes apart, we need understand why use her and principally if we should abandon her (or not).
  speakers:
    - Vinícius Almeida

- id: "robson-agapito-correa-rubyconf-brazil-2015"
  title: "Continuous Integration, Automated Builds and Continuous Deployment, developing with quality."
  date: "2015-09-19"
  start_time: "16:00"
  end_time: "16:45"
  language: "Portuguese"
  track: "Workshop Trail 2"
  video_provider: "not_recorded"
  video_id: "robson-agapito-correa-rubyconf-brazil-2015"
  description: |-
    The participation of a high quality team at Locaweb was essential to improve the deployment process of applications in all environments prior to the production deployment.

    In this lecture we will show how we use this process to create, promote and validate packages regarding its code quality and systems in Locaweb using the Jenkins.

    The union between Devs and QA's was the big difference in the success of this process.
  speakers:
    - Robson Agapito Correa

- id: "stefano-benatti-rubyconf-brazil-2015"
  title: "ADFS or Awesome Dynamic Faceted Search using Mongoid and Solr"
  date: "2015-09-19"
  start_time: "16:00"
  end_time: "16:45"
  language: "Portuguese"
  track: "Workshop Trail 3"
  video_provider: "not_recorded"
  video_id: "stefano-benatti-rubyconf-brazil-2015"
  description: |-
    In this talk I will show how and why you can create dynamic faceted search engines in Rails, similar to the ones used in http://escoladigital.org.br or others such as buscape or amazon, without needing to hardcode every field/column in advance. Using Mongoid and Solr, you can create dynamic fields and indexes, and even a dynamic backend admin section to manage fields and options, while still maintaining fast perfomance.

    By doing so, you can create multitenant applications or on the fly data fields with complex search filters with highly customisable options and no database migrations or constant reindexing.

    This technique has been applied to a real case application with millions of visitors per month, which testifies its scalability and perfomance in a real case scenario.
  speakers:
    - Stefano Benatti

- id: "building-apis-on-rails-5-with-ams-rubyconf-brazil-2015"
  title: "Building APIs on Rails 5 with AMS"
  date: "2015-09-19"
  start_time: "17:15"
  end_time: "18:00"
  language: "Portuguese"
  track: "Auditorium 1"
  video_provider: "not_recorded"
  video_id: "building-apis-on-rails-5-with-ams-rubyconf-brazil-2015"
  description: |-
    A lot of people have being using Rails to develop both their internal or external API, but building a high quality API can be hard, and performance is a key point to achieve it.

    I'll share my stories with APIs, and tell you how Active Model Serializer, component of Rails-API, helped me. AMS have being used across thousands of applications bringing convention over configuration to JSON generation.

    This talk will give you a sneak peek of a new version of AMS that we have being working on, it's new cache conventions, and how it's being considered to be shipped by default in new Rails 5.
  speakers:
    - João Moura

- id: "lailson-bandeira-rubyconf-brazil-2015"
  title: "Data Mappers in Ruby"
  date: "2015-09-19"
  start_time: "17:15"
  end_time: "18:00"
  language: "Portuguese"
  track: "Auditorium 2"
  video_provider: "not_recorded"
  video_id: "lailson-bandeira-rubyconf-brazil-2015"
  description: |-
    Due to the popularity of the ActiveRecord gem, the Ruby community traditionally gave preference to persistence solutions based on the Active Record pattern. However, this pattern is not always the best choice, especially in large applications. An alternative for such cases is the Data Mapper pattern, which has been gaining more and more attention from Rubyists recently. This talk discusses the options we currently have for using the Data Mapper pattern in Ruby projects and how each library differ from each other.
  speakers:
    - Lailson Bandeira

- id: "andrew-rosa-rubyconf-brazil-2015"
  title: "Wassup with this Functional Programming thing?"
  date: "2015-09-19"
  start_time: "17:15"
  end_time: "18:00"
  language: "Portuguese"
  track: "Workshop Trail 1"
  video_provider: "not_recorded"
  video_id: "andrew-rosa-rubyconf-brazil-2015"
  description: |-
    The current programming scenario is once again changing. We see the rise of several (not so) new languages, many speaking about functional paradigm. But what ultimately would be a functional language? How it differs from what we currently have? And more importantly, what we Rubyists get out of it?

    Here I intend to make a brief statement about what are the differences between FP and OOP, advantages and things you should be careful with. And how can we bring some of their ideas and practices to improve our own Ruby code today.
  speakers:
    - Andrew Rosa

- id: "barbara-barbosa-camila-campos-rubyconf-brazil-2015"
  title: "Rails Girls"
  date: "2015-09-19"
  start_time: "17:15"
  end_time: "18:00"
  language: "Portuguese"
  track: "Workshop Trail 2"
  video_provider: "not_recorded"
  video_id: "barbara-barbosa-camila-campos-rubyconf-brazil-2015"
  description: |-
    Rails Girls is a global non-profit organization founded by Linda Liukas and Karri Saarinen in November of 2010, in Helsinki, Finland. The organization has the goal of presenting the world of technology to people that identify in the female gender, of all ages and experience levels. The first event took place with more than 100 attendees and it is today present in all of the world's continents.

    The São Paulo Rails Girl (http://railsgirls.com/saopaulo2015) intends to give the attendees all the needed tools to understand and be inspired by the world of technology. =) Let's talk a little bit about this community, where the events happen, and also comment on other initiatives in computation geared towards the female audience.
  speakers:
    - Bárbara Barbosa
    - Camila Campos

- id: "salviano-ludgerio-felipe-gomes-rubyconf-brazil-2015"
  title: "Fun with Ruby: The Functional Approach"
  date: "2015-09-19"
  start_time: "17:15"
  end_time: "18:00"
  language: "Portuguese"
  track: "Workshop Trail 3"
  video_provider: "not_recorded"
  video_id: "salviano-ludgerio-felipe-gomes-rubyconf-brazil-2015"
  description: |-
    Ruby is known for be an object-oriented language. All are objects, unless blocks, these are a different animal. In this talk I intend to show for developers, beginners or intermediates, some fundamentals of functional programming and how to take advantage of his characteristics present in Ruby. As also, clarify some aspects that can confuse the novice Rubyist.

    Some topics and questions include:

    - What's Closures?

    - How closures in Ruby looks like

    - Examples in other languages: Javascript, Elixir etc. (small snippets)

    - Show as experiment how to use closures to create objects that preserve his states.

    - High order functions

    - Procs Vs. Lambdas

    - Show that blocks aren't high order functions

    - Lexical scope

    - Show that methods in Ruby, unlike procs and lambas, doesn't have lexical scope.

    - Show that methods in Ruby can be converted to procs and pass to other methods .
  speakers:
    - Salviano Ludgério Felipe Gomes

- id: "marcello-rocha-rubyconf-brazil-2015"
  title: "Not-Entreprise Message Bus"
  date: "2015-09-19"
  start_time: "18:00"
  end_time: "18:45"
  language: "Portuguese"
  track: "Auditorium 1"
  video_provider: "not_recorded"
  video_id: "marcello-rocha-rubyconf-brazil-2015"
  description: |-
    Have you ever had to work with decades old legacy software? Have you ever participated in a ""big rewrite"" of the said software? Well... that's my (and my team) job.

    How did we (are we trying to) do it? One of our answers is a event-driven architecture. It has some advantages (like being asynchronous) and made us make some compromises (by being asynchronous)

    How did it help (or hindered) us? Which risks are involved? Which are our goals? Why did we choose RabbitMQ?

    If you want to get a glimpse of how to work with RabbitMQ and with an event driven architecture or even if you wanna see how are we tackling this herculean task, this is the talk for you.
  speakers:
    - Marcello Rocha

- id: "guilherme-garnier-rubyconf-brazil-2015"
  title: "Evolution of a distributed architecture: from Globo.tv to Globosat Play"
  date: "2015-09-19"
  start_time: "18:00"
  end_time: "18:45"
  language: "Portuguese"
  track: "Auditorium 2"
  video_provider: "not_recorded"
  video_id: "guilherme-garnier-rubyconf-brazil-2015"
  description: |-
    When your product grows, one of the biggest challenges is how is your architecture going to evolve in a sustainable way. In this talk, I'm going to show how the platform created for Globo.tv grown and evolved with the rise of a new product: Globosat Play. Among the challenges, how to allow several teams to work on the same platform, how to share components and how to update a project without breaking another. I'll also detail the main benefits and drawbacks of a microservices architecture compared to a monolithic one.
  speakers:
    - Guilherme Garnier

- id: "vinicius-palma-rubyconf-brazil-2015"
  title: "React on Rails"
  date: "2015-09-19"
  start_time: "18:00"
  end_time: "18:45"
  language: "Portuguese"
  track: "Workshop Trail 1"
  video_provider: "not_recorded"
  video_id: "vinicius-palma-rubyconf-brazil-2015"
  description: |-
    React is a new framework javascript, developed by Facebook. And the description on site is ""Lots of people use React as the V in MVC. Since React makes no assumptions about the rest of your technology stack, it's easy to try it out on a small feature in an existing project"".

    I'll talk about how implement this framework, on your workflow with RoR using a gem called react-rails.

    The talk will contain this informations, States and Props, Virtual DOM and JSX about the framework. Using JSX, organization components, Pre-render, React unobtrusive and helpers about the gem.
  speakers:
    - Vinicius Palma

- id: "diego-eis-rubyconf-brazil-2015"
  title: "Flexbox and Grid Layout - The new way to structure layouts"
  date: "2015-09-19"
  start_time: "18:00"
  end_time: "18:45"
  language: "Portuguese"
  track: "Workshop Trail 2"
  video_provider: "not_recorded"
  video_id: "diego-eis-rubyconf-brazil-2015"
  description: |-
    Until today, we only have used workarounds to structure layouts of products and websites. Tables are not the solution, but they have the way we consume and structure content in Web. Float are not the right answer. Float can't make a good work simply because this was not created to do that. However we use float instead tables because float is more flexible and better.

    To solve this problem, we have now two recommendations: Flexbox and Grid Layout.

    This talk is about how this recommendations will help authors to make better structures in any device, with independent HTML code.
  speakers:
    - Diego Eis

- id: "matheus-costa-rubyconf-brazil-2015"
  title: "I don't care if it's Less, Stylus or Sass"
  date: "2015-09-19"
  start_time: "18:00"
  end_time: "18:45"
  language: "Portuguese"
  track: "Workshop Trail 3"
  video_provider: "not_recorded"
  video_id: "matheus-costa-rubyconf-brazil-2015"
  description: |-
    Preprocessors are here, but how to get the most out of them? In this talk you will learn how to improve all the features of these guys, regardless of your choice.
  speakers:
    - Matheus Costa
