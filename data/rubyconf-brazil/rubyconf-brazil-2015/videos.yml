    The secret was simple in its essence, but difficult in the application: Continuous Delivery. With the company's growth, the development cycle had become the major bottleneck to be won - deploys that did not climb, manual processes and personal relationships almost destroyed by excessive working hours. Today we held 10 daily deploys, have higher quality of the products delivered and clients and much more satisfied staff.

