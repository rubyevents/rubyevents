- id: "hugo-barauna-rubyconf-brazil-2015"
  title: "Test piramids: rethinking your testing strategy and tactics."
  date: "2015-09-18"
  start_time: "12:00"
  end_time: "12:45"
  language: "Portuguese"
  track: "Auditorium 1"
  slides_url: "https://speakerdeck.com/plataformatec/piramide-de-testes-escrevendo-testes-com-qualidade-at-rubyconf-2015"
  video_provider: "not_recorded"
  video_id: "hugo-barauna-rubyconf-brazil-2015"
  description: |-
    Rails brought to us the benefit of testing by default, but this was 10 years ago, and now the question is: what's the next step? The first step is to think on your testing strategy. What to test and in which layer. You will learn about the concept of "testing piramid", and how this affects your aproach to testing.

    We will see what makes a good test, that DRY in the testing world is not the same as in the "production code" world, we will also see examples of "test smells", like the "mystery guest".

    Lets break the myth that Cucumber is worthless, you will see that you don't need it in all your acceptance tests, learn when to use it, how to use it, and the concept of executable specification behind this approach.

    Summing it up, you will see various foundation examples, patterns and ideias to take the next step on improving your abilities to write and organize tests.

    This talk is based on my own experience in various projects and on the studies developed while writing my book about TDD/BDD in Ruby.
  speakers:
    - Hugo Baraúna

- id: "rafael-sales-rubyconf-brazil-2015"
  title: "Is your Web Application robust?"
  date: "2015-09-18"
  start_time: "12:00"
  end_time: "12:45"
  language: "Portuguese"
  track: "Auditorium 2"
  video_provider: "not_recorded"
  video_id: "rafael-sales-rubyconf-brazil-2015"
  description: |-
    When hearing ""I built a robust Web Application"" many people abstract what's behind ""robust"" and just imagine it's something that will survive earthquakes - I dare to say it's harder to survive a non-robust application since I never faced an earthquake. Do we just want to be vain when saying that we built something robust? Well, what I want is to be proud when saying that I built a Web Application that meets a minimum set of properties which can be summarized as robustness.

    So, are we verifying the right properties to guarantee that a Web Application is robust? It's common to demand that third-party services meet Distributed Systems properties, but we usually forget offering the same when designing our Web Applications, so how can we guarantee our users won't get disappointed?

    Let's establish which properties are fundamental to say that a production Web Application architecture is robust. We will also revisit idempotency, resilience and some topics of Distributed Systems contextualized in common architectures of Web Applications to help us identify blind spots that need to be addressed.

    I'm challenging you to be proud when saying that you built something robust!
  speakers:
    - Rafael Sales

