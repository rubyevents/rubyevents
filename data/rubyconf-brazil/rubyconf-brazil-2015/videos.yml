  date: "2015-09-19"
  start_time: "11:30"
  end_time: "12:15"
  language: "Portuguese"
  track: "Auditorium 2"
  video_provider: "not_recorded"
  video_id: "halan-pinheiro-rubyconf-brazil-2015"
  description: |-
    Everybody that writes software is used to write tests. Sometimes diverging in 'how'. Everytime we write tests we use some tool to 'measure' how deep it goes. The most common way is to measure how much of the written code is actually exercised during the tests. But, what exactly does 100% means in that case? How much does it cost to keep that metric? Is it worth it? Let's talk a bit about this and exchange experiences of how we use this metric.
  speakers:
    - Halan Pinheiro

