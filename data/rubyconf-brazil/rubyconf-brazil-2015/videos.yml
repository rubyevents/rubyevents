- id: "tiago-freire-bruno-bacarini-rubyconf-brazil-2015"
  title: "Why AMS Adapters, in Rails 5, are so important to a wonderful RESTful API"
  date: "2015-09-18"
  start_time: "14:15"
  end_time: "15:00"
  language: "Portuguese"
  track: "Auditorium 1"
  video_provider: "not_recorded"
  video_id: "tiago-freire-bruno-bacarini-rubyconf-brazil-2015"
  description: |-
    Web APIs have revolutionized all kinds of products and services, and still continue to do so.

    Nowadays the most relevant architecture is REST along with the JSON media type. Furthermore, lots of specifications to serialize those media types are appearing. JSON API has released its first version last May.

    We are going to talk about the importance of those Active Model Serializers (AMS) format adapters, now the default on Rails 5. In additional, we would like to show how AMS can help us implement hypermedia controls and how it can affect your RESTful API.

    Topics:

    - Hypermedia Controls in Restful web services

    Ref: http://martinfowler.com/articles/richardsonMaturityModel.html)

    - Json formats(Json-api, HAL)

    Ref: http://stateless.co/hal_specification.html - http://jsonapi.org/

    - Rails 5 and Rails-api

    Ref: https://github.com/rails/rails/pull/19832

    - Active Model Serializers(AMS) and Adapters

    Ref: https://github.com/rails-api/active_model_serializers
  speakers:
    - Tiago Freire
    - Bruno Bacarini

