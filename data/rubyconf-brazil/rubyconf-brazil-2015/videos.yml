- id: "bruno-ghisi-rubyconf-brazil-2015"
  title: "Scaling teams and saving marriages with continuous delivery"
  date: "2015-09-19"
  start_time: "10:15"
  end_time: "11:00"
  language: "Portuguese"
  track: "Workshop Trail 3"
  video_provider: "not_recorded"
  video_id: "bruno-ghisi-rubyconf-brazil-2015"
  description: |-
    In this talk we will show how practices related to continuous delivery helped up in a large restructuring and growth processes - which we scaled from a single team dealing with 300 clients to a scenario of 1,800 clients and 5 teams working in the same product.

    The secret was essentially simple, but difficult to comply: Continuous Delivery. With the growth of the company, the development cycle became the big bottleneck to surpass - deploys which couldn't scale, manual processes and almost destroyed personal relationships because of excessive hours of work. Today we can do 10 daily deploys, we have better quality in the work delivered and the clients and the teams are more satisfied.

    We will talk about topics such as the way we use version control, practices and tools adopted in the development and tests of the features, and even how we revert versions out from production. We will see processes and solutions that can inspire you to begin your own journey towards continuous delivery.
  speakers:
    - Bruno Ghisi

- id: "sebastian-sogamoso-rubyconf-brazil-2015"
  title: "Microservices, a bitter sweet symphony"
  date: "2015-09-19"
  start_time: "11:30"
  end_time: "12:15"
  language: "Portuguese"
  track: "Auditorium 1"
  video_provider: "not_recorded"
  video_id: "sebastian-sogamoso-rubyconf-brazil-2015"
  description: |-
    Like a espresso, code is better served in small portions. Unfortunately most of the time we build systems consisting of a monolithic application that gets bigger and scarier by the day. Fortunately there are a few ways to solve this problem.

    Everyone talks about how good microservices are. At a first glance an architecture of small independently deployable services seems ideal, but it's no free lunch, it comes with some drawbacks.

    In this talk we'll see how microservices help us think differently about writing code and solving problems, and why they are not always the right answer.
