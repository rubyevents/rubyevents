- id: "fernando-hamasaki-de-amorim-bruno-costa-rubyconf-brazil-2015"
  title: "Go for Rubyist"
  date: "2015-09-18"
  start_time: "10:00"
  end_time: "10:45"
  language: "Portuguese"
  track: "Workshop Trail 3"
  video_provider: "not_recorded"
  video_id: "fernando-hamasaki-de-amorim-bruno-costa-rubyconf-brazil-2015"
  description: |-
    Go is a performant programming language with simple syntax, strongly typed, compiles fast and efficiently, native support, with a high-level support for concurrency, among other features.

    Let's explore Go from Ruby programmers point of view, comparing the approaches of each language in common situations, such as dependency management, error handling and testing.

    We'll look at the interoperability between the two languages, showing where the concepts used in Go can be applied to Ruby code.

    We will examine Go's concurrency model based on CSP and when we can extend our Ruby on Rails projects with Go applications.

    In addition, we will show lots of Go and Ruby code.
  speakers:
    - Fernando Hamasaki de Amorim
    - Bruno Costa

- id: "renan-ranelli-rubyconf-brazil-2015"
  title: "Don't fear the GIL: What Ruby has in the box for concurrent programming"
  date: "2015-09-18"
  start_time: "11:15"
  end_time: "12:00"
  language: "Portuguese"
  track: "Auditorium 1"
  slides_url: "https://speakerdeck.com/rranelli/rubyconf-brazil-2015-dont-fear-the-gil-what-ruby-has-in-the-box-for-concurrent-programming"
  video_provider: "not_recorded"
  video_id: "renan-ranelli-rubyconf-brazil-2015"
  description: |-
    It's not uncommon to hear people saying that concurrent programming is hard, especially in Ruby. In the recent years we have seen the focus in concurrent programming rise more and more.

    The basic assumption that Ruby is bad for concurrency has made many programmers look at other languages like Erlang, Scala and Go without actually understanding what Ruby has in the box for concurrent programming.

    But do we really need to look outside of Ruby to find concurrency primitives that can make our work easier? From my experience, there is *a lot* of low hanging fruit out there that the average Ruby developer may miss.

    In this talk I will talk briefly about the fundamentals of concurrent programming and show you how Ruby fares in the realm. I will talk about different models of approaching concurrency like Threads, Actors and Fibers.

    In particular I will focus on how you can take advantage of simple abstractions built above threads showing examples of production code. I will also try to point out the main points and some of the many gotchas required to succeed in this task.

    I will also talk about how the same example could've been implemented using the actor model and contrast both alternatives highlighting their pros and cons.
  speakers:
    - Renan Ranelli

