- id: "ben-langfeld-rubyconf-brazil-2015"
  title: "Ruby, Javascript and Elixir joining forces for WebRTC"
  date: "2015-09-19"
  start_time: "15:15"
  end_time: "16:00"
  language: "Portuguese"
  track: "Auditorium 1"
  slides_url: "https://speakerdeck.com/benlangfeld/ruby-javascript-and-elixir-joining-forces-for-webrtc"
  video_provider: "not_recorded"
  video_id: "ben-langfeld-rubyconf-brazil-2015"
  description: |-
    This may be RubyConf, but most of us use more than just Ruby to build out our application stack and deliver a compelling product to our users. With WebRTC, this is even more so. We combine a web application, perhaps in Rails, with a rich communications UI (voice and video) in the browser using Javascript and some heavy-lifting on the backend using a range of technologies, including Elixir. In this presentation, we'll talk about why WebRTC is interesting, how it works, and how you too can leverage your polyglot skills to deliver an out-of-this world experience based on tools in and out-side the Ruby comfort-zone.
  speakers:
    - Ben Langfeld

- id: "fabiano-beselga-rubyconf-brazil-2015"
  title: "Clean Architecture on Rails: find out what Game of Thrones has to do with Uncle Bob"
  date: "2015-09-19"
  start_time: "15:15"
  end_time: "16:00"
  language: "Portuguese"
  track: "Auditorium 2"
  slides_url: "https://speakerdeck.com/bezelga/clean-architecture-on-rails-rubyconf-brasil-2015"
  video_provider: "not_recorded"
  video_id: "fabiano-beselga-rubyconf-brazil-2015"
  description: |-
    Rails is an awesome framework to build something fast from scratch, but when the app starts to grow it becomes harder to maintain if you keep following only the folders that Rails’s initial configuration provides.

    There are a lot of approaches to get around it, Uncle Bob’s [Clean Architecture](http://blog.8thlight.com/uncle-bob/2012/08/13/the-clean-architecture.html) separates the business  from implementation details like delivery mechanism and from the database.

    I will show ways to apply clean architecture to a big Rails project and what are the pros and cons of each approach.

    I will also show the lessons we’ve learned using Clean Architecture for more than 1 year at [Magnetis](magnetis.com.br)
  speakers:
    - Fabiano Beselga

