- id: "carlos-duarte-do-nascimento-rubyconf-brazil-2013"
  title: "Emulando Atari 2600 em Ruby"
  date: "2013-08-29"
  start_time: "13:15"
  end_time: "14:00"
  language: "Portuguese"
  track: "Sala 1"
  video_provider: "not_recorded"
  video_id: "carlos-duarte-do-nascimento-rubyconf-brazil-2013"
  description: |-
    Emuladores para consoles de videogame clássicos são tipicamente desenvolvidos em linguagens de baixo nível, como C/C++ ou Assembly, que resulta em ganhos de velocidade, mas algumas vezes isso torna o código difícil de ler, entender e manter. Esta palestra leva a audiência num tour pelo ruby2600, um emulador experimental de Atari 2600 que tenta aplicar as melhores práticas e ferramentas que são reconhecidas no ecossistema Ruby para desenvolvimento de emuladores.
