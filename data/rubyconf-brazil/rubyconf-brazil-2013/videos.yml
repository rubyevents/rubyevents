- id: "eduardo-shiota-yasuda-rubyconf-brazil-2013"
  title: "Arquitetura de Javascript Modular e Event-Driven"
  date: "2013-08-29"
  start_time: "10:15"
  end_time: "11:00"
  language: "Portuguese"
  video_provider: "not_recorded"
  video_id: "eduardo-shiota-yasuda-rubyconf-brazil-2013"
  description: |-
    Em aplicações de larga escala, certas interações que parecem simples aos olhos do usuário escondem a complexidade de múltiplas requisições assíncronas e updates no DOM toda vez que uma informação é modificada. Esta complexidade pode facilmente virar um inferno de callbacks, e nesta palestra mostrarei como através de uma estrutura event driven criada do zero é possível quebrar uma página em componentes modulares, desacoplados, e testáveis.
  speakers:
    - Eduardo Shiota Yasuda

- id: "danilo-sato-rubyconf-brazil-2013"
  title: "O que você NÃO aprendeu sobre Programação Orientada a Objetos"
  date: "2013-08-29"
  start_time: "11:00"
  end_time: "11:45"
  language: "Portuguese"
  track: "Sala 1"
  video_provider: "not_recorded"
  video_id: "danilo-sato-rubyconf-brazil-2013"
  description: |-
    Ruby é uma linguagem orientada a objetos, porém a maneira como aprendemos orientação a objetos geralmente foca no "O que?" e pouco no "Por quê?". Aprendemos o que é herança, polimorfismo, as diferenças entre classes e objetos, mas não discutimos questões mais relevantes como: o que caracteriza um bom design OO? Quais as vantagens e desvantagens de usar herança? Como OO me ajuda a resolver problemas do dia a dia? Nesta palestra vamos abordar estas e outras questões de design e modelagem OO através de exemplos. Pretendo desbancar alguns mitos - como modelar OO é modelar o mundo real - assim como compartilhar alguns princípios para ajudar você e seu time a melhorar a qualidade do código da sua aplicação Ruby.
  speakers:
    - Danilo Sato

