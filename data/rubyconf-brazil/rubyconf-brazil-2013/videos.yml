- id: "pablo-astigarraga-rubyconf-brazil-2013"
  title: "50 Shades of MVC"
  date: "2013-08-29"
  start_time: "13:15"
  end_time: "14:00"
  language: "Portuguese"
  track: "Sala 2"
  video_provider: "not_recorded"
  video_id: "pablo-astigarraga-rubyconf-brazil-2013"
  description: |-
    We at the Rails world are very proud of embracing the Model-View-Controller design pattern, it is integral to the way we build web applications and there is a general consensus that all of us generally know what we are talking about in regards to it, hell , most of our code files are under a model, controller or views directories! We've got to know what we are doing, right? Much like Object Orientation the Model-View-Controller pattern is one of the most popular-yet-heavily-altered concepts in modern computer science, what were the original propositions of the pattern? How was it applied back in the 70's, when it was proposed as a part of Smalltalk? How much have we changed it to adapt it to the web application scene? How can we apply this to our day to day work in 2013? is altering the original pattern necessarily a bad thing? On this talk I present different aspects of the MVC pattern and its changes from its inception to modern day use, what to keep in mind about the pattern as opposed to a single framework's implementation of it and how knowing this should make us all around better programmers.
  speakers:
    - Pablo Astigarraga

- id: "carlos-souza-rubyconf-brazil-2013"
  title: "Como pegar um Trem em movimento"
  date: "2013-08-29"
  start_time: "14:00"
  end_time: "14:45"
  language: "Portuguese"
  track: "Sala 1"
  video_provider: "not_recorded"
  video_id: "carlos-souza-rubyconf-brazil-2013"
  description: |-
    Começar novos projetos em Rails é sempre uma maravilha. Por outro lado, entrar em um projeto Rails às vezes pode ser doloroso. Entender o projeto e suas particularidades:- configuração de ambiente de desenvolvimento, integração com serviços de terceiros, estratégias de deployment e acesso à outras informações perdidas ao longo do tempo, são alguns tópicos que interferem na entrada de novos desenvolvedores e o release de novas features de maneira eficaz. Esta palestra vai abordar práticas, convenções e apresentará algumas ferramentas visando facilitar a integração de novos membros à projetos Rails existentes.
  speakers:
    - Carlos Souza

- id: "bruno-oliveira-rubyconf-brazil-2013"
  title: "Krypt - Criptografia não-tediosa em Ruby"
  date: "2013-08-29"
  start_time: "14:00"
  end_time: "14:45"
  language: "Portuguese"
  track: "Sala 2"
  video_provider: "not_recorded"
  video_id: "bruno-oliveira-rubyconf-brazil-2013"
  description: |-
    Pelos anos, Ruby se tornou muito mais do que uma linguagem de programação, mas também uma paltaforma para desenvolver aplicações robustas. Entretanto, a segurança precisa ser repensada e criptografia deve ser algo simples para humanos. Na maioria das vezes nós não nos importamos quais algoritmos são ideais para encriptar ou não, SHA-256 ou SHA-512, RSA ou ECC, AES-128 ou AES-256, padding schemes, número de iterações, tamanho de chaves ou se essas escolhas vão prevenir ataques baseados em tempo. Os desenvolvedores precisam ficar atentos em muitos problemas e somente uma linha errada de código pode introduzir uma nova vulnerabilidade de segurança. Hoje em dia o Ruby OpenSSL é a única opção se o desenvolvedor estiver disposto a fazer criptografia séria, mas ela tende a ser complicada se por qualquer razão um algoritmo específico deve ser suportado ou atingir portabilidade entre diferentes sistemas operacionais. Nesta sessão técnica você será apresentado ao Krypt, uma biblioteca que traduz a criptografia tediosa em algo claro para humanos, fornecendo um passo-a-passo sobre como Krypt é diferente de outras bibliotecas de criptografia e porque. Descubra mais sobre como ela ajuda a substituir extensões OpenSSL na biblioteca padrão do Ruby e os detalhes por trás dos panos sobre como ele simula funcionalidades de OpenSSL que não estavam disponíveis em JRuby antes.
  speakers:
    - Bruno Oliveira

- id: "lucas-mazza-rubyconf-brazil-2013"
  title: "Rails ama seu Front-end"
  date: "2013-08-29"
  start_time: "14:45"
  end_time: "15:30"
  language: "Portuguese"
  track: "Sala 1"
  video_provider: "not_recorded"
  video_id: "lucas-mazza-rubyconf-brazil-2013"
  description: |-
    O Rails fornece diversas ferramentas para o desenvolvimento de aplicações web e, talvez, a área mais bem atendida seja a criação de interfaces web, através do extenso suporte a views, helpers e assets. Mas mesmo com tudo que o Rails provê, muitas aplicações acabam com uma camada de apresentação macarrônica, bem diferente do que costumamos ver no lado "Back end", pelo descaso e falta de atenção, ou pelo receio de se trabalhar nesse código de uma forma mais próxima a que usamos no resto das nossas aplicações. Nesta palestra você irá conhecer mais sobre como organizar sua lógica de apresentação em Presenters e Decorators sem abolir o uso de helpers, alguns truques com partials e como tirar maior proveito do JavaScript não obtrusivo do Rails e do Asset Pipeline para construir o seu Front end sem medo de ser feliz.
  speakers:
    - Lucas Mazza

- id: "philip-calcado-rubyconf-brazil-2013"
  title: "Usando Rails numa Startup de Sucesso: As partes que ninguém te contou"
  date: "2013-08-29"
  start_time: "14:45"
  end_time: "15:30"
  language: "Portuguese"
  track: "Sala 2"
  video_provider: "not_recorded"
  video_id: "philip-calcado-rubyconf-brazil-2013"
  description: |-
    A SoundCloud é o maior repositório de áudio online, sendo utilizada por mais de 200 milhões de pessoas por mês. O produto nasceu como uma típica aplicação Rails, e nos últimos seis anos passou por aventuras e desventuras em escalando o sistema e o time de desenvolvimento nesta plataforma. Nesta apresentação, vamos conversar sobre os benefícios de usar Rails, os problemas e soluções encontrados e como a SoundCloud está evoluindo sua arquitetura para provêr um serviço escalável.
  speakers:
    - Philip Calçado

- id: "ben-langfeld-rubyconf-brazil-2013"
  title: "Adhearsion 3, o futuro da comunicação do Ruby"
  date: "2013-08-29"
  start_time: "16:00"
  end_time: "16:45"
  language: "Portuguese"
  track: "Sala 1"
  video_provider: "not_recorded"
  video_id: "ben-langfeld-rubyconf-brazil-2013"
  description: |-
    No começo do projeto para construir a segunda versão do Adhearsion, nós definimos nossa visão para o projeto: que o Adhearsion 1 era um framework para construir aplicativos de Asterisk, Adhersion 2 é um frameork para construir aplicativos de voz (sobre 3 plataformas), e que Adhearsion 3 seria um framework para construir aplicativos de comunicação em tempo real. A versão 2 é estável e em larga utilização, e agora começamos a pensar sobre como especificamente a versão 3 vai se parecer e que capacidades serão expostas para tornar mais fácil, mais legal e mais expressivo construir aplicações de comunicação em tempo real em Ruby. Nesta palestra vou compartilhar algumas dessas idéias, junto com casos de uso de exemplo e explicar porque acreditamos que esse trabalho é essencial para trazer o Ruby à liderança nessa arena. Também vou compartilhar lições aprendidas no processo de manter um projeto open source desse tipo, enfrentando sua terceira grande evolução bem no seu pico.
  speakers:
    - Ben Langfeld

- id: "carlos-galdino-rubyconf-brazil-2013"
  title: "Como Rubinius executa seu código?"
  date: "2013-08-29"
  start_time: "16:00"
  end_time: "16:45"
  language: "Portuguese"
  track: "Sala 2"
  video_provider: "not_recorded"
  video_id: "carlos-galdino-rubyconf-brazil-2013"
  description: |-
    Já quis saber como o Ruby executa seu código? O que exatamente deve acontecer para você ter aquele simples 'Hello World'? Esta palestra irá mostrar como o Rubinius é estruturado e como ele funciona por baixo do capô. Você vai aprender sobre seu processo de inicialização, a máquina virtual, o garbage collector, compilador e outros passos intermediários pelo caminho que são necessários para executar seu código.
  speakers:
    - Carlos Galdino

- id: "hongli-lai-rubyconf-brazil-2013"
  title: "Supercharging your deployments with Phusion Passenger 4"
  date: "2013-08-29"
  start_time: "16:45"
  end_time: "17:30"
  language: "English"
  video_provider: "not_recorded"
  video_id: "hongli-lai-rubyconf-brazil-2013"
  description: |-
    An app server is necessary for running Ruby web apps, but do you know why? Phusion Passenger is currently a popular app server choice, but how does it differ from the rest, and how does it work? In this talk you'll be introduced to Phusion Passenger, and you'll find a comparison with other app servers in terms of benefits, features, performance and technology. You will also learn how to tweak and optimize Phusion Passenger to enjoy its full benefits.
  speakers:
    - Hongli Lai

- id: "hal-fulton-rubyconf-brazil-2013"
  title: "External DSLs in Ruby"
  date: "2013-08-30"
  start_time: "09:00"
  end_time: "09:45"
  language: "English"
  video_provider: "not_recorded"
  video_id: "hal-fulton-rubyconf-brazil-2013"
  description: |-
    The concept of a DSL (Domain-Specific Language) is popular in modern computing, and especially in our community. Ruby's flexible syntax makes it easy to create "internal" DSLs, which are actually parsed and executed by the Ruby interpreter. But it's also fairly easy to create an external DSL and write your own interpreter for it. Here we look at a little of the theory behind grammars in general, and look at examples using libraries such as Treetop and Parslet. Finally, we will examine the beginnings of a few real-life examples of how external DSLs might be used in areas such as creating more readable extended regular expressions and scripting graphics with ImageMagick.
  speakers:
    - Hal Fulton

- id: "jose-valim-rubyconf-brazil-2013"
  title: "Elixir: uma aproximação pragmática e concorrente à programação"
  date: "2013-08-30"
  start_time: "10:15"
  end_time: "11:00"
  language: "Portuguese"
  video_provider: "not_recorded"
  video_id: "jose-valim-rubyconf-brazil-2013"
  description: |-
    As mudanças em hardware estão mais uma vez afetando a forma como escrevemos software. Memória barata e aumento no número de CPUs estão movendo o desenvolvimento de software de estado mutável, que requer locks e sincronização, para transformar estado, que pode acontecer concorrentemente. Elixir é uma forma pragmática para programação de software concorrente. Todo código Elixir é composto de pequenos processos, que falam uns com os outros via mensagens, todas rodando concorrentemente. Elixir mistura funcionalidades de meta-programação com outros mecanismos que programadores de orientação a objetos consideram essencial para escrever bom software, como polimorfismo. Nesta palestra você vai aprender sobre Elixir, seu ecossistema e sobre a VM Erlang, que foi feita do zero para construir software robusto, concorrente e distribuído.
  speakers:
    - José Valim

- id: "arthur-neves-rubyconf-brazil-2013"
  title: "Mongoid Internals"
  date: "2013-08-30"
  start_time: "11:00"
  end_time: "11:45"
  language: "Portuguese"
  track: "Sala 1"
  video_provider: "not_recorded"
  video_id: "arthur-neves-rubyconf-brazil-2013"
  description: |-
    Vou falar sobre funcionalidades internas *escondidas* do mongoid, coisas relacionadas a: * Moped/Origin gems * Relation vs Embedding * Atomic operations * IdentityMap, eager load * Safe writes/reads
  speakers:
    - Arthur Neves

- id: "tiago-bastos-eduardo-gurgel-rubyconf-brazil-2013"
  title: "Ruby & Elixir - Aplicações mobile de tempo real"
  date: "2013-08-30"
  start_time: "11:00"
  end_time: "11:45"
  language: "Portuguese"
  track: "Sala 2"
  video_provider: "not_recorded"
  video_id: "tiago-bastos-eduardo-gurgel-rubyconf-brazil-2013"
  description: |-
    Esta palestra vai explicar como desenvolver uma aplicação mobile de tempo real usando Ruby e tendo Elixir como uma solução escalável para melhorar a performance no backend quando necessário. Nossa palestra descreve o cenário com uma aplicação de fórum em tempo real que funciona parecido com um chat que está sempre conectado ao servidor. Para isso usamos Elixir como um servidor web que só tem algumas preocupações, um servidor websockets Elixir e um backend Ruby rodando a lógica de negócios. O backend e o servidor web são conectados usando BERT-RPC. Vamos mostrar como usar RubyMotion para construir uma aplicação móvel que se comunica com o backend. A mágica por trás é o BERT-RPC, um protocolo flexível de serialização binária e RPC. Essa aproximação dá poder ao desenvolvedor para construir primeiro e melhorar a performance depois.
  speakers:
    - Tiago Bastos
    - Eduardo Gurgel

- id: "luis-cipriani-rubyconf-brazil-2013"
  title: "Caching de APIs na prática, porque seu servidor merece um descanso"
  date: "2013-08-30"
  start_time: "13:15"
  end_time: "14:00"
  language: "Portuguese"
  track: "Sala 1"
  video_provider: "not_recorded"
  video_id: "luis-cipriani-rubyconf-brazil-2013"
  description: |-
    A melhor requisição HTTP feito para seu servidor, é aquela que não chega ao seu servidor. Você sabe o tempo de vida dos seus recursos? Como garantir que o usuário nunca acesse uma resposta expirada, sem precisar abrir a porteira das conexões com o origin server? Quais tipos de caches existem e quando devo usá-los cada um deles? Por que eu deveria perder o medo de ler RFCs? Essa palestra apresentará boas práticas de uso do cache HTTP em APIs e em aplicações web, fazendo com que seus produtos digitais otimizem o uso das máquinas e economize dinheiro.
  speakers:
    - Luis Cipriani

- id: "jaime-andres-davila-rubyconf-brazil-2013"
  title: "DCI: semiotics applied to software"
  date: "2013-08-30"
  start_time: "13:15"
  end_time: "14:00"
  language: "Portuguese"
  track: "Sala 2"
  video_provider: "not_recorded"
  video_id: "jaime-andres-davila-rubyconf-brazil-2013"
  description: |-
    Formally, semiotics is the study of signs: how do they relate?, how do they structure meaning?, what rules do they follow? All these questions are important to understand how humans communicate and how we interpret the world around us, so it's no wonder that semiotics are related to the process of building software. We, as developers, create software that communicates not only to the end user, but also to other systems and even to other developers. A clear separation of each part of the ""final message"" is important to keep the code maintainable and more important, to control the meaning of our app. DCI is an elegant way to keep that separation clear, we can manage the "rules" (context), the "symbols" (data) and the "meaning" (information) of the message. During this talk I'll explore some concepts of semiotics which are important for DCI and how DCI uses those concepts to communicate. Part of the talk includes an overview of an app I'm building using grape, which allowed me to build from scratch an architecture based on DCI an experiment ideas and concepts I'd like to share with you. I'll also present grapevine an opinionated structure for REST APIs built with DCI in mind
  speakers:
    - Jaime Andrés Dávila

- id: "laurent-sansonetti-rubyconf-brazil-2013"
  title: "Inside RubyMotion"
  date: "2013-08-30"
  start_time: "14:00"
  end_time: "14:45"
  language: "English"
  video_provider: "not_recorded"
  video_id: "laurent-sansonetti-rubyconf-brazil-2013"
  description: |-
    This talk will describe the internals of RubyMotion, a Ruby toolchain for iOS development. RubyMotion is different from CRuby in many ways and this session will focus on the technical differences and explain what makes RubyMotion unique. We will do a quick demo of RubyMotion but focus on technical details for most of the session
  speakers:
    - Laurent Sansonetti

- id: "nando-vieira-rubyconf-brazil-2013"
  title: "Usando Vagrant como ambiente de desenvolvimento Ruby"
  date: "2013-08-30"
  start_time: "14:45"
  end_time: "15:30"
  language: "Portuguese"
  video_provider: "not_recorded"
  video_id: "nando-vieira-rubyconf-brazil-2013"
  description: |-
    Uma das grandes dificuldades em qualquer plataforma de desenvolvimento é manter um ambiente conciso, principalmente quando o seu time possui muitos desenvolvedores. Junte isso à diferença entre o sistema operacional do desenvolvedor com arquiteturas diferentes, bibliotecas utilizadas com extensões nativas e a probabilidade de dar algo errado em produção aumenta muito! Veja como o Vagrant pode resolver todos esses problemas e ainda servir como uma plataforma de testes para scripts de configuração de servidores usando máquinas virtuais.
  speakers:
    - Nando Vieira

- id: "willian-molinari-rubyconf-brazil-2013"
  title: "Como usamos Ruby para construir o Cloud da Locaweb"
  date: "2013-08-30"
  start_time: "16:00"
  end_time: "16:45"
  language: "Portuguese"
  track: "Sala 1"
  video_provider: "not_recorded"
  video_id: "willian-molinari-rubyconf-brazil-2013"
  description: |-
    Essa palestra vai mostrar como usamos Ruby para criar mais do que apenas uma aplicação web e o que foi feito para construir um sistema inteiro de provisionamento que lida com a infraestrutura do Cloud Server Pro da Locaweb. Vamos falar sobre os desafios que tivemos: * Configurar o firewall * Configurar o dhcp * Configurar a rede * Criar e lidar com as máquinas virtuais no hypervisor * Controlar os status das máquinas virtuais. Parte da infraestrutura se tornaram projetos open source e vamos explicar quando decidimos criá-las e como as estamos usando hoje.
  speakers:
    - Willian Molinari

- id: "joao-moura-rubyconf-brazil-2013"
  title: "Rankings, você está fazendo errado!"
  date: "2013-08-30"
  start_time: "16:00"
  end_time: "16:45"
  language: "Portuguese"
  track: "Sala 2"
  video_provider: "not_recorded"
  video_id: "joao-moura-rubyconf-brazil-2013"
  description: |-
    Temos visto muitos rankings em nossas vidas, não somente em aplicações web mas também em diferentes dispositivos, na maioria das vezes como parte de gamificação. Mas isso está sendo mesmo efetivo? De fato, a maioria das implementações de ranking estão erradas, e podem até mesmo tornar sua aplicação menos atraente. Você pode nunca chegar ao topo e nunca encontrar um desafio real contra outro usuário, e essas são apenas os maiores problemas quando falamos de Rankings. Diferentes algoritmos são aplicados e desenvolvidos para tornar rankings atraentes, algumas delas por grandes empresas como Sony, Microsoft, Nintendo e outras. Muitas grandes implementações vieram dessas empresas, e nós podemos usá-las no nosso processo de desenvolvimento também. Isso dito, como devemos proceder? Como podemos usar Rankings de forma efetiva para nos ajudar a construir aplicativos melhores e mais engajantes? Simples, assista esta palestra!
  speakers:
    - João Moura

- id: "rodrigo-franco-rubyconf-brazil-2013"
  title: "Hackers, Anarquistas e Diletantes"
  date: "2013-08-30"
  start_time: "16:45"
  end_time: "17:30"
  language: "Portuguese"
  video_provider: "not_recorded"
  video_id: "rodrigo-franco-rubyconf-brazil-2013"
  description: |-
    Hackers, Diletantes e Anarquistas Nem tudo na vida vem com manual de instruções. Desde os primórdios, pessoas brilhantes tem marcado a história tomando decisões inusitadas. Nessa cativante palestra, Rodrigo vai guiá-lo por uma multidão de pensadores, programadores, anarquistas e hackers bebums que se permitiram fazer algo fora do convencional, e com isso, revolucionaram a vida dos outros.
  speakers:
    - Rodrigo Franco
