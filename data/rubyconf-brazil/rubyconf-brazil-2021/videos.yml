- id: "joacir-oliveira-santos-junior-rubyconf-brazil-2021"
  title: "Os Benefícios e Desafios da Programação em Par"
  date: "2021-07-29"
  start_time: "19:05"
  end_time: "19:50"
  language: "Portuguese"
  video_provider: "not_published"
  video_id: "joacir-oliveira-santos-junior-rubyconf-brazil-2021"
  description: |-
    A Programação em Par consiste em fundir os pensamentos de duas pessoas para atingir um único objetivo e, apesar de parecer estranho para algumas delas, pode ser bem produtivo e prazeroso.
    Programar em dupla evidencia a importância da relação humana e da cooperação, portanto o desenvolvimento interpessoal é chave essencial para uma ótima programação em par. Como resultado, podemos construir códigos melhores, aumentar a empatia, acelerar a revisão de código, disseminar conhecimento e porque não dar boas risadas. No fim, melhorar a entrega do trabalho e a relação dos membros pode ser alcançada com sucesso.
  speakers:
    - Joacir Oliveira Santos Júnior

