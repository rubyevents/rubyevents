- id: "renan-ranelli-rubyconf-brazil-2021"
  title: "Rubismo para além-ruby"
  date: "2021-07-29"
  start_time: "20:35"
  end_time: "21:15"
  language: "Portuguese"
  video_provider: "not_published"
  video_id: "renan-ranelli-rubyconf-brazil-2021"
  description: |-
    Ruby está morrendo". Todo rubista já se deparou com essa afirmação. Entra ano e sai ano, estamos sempre à beira da extinção rubista, que parece sempre eminente mas jamais se concretiza. 
      Nessa palestra vamos explorar essa questão para entender, afinal, por que diabos esse futuro *nunca chega*? Vamos falar sobre a historia do Ruby, seus principais marcos e também seus impactos e influências para além de suas fronteiras. Não é exagero dizer que Ruby mudou radicalmente a história da nossa indústria, e, nessa apresentação, pretendo mostrar um pouco como esse processo se deu.
      Em paralelo ao big-picture, também vou falar como ruby mudou radicalmente a minha vida e a de pessoas próximas.
  speakers:
    - Renan Ranelli

