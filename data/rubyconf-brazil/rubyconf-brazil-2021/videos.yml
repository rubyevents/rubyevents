- id: "mauricio-eduardo-chicupo-szabo-rubyconf-brazil-2021"
  title: "Are we abstracting too much?"
  date: "2021-07-30"
  start_time: "16:05"
  end_time: "16:50"
  language: "English"
  video_provider: "not_published"
  video_id: "mauricio-eduardo-chicupo-szabo-rubyconf-brazil-2021"
  description: |-
    When I first learnt Ruby, I was amazed at the power of DSLs and the Rails framework.
    Then, after working outside Ruby and back, I felt the paradigm change. DSLs that do not compose. Frameworks that make things difficult when you need new technologies. "Convention over configuration" that needs configuration to make the convention work. Are we abstracting too much? What benefits can we harvest when we drop some, if not all, abstractions.

    In this talk, I want to show a different way to handle code - how can we escape the problems we have when things fall outside the framework's "conventions".
  speakers:
    - Maurício Eduardo Chicupo Szabo

- id: "fabricio-buzeto-rubyconf-brazil-2021"
  title: "Gall’s law applied to distributed systems"
  date: "2021-07-30"
  start_time: "16:50"
  end_time: "17:35"
  language: "English"
  video_provider: "not_published"
  video_id: "fabricio-buzeto-rubyconf-brazil-2021"
  description: |-
    Gall’s Law states that any complex system that works, evolved from a simple system that also worked. I'll show you practical examples of how to start small and let complexity grow as needed. Sharing how we identified the hints for improvement, and the techniques and tools that supported it.
  speakers:
    - Fabricio Buzeto

- id: "maciej-rzasa-rubyconf-brazil-2021"
  title: "API Optimization Tale: Monitor, Fix and Deploy (on Friday)"
  date: "2021-07-30"
  start_time: "17:35"
  end_time: "18:20"
  language: "English"
  video_provider: "not_published"
  video_id: "maciej-rzasa-rubyconf-brazil-2021"
  description: |-
    I saw a green build on a Friday afternoon. I knew I need to push it to production before the weekend. My gut told me it was a trap. I had already stayed late to revert a broken deploy. I knew the risk. 
    In the middle of a service extraction project, we decided to migrate from REST to GraphQL and optimize API usage. My deploy was a part of this radical change. Why was I deploying so late? How did we measure the migration effects? And why was I testing on production? I'll tell you a tale of small steps, monitoring, and old tricks in a new setting. Hope, despair, and broken production included.
  speakers:
    - Maciej Rząsa

