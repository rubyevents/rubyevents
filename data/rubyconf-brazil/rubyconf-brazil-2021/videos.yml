- id: "gabriel-ferreira-rubyconf-brazil-2021"
  title: "Uma talk eventualmente consistente"
  date: "2021-07-29"
  start_time: "16:05"
  end_time: "16:50"
  language: "Portuguese"
  video_provider: "not_published"
  video_id: "gabriel-ferreira-rubyconf-brazil-2021"
  description: |-
    "Eventualmente consistente" é a expressão que usamos para informações que não são atualizadas em tempo real mas que, eventualmente, se tornam consistentes. Essa estratégia de delaying pode ser vital para um sistema, como foi no nosso caso, em que reduzimos o tempo para recalcular relatórios de envio por hora de 4 horas em média para apenas 5 minutos. Esta talk traz um compilado de aprendizados sobre o uso consciente dos recursos disponíveis, tomando por base um ambiente altamente concorrente com processamento diário de mais de 10M de eventos.
  speakers:
    - Gabriel Ferreira

- id: "joao-paulo-lethier-rubyconf-brazil-2021"
  title: "Entendendo o funcionamento do cache no Rails"
  date: "2021-07-29"
  start_time: "16:50"
  end_time: "17:35"
  language: "Portuguese"
  video_provider: "not_published"
  video_id: "joao-paulo-lethier-rubyconf-brazil-2021"
  description: |-
    O Rails possui métodos e helpers que nos ajudam muito quando precisamos usar cache para otimização e melhoria de performance. Mas o que acontece na mágica do rails que torna esse uso tão fácil? Entender exatamente como as chaves do cache são geradas, assim como entender como invalidar as chaves da melhor forma, nos permitem fazer o melhor uso dessa ferramenta e também evitar erros e problemas.
  speakers:
    - João Paulo Lethier

- id: "kevin-santos-rubyconf-brazil-2021"
  title: "Minha aplicação cresceu e agora?"
  date: "2021-07-29"
  start_time: "17:35"
  end_time: "18:20"
  language: "Portuguese"
  video_provider: "not_published"
  video_id: "kevin-santos-rubyconf-brazil-2021"
  description: |-
    Vou abordar num contexto geral como enfrentar desafios de escalabilidade em aplicações Rails e trazer também muitas outras dicas para desenvolver uma aplicação robusta e ainda por cima gastando pouco. 

    Vou mostrar na prática temas como gerenciamento de métricas, ferramentas e serviços terceiros usando como exemplo uma plataforma SaaS de ecommerce.

    Vamos abordar pontos como:
    Utilização de APM na aplicação
    Otimização do Banco de dados
    Otimizações de Memória
    Distribuição de Workers e Threads
    Tracking de Bugs e Logging
  speakers:
    - Kevin Santos

