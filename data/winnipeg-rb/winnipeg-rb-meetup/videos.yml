  talks:
    - id: "adam-krieger-winnipeg-rb-meetup-october-2024"
      title: "Integrating Threat Modelling in Web Application Teams"
      event_name: "Winnipeg.rb Meetup October 2024"
      date: "2024-10-30"
      video_provider: "not_recorded"
      video_id: "adam-krieger-winnipeg-rb-meetup-october-2024"
      description: |-
        Attackers don't play by the rules. Attackers will do whatever they can to disrupt, steal, or manipulate applications and their data. The STRIDE framework is a key tool in analyzing our applications, understanding the threats these attackers pose, and building countermeasures commensurate with risk. Combine that with an operationalized Secure SDLC approach and your organization can implement the security controls needed to keep your data safe. The path to Secure Design is there, but you need to take the steps. Join me in this talk to spread awareness about effectively integrating threat modelling into your application design process.
      speakers:
        - Adam Krieger

    - id: "gannon-mcgibbon-winnipeg-rb-meetup-october-2024"
      title: "How to Keep Rails App Development Fast"
      event_name: "Winnipeg.rb Meetup October 2024"
      date: "2024-10-30"
      video_provider: "not_recorded"
      video_id: "gannon-mcgibbon-winnipeg-rb-meetup-october-2024"
      description: |-
        Is your web application slow to boot? How long does it take to run a single test? In this talk, you'll learn how to keep Rails application development fast, how to profile an application, and ways to catch speed regressions.
      speakers:
        - Gannon McGibbon

