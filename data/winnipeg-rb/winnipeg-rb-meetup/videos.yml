  talks:
    - id: "alexander-trauzzi-winnipeg-rb-meetup-january-2025"
      title: "ORMs are Fine"
      event_name: "Winnipeg.rb Meetup January 2025"
      date: "2025-01-29"
      video_provider: "not_recorded"
      video_id: "alexander-trauzzi-winnipeg-rb-meetup-january-2025"
      description: |-
        Plenty of misinformation has taken hold over the years around ORMs. It varies by ecosystem, but is found everywhere and has sometimes even earned ORMs a negative reputation.

        We'll spend a bit of time together understanding ORMs, what they are, the ways in which they can help, as well as the ways they are misunderstood. We'll also look briefly at the mix of validity and relevance when it comes to performance claims.

        This talk is aimed at people doing the design and development of software, although others connected to the building and releasing can benefit too!
      speakers:
        - Alexander Trauzzi

    - id: "gannon-mcgibbon-winnipeg-rb-meetup-january-2025"
      title: "Making a Game with DragonRuby"
      event_name: "Winnipeg.rb Meetup January 2025"
      date: "2025-01-29"
      video_provider: "not_recorded"
      video_id: "gannon-mcgibbon-winnipeg-rb-meetup-january-2025"
      description: |-
        Most programmers know you can build games with Unity or Unreal, but did you know you can use Ruby too? In this talk, you'll learn about DragonRuby, a cross-platform Ruby runtime. We'll focus on building a simple game from scratch using the DragonRuby game toolkit.
      speakers:
        - Gannon McGibbon

