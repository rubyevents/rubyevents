description: |-
  Wir führen "Lightning Talks" durch: Kurze, spontane Vorträge (5 bis maximal 20 Minuten) über ein Projekt, ein gem, eine Technologie, eine Erfahrung. Alle Teilnehmenden sind frei, etwas vorzustellen.

  Wenn uns die Themen ausgehen oder 90 Minuten um sind, gehen wir in eine naheliegende Bar und diskutieren noch etwas weiter.

  Erster Talk (Fabian Mettler, Simplificator):

  Phoenix Framework: A highly connected web framework

  Phoenix is a framework for building scalable web applications with realtime connectivity across all your devices. It relies on the Elixir language for making the development of maintainable applications productive and fun.

  Second talk: (Georgi Mitev, Sharoo):

  Building APIs with Grape

  Georgi will present Sharoo's apis consumed by mobile devices and js, general structure of the grape apis, authentication, input validation, what they've built and why.

  Wenn Du weitere Talks ansagen kannst bitte melde dich.
