  We'll meet at Puzzle for a dense Rails evening. The following presentations will happen, some shorter, some longer.

  * **Marco Roth** – Developer Tooling for the Modern Rails & Hotwire Era
  * **Alessandro Rodi** ([Renuo](https://www.renuo.ch/)) – Pragmatic Rails – rails_api_logger
  * **Matthias Vieweger** ([Puzzle](https://www.puzzle.ch/)) – nochmal, the gem
  Preserving user-data becomes challenging when the infrastructure evolves differently than you anticipated. How to migrate over 100GiB of user-uploads across 40 applications without downtime or data-loss.
  * **Alessandro Rodi** ([Renuo](https://www.renuo.ch/)) – Pragmatic Rails again – validation_errors
  * **Riccardo Carlesso** (Google Cloud) – News Crawler via Langchain.RB and Gemini APIs
