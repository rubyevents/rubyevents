description: |-
  Do you need a cool summer breeze because everything gets too hot?

  We'd like to get together at Renuo for a set of fresh and handmade presentations once more:

  Hot module reloading (Alessandro Rodi):
  Alessandro is a software engineer and leads our education program. He fell in love with Webpacker and tells you how to ride the JS wave without being afraid of derailment.

  CSP - Water wings for our users (Martin Cavoj):
  Martin is a software engineer at Renuo. He will tell you, how we started using Content Security Policy in our Rails apps and how we reacted to an incoming hurricane.

  Rails 6 Preview (Simon Huber)
  Simon is a software engineer at Renuo. He will explain you some of the fresh features of Rails, for example about how to sail with multiple ships at the same time.

  Percy.io (Lukas Bischof)
  Lukas is an intern at Renuo. He explains you how we improved our code review process with screenshots. Visual cortex on deck!

  As always, drinks and snacks are on us :-)
