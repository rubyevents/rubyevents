description: |-
  Sebastian Burkhard macht eine Präsentation zu:
  Making complex computations fast enough for a Rails request.

  A typical Rails request is not very CPU-heavy. But what if you have a
  long-running complex computation in your application? What if you
  can't switch to another language then Ruby. I'll present lessons
  learned from work I did in 2010. I'll present various uses of micro
  and macro optimizations and other little hacks.

  Danach wie üblich Community-Austausch für neue und bekannte Gesichter im Restaurant Steinfels.
