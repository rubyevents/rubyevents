description: |-
  Welcome to the year 2018!

  We'd like to get together at Renuo for a set of interesting presentations once more:

  Goodbye Sprockets (Alessandro Rodi):
  Alessandro is a software engineer and leads our education program. He will tell you why Sprockets are from the past and how we can move on with Webpacker.

  Testing with Cucumber (Richard Bützer):
  Richard is a software engineer at Renuo. He will tell you, why we have added yet another layer to our testing infrastructure.

  Systematically speeding up your tests (Stéphane Bisinger):
  Stéphane is a software engineer and is responsible for our smooth operations. He will show you how to look at your tests to easily spot speed improvement potential.

  Simple & flexible Rails-API's with GraphQL (Denis Müller):
  Denis is one of our three IMS interns. He will tell you something about GraphQL and how it can make your life easier.

  As always, drinks and snacks are on us :-)
