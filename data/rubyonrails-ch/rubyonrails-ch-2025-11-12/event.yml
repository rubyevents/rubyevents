description: |-
  Hey everyone, this year's last Railshöck is hosted at Swisscom's. Three speakers committed to share their perspective on stage:

  * Rage Against the Malicious by Alexis Bernard is
  about how to protect Rails applications against bots and brute force attacks without annoying humans, and why he thinks captchas are not the best solution.

  * Smart Queries for Dumb Models by Clemens Helm
  about how complex data filtering in Rails often leads us down a rabbit hole of custom scopes, service objects, and Arel acrobatics. But what if we let the database do what it’s best at? In this talk, you’ll see how SQL views paired with plain ActiveRecord and Ransack can turn messy logic into elegant, powerful queries — without giving up the Rails way.

  * Level Up Your Engineering Career with Mentorship, Pairing, and AI by Hana Harencarova
  Feeling stuck in your technical growth? Don't learn alone. Discover how to tap into mentorship, pair programming, and AI to accelerate your skills. Whether you're early in career or going for senior roles, this session will equip you with strategies to get there faster and have fun in the process.

  As always, snacks and drinks are sponsored by the host. So thanks to Swisscom!
