  Martin Naumann zeigt in seiner Präsentation wie man mit RSpec, Cabybara und RSpec_API_Documentation schnell und relativ unkompliziert seine Webanwendungen end-to-end testet und dadurch die Qualität prüfen kann. Darüberhinaus wirft der Vortrag einen Blick auf einige best practices und Tools wie Spork, Autotest, Nailgun und Guard, um die Testläufe zu beschleunigen und den Entwicklungsprozess zu vereinfachen.
