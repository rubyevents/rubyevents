description: |-
  DeinDeal has a team of +20 engineers in 5 different teams that build a platform and services based on Ruby on Rails, Padrino and Sinatra on the backend, and Javascript, iOS and Android on the frontend.

  Given the amount of people and the complexity of the platform, it was essential for our process to have a flexible and solid staging system that would allow us to test and verify multiple features and fixes at the same time.

  During our talk we will introduce you briefly to Docker and its characteristics and will focus on how we use it to power our process and the lessons that we have learned so far.

  During the talk we will have a guest appearance of the master mind behind our setup, Georg Kunz.

  After the talk we will have discussions and drinks at the office.

  See you!
