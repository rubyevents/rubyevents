description: |-
  Hello Rubyists

  The Rails Foundation celebrated the 20 years anniversary of Rails last year using the inception date of the framework. As if you could just "incept" such a phenomenon – this is marketing BS. The relevant thing about Rails is that version 0.5 was published under the MIT license on July 24th 2004 (CET). Exactly 20 years ago. Let's celebrate this!

  I reserved the Tonbandlounge in the 25hours hotel from which we'll have a [good view over many rails](https://www.youtube.com/watch?v=LHQ77RPhx3c&list=PL_pizUPkggDjcl75JQ6XVZEjM4bK_FUqD&index=4).

  18:00 Apéro (sponsored by [Renuo](https://www.renuo.ch/))
  18:30 Presentation by me about Rails 0.5
  19:00 Open end

  Cheers, Josua

  PS: Other presentations about the Rails history are welcome. Please write me directly.
