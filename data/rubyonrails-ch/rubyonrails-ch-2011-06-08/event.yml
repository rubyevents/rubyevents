description: |-
  Hack-Night!

  Die Idee dahinter ist, dass wir zusammen an interessanten Projekten/Gems/Ideen arbeiten und uns dazu austauschen. Momentan möchten wir die Hack-Night sehr offen halten und schauen was sich am Abend entwickelt. Damit ihr euch trotzdem vorstellen könnt was wir machen, einige Ideen:

  Bugs fixen für ein open source Projekt Neues Fun-Projekt starten Neue GEMs testen und kurz vorstellen Pair programming an eigenem Projekt Wir starten um 18.30 mit einer kurzen Intro und der Vorstellung von Themen an welchen gearbeitet werden kann. Danach bilden wir kleine Gruppen und arbeiten bis ca. 22.00 Uhr am ausgewählten Thema. Am Ende kann jede Gruppe kurz ihre Resultate/Erfahrungen und Learnings präsentieren.

  Wir hoffen auf zahlreiches erscheinen. Anmeldung im Wiki oder unter Meetup zwingend.
