description: |-
  Dear all

  We are looking forward to hearing a talk about Multitenancy with Rails.

  Multitenancy is a way to architect software such that a single
  application transparently serves multiple customers. Dimiter Petrov is going to present a case study of a project where multiple applications were consolidated into one and discuss:
  * the advantages and disadvantages of multitenancy
  * per-client data separation at the database level and file
  * system level
  * the configuration of mailers, background jobs, cache, etc.
  * custom design and copy
  * custom features

  We hope to see you there! As usual there will be drinks and food as well.
