description: |-
  We will have "Lighning Talks", short talks under 30 minutes held by member of the community.

  Please note that this will be the last Railshöck held at Colab Zürich at Zentralstrasse 37. We will be on the first floor. Since Colab is already moved infrastructure will be very limited: I will bring a beamer, but most furniture is already moved. Also internet may be broken, please bring offline versions of your slides.

  After the official part, there will be a last aperitif to join at Colab ground floor. Their target is to "clean up" all drinks that are there.

  Currently the following talks are announced:

  Nico Schottelius (http://www.meetup.com/rubyonrails-ch/members/96920492/) / rails-hosting.ch

  It's a common saying, when one door closes, two newdoors open. When the doors of our beloved Colab Zurichare closing, the door to Ruby on Rails Hosting in Switzerland is opening:
  After two years of development and testing on tendifferent software stacks, we at ungleich are proudto open up the Beta to our Ruby On Rails Hosting.
  Nico Schottelius, president of ungleich GmbH, will talkabout the chosen and dropped technologies and show howeasy Ruby on Rails Hosting can be - for Sysadmins, Developersand DevOps.

  Slawosz Slawinski (http://www.meetup.com/rubyonrails-ch/members/31259872/) / Go

  Short presentation about Go, especially about parts that you may like to use with Ruby (Rails), including http://www.goworker.org/ project.

  I'm looking forward to see you a last time at Colab!
