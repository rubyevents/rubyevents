description: |-
  We prepared four short presentations for you about intimate tech details of Renuo. We focus on detours and shortcuts this time.

  100 ways to search (Simon & Simon)
  The two Simons give us a rough overview about different ways how to implement a search in your rails project.

  How to NOT search (Alessandro Rodi)
  We optimized the performance of a search without relying on a search engine, saving costs and focusing on the business-side rather than the technical-side of the Web Application.

  How NOT to find (Josua Schmid)
  We built a usable search – we thought… Then suddenly there were five times more data to search through. This lead to a usability nightmare which made us reconsider.

  Decorators & Co. (Gregor Wassmann)
  Rails concerns? No, not this time. Gregor leads the IT at Hoelzle in Bubikon and has stories to tell about how he's modernizing the software of a parts trading company.

  As always, drinks and snacks are on us :-)
