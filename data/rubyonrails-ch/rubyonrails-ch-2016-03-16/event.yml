description: |-
  Your Rails app starts out nice and tidy, and then sprint after sprint it slowly becomes a patchwork of code you
  know you could have written nicer. But after all it's not that bad, you have quite a few tests and it works, right?

  In early 2015 we had the chance to start a green field project which we knew would become big over time. We made a few
  decisions early in the project to avoid re-doing mistakes from the past. A year later we
  want to show you what we learned and we want to have a discussion on your projects and experiences!

  Jeremy Seitz from local.ch will also give a talk, his topic will be "Orchestrating APIs".

  We will offer a few snacks and drinks and we're looking forward to seeing you!
