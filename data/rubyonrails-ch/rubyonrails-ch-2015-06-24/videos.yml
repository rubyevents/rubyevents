  video_id: "renuo-upload-rubyonrails-ch-2015-06-24"
  description: |-
    A modern, open source, scalable upload solution. Once the (Heroku) services are set up, any data can be uploaded directly to Amazon S3 with JavaScript. This decouples the (expensive) app server from file uploads (including bandwidth), upload backups, S3 bucket config, CDN setup, etc. An additional service resizes images through Amazon CloudFront and Thumbor, without server changes.
