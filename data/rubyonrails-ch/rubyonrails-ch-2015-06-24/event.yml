description: |-
  Wir führen "Lightning Talks" durch: Kurze, spontane Vorträge (5 bis maximal 30 Minuten). Alle Teilnehmenden sind frei, etwas vorzustellen.

  Wenn uns die Themen ausgehen oder 90 Minuten um sind, gehen wir in eine naheliegende Bar und diskutieren noch etwas weiter.

  Erster Talk (Lukas Elmer, Renuo GmbH):

  AngularJS & TypeScript: Stopping Frontend Development in Rails?

  Ein kurzes Intro in AngularJS und TypeScript. Wir zeigen die Vor- und Nachteile auf gegenüber einer klassischen Rails App mit erb/slim/haml Frontend mit Coffeescript auf, und zeigen wie sich die Design Entscheidung auf die App aus Benutzersicht auswirken kann. Weiter vergleichen wir TypeScript mit Coffeescript und die jeweiligen Communities und zeigen, weshalb TypeScript die Zukunft sein könnte.

  Zweiter Talk (Lukas Elmer, Renuo GmbH):

  Renuo Upload

  Eine moderne, open source, skalierbare Upload Lösung, die einfach eingesetzt werden kann. Sind die (Heroku) Services einmal aufgesetzt, können mithilfe von Javascript beliebige Daten direkt nach Amazon S3 hochgeladen werden. Das entkoppelt den (teuren) App Server von dem Datei Upload (inkl. Bandbreite), Upload Backups, S3 Bucket Config, CDN Einrichtung, etc.

  Zusätzlich gibt es einen Service, der über Amazon Cloudfront und Thumbor Bilder in die richtige Dimension bringt, und das ohne Server Anpassungen.

  Einen Teil von Renuo Upload ist bereits open source, der Rest folgt noch (vor dem Rails Höck selbsverständlich).
