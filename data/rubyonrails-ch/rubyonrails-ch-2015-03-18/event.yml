description: |-
  Die erste Hacknight in Bern mit Yves Senn, Rails Core Team Mitglied.

  Diese Hacknight dreht sich ausschliesslich um Rails Contributions und Yves gibt eine Einführung in die Prozesse und Abläufe im Rails Projekt. Danach arbeiten wir bis 22.00 Uhr in kleinen Gruppen an Rails Issues und bei Problemen oder Fragen steht uns Yves mit Rat und Tat zur Seite. Zum Abschluss besprechen wir die Resultate und Erfahrungen nochmals zusammen.

  Eine einmalige Chance um zu erfahren wie man selber Code zum Rails Projekt beiträgt und hilft, offene Issues zu lösen.

  Als Vorbereitung bitte Contributing to Ruby on Rails (http://guides.rubyonrails.org/contributing_to_ruby_on_rails.html) lesen und auf dem eigenen Notebook die Entwicklungs-Umgebung, wie im Punkt 4.1 (http://guides.rubyonrails.org/contributing_to_ruby_on_rails.html#contributing-to-the-rails-code) beschrieben, aufsetzen.
