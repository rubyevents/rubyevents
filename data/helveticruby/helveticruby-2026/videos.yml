- id: "iliana-hadzhiatanasova-helveticruby-2026"
  title: "From Rails 3.0 to Rails Edge - 15 years of Rails upgrades in a 3 million line monolith"
  date: "2026-11-19"
  language: "English"
  video_provider: "scheduled"
  video_id: "iliana-hadzhiatanasova-helveticruby-2026"
  description: |-
    Fin has been running on Rails since 2011. Starting from Rails 3.0, today our 3 million line monolith is running on the main branch of Rails. This talk covers our Rails upgrade journey over the last 15 years - the things that broke, the monkey patches keeping it all together, and what it takes to get 300 engineers comfortable shipping on unreleased Rails versions.
