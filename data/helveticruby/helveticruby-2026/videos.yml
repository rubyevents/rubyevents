- id: "benoit-daloze-helveticruby-2026"
  title: "Running Native Extensions and Ruby Code in Parallel Threads"
  date: "2026-11-19"
  language: "English"
  video_provider: "scheduled"
  video_id: "benoit-daloze-helveticruby-2026"
  description: |-
    Ever heard of the one-lock-to-rule-them-all preventing parallel execution of Threads for both Ruby code and native extensions? Let’s remove that!

    In this talk we show how we are running native extensions in threads running in parallel, what conditions are needed for that and how to make your own native extension compatible with parallel execution.

    We also look at what it takes to run Ruby code in parallel, including making Hash parallel, thread-safe and fast.

    This is using Threads and not Ractors, so it’s compatible with most gems without changing the programming model.
  speakers:
    - Benoit Daloze

- id: "esti-alvarez-otero-helveticruby-2026"
  title: "The database diet that slimmed down our codebase too."
  date: "2026-11-19"
  language: "English"
  video_provider: "scheduled"
  video_id: "esti-alvarez-otero-helveticruby-2026"
  description: |-
    Sysadmin: We need to reduce the size of our database.

    Me: Ok, we’ve done that before. I’ll just delete a few million records from the database as we did last year.

    Spoiler: I didn’t delete a single row. This is the story of how we cut our indexes by more than 60% through proper database design and maintenance instead. Chasing down why those indexes existed took us straight into the Ruby code, uncovering some dead code. Expect PostgreSQL techniques you can apply on Monday morning.
  speakers:
    - Esti Álvarez Otero

- id: "daniel-colson-helveticruby-2026"
  title: "Regex as Easy as /(abc)?/"
  date: "2026-11-19"
  language: "English"
  video_provider: "scheduled"
  video_id: "daniel-colson-helveticruby-2026"
  description: |-
    What really happens when Ruby sees a regular expression like /abc/? While many of us use regular expressions regularly, we don’t necessarily think much about how they really work. In this talk we’ll trace a regular expression through Ruby’s internals, from parsing the pattern into a syntax tree, to compiling into bytecode, to executing that bytecode on a small virtual machine. You’ll come away with a deeper understanding and appreciation for Ruby’s regular expression engine, and hopefully an increased confidence in working with regular expressions in Ruby.
  speakers:
    - Daniel Colson

