- id: "jade-dickinson-helveticruby-2026"
  title: "Building a multi-user reservation system across Hotwire and a Rails API"
  date: "2026-11-19"
  language: "English"
  video_provider: "scheduled"
  video_id: "jade-dickinson-helveticruby-2026"
  description: |-
    Building multi-user reservations for appointments, tickets or other limited resources is such a classic problem that it comes up in system design books as “Build a ticket reservation system”. What do you need to know to build it for real? I will share my experience: from building a simple MVP, planning how to scale it, and designing for reliability and recoverability in a distributed system.
