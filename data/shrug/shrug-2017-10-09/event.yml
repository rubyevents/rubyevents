description: |-
  ### Lightning talks - Autumn edition

  Hello, #shruggers. We're hoping for a session of a couple of 10-15 minutes talks (included in that a short Q&A time), about things of interest to you (within reason, of course) - best to aim for something related to Ruby, Rails or web/tech/programming or in the same ballpark. Now, don't get us wrong, if your talk is slightly further away from this, but interesting, we want to know about it too.

  There is no requirement to give a talk, but if you are interested in speaking, we can offer a safe environment.

  #### About our speakers

  {::comment} Both [James](https://twitter.com/jamgregory) & [Eve](https://twitter.com/b_seven_e) bravely/foolishly signed up to do a talk, but we have a couple of slots left so get in touch (possibly even gauge some interest on your idea on our [#sheffieldruby Slack channel](https://sheffielddigital.slack.com/messages/sheffieldruby)) if you want to present. {:/comment}

  Thank you very much to [Pauline](https://twitter.com/paulienuh), [Harriet](https://twitter.com/lupatria), [James](https://twitter.com/jamgregory) and [Eve](https://twitter.com/b_seven_e) for giving fascinating lightning talks this evening.

  You can view the slides to their talks below:

  * ["Building Communities" by Pauline Narvas](https://www.slideshare.net/PaulinePNarvas/building-communities-80620801/1)
  * ["Getting to know your users" by Harriet Holman](https://shrug.org/files/shrug-95/getting-to-know-your-users.pdf)
  * ["5 things I've learnt while starting out with GCP" by James Gregory](https://shrug.org/files/shrug-95/5-things-learnt-about-gcp.pdf)
  * ["User Needs Driven Development" by Eve Barabas](https://shrug.org/files/shrug-95/user-needs-driven-leadership.pdf)

  #### About our venue

  Our meetup will take place at our venue, [Union St](http://www.union-st.org).

  After the meetup, we'll be heading to [The Devonshire Cat](http://www.devonshirecat.co.uk/) for drinks, food and chat.
