description: |-
  We've just been through conference season (and still yet to come) so we would like for our shruggers to share their learning experiences.

  [James Gregory](https://twitter.com/jamgregory) will start us off with info from [Agile Manchester](http://agilemanchester.net/2018/), fresh of the press and vet our appetite for some [Railconf](http://railsconf.com/), followed by [Ryan Bibby](https://twitter.com/ryanbibby) and more [Railconf](http://railsconf.com/) extravaganza and finishing with [Eva Barabas](https://twitter.com/b_seven_e) talking some [Bath Ruby](https://2018.bathruby.uk/schedule/) and how it was to co-organise [Isle of Ruby](https://2018.isleofruby.org/).

  It's not too late to get involved if you briefly want to share some learnings from conferences as well as podcasts, videos, blogs or other sources that inspired you. Give us a shout on [Twitter](https://twitter.com/sheffieldruby), via [email](mailto:hello@shrug.org) or [Slack](https://sheffielddigital.slack.com/messages/sheffieldruby).

  #### About our venue

  Our meetup will take place at our usual venue, [Union St](http://www.union-st.org).

  After the meetup, we'll be heading to [The Devonshire Cat](http://www.devonshirecat.co.uk/) for drinks, food and chat.
