  #### *Extra event* Open Source - Contributing - drop-in session
  Sean and Greg work on two amazing open source projects, GitLab and Foreman, respectively and are perfectly placed to help you either make your first contributions to the projects or talk about your git workflow/CI and anything DevOps/Config Management/CI/Community related.

  We welcome both seasoned and unseasoned OpenSource enthusiasts for one or 2 of the sessions (we will break at 12pm for an hours lunch)

  #### About our speakers
  Greg Sutcliffe has been a sysadmin, DBA, developer, and is now the community manager for an open-source Rails system management project [The Foreman](https://theforeman.org). He's been working from home for Red Hat for over four years and may have gone slightly crazy in the process...

  Sean McGivern works on GitLab's discussion tools, from creating an issue to reviewing the code to fix it. Before this he worked on cloud computing software, and before that he was a much younger person.

  #### About our sponsors
  We would like to thank our two main sponsors for the travel arrangements and time off for our speakers. [Red Hat](https://www.redhat.com/en) is the world's leading provider of open source software solutions, using a community-powered approach to reliable and high-performing cloud, Linux, middleware, storage and virtualization technologies. Red Hat also offers award-winning support, training, and consulting services. As the connective hub in a global network of enterprises, partners, and open source communities, Red Hat helps create relevant, innovative technologies that liberate resources for growth and prepare customers for the future of IT.

  [GitLab Inc.](https://about.gitlab.com/) is a company based on the GitLab open-source project. GitLab is an application to code, test, and deploy code together. It provides Git repository management with fine-grained access controls, code reviews, issue tracking, activity feeds, wikis, and continuous integration.

