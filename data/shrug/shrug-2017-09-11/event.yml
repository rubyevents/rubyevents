description: |-
  What does good code look like? Seems like a simple enough question to answer. A much harder one is how do you get to this good code? This is the question that [Sandi Metz](https://www.sandimetz.com/) and [Katrina Owen](http://www.kytrinyx.com/) answer in their new book [99 Bottles of OOP](https://www.sandimetz.com/99bottles/).

  This session we'll be doing an interactive session based on the opening chapter. You'll start by spending some time working on the [99 bottles of beer exercise](http://nwrug.org/quizzes/99-bottles-of-oo-programming) before we look at four existing solutions and discuss the relative merits and disadvantages of each. Although we won't have the entire answer (for that you need to read the book!) by the end we should have a better understanding of what makes for good code.

  #### Taking part
  There will be a half hour programming exercise at the beginning of this session. Doing the exercise is not compulsory, but if you would like to take part bring a laptop with [Ruby](https://www.ruby-lang.org/en/documentation/installation/) (1.9 or above) and the [Minitest](https://github.com/seattlerb/minitest) gem (version 5 or above) installed on it.

  #### Don't know Ruby?

  We welcome folks who are new or unfamiliar with Ruby! Please come along and either observe the session or get a helping hand from one of our more experienced members. You can also complete the exercise in another language if you like, but the tests provided will be written in Ruby, as will the examples we will go through at the end. Regardless of your experience or familiarity with Ruby, you should be able to get something from this session.

  #### Need help installing Ruby?

  If you need any help getting things set up on your computer, come to the session at 6:00 and we'll be happy to help.

  _This has been run on the other side of the Pennines this May and we thought inviting Tekin along to run it at ShRUG would be great - [more details are available on NWRUG site](https://nwrug.org/events/may-2017-99-bottles-of-object-oriented-programming-an-interactive-session)_.

  #### About our facilitator

  [Tekin Suleyman](https://twitter.com/tekin) a highly experienced freelance consultant who's been writing Ruby code and shipping successful products professionally for over a decade. Some of the awesome things he has done recently:
  * helped Co-op Digital ship their very first in-house digital service as tech lead, taking it from conception, through alpha, beta and into a fully operational service
  * spent two years working on the UK Government's website, including a stint as tech lead on the project to re-architect the government's publishing platform
  * contracted as a Ruby developer for several great startups and agencies, including FreeAgent, Swirrl, and Stardotstar
  * organised and ran a Rails Girls workshop, which aims to open up technology and make it more approachable
  * organised and ran the North West Ruby User Group, which is the hub of the Ruby community in the North West

  #### About our venue

  Our meetup will take place at our venue, [Union St](http://www.union-st.org).

  After the meetup, we'll be heading to [The Devonshire Cat](http://www.devonshirecat.co.uk/) for drinks, food and chat.
