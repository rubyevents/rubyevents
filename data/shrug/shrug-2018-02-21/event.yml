description: |-
  _**Please note:** you will have to register via CodeUp Meetup for this event either as a student or mentor_

  Sheffield Ruby User Group has been running Ruby Newby events in the past, and this time we teamed up with CodeUp to introduce some students to Ruby! Why not join us.

  CodeUp Sheffield is a mentoring program for adults who would like to learn how to code for free. Once a month we intend to provide a workspace for people with no programming skills to come and learn the basics, with mentors available to answer your questions and help you on your way. Our sessions will also be suitable for people with basic skills who need support to develop them, and even for people with intermediate or advanced skills who just want to come along to a space where everyone is immersed in code!

  On top of our usual proceedings, we will have an intro to the Ruby language this month and we're inviting some Shruggers to be on hand on the day for our students. If you are a developer from another language, or a beginner who would want to learn (more) Ruby, this is the place for you.

  Come along and talk to our mentors (I'm reliably informed that our mentors also do other languages)- they can help if you need some pointers to get started with programming, some advice on a project you're working on, or if you have any other questions about coding or getting your first job in the tech industry.

  Please ensure you bring along your own laptop.

  CodeUp have a [Slack group](https://codeupshf-slack.herokuapp.com/) to help organise what you're working on, and arrange mentoring and groups as needed ahead of the event! Please sign up if you haven't already.

  #### About our venue

  Doors open at 6pm for you to come and mingle, talk to people who share your interests in coding, and sort out who's doing what.

  At 6:30 we'll split into groups by language/project, either with mentors or others who are interested in the same thing, for group learning.

  [The Workstation](https://www.showroomworkstation.org.uk/workstation/what) is fully accessible with lift access to all floors. We are quite restricted on space, so we cannot let you in if you have not RSVPed on Meetup. If you have signed up but can't make it anymore, please set your RSVP to no so that other people can take your place.

  After the meetup, we'll be heading to the [Rutland Arms](http://www.therutlandarmssheffield.co.uk/) for drinks, food and chat.
