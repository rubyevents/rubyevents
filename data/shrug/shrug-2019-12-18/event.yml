description: |-
  Following our tradition for a meal in December, and given we like trying out new places, we've landed on [Domo Restaurant](https://www.domorestaurant.co.uk/) this year in stylish [Little Kelham](https://citu.co.uk/citu-places/little-kelham).

  We'll be around from 6.15pm and we've booked a table, so if you're planning to join us, please RSVP for us to confirm the table.

  **To get to Domo Restaurant**, leaving from Shalesmoor/Kelham Island tram stop, head towards Green Lane, by crossing all the traffic lights, then continue down towards the Fat Cat pub. Enter by the Little Kelham entrance and continue until the end. The restaurant is on the right.

  On behalf of Sheffield Ruby organising team, we hope you have a lovely break over the Christmas period and have a happy New Year.
