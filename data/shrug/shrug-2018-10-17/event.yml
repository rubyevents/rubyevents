description: |-
  _**Please note:** This meetup is taking place on Wednesday, instead of our usual Monday timeslot._

  This month, we're pleased to welcome two speakers from [Cookpad](https://cookpad.com/uk) to talk about the following topics:

  * #### Kafka + Cookpad

    For the past 4 months Lewis has been busy working on integrating Cookpad with Kafka. Lewis will be sharing some of his insights, tip and tricks in a short presentation, to help you integrate Kafka with a Ruby on Rails application.

  * #### Automate your home with Ruby

    In this talk Karl will be sharing his insights and learnings from implementing the HomeKit Accessory Protocol to create a HomeKit accessory in Ruby. HomeKit is a set of protocols and libraries to access devices for home automation. The talk explores some limitations of Rack, decoding binary data with Ruby and an overview of the HomeKit Accessory Protocol. Karl will also live demo a couple of different accessories.

  _Not this side of the Pennines on Wednesday? Lewis and Karl are also talking at NWRUG on Thursday - [more details are available on the NWRUG site](https://nwrug.org/events/october-2018-automate-your-home-with-ruby-kafka-cookpad)_.

  #### About our speakers

  ##### Lewis Buckley
  Lewis has been writing software professionally for the past 7 years, recently joining Cookpad as a Senior Ruby engineer. He is co-organiser of South West Ruby and his current work involves using Ruby with Redis and Kafka to build the Cookpad news feed. When he’s not coding you’ll find him in the kitchen, cooking or occasionally making cocktails.

  ##### Karl Entwistle

  Karl has been a keen Rubyist for over a decade. Currently he’s renovating a house with his wife. He is a burrito enthusiast who also enjoys pizza and model trains.

