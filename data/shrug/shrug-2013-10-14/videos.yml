  description: |-
    October's meeting is a talk from [Glen Mailer](http://stainlessed.co.uk/) on message queues:

    A practical introduction to how and why you should be using a real message queue - at any scale. We'll have an introduction to message queue concepts and architecture using AMQP and RabbitMQ, exploring why this is useful and what tasks queues are suited for. We'll then have an opportunity for everyone to try writing queue consumers and publishers against a sample server - no experience necessary!

    Ideally attendees should arrive with Ruby 1.9.2+ pre-installed, "gem install bunny" will also save us a bit of setup time and bandwidth.
