  title: "Make Ruby scripting great again!"
  date: "2017-02-20"
  video_provider: "not_recorded"
  video_id: "piotr-murach-shrug-2017-02-20"
  description: |-
    Ruby developers are migrating their scripts to Go, Rust and similar. Performance and novelty are strong forces to contend with.

    It's time we bring scripting joy back to Ruby! [Bundler](http://bundler.io/) and [Homebrew](http://brew.sh/) are just a few examples of past glory. However, there are a myriad of tools to be developed and Ruby has the power and elegance to make building command line applications easy.

    How can the mighty god of thunder help us? Curious? Then come along.
