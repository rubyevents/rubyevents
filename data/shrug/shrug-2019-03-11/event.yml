description: |-
  In one timeline a quick path to clarity. In the other a painful journey trying to uncover the obscure intent of a line of code. The only difference between these two realities? The revision history...

  This is a story about revision histories and their impact on software maintainability. Think Sliding Doors, but with more Git!

  #### About our speaker

  [Tekin Süleyman](https://twitter.com/tekin) is a senior freelance consultant who's been shipping Ruby code for over a decade. He's worked with teams, large and small: from Government agencies (GDS) to listed startups ([FreeAgent](https://www.freeagent.com/)), and the world's oldest and largest Co-operative ([Co-op Digital](https://www.co-operative.coop/)). He also runs the [North West Ruby User Group](https://nwrug.org/) in Manchester, and we had the pleasure to collaborate with them on a number of occasions. Tekin has given this talk at [Brighton Ruby](https://brightonruby.com/), [RailsConf](http://railsconf.com/) and [Railsconf Australia](https://www.rubyconf.org.au/2019), and each time it gets better and better as he is great as incorporating feedback!

  #### About our venue

  Our meetup will take place at our usual venue, [Union St](http://www.union-st.org).

  After the meetup, we'll be heading to [The Devonshire Cat](http://www.devonshirecat.co.uk/) for drinks and a chat.
