description: |-
  _**Please note:** this meetup is a week later than normally scheduled._

  API access is an important part of building any internet application today, from cat meme generation to processing card payments - the possibilities are endless! This workshop will be a hands-on introduction to API access basics in Ruby.

  For those just starting we will go through connecting and using the API with simple code. For people a little more seasoned and beginners wishing to explore, we will play a little game with a (fictional) bank API.

  You will need a computer with recent version of Ruby installed if you wish to take part.

  #### About our speaker

  Local FinTech legend, [Valentin](http://www.madespecial.co.uk/), is back from his UK-wide tour of sprint planning meetings with another world-first - a bank you can talk to in JSON.

  #### About our venue

  Our meetup will take place at our venue, [Union St](http://www.union-st.org).

  After the meetup, we'll be heading to [The Devonshire Cat](http://www.devonshirecat.co.uk/) for drinks, food and chat.
