title: "Sheffield Ruby Meetup January 2017"
subtitle: "An Introduction to Rust for Rubyists"
location: "Sheffield, United Kingdom"
timezone: "Europe/London"
kind: "meetup"
description: |-
  What is it about Rust that is attracting Ruby devs, programmers from other high-level languages, and systems developers from languages like C?

  This talk will look at some of the language features that make Rust expressive like Ruby but also performant enough to interest those from the C and C++ world.

  We will take a beginner-friendly look at the type system, ideas around 'ownership' of memory, and the useful tooling around the language.

  #### About our speaker

  [Daniel King](https://twitter.com/Kingy) is a web developer, working mainly with Rails and interested in new languages (bringing us Elixir, [couple of meetups ago](https://shrug.org/meetings/shrug-64/)). He once met Matz at a beach party in Barcelona and will take any chance he can get to brag about it.

  #### About our venue

  Our meetup will take place at our venue, [Union St](http://www.union-st.org).

  After the meetup, we'll be heading to [The Devonshire Cat](http://www.devonshirecat.co.uk/) for drinks, food and chat.
