  description: |-
    Metaprogramming is not only fun, but, importantly, it makes makes you feel *really* clever - which we all know is the main purpose of a career in programming. Sadly, it’s not always the best fit for codebases with multiple contributors. This talk will explore some neat tricks you can do when you don’t need to worry about that perennial problem - other people needing to understand your code.

