- id: "stefanni-brasil-wnb-rb-2022-08-30"
  title: "Want to move up the Engineering ladder? Don't ask for advice"
  date: "2022-08-30"
  video_provider: "not_published" # unpublished video: B3c2GpMUCZE
  video_id: "stefanni-brasil-wnb-rb-2022-08-30"
  description: |-
    What is the first thing people tell you need to know to become a Senior Ruby Developer? Have you ever asked that question to a Senior Ruby dev? Worse than that: have you ever asked for generic career advice?

    In this talk, I’ll convince you to ditch the idea of asking for advice. You’ll learn how to ask specific questions to people who got to the place you want to go. Who had a similar context and constrains. And how to extract useful information that applies to your situation. Plus, you’ll hear real stories of Ruby Developers who got to Senior (and beyond). Then, you’ll know how to create your Path to Senior.

    https://www.wnb-rb.dev/meetups/2022/08/30
