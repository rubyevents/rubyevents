- id: "alex-morton-wnb-rb-2022-08-30"
  title: "Improving Your Dev Skills != Writing Increasingly Complex Code"
  date: "2022-08-30"
  video_provider: "not_published" # unpublished video: akebHS1_N04
  video_id: "alex-morton-wnb-rb-2022-08-30"
  description: |-
    When you think of getting to that next level of your career as a developer, do visions of nightmarishly complex code solutions that you’ll have to write and decipher come to mind? For me, it did — until I realized that levelling up as a software engineer actually means simplifying the code you write and getting better at finding elegant (read: not overly complex) solutions to hard problems.

    In this talk, we’ll cover why it’s important to strive for simplicity in your code as you level up in your career, as well as some concrete steps you can take to build your skills for doing so.

    https://www.wnb-rb.dev/meetups/2022/08/30
  speakers:
    - Alex Morton
