  description: |-
    You feel safe in the knowledge that your application is kept performant by the familiar 'Rails magic'... but even so, do you occasionally want to check behind the curtain?! Let's demystify things to discover exactly how applications are kept performant and efficient by the cool concurrency and threading that is 'woven' (!) into the Rails framework. In this talk, you will first learn about the core principles of concurrency in software in an easy-to-understand way, then take a behind-the-scenes look at where these principles are built into Rails, and finally, gain insights about configuration that could improve the performance, reliability and data-safety of your application.

