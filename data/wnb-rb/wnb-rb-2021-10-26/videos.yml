  description: |-
    You're excited about getting your first role as a software engineer, (congratulations!) and have just completed your first week. Setting up your dev environment took 3 days instead of 3 hours, you attend onboarding sessions and remember about 5% if you're lucky, and you get introduced to the codebase and you begin to wonder if you're qualified for this job.

    If you're a seasoned developer, you can help your fellow junior developers navigate through this exciting yet terrifying time. For this talk, I received advice from knowledgeable and experienced developers on how to be successful in your first role. Join me today and find out how you can make yourself stand out while controlling impostor syndrome and preventing burn out.

