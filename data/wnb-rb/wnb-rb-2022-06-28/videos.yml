  description: |-
    What is the difference between *procs* and *lambdas*? How do we define them and how do we invoke them? We will also talk about *yield* keyword and *closures*. We will unravel the magic of `&:` syntax and explain exactly why this works  `users.map(&:first_name)`.

    This talk will be accessible to Ruby developers at all levels. We will play around with these constructs in the IRB so you can walk away with a clear understanding of these fundamental Ruby things!

