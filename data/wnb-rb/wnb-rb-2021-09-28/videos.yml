    In this talk, you'll quickly learn about the core of what makes Ruby work, its VM. We'll answer questions like "what even is a VM?", "how does Ruby's work?", and "how will this help us in our day to day Ruby programming". While this talk is technical, we'll start with only the most simple of Ruby programs, and slowly pull layers back to understand more and more of how the language works, so it should be approachable to everyone!

