  description: |-
    Are you nervous to network? Not sure how, when, or why we should network with other professionals, or how it can help you? In this talk, CEO & Career Coach Rachel Serwetz will deep dive into what networking really means and doesn't mean, how to make it comfortable and strategic for you, who to reach out to, what to do once you connect, how to follow up, and so much more. Bring all of your career questions for an AMA at the end!

    About the speaker:
    Rachel Serwetz' early professional experience was at Goldman Sachs in Operations and at Bridgewater Associates in HR. From there, she was trained as a coach at NYU and became a certified coach through the International Coach Federation. After this, she worked in HR Research at Aon Hewitt and attained her Technology MBA at NYU Stern. Throughout her career, she has helped hundreds of professionals with career exploration and for the past 7+ years she has been building her company, WOKEN, which is an online career exploration platform to coach professionals through the process of clarifying their ideal job and career path. She has also served as an Adjunct Professor of Entrepreneurship at Binghamton University and as a Career Coach through the Flatiron School/WeWork, Columbia University, and Project Activate. Learn more about WOKEN here: iamwoken.com.

