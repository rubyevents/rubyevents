    Rails Edge has its risks and rewards; here's how you can do it successfully. In this  talk, I'll share hard-won takeaways from keeping a large, legacy app on pre-release Rails. I'll also show how we contribute to open source—landing small, focused PRs, and contributing where Rails still needs love—so the next upgrade is easier for everyone. You'll leave with a compact playbook for Rails upgrades and the confidence to spar with Edge without getting knocked out. Living on Rails Edge isn't a dare, it's a training plan.

