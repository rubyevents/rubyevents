  Topics
  ========
  A remote presentation by Yehuda Katz of EngineYard!

  Yehuda Katz is currently employed by Engine Yard (https://www.engineyard.com), and works full time as a Core Team Member on the Rails project. He is the co-author of jQuery in Action (https://www.manning.com/affiliate/idevaffiliate.php?id=485_93) and the upcoming Rails 3 in Action (https://www.manning.com/affiliate/idevaffiliate.php?id=485_145), and is a contributor to Ruby in Practice (https://www.manning.com/affiliate/idevaffiliate.php?id=485_96).

  He spends most of his time hacking on Rails, but also on other Ruby community projects, like Rubinius (https://rubini.us/) and Datamapper (https://datamapper.org/). And when the solution doesn't yet exist, he'll try his hand at creating one - as such, he's also created projects like Thor (https://github.com/wycats/thor/) and DO.rb (https://github.com/datamapper/do/).

