description: |-
  Editor Wars
  We will be discussing tips and tricks in each and hope to crown a champion before it's over. So far we have representation for TextMate, emacs, and Vim. Please let me know if you have experience in another editor as we would like to add others to the discussion. You don't need to make a big presentation about your editor, but just having you there will be great.

  So Far...
  Vim: Miles Sterrett / Davey Strus
  TextMate Eli Miller & others
  NetBeans Dave Christiansen

  Making Gems and Plugins
  We will be discussing installation, creation and usage of gems and plugins in your Rails projects.

  Rails + Merb!
  You've all heard the news that Rails 3.0 will merge Rails and Merb into the perfect framework...hopefully. We will certainly discuss the merger and how it might impact future application development.

  The timing is perfect for our sponsor for the next meetup as it is one of the principles in the Rails/Merb merger...

