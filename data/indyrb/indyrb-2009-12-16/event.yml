  POSTPWND!

  Originally scheduled for December 9th, this meetup has been re-scheduled to December 16th. Please try to refrain from using the books you were going to exchange tonight as fire-starter. I know it's cold, but it won't last. It's Indiana.

  Topics
  ========
  Chris Z talks about iPhone Programming
  Eli Miller talks about the Sproutcore JS Application Framework

  Also...
  BOOK EXCHANGE!

  We'll be trying something new - a book exchange! Bring books you don't use but think might be of interest to other members. The rules of the exchange are simple:
  Try to be fair-ish. Take about what you give (or less)
  Don't bring grossly out of date technical books - nobody wants your OS9 user guide!

  If you have books you are willing to loan to indy.rb members, bring those too. We'll put them in a separate pile marked with cards for the borrowers to fill out (make sure you write your name on the book)
  We're going to try this out and if it turns out to be popular we might do it again, otherwise we'll let it die.

