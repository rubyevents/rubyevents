  description: |-
    There may come a time when rbenv, rvm, or chruby won't cut it for your use case. Sometimes you need or want a current-day Ruby version installed on the system level, but most Linux distros provide really out of date Rubies. To get what you want, you need to roll your own Ruby.

    Creating OS packages may sound scary, but in reality they are easy once you have a build system setup. I currently maintain a small set of servers for my side projects and have used my own self-built package of Ruby for quite a while now.

    Tony is a senior web developer with about 10 years (most of it in Ruby) of total experience building websites professionally. By day, he curses DHH's name while hacking away at code and trying to keep junior devs from scraping their knees. By night, he's peeling away from the starting line while blowing up other vehicles in my way in Mario Kart.
