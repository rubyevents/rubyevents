  Presentations:

  How we built a text-to-give app at evrconnect using Twilio, Stripe, and Rails by Andrew Porterfield

  We recently rolled out the ability to donate via text messaging at evrconnect. This talk will demo the feature as well as walk through the code that makes it come to life. We'll touch briefly on Stripe, but focus mainly on using Twilio's API to interact with people from your app. We won't be doing live coding, but there will be a lot of code samples.

  Fishbowl Conversation: Code Archaeology

  How do you read code? When you're new to a project, what do you look for to tell what it's trying to do, how it's been maintained, and what any problem spots are?
