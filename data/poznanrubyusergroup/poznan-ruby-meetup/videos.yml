      language: "Polish"
      video_provider: "not_recorded"
      video_id: "agata-kabat-bartek-juszczak-poznan-ruby-meetup-august-2024"
      description: |-
        Wyobraź sobie, że właśnie zostałeś/-aś menedżerem/menedżerką i Twój zespół stoi przed wielkim wyzwaniem. Wszyscy patrzą na Ciebie, oczekując, że wskażesz im drogę. To moment, w którym nie wystarczy być świetnym specjalistą w swojej dziedzinie – musisz stać się liderem, który potrafi zainspirować, zmotywować i poprowadzić swój zespół do sukcesu. Jeśli czujesz, że to Twoja przyszłość, zapraszamy na 2-godzinny warsztat, który pomoże Ci świadomie wejść na tę ścieżkę zawodową.
      speakers:
        - Agata Kabat
        - Bartek Juszczak

