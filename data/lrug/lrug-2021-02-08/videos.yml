  title: "An intro to Bridgetown: A static site generator for the modern JAMStack era."
  date: "2021-02-08"
  announced_at: "2021-01-24T21:30:00Z"
  video_provider: "mp4"
  video_id: "https://assets.lrug.org/videos/2021/february/ayush-newatia-an-intro-to-bridgetown-a-static-site-generator-for-the-modern-jamstack-era-lrug-feb-2021.mp4"
  description: |-
    [Bridgetown](https://www.bridgetownrb.com) is a new Ruby-powered static
    site generator that was forked from Jekyll 4.1. It has a focus on modern
    ideas and includes Webpack as a first-class citizen. In this talk I'll
    give a demo of what differentiates Bridgetown from Jekyll and some of
    its best features; followed by a short Q&A.
  speakers:
