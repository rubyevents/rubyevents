- id: "frederik-fix-lrug-2007-08-13"
  title: "Ruby2Ruby"
  date: "2007-08-13"
  video_provider: "not_recorded"
  video_id: "frederik-fix-lrug-2007-08-13"
  description: |-
    Frederik Fix has been delving into the dark work of ruby2ruby and ParseTree. This stuff is, in Frederik's own words, quite advanced and very experimental. But that makes it all the more interesting.

    The talk covers: an intro to Abstract Syntax Trees, how to get one from ParseTree, examples of how to use the AST, and a demo of a plugin that uses all this to translate Ruby to JavaScript.
  speakers:
    - Frederik Fix

- id: "jay-phillips-lrug-2007-08-13"
  title: "Next-Gen VoIP Development with Ruby and Adhearsion"
  date: "2007-08-13"
  video_provider: "not_recorded"
  video_id: "jay-phillips-lrug-2007-08-13"
  description: |-
    Adhearsion's creator Jay Phillips will discuss Ruby's work in VoIP and how even complete telephony novices can powerfully develop their own VoIP system with Asterisk and Adhearsion using pure-Ruby for all application logic. Attendees will see Jay develop a sophisticated Adhearsion application that integrates and handles calls from the public telephone network and integrates with a Rails application. Adding a voice component to a web application is much easier than you think!
  speakers:
    - Jay Phillips
