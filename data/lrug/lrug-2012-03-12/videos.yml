  description: |-
    A Fishbowl session, organised by Stuart Eccles, focussing on approaches to TDD. The idea is not to focus on tedious tool debates like Test::Unit vs. RSpec or Cucumber vs. raw ruby for integration testing, but to explore other debates, such as Obie Fernandez's suggestion that TDD might not be the best approach for early-stage startups.

    The initial panel and their opening statements:
    - Stuart Eccles - Writing tests before validating the business value is pointless
    - Tom Stuart (@tomstuart) - Rails encourages you to to TDD wrong
    - Joseph Wilk - The cargo culting of TDD without considering if and why
    - Tom Stuart (@mortice) - The "fast specs" paradigm is a red herring for producing better code

    Murray Steele moderated; anyone could join the discussion by claiming the empty fifth chair.
  speakers:
    - Stuart Eccles
