  title: "Syncing from a non-Rails app with Multiple Database Connections"
  date: "2026-09-14"
  announced_at: "2026-08-12T19:28:00Z"
  video_provider: "not_published"
  video_id: "jade-dickinson-lrug-2026-09-14"
  description: |-
    Rails supports scaling applications with multiple databases, but did you know you can also
    use them to connect to any database and query it using ActiveRecord? I’ll talk about the
    process of syncing data from a non-Rails app to our Rails monolith in order to sunset an
    old system. I will elaborate by explaining how I designed a sync mechanism that could run
    quickly and continuously, mapped information across database schemas, and the decisions I
    made to make it understandable, observable and easy to operate.
  speakers:
    - Jade Dickinson

