  description: |-
    A talk about caching, chef, munin, load testing and hosting. As part of its adoption of agile techniques and its creation of a Skunkworks division, DirectGov asked the Agile Delivery Network to build a successor website to the Number 10 e-petitions site with a 6 week deadline. The talk aims to highlight the measures taken to cope with high throughput, what worked and what could be done differently to avoid headlines like "Government's e-petition website crashes on first day".
