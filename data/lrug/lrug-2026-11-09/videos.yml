- id: "jade-dickinson-lrug-2026-11-09"
  title: "Building a multi-user reservation system across Hotwire and a Rails API"
  date: "2026-11-09"
  announced_at: "2026-10-22T22:35:00Z"
  video_provider: "not_published"
  video_id: "jade-dickinson-lrug-2026-11-09"
  description: |-
    Building multi-user reservations for appointments, tickets or other limited resources
    is such a classic problem that it comes up in system design books as “Build a ticket
    reservation system”. What do you need to know to build it for real? I will share my
    experience: from building a simple MVP, planning how to scale it, and designing for
    reliability and recoverability in a distributed system.
  speakers:
    - Jade Dickinson

- id: "abiodun-olowode-lrug-2026-11-09"
  title: "Protecting your Ruby application from Denial of Wallet attacks"
  date: "2026-11-09"
  announced_at: "2026-10-22T22:35:00Z"
  video_provider: "not_published"
  video_id: "abiodun-olowode-lrug-2026-11-09"
  description: |-
    A denial of wallet attack doesn't take your app down. It makes your app spend money,
    through paid APIs such as LLM calls, until the bill hurts. In this talk, I explain
    what these attacks look like, how we found the gaps in our own app and how we are
    fixing them.  Your app might have the same gaps.
  speakers:
    - Abiodun Olowode
