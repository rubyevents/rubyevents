name: "Metropolitan Pavilion, Dream Room"
description: "Chelsea doesn't announce itself: it quietly holds some of the best galleries in the city, the rooftop gardens strung along the High Line, and enough exposed brick to remind you SoHo isn't the only neighborhood with taste. The Dream Room sits inside Metropolitan Creative Studios, a newly built floor atop the Metropolitan Pavilion — a longtime fixture for fashion shows and product launches, and now, for a day, us. Theater seating for up to 110, a stage, four mics, three screens. Nothing to plug in, nothing to fuss over. Just walk in and start talking."
instructions: "Leave the car. Chelsea and the Flatiron District sit at the crossing point of half the subway system. The 1 train stops at 18th St, a block from the door, and the 2/3, A/C/E, F/M/L, and 4/5/6/N/Q/R/W all land within a few blocks at 14th St. Wherever you're staying, you're one ride and a short walk away. If you do drive, parking garages line 18th, 19th, and 20th Streets."
