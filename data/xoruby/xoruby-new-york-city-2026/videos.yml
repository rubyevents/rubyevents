- id: "noel-rappin-xoruby-new-york-city-2026"
  title: "Rubyist in the Loop"
  date: "2026-10-10"
  start_time: "16:15"
  end_time: "16:45"
  language: "English"
  video_provider: "scheduled"
  video_id: "noel-rappin-xoruby-new-york-city-2026"
  description: |-
    At a recent conference, nearly every hand in the room went up when asked who writes code with an AI agent. A day later, nearly every hand went up again when asked who identifies as a Rubyist. Both are true, which raises a question: if the agent types the code, what does it mean to be a Rubyist. This talk argues that engineering and taste are the answer, exploring why teams might fail to turn LLM coding speed into end-to-end productivity, and suggesting that human context and expertise can be the answer. You'll leave with tools for being an effective Rubyist in the loop.
  speakers:
    - Noel Rappin
