- id: "charles-nutter-xoruby-new-york-city-2026"
  title: "Expand Your Ruby World with JRuby"
  date: "2026-10-10"
  start_time: "13:30"
  end_time: "14:00"
  language: "English"
  video_provider: "scheduled"
  video_id: "charles-nutter-xoruby-new-york-city-2026"
  description: |-
    JRuby is a Ruby 4.0-compatible runtime based on the Java Virtual Machine, bringing the scalability, performance, and ecosystem of the JVM to Rubyists around the world. Deploy anywhere with confidence and all-in-one packaging that protects your intellectual property. Scale to huge datasets and thousands of concurrent users with a single process. Take advantage of 30 years of tools and libraries from the Java world. JRuby opens up a world of opportunities to Ruby!
  speakers:
    - Charles Nutter

- id: "michael-carroll-xoruby-new-york-city-2026"
  title: "Elastic Software: Calculating Tech Debt Using LLM Tokens"
  date: "2026-10-10"
  start_time: "14:00"
  end_time: "14:30"
  language: "English"
  video_provider: "scheduled"
  video_id: "michael-carroll-xoruby-new-york-city-2026"
  description: |-
    Engineers complain about tech debt all day. We're bad at saying what it is and worse at pricing it, which is why product managers roll their eyes. Michael's answer is to count it in LLM tokens. A little napkin math puts a cost on both fixing the debt, carrying it, and point estimates go away.

    Thinking in "tokenomic cost" changes how you design software, not only how you talk about debt. It leads to a new design pattern, Elastic Software.
  speakers:
    - Michael Carroll

- id: "noel-rappin-xoruby-new-york-city-2026"
  title: "Rubyist in the Loop"
  date: "2026-10-10"
  start_time: "15:00"
  end_time: "15:30"
  language: "English"
  video_provider: "scheduled"
  video_id: "noel-rappin-xoruby-new-york-city-2026"
  description: |-
    At a recent conference, nearly every hand in the room went up when asked who writes code with an AI agent. A day later, nearly every hand went up again when asked who identifies as a Rubyist. Both are true, which raises a question: if the agent types the code, what does it mean to be a Rubyist. This talk argues that engineering and taste are the answer, exploring why teams might fail to turn LLM coding speed into end-to-end productivity, and suggesting that human context and expertise can be the answer. You'll leave with tools for being an effective Rubyist in the loop.
  speakers:
    - Noel Rappin
