- id: "michael-carroll-xoruby-new-york-city-2026"
  title: "Elastic Software: Calculating Tech Debt Using LLM Tokens"
  date: "2026-10-10"
  start_time: "14:00"
  end_time: "14:30"
  language: "English"
  video_provider: "scheduled"
  video_id: "michael-carroll-xoruby-new-york-city-2026"
  description: |-
    Engineers complain about tech debt all day. We're bad at saying what it is and worse at pricing it, which is why product managers roll their eyes. Michael's answer is to count it in LLM tokens. A little napkin math puts a cost on both fixing the debt, carrying it, and point estimates go away.

    Thinking in "tokenomic cost" changes how you design software, not only how you talk about debt. It leads to a new design pattern, Elastic Software.
  speakers:
    - Michael Carroll

- id: "daniel-colson-xoruby-new-york-city-2026"
  title: "Regex as Easy as /(abc)?/"
  date: "2026-10-10"
  start_time: "15:00"
  end_time: "15:30"
  language: "English"
  video_provider: "scheduled"
  video_id: "daniel-colson-xoruby-new-york-city-2026"
  description: |-
    What really happens when Ruby sees a regular expression like /abc/? While many of us use regular expressions regularly, we don't necessarily think much about how they really work. In this talk we'll trace a regular expression through Ruby's internals, from parsing the pattern into a syntax tree, to compiling into bytecode, to executing that bytecode on a small virtual machine. You'll come away with a deeper understanding and appreciation for Ruby's regular expression engine, and hopefully an increased confidence in working with regular expressions in Ruby.
  speakers:
    - Daniel Colson

