name: "Ederer Hall"
description: "Ederer Hall is an industrial event space in Seattle's SODO district. Housed in the 1919 Ederer Engineering Building — once a crane manufacturing plant — with exposed steel beams, reclaimed wood floors, high ceilings, and a working 20-ton overhead crane, the space has character to spare."
instructions: "Whether you drive or use public transit, Ederer Hall provides flexible and convenient transportation options. The venue is accessible via the Link light rail 1 Line, SODO Station is about a 10–12 minute walk away, and Metro bus stops along 1st and 4th Avenues S are a few minutes' walk. If you're driving, there is ample free and paid parking nearby, plus a parking lot adjacent to the venue."
