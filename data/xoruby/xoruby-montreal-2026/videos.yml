- id: "marc-andre-cournoyer-xoruby-montreal-2026"
  title: "You Can Build More Than Software Now"
  date: "2026-10-17"
  start_time: "11:15"
  end_time: "11:45"
  language: "English"
  video_provider: "scheduled"
  video_id: "marc-andre-cournoyer-xoruby-montreal-2026"
  description: |-
