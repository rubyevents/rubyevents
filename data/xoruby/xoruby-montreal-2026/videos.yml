- id: "david-cornu-xoruby-montreal-2026"
  title: "Ideas Worth Stealing: What Rubyists Can Learn From Other Ecosystems"
  date: "2026-10-17"
  start_time: "10:00"
  end_time: "10:30"
  language: "English"
  video_provider: "scheduled"
  video_id: "david-cornu-xoruby-montreal-2026"
  description: |-
    Ruby has never been shy about borrowing from its predecessors and peers, like Smalltalk's blocks, Perl's regular expressions, and CLU's `yield`. Combined with the community's sense of what idiomatic Ruby is, those ideas deeply impacted the way I approach code.

    The programming world hasn't stood still though, and my exposure to yet more good ideas in other ecosystems has pushed me to try and bring them back into the Ruby I write. This talk will cover some of these, from straightforward newtypes to the more controversial runtime assertions.
  speakers:
    - David Cornu

- id: "kasper-timm-hansen-xoruby-montreal-2026"
  title: "Building gem.coop"
  date: "2026-10-17"
  start_time: "10:45"
  end_time: "11:15"
  language: "English"
  video_provider: "scheduled"
  video_id: "kasper-timm-hansen-xoruby-montreal-2026"
  description: |-
    Let's dive deep into the code of gem.coop and its underlying Rails app 🏔️ Peak. gem.coop is a brand new Ruby gem server that's fully Bundler compatible but working on next-generation features like namespaces, cooldowns, staged publishing, preview builds of gems and more. We'll look at what it took to build peak, including the domain modeling, what Bundler needs for compatibility, fun new tooling we built, and other discoveries we made along the way.
