name: "VIFF Centre"
description: |-
  VIFF Centre is the year-round home of the Vancouver International Film Festival, in the heart of downtown Vancouver. With a 169-seat cinema featuring 4K projection and Dolby surround sound, plush seating with double armrests, and an atrium lobby made for mingling, you'll be watching talks in serious comfort.
instructions: |-
  Whether you drive or use public transit, VIFF Centre provides flexible and convenient transportation options. The venue is accessible via SkyTrain: Yaletown-Roundhouse Station (Canada Line) is about a 5-minute walk, and Granville Station is about 10 minutes, with bus stops along Davie and Granville Streets just a couple of minutes away. If you're driving, there's metered street parking and several paid parkades within a short walk.
