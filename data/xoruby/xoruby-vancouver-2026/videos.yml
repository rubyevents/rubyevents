- id: "kyle-d-oliveira-xoruby-vancouver-2026"
  title: "More feedback! Quantity becomes quality"
  date: "2026-08-15"
  language: "English"
  video_provider: "scheduled"
  video_id: "kyle-d-oliveira-xoruby-vancouver-2026"
  description: |-
    Is it possible for someone to write a large quantity of high quality code? Absolutely! There is a thought that in order to produce quality code, one must move slowly, or that the developer who writes lots of code must not write quality code. This is not true at all. The real key is the amount of feedback, both internally and externally gathered. Aiming for feedback quantity instead of quality might be a big shift. But in reality, you are still focusing on quality. We will explore some of the research that supports this and highlight ways you can gather lots of feedback to be able to consistently produce high quality code.
  speakers:
    - "Kyle d'Oliveira"

