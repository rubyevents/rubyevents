- id: "tbd-xoruby-vancouver-2026"
  title: "Your Agents Deserve a Green Build"
  date: "2026-08-15"
  language: "English"
  video_provider: "scheduled"
  video_id: "tbd-xoruby-vancouver-2026"
  description: |-
    A red build used to mean a shrug and a retry. Now an agent hits that flaky spec and "fixes" code that was never broken, or burns an hour of tokens chasing a ghost. Worse, it reads your bad specs as examples and copies them — sleeps, retries, and all — into everything it writes next. The result: your whole org ends up living at the speed of your least reliable pipeline, a rough place to be when everything else just got faster. A field report from raising build success rate in a large Rails monolith — and what we got wrong first.
  speakers:
    - Kevin Edelmann
    - Adam Palmblad

- id: "john-hawthorn-xoruby-vancouver-2026"
  title: "Schrödinger's local - Defining variables dynamically"
  date: "2026-08-15"
  language: "English"
  video_provider: "scheduled"
  video_id: "john-hawthorn-xoruby-vancouver-2026"
  description: |-
    A quirk of Ruby and ERB templates is that it's not always obvious what's a local variable and what's a method. I'll explain why that is, the problems it creates, and a strange new way we could solve it by making a ruby-to-ruby transpiler which rewrites local variable access.
