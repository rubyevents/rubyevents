name: "The Loft on King"
description: "The Loft on King is a third-floor loft space above the energy of King Street West, in Toronto's downtown fashion and entertainment district. With polished concrete floors, brick-and-beam architecture designed by Solid Design & Build, and a layout inspired by classic New York City lofts, the space pairs industrial character with blank-slate flexibility — plus a rooftop patio for stepping outside between sessions."
instructions: "Whether you drive or use public transit, The Loft on King provides flexible and convenient transportation options. The venue is accessible via the King streetcar (504/508), with a stop right at King St W & Portland St just steps from the door — the more practical route than the subway, since St. Andrew and Osgoode stations sit about 1.5 km further east. If you're driving, paid street and lot parking is available throughout the King West area."
