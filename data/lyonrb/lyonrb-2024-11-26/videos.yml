  description: |-
    Pierre-Alexandre Pierulli vous présente son talk intitulé : In app Styleguide, une autre vision de la 'source unique de vérité' pour le design

    Que ce soit l'app d'un personne ou une app qui existe depuis 10ans. Savoir entre les capture d'écran, les fichiers photoshop ou figma quelle est la bonne version du design, voila qui pose parfois bien des souci. Notamment lorsque certain composant sont visible uniquement sous certaine condition particulière.
    Les styleguide inapp ou parfois appellé (interactive styleguide), sont une solution à cela. Après avoir implémenté cela sous plus de 5 projets je vous propose une petite introduction au concept. Avec avantage inconvénients.

