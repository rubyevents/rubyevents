description: |-
  Bienvenue au 5ème meetup de l'année 2019 ! Cette fois-ci nous nous retrouverons pour une édition spéciale Lyon.rb x Vue.js en partenariat avec la communauté Meetup lyonnaise "Vue.js Lyon".

  Après le succès du meetup de rentrée Stranger Ruby, ne ratez surtout pas cette édition qui s'annonce riche :-)

  Venez découvrir avec nous les sujets suivants :

  L'intégration de Vue dans un framework backend tel que Rails
  Aperçu des nouveautés de Vue 3
  Aperçu des nouveautés de Rails 6
  Le programme de la soirée :

  18h30 : Début du meetup, faisons connaissance
  19h00 : Présentations par les membres des communautés Lyon.rb / Vue.js Lyon
  20h30 : Débats et échanges entre participants
  21h30 : Fin du meetup
  L'évènement sera généreusement accueilli par le Coding Bootcamp | Le Wagon Lyon, à deux pas de l'Hôtel de Ville.

  Nous recherchons des speakers... Ne soyez pas timide ! Que vous veniez de découvrir un sujet intéressant ou que vous le maitrisiez déjà et souhaitez le partager, merci de contacter Jean-Michel :-)
