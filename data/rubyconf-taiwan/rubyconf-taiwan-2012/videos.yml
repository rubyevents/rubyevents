- id: "jim-huang-rubyconf-taiwan-2012"
  title: "Apply mruby into Deeply Embedded Environments"
  date: "2012-12-07"
  video_provider: "not_published"
  video_id: "jim-huang-rubyconf-taiwan-2012"
  description: |-
    mruby 的出現，就是將 Ruby 帶到更多運算環境，不在只是個人電腦或伺服器，而是有機會在機器人一類的自動控制領域，大放異彩。本議程將以實際應用 mruby 到 MCU (微控制單元) 與 RTOS 領域的經驗，分享給對 Ruby 多樣應用有興趣的朋友
