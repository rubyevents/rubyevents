- id: "lin-jen-shin-rubyconf-taiwan-2012"
  title: "Concurrent Ruby Application Servers"
  date: "2012-12-07"
  video_provider: "not_published"
  video_id: "lin-jen-shin-rubyconf-taiwan-2012"
  description: |-
    By understanding various of ways to achieve concurrency (i.e. serving

    more requests in a short period of time with less resource), we can

    pick the right model which suits our needs for a certain kind of web

    application and make it more responsive under high load/traffics and

    less vulnerable to DoS attack.

    There's no perfect one-and-for-all model, but only ones can suit our

    need best. We'll talk about various ways for concurrency, and what's

    current implementations which we can pick from and how to implement

    them.
  speakers:
    - Lin Jen-Shin

- id: "gosuke-miyashita-rubyconf-taiwan-2012"
  title: "Inside Sqale's Backend"
  date: "2012-12-07"
  video_provider: "not_published"
  video_id: "gosuke-miyashita-rubyconf-taiwan-2012"
  description: |-
    Sqale is a cloud application platform for Ruby

    from paperboy&co., Inc, Japan.

    Sqale uses some Ruby technologies and others like these in its backend.

    * Ruby/Ruby On Rails

    * Puppet/Chef

    * Resque

    * Unicorn * AWS(EC2, ELB, RDS, Route53)

    * Patched version of OpenSSH

    * Patched version of Linux kernel * OpenResty(ngx_openresty)

    * Redis

    * Git

    * LXC

    * etc.

    I will talk about the backend architecture of Sqale through explaining

    how we use these technologies in it.

    If you are interested in the inside architecture of a cloud

    application platform, this session will be very helpful.
  speakers:
    - Gosuke Miyashita

- id: "hiroshi-shibata-rubyconf-taiwan-2012"
  title: "How to discover the Ruby's defects with web application."
  date: "2012-12-07"
  video_provider: "not_published"
  video_id: "hiroshi-shibata-rubyconf-taiwan-2012"
  description: |-
    To discover the Ruby's defects is too difficult because they are in

    hidden place. So we need high contexts and techniques if we try to

    discover Ruby's defects without any ruby application.

    A remarkable feature of the Japanese Ruby is that we have many Ruby

    applications. A tDiary(http://www.tdiary.org/) is one of oldest web

    application with ruby. tDiary has been growing up with ruby, and found

    defects in ruby. Because tDiary uses Ruby functions that other

    softwares do not use.

    I will talk about Ruby's useful but rare functions and how to discover

    Ruby's defects.
  speakers:
    - Hiroshi SHIBATA

