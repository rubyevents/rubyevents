  description: |-
    Let's talk about salaries, diversity, career development, getting compensated in gold and silver, paying taxes in livestock and Ruby code. We at Travis CI have been working on a new salary system to determine how much we pay whom, when employees get raises and a whole range of other things. After lots of back and forth, we ended up with a Sinatra application to solve salary questions. Expect to explore the topic from many different angles and levels. We'll look at decisions, realisations and implications, as well as interesting parts of the implementation.
