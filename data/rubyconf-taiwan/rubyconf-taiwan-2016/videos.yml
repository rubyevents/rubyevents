- id: "luba-tang-rubyconf-taiwan-2016"
  title: "Ruby, facing the change of microprocessors"
  raw_title: "RubyConf Taiwan 2016 - Ruby, facing the change of microprocessors by Luba Tang"
  date: "2016-12-03"
  published_at: "2017-01-18T05:40:33Z"
  video_provider: "youtube"
  video_id: "AWVnCI-d4RQ"
  description: |-
    隨著物聯網與雲端服務的盛行，傳統的 server class microprocessor 逐漸地從 general propose 轉變成為 workload specific；雲端服務採購 workload specific processor 的比重從 2010 年 9% 提升到今年至少 30%，比重逐年增加。為了因應 workload specific processor，許多程式語言都逐漸從 interpreter base、JIT base 轉向到 compiler base。Ruby language 的架構是採用純 interpreter base，致使 Skymizer 在針對客戶 workload 優化時，遭遇許多困難。 本篇 talk 會指出 Ruby langauge 現行 VM 上設計的問題，說明為何其無法針對客戶 workload 進行客製化，以期之後社群的努力與改進。
  speakers:
    - Luba Tang

