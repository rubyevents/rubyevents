- id: "florian-dutey-rubyconf-taiwan-2016"
  title: "Large scale Rails applications"
  raw_title: "RubyConf Taiwan 2016 - Large scale Rails applications by Florian Dutey"
  date: "2016-12-03"
  published_at: "2017-01-18T05:44:11Z"
  video_provider: "youtube"
  video_id: "vokjrQwTIQM"
  description: |-
    Rails patterns are amazing for prototyping, but they are actually very bad practices for large scale production applications.

    Also, Rails comes with lot of handy tools to break many barriers for web beginners while introducing tons of good practices. Again, those good practices are a good introduction, but they don't fit large scale production applications, especially when it comes to modern practices in front end world.

    I will discuss why those patterns are not a fit, and how they can be replaced (completely dropped for another technology, or how to improve them). Delivering good practices that should be implemented as soon as your project is no more a prototype to scale your tests speed, your maintainability.
  speakers:
    - Florian Dutey

- id: "shi-gang-wang-rubyconf-taiwan-2016"
  title: "Writing Data Analysis Pipeline As Ruby Gem"
  raw_title: "RubyConf Taiwan 2016 - Writing Data Analysis Pipeline As Ruby Gem by Shi-Gang Wang"
  date: "2016-12-03"
  published_at: "2017-01-18T05:42:56Z"
  video_provider: "youtube"
  video_id: "r1FLLLMDjYk"
  description: |-
    在分析 DNA/RNA 資料上，已有許多工具可供使用，可透過不同工具的結合，可以找出可能導致疾病或癌症的變異點，但工具繁雜，每套工具所需要的參數及使用方法不同，控制每個步驟相當麻煩，必須精通各種分析工具的用法。

    希望透過這個 talk 讓聽眾暸解，要串接 C 和 JAVA 等語言撰寫的分析工具時，可以利用 RUBY 的套件，撰寫簡單的 code 來處理複雜的分析流程．我們將工具與參數的使用，撰寫成 RUBY 模組，並利用 templete 系統組合出一個 robust 的資料分析流程(Cagnut)。

    執行分析流程通常會花費相當大的資源與時間，我們將以 Cagnut 為核心，探討如何撰寫輔助套件(cagnut-cluster)，讓 Cagnut 可以運用不同 cluster 上的排程系統，如 LSF、SGE、Torque (PBS)，達到節省分析巨量資料的時間。
  speakers:
    - Shi-Gang Wang

