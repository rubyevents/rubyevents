- id: "yasuko-ohba-rubyconf-taiwan-2016"
  title: "Value And Pain to Keep Rails Applications Alive"
  raw_title: "RubyConf Taiwan 2016 - Value And Pain to Keep Rails Applications Alive by Yasuko Ohba"
  date: "2016-12-03"
  published_at: "2017-01-18T05:13:23Z"
  video_provider: "youtube"
  video_id: "QIKBsdrTg84"
  description: |-
    In 2014-2015 my team migrated a series of applications from Rails 2.3.5 to 4.2.1, and Ruby 1.8 to 2.1. Our goal was to add large features, while substantially refactoring the whole system. It was a big challenge!

    This talk will cover the timeline of the project and talk about all the things a team performing a large migration of Ruby and Rails will need to do. Secondly, I'll talk about importance, hardness, and some techniques to keep Rails applications healthy and maintainable.
  speakers:
    - Yasuko Ohba

- id: "harisankar-p-s-rubyconf-taiwan-2016"
  title: "Using database to pull your applications weight"
  raw_title: "RubyConf Taiwan 2016 - Using database to pull your applications weight by Harisankar P S"
  date: "2016-12-03"
  published_at: "2017-01-18T05:17:36Z"
  video_provider: "youtube"
  video_id: "zJnFepGZWME"
  description: |-
    Most Ruby on Rails application out there in the world deals with the manipulation and presentation of data. So the speed of our application has a relationship with how fast we work with data. Ruby on Rails, the swiss army knife of web development, is good with presenting data. But when it comes to crunching huge volumes of data, our rails application starts to slow down. Here we are not talking about joining a couple of rows from multiple tables, but about processing months of historical data and providing meaning full information.

    Databases are good at processing data, but we sometimes make the mistake of just using it to as a file cabinet. The database is optimized to crunch GB's of data and return to us the results that we need.

    So my talk would be about how to optimize your database so as to speed up your existing Ruby on Rails application.
  speakers:
    - Harisankar P S

- id: "yoh-osaki-rubyconf-taiwan-2016"
  title: "Isomorphic web programming in Ruby"
  raw_title: "RubyConf Taiwan 2016 - Isomorphic web programming in Ruby by Yoh Osaki"
  date: "2016-12-03"
  published_at: "2017-01-18T05:34:55Z"
  video_provider: "youtube"
  video_id: "1Qvs1e0RyIY"
  description: |-
    For JavaScript, The method is available that is the isomorphic programming.

    The isomorphic programming is the method exploiting the advantages obtained by same code running on both the server-side and client-side.

    For examle, React is reducing the overhead of iniitial rendering in client side by server side rendering.

    On the other hand, for the rubyists, We can also write ruby code on client side by using Opal.

    This talk introduces a new framework for isomorphic programming with the Opal: Menilite.

    Menilite shares model code between the server side and the client side by marshalling objects and storing them in the database automatically.

    As a result, code duplication is reduced and APIs are no longer a necessity.

    Isomorphic programming can significantly accelerate your progress on a project; I sincerely hope you find it helpful in developing web applications.

    Menilite aims to expand the playing field for the Ruby language, a language optimized for developer happiness. I'm sure you will agree that we will find even more happiness by bringing Ruby to the front-end as well.
  speakers:
    - Yoh Osaki

