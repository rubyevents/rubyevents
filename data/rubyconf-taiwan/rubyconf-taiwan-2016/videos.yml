- id: "konstantin-haase-rubyconf-taiwan-2016"
  title: "How we replaced salary negotiations with a Sinatra app"
  raw_title: "RubyConf Taiwan 2016 - How we replaced salary negotiations with a Sinatra app by Konstantin Haase"
  date: "2016-12-03"
  published_at: "2017-01-18T06:03:26Z"
