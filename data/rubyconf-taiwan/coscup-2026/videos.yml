- id: "lilith-coscup-2026"
  title: "Your Scraper Just Broke — Again: Hard-Won Lessons from 100+ Ruby Spiders in Production"
  date: "2026-08-08"
  language: "Chinese"
  video_provider: "scheduled"
  video_id: "lilith-coscup-2026"
  description: |-
    Maintaining one web scraper is easy. Maintaining over 100, each targeting a different financial institution's website, is a completely different beast.

    This talk is drawn from a real production Rails system that continuously downloads
    monthly report PDFs from Japanese asset management companies. When DWS silently migrated their REST API to a Nuxt.js SPA, when JPMorgan's ReactVirtualized table only rendered 12 visible rows and your target fund wasn't one of them, when Capital Group stopped offering PDF files and switched to HTML-only reports — your spiders just
    quietly broke.

    I'll walk through the three most common failure patterns and their Ruby solutions, how Module and Concern help organize shared logic across a large spider fleet, and the most important engineering judgment of all: when to fix, and when to just delete.
  speakers:
    - Lilith

- id: "cindy-liu-coscup-2026"
  title: "Three Common Design Pitfalls Behind Rails' March 2026 Security Update"
  date: "2026-08-08"
  language: "Chinese"
  video_provider: "scheduled"
  video_id: "cindy-liu-coscup-2026"
  description: |-
    On March 23, 2026, Rails released versions 7.2.3.1, 8.0.4.1, and 8.1.2.1, patching multiple CVEs spanning XSS, ReDoS, memory exhaustion, path traversal, and glob injection — its largest security update in recent years. Rather than walking through each CVE, this talk takes a step back: are there shared design pitfalls underneath? I'll pick the most representative cases and group them into three patterns: misplaced trust boundaries (mixing internal state with external input), filesystem APIs accepting unfiltered input (path traversal and glob injection), and "one fix isn't enough" — incomplete patches that get bypassed. Each pitfall comes with vulnerable code, how it was fixed, and a checklist you can apply directly to your project. No security background required.
  speakers:
    - Cindy Liu

