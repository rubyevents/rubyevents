- id: "nebiyu-elias-talefe-coscup-2026"
  title: "Building Native Mobile Apps Using Rails"
  date: "2026-08-08"
  language: "English"
  video_provider: "scheduled"
  video_id: "nebiyu-elias-talefe-coscup-2026"
  description: |-
    We all know Rails is a very mature framework for building web applications? But can it be used to build native mobile apps as well? Remember what react native/flutter did to building mobile apps. You write your app once in those frameworks and magically your app works both in the App Store and Play Store. This significantly reduces the development effort and allow you to have a smaller team size. But what if I tell you can pretty much do the same thing using Rails. With this approach you don't maintain separate apps for your mobile and backend. You also take advantages of the power of Rails from the start. We will explore hotwire native and how it can be used to build mobile apps that are native. This way you can accelerate your mobile app development and cut down your development effort significantly. We will also explore how to use strada to build native components using web technologies. I will also share my starter template for creating a mobile app project using Rails.
