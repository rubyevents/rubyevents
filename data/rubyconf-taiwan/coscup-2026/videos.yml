- id: "kasa-hsiao-coscup-2026"
  title: "Diving into Ruby 3 ReDoS Defense: Design Trade-offs, Rails Integration, and the Future of Regexp"
  date: "2026-08-08"
  language: "Chinese"
  video_provider: "scheduled"
  video_id: "kasa-hsiao-coscup-2026"
  description: |-
    "Left on read... every time I suggest a version upgrade."

    Ruby 3.2 introduced significant improvements to Regexp security and performance. With Ruby 4 recently released and Ruby 3.2 now officially reaching EOL, the community’s approach to ReDoS (Regular Expression Denial of Service) has gradually extended from “how do we write safe Regex” to “how can the runtime itself help reduce risk for developers.”

    However, the CVE-2026-1388 incident in GitLab and CVE-2026-33169 in Active Support in early 2026 once again remind us that in real-world web applications, Regexp can still become an unexpected source of performance and security issues.

    This talk continues the discussion from the RubyJam 2026.03 Meetup around Ruby Feature #17837 and #19104, and extends it with the latest developments in 2026:

    Case breakdown: Analyzing two ReDoS-related CVEs in 2026, and examining which Regexp patterns can still introduce risk under existing mitigation mechanisms.
    Rails in practice: How to integrate Regexp Timeout into Rails applications, and what practical pitfalls to watch out for.
    From ReDoS to Timing Attacks: Following up on questions from the RubyJam Meetup, exploring the other side of algorithmic complexity attacks, and how Ruby ecosystems implement Constant Time Comparison.
    The latest direction of Ruby Regexp: First-hand insights from RubyKaigi 2026, looking into the ongoing progress of introducing JIT into Regexp and what it may imply for security considerations going forward.
  speakers:
    - Kasa Hsiao

- id: "let-ai-take-over-your-app-building-a-seamless-microsecond-level-ruby-security-sandbox-coscup-2026"
  title: "Let AI Take Over Your App: Building a Seamless, Microsecond-Level Ruby Security Sandbox"
  date: "2026-08-08"
  language: "Chinese"
  video_provider: "scheduled"
  video_id: "let-ai-take-over-your-app-building-a-seamless-microsecond-level-ruby-security-sandbox-coscup-2026"
  description: |-
    In the era of AI, traditional software development paradigms have shifted significantly, bringing forth entirely new opportunities. Have you ever wondered if AI could dynamically implement new features right within your Ruby or Rails environment?

    Kobako was originally designed as a WebAssembly sandbox to bring the "Code Mode" mechanism into the Ruby ecosystem, allowing AI to write short scripts directly instead of orchestrating a massive number of fragmental MCP (Model Context Protocol) tools.

    However, inspired by druby, Kobako leverages Ruby’s dynamic language features to interact seamlessly with arbitrary objects in the Host environment. This opens up a completely different approach for AI to assist and drive software development.

    Sandbox technology is a crucial branch of "Harness Engineering," a topic being widely discussed this year. Centered on the core challenge of how to execute untrusted code safely, this talk will share the development and exploration journey of Kobako, showcasing a security sandbox born purely from embracing Ruby’s unique language features.
  speakers:
    - 蒼時弦也
