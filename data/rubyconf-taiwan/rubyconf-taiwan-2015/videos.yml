- id: "hiroaki-iwase-rubyconf-taiwan-2015"
  title: "Lightning Talk: Ruby based Distributed Key Value Store \\\"ROMA\\\""
  raw_title: "RubyConf Taiwan 2015-LT-02 Hiroaki Iwase：Ruby based Distributed Key Value Store ROMA"
  kind: "lightning_talk"
  date: "2015-09-11"
  published_at: "2015-10-15T15:24:25Z"
  video_provider: "youtube"
  video_id: "B3rzAoQ_UJk"
  description: |-
    I am going to introduce ROMA(Ruby/Rakuten On-Memory Architecture). ROMA is one of the data storing systems for distributed key-value stores. It is a completely decentralized distributed system that consists of multiple processes, called nodes, on several machines. It is based on pure P2P architecture like a distributed hash table, thus it provides high availability and scalability. This has been developed as an OSS product written in Ruby from 2007 with Matz. I will also share a GUI management tool named 'Gladiator', which is developed for Ruby on Rails, enabling developers to control ROMA more easily and intuitively.
  speakers:
    - Hiroaki Iwase

