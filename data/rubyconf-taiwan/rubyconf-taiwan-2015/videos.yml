- id: "nico-hagenburger-rubyconf-taiwan-2015"
  title: "Get rid of that front end"
  raw_title: "RubyConf Taiwan 2015 - Get rid of that front end by Nico Hagenburger"
  date: "2015-09-11"
  published_at: "2015-11-24T08:15:01Z"
  video_provider: "youtube"
  video_id: "ecdb0DTpRa8"
  description: |-
    For many back-end developers, the front-end is a pain. Dirty code within the application and even hard to test. So how can we use our experiences as Ruby developer to built a better front end?

    Not every application developer (back-end or JavaScript) places importance on the details of front-end structure. Instead, they prefer simply to use APIs — mostly with a JSON interface. Instead of interference with the front-end developer’s work, this provides a structured API that only takes care of defined values.

    CSS can’t live without HTML, and HTML almost can’t live without CSS. Let the front-end developer take care of both and consume the result as a well-tested API that takes nothing else than data as input.
  speakers:
    - Nico Hagenburger

- id: "lulalala-rubyconf-taiwan-2015"
  title: "Rewriting an imageboard"
  raw_title: "RubyConf Taiwan 2015 - Rewriting an imageboard by lulalala"
  date: "2015-09-11"
  published_at: "2015-11-24T09:04:43Z"
  video_provider: "youtube"
  video_id: "HsfhdGF26a4"
  description: |-
    幾年前我為了學習 Rails 而寫了一個類似 2ch 的貼圖版，但是找到工作後就忘了它的存在。幾年後我突然想知道要是能運用這幾年學到的經驗重寫的話，會發生什麼事。於是我重寫了。這裡我會整理自己在這次所得到的心得。

    A few years ago I wrote a 2ch-like imageboard in order to learn Rails. After finding a job I abandoned it... until now. I decide to apply all the knowledge I have learnt over the years into rewriting this app. Here I'll talk about what I have done, what I have changed, and how I felt during the process.
  speakers:
    - lulalala

- id: "aaron-patterson-rubyconf-taiwan-2015"
  title: "Request and Response"
  raw_title: "RubyConf Taiwan 2015 - Request and Response by Aaron Patterson"
  date: "2015-09-11"
  published_at: "2015-11-24T09:25:15Z"
  video_provider: "youtube"
  video_id: "u5AaZRVhecI"
  description: |-
    What goes in to a request and response in a Rails application? Where does the

    application get its data, and how does that data get to the client when you are

    done? In this talk we'll look at the request and response lifecycle in Rails.

    We'll start with how a request and response are serviced today, then move on

    to more exciting topics like adding HTTP2 support and what that means for

    developing Rails applications.
  speakers:
    - Aaron Patterson

- id: "tse-ching-ho-rubyconf-taiwan-2015"
  title: "gem 'webpack-rails'"
  raw_title: "RubyConf Taiwan 2015 - gem 'webpack-rails' by Tse-Ching Ho"
