    - Ruddy Lee

- id: "juanito-fatas-rubyconf-taiwan-2015"
  title: "RSpec for Practical Rubyist"
  raw_title: "RubyConf Taiwan 2015 - RSpec for Practical Rubyist by Juanito Fatas"
  date: "2015-09-11"
  published_at: "2015-10-16T08:37:52Z"
  video_provider: "youtube"
  video_id: "uatFCBHXJqU"
  description: |-
    Everyone knows testing is so important. Everyone knows the pros and cons of testing. But there are thousands of excuses to prevent you from writing tests. There are thousands of barriers to block beginners from writing tests. I want to promote more people start writing tests. I want to make writing tests extremely easy. In this talk I will cover enough testing backgounds, types of tests. Introduce RSpec as the weapon to test our Ruby/Rails application. RSpec magic spells to start writing tests. Give practical examples of the most important tests they can write after this talk. How to be a mocking bird to fake everything for testing real world interactions. Then cover other types of tests for them to go even further.
  speakers:
    - Juanito Fatas

- id: "assaf-gelber-rubyconf-taiwan-2015"
  title: "Beating Poker With The Help Of Ruby"
  raw_title: "RubyConf Taiwan 2015 - Beating Poker With The Help Of Ruby by Assaf Gelber"
  date: "2015-09-11"
  published_at: "2015-10-16T08:42:40Z"
  video_provider: "youtube"
  video_id: "Q2zIL9V2VIw"
  description: |-
    As a poker player, it is extremely important to analyze your decisions at the table and retrospectively all the time. Luckily for us, we can program so we can let Ruby do that for us! In this talk, we will explore why we need software in poker, what types of software can we use, and how to actually implement those tools in Ruby to make our decision making around the table much simpler, from basic statistical analysis of situations to understanding our opponents' strategy and tendencies. This talk will cover everything you need to become a better poker player with the help of Ruby as well as give you some general statistical analysis knowledge.
  speakers:
    - Assaf Gelber

