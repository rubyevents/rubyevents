- id: "elvis-saravia-rubyconf-taiwan-2015"
  title: "Lightning Talk: Venturing into Social E-Commerce Platforms"
  raw_title: "RubyConf Taiwan 2015 LT 08 Elvis Saravia：Venturing into Social E Commerce Platforms"
  kind: "lightning_talk"
  date: "2015-09-11"
  published_at: "2015-11-23T15:30:32Z"
  video_provider: "youtube"
  video_id: "53rHYs4_RoM"
  description: |-
    This talk focuses on the experiences, challenges, ideas and opportunities encountered while building your dream web platform project using Ruby on Rails. We take a curious look at how the student creator of Kuai List (kuailist.com), a social e-commerce platform, is doing just that. Everyday, we hear countless stories of new successful online platforms, their acquisitions, and their complexities. But few talk about what it takes to build one from the ground up. With the sudden rise of new programming technologies and easy-to-integrate services, online platforms have taken center stage and there is no better time to build your own. But even though it is important to get your ideas off the ground and seen, it is equally important to do it the right way and at the right time using the proper technology. Policies, standards, and security have never been more important to observe as they are now.
  speakers:
    - Elvis Saravia

- id: "evadne-wu-rubyconf-taiwan-2015"
  title: "Lightning Talk: Running with Sockets in Production"
  raw_title: "RubyConf Taiwan 2015 LT 09 Evadne Wu：Running with Sockets in Production"
  kind: "lightning_talk"
  date: "2015-09-11"
  published_at: "2015-11-23T15:37:54Z"
  video_provider: "youtube"
  video_id: "NKLV-qt5Uus"
  description: |-
    Since winter 2014 we’ve built and maintained a successful student coursework portfolio management application with server–client messaging capabilities and automatic content synchronization on the front-end. This talk discusses finer points of building such a web-client-facing synchronization layer and keeping it running in production without incurring infrastructural frustration or programmer headaches. I’ll briefly look at available solutions and explain the pros and cons of each approach when it comes to sending server-side updates to active client applications, and demonstrate a successful approach that has been proven in production by hundreds of thousands of users.
  speakers:
    - Evadne Wu

