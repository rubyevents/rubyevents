- id: "weihang-jian-rubyconf-taiwan-2015"
  title: "Gulp on Rails - Return Front end back to Front end Developers"
  raw_title: "RubyConf Taiwan 2015 - Gulp on Rails - Return Front end back to Front end Developers by 簡煒航"
  date: "2015-09-11"
