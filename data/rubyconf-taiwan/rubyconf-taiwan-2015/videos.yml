- id: "judy-tuan-rubyconf-taiwan-2015"
  title: "Make Your Rails App more Interactive with Angular"
  raw_title: "RubyConf Taiwan 2015 - Make Your Rails App more Interactive with Angular by Judy Tuan"
  date: "2015-09-11"
  published_at: "2015-12-17T08:21:16Z"
  video_provider: "youtube"
  video_id: "Mgtic-H_u-Y"
  description: |-
    Angular delivers the kind of web app people expect: fast, single-page, and highly interactive; and for developers the framework is powerful and fun to use. Just as Rails can feel magical because of how quickly we can build new applications and Ruby’s flexibility gives us freedom, Angular’s two-way bindings update models effortlessly, and powerful directives support code reuse. I will talk about how we transformed Indiegogo’s Rails web app with a new Angular front-end. I will share practical tips for getting started with Angular in your Rails app, and how data is transferred from your database through Rails to the front-end and back again.
  speakers:
    - Judy Tuan

