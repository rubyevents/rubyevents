- id: "don-werve-rubyconf-taiwan-2015"
  title: "Maker to Manager"
  raw_title: "RubyConf Taiwan 2015 - Maker to Manager by Don Werve"
  date: "2015-09-11"
  published_at: "2015-12-17T06:12:44Z"
  video_provider: "youtube"
  video_id: "InRCrvkyiX0"
  description: |-
    Stepping into a management role is often the most difficult career transition for a working programmer, and can be a sharp and painful lesson in how to lose friends and alienate people, as the skills required to successfully manage people are very different than the skills required to successfully cut code. We will discuss what it takes to be an effective manager, learn how to avoid many of the traps that await engineers that start down the management path, and explore several battle-tested management techniques that you can deploy within your team to nurture a culture of engineering excellence. If you are a developer taking on a leadership role, a first-time CTO, or a technical cofounder, then this talk is for you.Stepping into a management role is often the most difficult career transition for a working programmer, and can be a sharp and painful lesson in how to lose friends and alienate people, as the skills required to successfully manage people are very different than the skills required to successfully cut code.
  speakers:
    - Don Werve

- id: "ruddy-lee-rubyconf-taiwan-2015"
  title: "The future of project development"
  raw_title: "RubyConf Taiwan 2015 - The future of project development by Ruddy Lee"
  date: "2015-09-11"
  published_at: "2015-10-16T06:16:02Z"
  video_provider: "youtube"
  video_id: "KCtiGybxWQI"
  description: |-
    對軟體開發的成長過程而言；敏捷開發用迭代(iteration)式小週期循環的開發方式，克服了傳統開發對需求變更的無奈，成功克服了複雜專案的開發。但在這個 Mobile is eating the world的時代裡，任何開發作業的時間都嚴重的受到了挑戰，一切都越變越快，產品生命週期的長短就彷彿像手機App的安裝與移除一般的令人驚訝它的快速，此時能夠迅速交付產品的精實開發，

    便成了大家的寵兒，因為它能盡快提供具有足夠價值的產物給客戶，這種稱不上是創新卻能整合開發與維運的架構方式，就稱之為DevOps。
