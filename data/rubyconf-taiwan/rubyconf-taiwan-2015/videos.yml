- id: "manuel-vidaurre-rubyconf-taiwan-2015"
  title: "Using Ruby to Implement e-commerce"
  raw_title: "RubyConf Taiwan 2015 - Using Ruby to Implement e-commerce by Manuel Vidaurre"
  date: "2015-09-11"
  published_at: "2015-11-23T10:01:38Z"
  video_provider: "youtube"
  video_id: "yXgkDNmKUmU"
  description: |-
    Implementing e-commerce is complicated because there are several interconnected parts as: * Architectural Design and Patterns * Appropriate use of messaging, composition and inheritance * Balancing the transactions security and the user experience * Integration with 3rd-party services * Clear conversion funnel/workflow for ensuring business viability * Features management and implementation * I18n and localization * Continuos Integration and Deployment * Support and maintenance of e-commerce infrastructure We as a team focus in e-commerce implementation. Since several years ago, we have successfully implemented e-commerce for several customers, using Ruby, Ruby on Rails, Sinatra, Spreecommerce and other frameworks and platforms. We have learned many things in the process and we have identified common pitfalls and challenges. In this talk, those lessons learned will be presented, as well, how to implement a successful e-commerce.
  speakers:
    - Manuel Vidaurre

- id: "vipul-a-m-rubyconf-taiwan-2015"
  title: "React on Rails"
  raw_title: "RubyConf Taiwan 2015 - React on Rails by Vipul A M"
  date: "2015-09-11"
  published_at: "2015-11-23T10:31:35Z"
  video_provider: "youtube"
  video_id: "KgGA9PJL3TQ"
  description: |-
    Rails has seen a lot of MVC’s for the V layer itself. May it be Ember or Angular, unless there’s some heavy groundwork, these don’t gel well with existing applications. React JS being framework Agnostic, blows out of these requirements, and being dead simple is far easier to add to existing / new projects. In this talk we’ll do walkthrough on using React JS and some of the new ES 6 features it brings, and integrating and using React in Rails. We’ll then take a look at various integration approaches with Rails- webpack/browserify and how to manage data and states using backbone, flux, GraphQL+Relay and more.
  speakers:
    - Vipul A M

- id: "ted-johansson-rubyconf-taiwan-2015"
  title: "Beyond the MVC - An Object Taxonomy for Rails"
  raw_title: "RubyConf Taiwan 2015 - Beyond the MVC - An Object Taxonomy for Rails by Ted Johansson"
  date: "2015-09-11"
  published_at: "2015-11-23T10:54:21Z"
  video_provider: "youtube"
  video_id: "IAGDBMaFEg0"
  description: |-
    Rails goes to great lengths to convince us that we can get by with merely three different building blocks--the old, familiar models, views, and controllers. In early 2010, James Golick objected to this and proposed the (then controversial) idea of adding something called a Service Object, into the mix.

    In this talk, we will look at the development in the 5 years that have since passed. We will take a walk outside the compound, and explore a new taxonomy of objects that we can use in our Rails applications to create a richer domain model.
  speakers:
    - Ted Johansson

- id: "hiroshi-shibata-rubyconf-taiwan-2015"
  title: "Middleware as Code with mruby"
  raw_title: "RubyConf Taiwan 2015 - Middleware as Code with mruby by Hiroshi SHIBATA"
  date: "2015-09-11"
  published_at: "2015-11-23T15:03:54Z"
  video_provider: "youtube"
  video_id: "vKPtLI0JCG4"
  description: |-
    mruby is the lightweight implementation of the Ruby language and was released about a year ago. mruby has embeddable mechanism for middlewares like http server, search engine, etc.

    Embedded mruby provides ruby runtime and syntax to middlewares. It’s so powerful programming environment for Rubyists. Even with mruby, we were able to create web services with tests and gems, and it also helped to solve some problems using Ruby code outside of a Rails application.

    I will describe​ details of mruby in production service.
  speakers:
    - Hiroshi SHIBATA

- id: "sarah-allen-rubyconf-taiwan-2015"
  title: "Transparency Wins"
  raw_title: "RubyConf Taiwan 2015 - Transparency Wins by Sarah Allen"
  date: "2015-09-11"
  published_at: "2015-11-24T00:48:44Z"
  video_provider: "youtube"
  video_id: "-2_9WFtEvaA"
  description: |-
    Transparency is a powerful means of making change. Ruby’s open source approach has spread across an ecosystem of libraries and whole companies. Open source increases the speed of software development and leads to higher quality code. These patterns of how we make software are changing how we do business and how our governments work. These aren’t just patterns of how we write code; these are patterns of how we interact with each other, teach and learn new skills, and experiment with new ideas. When we make our work visible, we expand its potential, and increase the chances of dramatic, unexpected impact.
  speakers:
    - Sarah Allen

- id: "jiang-wu-rubyconf-taiwan-2015"
  title: "用Swagger實作Web API文檔"
  raw_title: "RubyConf Taiwan 2015 - 用Swagger實作Web API文檔 by 吳江"
  date: "2015-09-11"
  published_at: "2015-11-24T06:00:44Z"
  video_provider: "youtube"
  video_id: "ACXPGMu5kXU"
  description: |-
    随着Mobile程序和Single Page Application的流行，编写RESTful API变得越来越常见和重要。

    Swagger是一个简单而又十分强大的描述RESTful API的规范，允许开发者使用JSON描述API的元数据，结构和数据模型。Swagger的开发者社区在不断的成长。在规范以外，Swagger有多种实现，并提供丰富的工具套件，帮助API开发者生成交互性的文档（且与代码保持同步）和client SDK，大幅度地提高API的成功采用。

    除了很多start-up公司采用Swagger外，很多领先的科技企业比如 Microsoft, IBM, Apigee, Getty Images, Intuit, LivingSocial, McKesson, Morningstar 和 PayPal 也使用 Swagger 打造更优秀的 RESTful API。

    本次演讲主要介绍如何使用grape-swagger这个gem开发符合Swagger规范的API描述，减少代码和文档中的重复，并用Swagger UI展现文档和实时测试。
  speakers:
    - Jiang Wu

