- id: "ricky-pai-rubyconf-taiwan-2015"
  title: "Tools for Culture and Happiness"
  raw_title: "RubyConf Taiwan 2015 - Tools for Culture and Happiness by Ricky Pai"
  date: "2015-09-11"
  published_at: "2015-11-24T08:23:41Z"
