    As an application grows in both complexity and number of contributors, how do we keep the development process easy and happy? At Airbnb's Developer Infrastructure, we user tools to streamline the development experience in place of rules and process. At this talk, I will talk about some of the tools we've built at Airbnb.
  speakers:
