  raw_title: "RubyConf Taiwan 2015 - 百大媒體網站從 WordPress 到 Rails 的大小事 by Ronald Hsu"
  date: "2015-09-11"
  published_at: "2015-12-17T08:01:26Z"
  video_provider: "youtube"
  video_id: "-mW2lzqkBEA"
  description: |-
    WordPress 簡易的架設與強大的後台讓人愛不釋手，但其令人垢病的低落效能讓一個台灣百大的媒體網站，每每遇到重要時事新聞常因突然過大的龐大流量導致無法負荷。這次將分享將近一年時間，從 WordPress 前台＋Rails 後台，一步步到全站 Rails 過程的大小事，包含資料庫、程式與伺服器架構設計等。
  speakers:
