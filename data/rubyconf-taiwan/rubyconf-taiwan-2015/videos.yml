  description: |-
    We present the soon to be open-sourced "Series" (official gem name TBD) which makes it stupid easy to use traditional ActiveRecord + an SQL database in combination with the no-SQL Redis to store, index and have multiple views and collections of existing ActiveRecord objects, leveraging the strengths of each type of data store. The codebase has been in production at PicCollage for years handling up to 100K requests per minute.
