    Writing performant code is hard. Writing performant ruby code that does lots of stuff is really hard. CocoaPods got to be pretty slow “at scale”, and this is the story of how we made our pod install times bearable again.
  speakers:
    - Samuel Giddins

- id: "delton-ding-rubyconf-taiwan-2019"
  title: "Protect Your Copyrighted Ruby Code in Distribution"
  raw_title: "RubyConf Taiwan 2019 - Protect Your Copyrighted Ruby Code in Distribution by Delton Ding"
  date: "2019-07-26"
  published_at: "2019-08-11T07:24:58Z"
  video_provider: "youtube"
  video_id: "8umunkABF3E"
  description: |-
    As all Interpreted Programming Languages, Ruby projects' source code can be easily viewed in distribution. If your project supports self-hosted deployment, it may be hard to protect your copyrights. This talk would summarize existing methods, and tries to introduce some tricks in protecting your copyrights.
  speakers:
    - Delton Ding
