- id: "joel-saupe-solidusconf-2019"
  title: "Solidus API: From PWAs to Native and Beyond"
  raw_title: "Joel Saupe - Solidus API: From PWAs to Native and Beyond | SolidusConf 2019"
  date: "2019-10-21"
  published_at: "2019-12-02T17:27:05Z"
  video_provider: "youtube"
  video_id: "MJBog3hjAt4"
  description: |-
    Joel takes us through the Solidus API and introduces the Solidus SDK.

    "Solidus API: From PWAs to Native and Beyond"
    In a world of JavaScript and native apps, how does Solidus fit in? We’ll discuss the highs and lows of using the Solidus API, and how we built an extensible JavaScript SDK enabling us to develop Solidus backed PWAs, native apps, and more.

