- id: "john-thornton-rubyhack-2019"
  title: "A Better Way To Manage Secrets"
  raw_title: "RubyHack 2019 - A Better Way To Manage Secrets by Johnny T"
  date: "2019-04-03"
  published_at: "2019-04-11T22:20:28Z"
  video_provider: "youtube"
  video_id: "D9aAep89LeA"
  description: |-
    RubyHack 2019 - A Better Way To Manage Secrets by Johnny T

    Do you know when your API keys are being used? Do you want to make compliance audits easier? Can you immediately stop rogue apps from decrypting sensitive data (during a data breach)? Come learn how to level up your app security and answer "yes" to these and more.
  speakers:
    - John Thornton

- id: "jonathan-johnson-rubyhack-2019"
  title: "Modern JavaScript, without giving up on Rails"
  raw_title: "RubyHack 2019 - Modern JavaScript, without giving up on Rails Jonathan Johnson"
  date: "2019-04-03"
  published_at: "2019-04-11T22:29:13Z"
  video_provider: "youtube"
  video_id: "VO2CnXaH4Jc"
  description: |-
    RubyHack 2019 - Modern JavaScript, without giving up on Rails Jonathan Johnson

    In a world of emerging JavaScript, is Rails getting left behind? Are server-side MVC applications out and static single page applications in? In this talk I’ll describe how we’ve used webpack(er) and Vue to revitalize our JavaScript approach within an aging Rails application. You can have it both ways.
  speakers:
    - Jonathan Johnson

- id: "david-mitchell-rubyhack-2019"
  title: "Plan your next move like a chess game"
  raw_title: "RubyHack 2019 - Plan your next move like a chess game by David Mitchell"
  date: "2019-04-03"
  published_at: "2019-04-11T22:30:09Z"
  video_provider: "youtube"
  video_id: "0ZOWCqwYkBc"
  description: |-
    RubyHack 2019 - Plan your next move like a chess game by David Mitchell

    The need for developer resources is only increasing and while you may like the next offer you get, you may want to step back and decide if it's really what you want to do. Based on own experience and the experience of others in the field, Dave will share a few ideas on how to make the decision on your next career move.
  speakers:
    - David Mitchell

- id: "kelly-sutton-rubyhack-2019"
  title: "Taming Monoliths Without Microservices"
  raw_title: "RubyHack 2019: Taming Monoliths Without Microservices by Kelly Sutton"
  date: "2019-04-03"
  published_at: "2019-04-11T22:31:49Z"
  video_provider: "youtube"
  video_id: "uBSIKLgOz_o"
  description: |-
    RubyHack 2019: Taming Monoliths Without Microservices by Kelly Sutton

    In the recent years, microservices have been an investment among many engineering teams as they scale. They are often the default of many new companies. But how has that gone wrong? This talk will dive into how one company of ~100 engineers refined their thinking and their Rails app for the better.
  speakers:
    - Kelly Sutton

- id: "molly-struve-rubyhack-2019"
  title: "Cache is King: Get the Most Bang for Your Buck From Ruby"
  raw_title: "RubyHack 2019: Cache is King: Get the Most Bang for Your Buck From Ruby by Molly Struve"
  date: "2019-04-03"
  published_at: "2019-04-11T22:34:16Z"
  video_provider: "youtube"
  video_id: "KtHGa2cu3S8"
  description: |-
    RubyHack 2019: Cache is King: Get the Most Bang for Your Buck From Ruby by Molly Struve

    Sometimes your fastest queries can cause the most problems. I'll take you beyond the slow query optimization and instead zero in on the performance impacts surrounding the quantity of your datastore hits.. Using real world examples dealing with datastores such as Elasticsearch, MySQL, and Redis, I will demonstrate how many fast queries can wreak just as much havoc as a few big slow ones. With each example I will make use of the simple tools available in Ruby to decrease and eliminate the need for these fast and seemingly innocuous datastore hits.
  speakers:
    - Molly Struve

- id: "benjamin-porter-rubyhack-2019"
  title: "A Rubyist's Survival Guide to Elixir and Phoenix"
  raw_title: "RubyHack 2019 - A Rubyist's Survival Guide to Elixir and Phoenix by Benjamin Porter"
  date: "2019-04-03"
  published_at: "2019-04-11T22:39:30Z"
  video_provider: "youtube"
  video_id: "sSoz7q37KGE"
  description: |-
    RubyHack 2019 - A Rubyist's Survival Guide to Elixir and Phoenix by Benjamin Porter

    You've heard of this "better ruby" before, and it sounds intriguing. It's performant, very scalable, and functional. But, it's a bit weird. It looks a lot like ruby, but there's some big things that are different. Come learn how to survive in the jungle if all you have is Elixir and Phoenix!
  speakers:
    - Benjamin Porter

- id: "shawnee-gao-rubyhack-2019"
  title: "GraphQL Migration: A Proper Use Case for Metaprogramming?"
  raw_title: "RubyHack 2019: GraphQL Migration: A Proper Use Case for Metaprogramming? by Shawnee Gao"
  date: "2019-04-03"
  published_at: "2019-04-11T22:46:54Z"
  video_provider: "youtube"
  video_id: "BuoqNlRNRUU"
  description: |-
    RubyHack 2019: GraphQL Migration: A Proper Use Case for Metaprogramming? by Shawnee Gao

    Integrating GraphQL Ruby includes repetitive and straightforward processes that can be metaprogrammed. I will detail metaprogramming a GraphQL API from a demo app and explain the benefits of this design pattern and how it improves developer experience.
  speakers:
    - Shawnee Gao

- id: "nelson-wittwer-rubyhack-2019"
  title: "The Circle of Lifecycle Events"
  raw_title: "RubyHack 2019 - The Circle of Lifecycle Events by Nelson Wittwer"
  date: "2019-04-03"
  published_at: "2019-04-11T22:47:08Z"
  video_provider: "youtube"
  video_id: "cgneN2ISuGY"
  description: |-
    RubyHack 2019 - The Circle of Lifecycle Events by Nelson Wittwer

    The game of LIFEcycle events (create, update, delete) is often the starting point for complex code, nasty race conditions, and technical debt. You will learn a few patterns I’ve put together for how to cleanly manage lifecycle events in various architectures and give examples of when and why you should use them.
  speakers:
    - Nelson Wittwer

- id: "fernando-seror-rubyhack-2019"
  title: "The Way of the Mentor"
  raw_title: "RubyHack 2019 - The Way of the Mentor by Fernando Seror"
  date: "2019-04-03"
  published_at: "2019-04-11T22:43:31Z"
  video_provider: "youtube"
  video_id: "KIiLoVwL7H4"
  description: |-
    RubyHack 2019 - The Way of the Mentor by Fernando Seror

    There are people that are such great teachers that they awaken a special interest in what they teach. When on a team, they add immense value. Join me on this journey to become a great mentor for your peers!
  speakers:
    - Fernando Seror

- id: "jason-swett-rubyhack-2019"
  title: "Using Tests as a Tool to Wrangle Legacy Projects"
  raw_title: "RubyHack 2019 - Using Tests as a Tool to Wrangle Legacy Projects by Jason Swett"
  date: "2019-04-03"
  published_at: "2019-04-11T22:47:04Z"
  video_provider: "youtube"
  video_id: "NTr0h4v-jHw"
  description: |-
    RubyHack 2019 - Using Tests as a Tool to Wrangle Legacy Projects by Jason Swett

    Most of the production projects we developers work on are, to some extent, legacy projects. Legacy project work is often characterized by painfully low development velocity, scary deployments, frequent bugs and outages, and less-than-thrilled stakeholders. It's not a lot of fun. Fortunately it's possible to mitigate the pains of maintaining a legacy project. Automated tests can be used as a tool to permanently fix bugs, speed up development velocity and turn deployments into a non-event.
  speakers:
    - Jason Swett

- id: "brandon-weaver-rubyhack-2019"
  title: "Reducing Enumerable - An Illustrated Adventure"
  raw_title: "RubyHack 2019 - Reducing Enumerable - An Illustrated Adventure by  Brandon Weaver"
  date: "2019-04-03"
  published_at: "2019-04-11T22:47:13Z"
  video_provider: "youtube"
  video_id: "rmwIVarHc5E"
  description: |-
    RubyHack 2019 - Reducing Enumerable - An Illustrated Adventure by  Brandon Weaver

    Meet Red. Red is a reducing lemur, and he loves to sum things using the reduce method. The problem is, with Ruby 2.4+ and the sum method he's starting to think reduce isn't that useful anymore. Distraught, Red asks his master for advice, and she sends him off on a grand journey to learn the true powers of the reduce method by reimplementing various methods from Enumerable. Join Red on an illustrated adventure through the land of Enumerable as he learns to map, select, find, and more using his trusty reduce. If you're new to Ruby and Functional Programming, this is the talk for you.
  speakers:
    - Brandon Weaver

