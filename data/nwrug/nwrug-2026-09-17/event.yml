description: |-
  This month at NWRUG we'll be catching up on one of the talks that happened at this year's RubyConf in Las Vegas: The Anatomy of an ERB Rendering Engine by Marco Roth.

  Marco has been doing incredible work with Herb, his HTML-aware ERB Rendering Engine, which now looks like it will be appearing in the next version of Rails! This talk takes us on a whistle-stop tour of ERB rendering, before taking a look at the powerful features and efficiencies that Herb unlocks.

  Schedule

  - 6:30pm — We gather for pre-talk pizza
  - 7:00pm — The watch-along starts
  - 8:00pm — We retire to The Crown & Kettle for refreshments and further Ruby chat

