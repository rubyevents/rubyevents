- id: "nwrug-meetup-august-2026"
  old_id: "nwrug-august-2026"
  title: "NWRUG August 2026"
  event_name: "NWRUG August 2026"
  date: "2026-08-20"
  video_provider: "not_recorded"
  video_id: "nwrug-june-2026"
  description: |-
    This month Jade Dickinson will be showing us how we can leverage Rails' multi-database support to connect and query database outside of our main application:

    Multiple Databases support scaling Rails applications, but did you know you can also use them to connect to any database and query it using ActiveRecord? I’ll talk about the process of syncing data from a non-Rails app to our Rails monolith in order to sunset an old system. I will elaborate by explaining how I designed a sync mechanism that could run quickly and continuously, mapped information across database schemas, and the decisions I made to make it understandable, observable and easy to operate.

    Schedule

    - 6:30pm — We gather for pre-talk pizza
    - 7:00pm — Talk starts
    - 8:00pm — We retire to The Crown & Kettle for refreshments and further Ruby chat

    Registration

    If you plan to attend, be sure to register so we can plan for numbers.

    Thanks to our sponsors

