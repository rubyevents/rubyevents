description: |-
  What if you could...
  ~> integrate with new clients or services with zero new code?
  ~> show your CFO an exact dollar figure for what your tech debt costs each month?
  ~> pay pennies to handle each simple production error, rather than have them break the whole app with a hard failure?
  Everyone’s talking so much about AI that writes your code, we are missing the more interesting conversation about what happens when AI lives INSIDE your code.
  In this talk, I’ll present Squishling — a Ruby gem that gives your classes an LLM power-up — and walk through real production use cases from Coolhand Labs: easier integrations, measurable tech debt, and errors that fix themselves before anyone notices.
  ~~~
  Michael Carroll is the founder of Coolhand Labs, used by startups & public companies to prevent silent agent failures and drift in production AI & agentic workflows.
  Prior to becoming AI-pilled, he co-founded a health tech startup, RubiconMD, just barbarically coding it by hand until it was acquired by Oak Street Health in 2021. He was also VP Engineering in charge of Platform at Teladoc Health, the world's largest telemedicine provider, through the pandemic. Both experiences still cause him to wake up in a cold sweat at night.

