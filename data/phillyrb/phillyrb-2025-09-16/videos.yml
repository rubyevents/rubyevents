  description: |-
    When our growing Rails application started feeling the strain, we didn’t hit the reset button—we leveled it up.

    In this talk, Carlos will share how we chose evolution over rebuild, adopting Component-Based Rails Architecture (CBRA) and creating our own tools, such as Cobra Commander, to tackle the unique challenges of scaling. You’ll hear real-world strategies, hard-earned lessons, and our vision for keeping large Rails apps clean, maintainable, and ready for the future.
