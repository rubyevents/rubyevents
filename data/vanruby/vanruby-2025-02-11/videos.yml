  description: |-
    At Zipline, we used LaunchDarkly for a while. It worked well for a long time, but the per-user pricing can get pretty expensive. Here's a story of how we migrated our stack to Flipper and the challenges we faced.
    The talk includes:

    * Techniques used in evaluating both Flipper and LaunchDarkly simultaneously to find differences in evaluation
    * Differences between LaunchDarkly and Flipper
    * A deep dive into Flipper expressions to mimic certain LaunchDarkly behaviours
