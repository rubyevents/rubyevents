    StarCraft® II is the gold standard Real-time Strategy game.
    Several years ago (Google) DeepMind Technologies Ltd embarked on the zillion dollar journey to train AI to solve the open-ended problem of playing SC2. Thanks to their work, in partnership with Blizzard Entertainment®, they open sourced the AI training interface... which we abuse to host Bot vs Bot death-matches. Heck, yes! 🤘

