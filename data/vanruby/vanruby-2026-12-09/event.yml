  Once upon a time, back in 2014, in a faraway land known as Vancouver, a little tradition was born.
  In those days, when cloud computing was still young, there was a fellow who hosted monthly cloud gatherings at Lighthouse Labs and CodeCore in the magical neighbourhood of Gastown.
  Before each gathering, this fellow could always be found at The Pint, frantically finishing that evening's presentation.
  He never invited anyone to join him, for there were slides to finish and precious little time.
  But word spread, and one by one, familiar faces began appearing. A quick hello became a conversation, a conversation became a new friendship, and before long, his quiet preparation time had become a gathering of its own.
  And so he learned an important lesson: the fewer slides he prepared, the better the conversations became.
  Then, one December in 2016, a brilliant idea struck him.
  Or perhaps it was simply laziness disguised as brilliance.
  "What if," he wondered, "instead of preparing another presentation, I invited all of Vancouver's tech user groups to celebrate the year together?"
  And so, a new annual tradition was born.
  The years passed. Technologies rose and fell, friendships flourished, and the tradition grew. Even a great plague that swept across the land could only interrupt the festivities for a little while.
  Ten years after that first December gathering, the tradition continues where it all began.
  The Pint.
  And this year, half the pub will once again be transformed into a gathering place for Vancouver's tech community, filled with familiar faces, new connections, music, and a little festive magic.
  No slide decks. No demos. Just good people, great conversations, and a celebration of the community we've built together.
  And the best part of this fairy tale? Everyone is invited to be part of the next chapter.
  🎄 Here's what awaits you:
  🤝 An opportunity to meet and connect with people from across Vancouver's tech communities

  🎧 A DJ bringing the music and festive atmosphere

  🎁 Prizes and giveaways throughout the evening

  🎤 A few brief words from the sponsors who help make our community events possible

  🎉 Half of The Pint reserved exclusively for our gathering

  Wednesday, December 9, 2026
  6:00 PM onwards
  The Pint, Vancouver
  Whether you're a developer, architect, student, community organizer, tech leader, or simply someone curious about technology, there's a place for you here.
  Come on your own or bring a friend. Reconnect with familiar faces, meet people from communities you haven't explored yet, share stories, exchange ideas, and perhaps make a connection that leads to something wonderful.
  No presentations to sit through. No technical debates to win. Just a chance to celebrate the people who make Vancouver's tech community what it is.
  Because the best part of the tech community has never been the technology. It's always been the people.
  And as for how our story ends?
  Well, that's something we'll write together.
  See you there! ✨
