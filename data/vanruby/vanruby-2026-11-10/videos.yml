  title: "Following the Data: An Experiment in Ruby Program Slicing"
  date: "2026-11-10"
  language: "English"
  video_provider: "scheduled"
  video_id: "theo-melo-vanruby-2026-11-10"
  description: |-
    We've all inherited codebases where figuring out why something happens takes longer than fixing it. What if we could trace a value backward through a real execution and identify exactly which parts of the code contributed to it?

    In this talk, I'll share an early experiment combining Ruby's Prism and TracePoint to explore dynamic program slicing: what it might teach us about unfamiliar codebases, how it could help developers and coding agents, and the challenges I'm discovering along the way.
