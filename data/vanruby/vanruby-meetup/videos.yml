    - id: "sean-van-mulligen-vanruby-meetup-november-2024"
      title: "Seamless Upgrades: How We Tackle Ruby and Rails Upgrades"
      event_name: "VanRuby Meetup November 2024"
      date: "2024-11-20"
      video_provider: "not_recorded"
      video_id: "sean-van-mulligen-vanruby-meetup-november-2024"
      description: |-
        Upgrading Ruby—or any core dependency—can be daunting for a large-scale platform. In this talk, we’ll explore how our organization approaches complex system upgrades with confidence. From dependency management and automated testing to feature flagging and canary deployments, I'll share strategies for minimizing risk, ensuring stability, and empowering teams to handle large upgrades smoothly.
      speakers:
        - Sean van Mulligen

