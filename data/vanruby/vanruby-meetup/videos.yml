      event_name: "VanRuby Meetup November 2024"
      date: "2024-11-20"
      video_provider: "not_recorded"
      video_id: "dawn-richardson-vanruby-meetup-november-2024"
      description: |-
        As you move into more senior engineering roles, the words "technical strategy" start being thrown around a lot. But what is technical strategy, and even if you know it, how do you turn it into execution and driving change. Dawn will share some experiences from her time as a Principal Engineer at Thinkific and personal learnings in moving skills from being an individual contributor towards becoming a technical leader.
