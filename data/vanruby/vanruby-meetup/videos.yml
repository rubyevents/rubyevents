  talks:
    - id: "paulo-ancheta-vanruby-meetup-february-2025"
      title: "Flipping LaunchDarkly"
      event_name: "VanRuby Meetup February 2025"
      date: "2025-02-11"
      video_provider: "not_recorded"
      video_id: "paulo-ancheta-vanruby-meetup-february-2025"
      description: |-
        At Zipline, we used LaunchDarkly for a while. It worked well for a long time, but the per-user pricing can get pretty expensive. Here's a story of how we migrated our stack to Flipper and the challenges we faced.
        The talk includes:

        * Techniques used in evaluating both Flipper and LaunchDarkly simultaneously to find differences in evaluation
        * Differences between LaunchDarkly and Flipper
        * A deep dive into Flipper expressions to mimic certain LaunchDarkly behaviours
      speakers:
        - Paulo Ancheta

- id: "vanruby-meetup-11-march-2025"
  title: "VanRuby Meetup March 2025"
  event_name: "VanRuby Meetup March 2025"
  date: "2025-03-11"
  video_provider: "children"
  video_id: "vanruby-meetup-11-march-2025"
  description: |-
    https://www.meetup.com/vancouver-ruby/events/306178269
  talks:
    - id: "dyson-returns-vanruby-meetup-march-2025"
      title: "Underground Competitive Coding: StarCraft 2 AI in Ruby!"
      event_name: "VanRuby Meetup March 2025"
      date: "2025-03-11"
      video_provider: "not_recorded"
      video_id: "dyson-returns-vanruby-meetup-march-2025"
      description: |-
        StarCraft® II is the gold standard Real-time Strategy game.
        Several years ago (Google) DeepMind Technologies Ltd embarked on the zillion dollar journey to train AI to solve the open-ended problem of playing SC2. Thanks to their work, in partnership with Blizzard Entertainment®, they open sourced the AI training interface... which we abuse to host Bot vs Bot death-matches. Heck, yes! 🤘

        The AI Arena community have a competitive ELO-based ladder and regular tournaments via ProBots.

        While primarily a Python/Java/C++/Rust-based community, several other languages are available. The Ruby interface was released this year.
        You don't have to be a game developer or even good at math to make a kick-ass Bot and there's tons of benefits for your personal growth. Come hear all about it and watch some LIVE DEMO's as we script a quick Bot to kick space-alien ass!
      speakers:
        - Dyson Returns

