- id: "vladimir-dementyev-rails-world-2026"
  title: "Durable orchestration on Rails: from continuation to workflow"
  raw_title: "Durable orchestration on Rails: From continuation to workflow - Vladimir Dementyev"
  date: "2026-09-24"
  start_time: "13:00"
  end_time: "13:30"
  announced_at: "2026-06-22"
  language: "English"
  track: "Track 2"
  video_provider: "youtube"
  video_id: "4dcv1a7eeMk"
  description: |-
    Active Job continuations were built to help long-running jobs survive deploys. Now they're becoming an orchestration primitive. Vladimir Dementyev (Evil Martians) looks at common multi-job patterns like pipelines, batches, timers and human-in-the-loop approvals, and at the tools Rails developers reach for today. He then introduces durable continuations for Active Job, a Rails-way extension that adds persisted state, step callbacks, uniqueness, timers and signals, so an entire workflow can live in a single job class.
  speakers:
    - Vladimir Dementyev

- id: "kinsey-durham-grace-rails-world-2026"
  title: "Agent-Proof Your Rails App: Your Codebase Is the Prompt"
  raw_title: "Agent-Proof Your Rails App: Your Codebase Is the Prompt - Kinsey Durham Grace"
  date: "2026-09-24"
  start_time: "13:45"
  end_time: "14:15"
  announced_at: "2026-06-22"
  language: "English"
  track: "Track 1"
  video_provider: "youtube"
  video_id: "QMkZ2J24XGI"
  description: |-
    Coding agents can write good Ruby. So why do so many of their pull requests still fail? At Rails World 2026, Kinsey Durham Grace draws on her time on GitHub's Copilot coding agent platform team, where she watched agents work in real codebases every day. Her argument is that agents usually fail for reasons other than programming ability.

    Kinsey looks at the gap between adoption and trust. She cites survey data showing 84% of developers use AI to write code but only 29% trust it. She also points to a study of more than 33,000 agent-authored PRs, which found conflict rates above 41% when two agents work at the same time. Because generation is cheap and verification is not, reviewing harder won't solve the problem. Instead, she shares research-backed changes you can make to your code and architecture so agents perform better and earn more trust, whichever agent you use.
  speakers:
    - Kinsey Durham Grace

