  description: |-
    How do you teach both AI agents and 180+ open-source contributors to work with a codebase they don't know? At Rails World 2026, RubyEvents.org maintainer Rachael Wright-Munn shows how custom Rails generators became the answer. She walks through building one from scratch, covering NamedBase vs. Base, arguments vs. options, auto-generated help docs, Thor templates, and file conflicts. She also shares practical fixes for flaky generator tests. Rachael then pairs the CLI with an AI skill, turns the same generators into MCP tools, and benchmarks every approach across models. The results show that smaller models with better tools can match or outperform frontier models on scoped, repeatable tasks for a fraction of the cost.
  speakers:
    - Rachael Wright-Munn

