    If AI writes your code in an hour but cleaning it up takes two days, better prompting won't fix it. Joël Quenneville (thoughtbot) explains why an agent is really a loop, and how to lean into that loop to raise the floor on the Rails code it writes. He moves judgment out of AGENTS.md and into deterministic tools like custom RuboCop cops, generators, hooks, focused review skills and domain-specific scripts.
