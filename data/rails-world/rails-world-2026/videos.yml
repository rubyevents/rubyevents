    Rails 8.2 ships with Herb, a toolchain that understands your HTML and Ruby together. At Rails World 2026, Marco Roth explains what Herb is and what it adds to the Rails view layer.

    Herb has full semantic and structural understanding of your ERB templates. That makes it possible to build a linter, a formatter, a language server, browser dev tools, and a dev server that updates your views and partials in real time without a page refresh. Now its engine renders and compiles ERB views inside Action View itself. Marco walks through what ships in Rails 8.2 and what an HTML-aware view layer makes possible next.
