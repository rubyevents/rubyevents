- id: "rachael-wright-munn-rails-world-2026"
  title: "Custom Rails Generators in RubyEvents"
  raw_title: "Custom Rails Generators in RubyEvents - Rachael Wright Munn"
  date: "2026-09-23"
  start_time: "13:45"
  end_time: "14:15"
