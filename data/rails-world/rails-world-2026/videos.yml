- id: "aaron-patterson-rails-world-2026"
  title: "Closing Keynote"
  raw_title: "Rails World 2026 Closing Keynote - Aaron Patterson"
  kind: "keynote"
  date: "2026-09-24"
  start_time: "16:30"
  end_time: "17:30"
  announced_at: "2026-06-22"
  language: "English"
  track: "Track 1"
  video_provider: "youtube"
  video_id: "t0knYnEYBRo"
  description: |-
    The purpose of a system is what it does, but only for those observing it. In the Closing Keynote of Rails World 2026, Aaron Patterson (Shopify) looks at performance through the "as-if rule": an optimization can change anything about your program, as long as nobody can observe the difference.

    Aaron covers what Ractors change about familiar patterns like memoization, how Ruby 4.0 quietly removes stack frames to make allocations 70% faster, and how ZJIT uses abstract interpretation to eliminate allocations entirely. Then he tells the story of how AI agents chained a RubyGems.org caching bug and rubydoc.info into a Rube Goldberg attack.

    His conclusion: your compiler promised you the as-if rule, but your AI hasn't, so keep reading your code.

    Aaron is also an AI-enthusiast. Watched alongside DHH's Opening Keynote, it shows the range of where the Rails community stands on our transition to AI-assisted development right now: we're all facing the same direction, but the conversation is how fast to go and when to take our eyes off the code.

    Plus: Aaron announced that Mike Dalessio joined the Rails Core team!
  speakers:
    - Aaron Patterson
