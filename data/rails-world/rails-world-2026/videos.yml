- id: "alicia-rojas-arely-rivera-rails-world-2026"
  title: "Layered Design, Layered Trust: How a Designer Started Shipping Production Rails"
  raw_title: "How a Designer started shipping production Rails - Alicia Rojas & Arely Rivera"
  date: "2026-09-23"
  start_time: "14:45"
  end_time: "15:15"
  announced_at: "2026-06-22"
  language: "English"
  track: "Track 1"
  video_provider: "youtube"
  video_id: "D1Y3tzhiAkw"
  description: |-
    What happens when a designer ships a 7,000-line PR to production? At Rails World 2026, Telos Labs software engineer Alicia Rojas and lead product designer Arely Rivera share the story of how a harness (design tokens, shared partials, and a short natural-language contract for AI agents) let Arely work directly in a Rails codebase, and what broke when it shipped anyway.

    They introduce the Onion Design Framework, five layers running from tokens and primitives to composed patterns, written rules, and screens, built so that agents can read and follow a design system. They also share results from running 33 agents on a single vague prompt, the one-sentence mistake that changed the outcome, and why cheaper execution makes human judgment and taste more valuable, not less.
  speakers:
    - Alicia Rojas
    - Arely Rivera

