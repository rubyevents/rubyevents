  description: |-
    MCP was everywhere, but what actually happens between an agent and a server? Enrique Mogollan, a software engineer at Handshake, set out to find out by building an MCP inspector in Ruby. In this talk he shows the raw messages that flow between client and server, then introduces Coatepec, an MCP server that keeps a warm Rails process running so agents can run tests, list routes and inspect models in milliseconds instead of waiting for Rails to boot. He also explains why returning less context helps agents focus, and closes with a look at MCP apps that render interactive UI in the chat window.
