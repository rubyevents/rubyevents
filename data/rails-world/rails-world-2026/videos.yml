- id: "mike-dalessio-rails-world-2026"
  title: "Hot Cell: Securing Active Storage in the age of AI"
  raw_title: "Hot Cell: Securing Active Storage in the age of AI - Mike Dalessio"
  date: "2026-09-23"
  start_time: "15:45"
  end_time: "16:15"
  announced_at: "2026-06-22"
  language: "English"
  track: "Track 1"
  slides_url: "https://mike.daless.io/prez/2026-09-23_rails-world-hotcell/slides.html"
  video_provider: "youtube"
  video_id: "swXl8M84YmM"
  description: |-
    At Rails World 2026, Mike Dalessio (newest member of the Rails Core team) gives a candid look at why security is so chaotic right now. As he puts it, AI has become very good at finding the bugs and trusting designs hidden in software humans wrote.

    Mike starts with a vulnerability he handled this summer involving Active Storage and libvips. He explains why the advisory was deliberately vague: he wanted to give teams time to upgrade before attackers moved in. He also explains how Active Storage works along the way. His goal is to make you worried first, then give you what you need to be proactive about securing your apps.
  speakers:
    - Mike Dalessio

- id: "tess-griffin-rails-world-2026"
  title: "Sharding Is Hard: Let's Make It Easier!"
  raw_title: "Sharding Is Hard: Let's Make It Easier! - Tess Griffin"
  date: "2026-09-23"
  start_time: "15:45"
  end_time: "16:15"
  announced_at: "2026-06-22"
  language: "English"
  track: "Track 2"
  video_provider: "youtube"
  video_id: "yLoqg7UkryU"
  description: |-
    When your database has outgrown the biggest box you can buy, sharding is the next step. Using a multi-clinic healthcare app as the example, Tess Griffin (thoughtbot) covers how to choose a shard key and how to route queries using Rails' built-in sharding or a proxy like PgDog. It also covers what to do about cross-shard joins and transactions. The core lesson is that good sharding comes down to good boundaries.
  speakers:
    - Tess Griffin

- id: "robby-russell-rails-world-2026"
  title: "Keynote: The Most Valuable Engineer Isn't Shipping Features"
  raw_title: "The Most Valuable Engineer Isn’t Shipping Features - Robby Russell"
  kind: "keynote"
  date: "2026-09-23"
  start_time: "16:30"
  end_time: "17:30"
  announced_at: "2026-06-22"
  language: "English"
  track: "Track 1"
  video_provider: "youtube"
  video_id: "XXjTdyhml0c"
  description: |-
    Makers build new things. Menders tend what already exists, and most professional software work is mending. In this closing keynote from Rails World 2026, Robby Russell (Planet Argon) talks about the "local workshop" every mature Rails app builds on top of the framework: the patterns, shortcuts, workarounds and oral traditions that teams quietly learn to compensate for, and that AI coding agents now have to rediscover every time their context resets.

    Drawing on client work, years of podcast interviews and conversations in conference hallways, Robby shares agrees that while producing code has gotten cheaper, deciding what belongs, what can be trusted and what should change still takes human judgment.
  speakers:
    - Robby Russell

- id: "fireside-chat-rails-world-2026"
  old_id: "yukihiro-matz-matsumoto-david-heinemeier-hansson-rails-world-2026"
  title: "Ruby, Rails, and the future of programming"
  raw_title: "Ruby, Rails, and the future of programming - Matz, DHH & Jeremy Daer"
  kind: "fireside_chat"
  date: "2026-09-24"
  start_time: "10:00"
  end_time: "11:00"
  announced_at: "2026-08-07"
  language: "English"
  track: "Track 1"
  video_provider: "youtube"
  video_id: "IEOqgPfGLQ8"
  description: |-
    What does it mean to be a Rubyist when agents write the code? In this Rails World 2026 fireside chat, Yukihiro "Matz" Matsumoto and David Heinemeier Hansson sit down with Jeremy Daer (37signals) to talk about shaping the future of Ruby and Rails as AI-assisted development becomes the norm.

    They cover the identity shift from software writer to software maker, why taste and joy still matter, and Matz's new Spinel compiler, which turns Ruby into native binaries using a fraction of the memory. They also get into slop, trust, and handing judgment to agents, why Ruby turns out to be one of the most token-efficient languages, and what two decades of Ruby and Rails have gotten right.
  speakers:
    - "Yukihiro \"Matz\" Matsumoto"
    - David Heinemeier Hansson
    - Jeremy Daer

- id: "daniela-velasquez-rails-world-2026"
  title: "Agents on Rails: Building AI Pipelines in plain Ruby"
  raw_title: "Agents on Rails: Building AI Pipelines in plain Ruby - Daniela Velasquez"
  date: "2026-09-24"
  start_time: "11:15"
  end_time: "11:45"
  announced_at: "2026-06-22"
  language: "English"
  track: "Track 1"
  video_provider: "youtube"
  video_id: "OX5coKfra4c"
  description: |-
    Most apps hold far more insight in their data than anyone has time to find. Dashboards and chatbots still wait for users to come ask. At Rails World 2026, Daniela Velasquez shows how to flip that around by building proactive AI agents in plain Rails, with no extra framework needed.

    Daniela uses an example app that tracks an athlete's workouts, sleep, and heart rate. She builds an AI running coach that suggests training changes before the athlete asks. Everything starts with a simple Rails job. From there she adds a prompt, an LLM provider of your choice, and a set of tools the agent can decide to use, from in-app data like workout history and sleep logs to outside sources like weather forecasts and web search.
  speakers:
    - Daniela Velasquez

