- id: "donal-mcbreen-rails-world-2026"
  title: "Active Search"
  raw_title: "Active Search - Donal McBreen"
  date: "2026-09-23"
  start_time: "11:15"
  end_time: "11:45"
  announced_at: "2026-06-22"
  language: "English"
  track: "Track 1"
  video_provider: "youtube"
  video_id: "OlzIyVzmMgI"
  description: |-
    Donal McBreen, principal programmer at 37signals, introduces Active Search, a new full-text search framework for Rails. Like Active Record or Active Job, it gives you a single API with pluggable adapters. It supports databases with full-text features (SQLite, Postgres, and MySQL) as well as dedicated search engines such as Elasticsearch.

    Donal shows how 37signals uses Active Search in production. Basecamp runs it on Elasticsearch, while Fizzy, the free and open-source Kanban app, uses it to switch between MySQL and SQLite. He then walks through a demo app to show how Active Search works, from installation and configuration to searching full-text fields and filtering results.
  speakers:
    - Donal McBreen

- id: "andrew-novoselac-rails-world-2026"
  title: "Ractors, Rails, and Robots: Automating the Path to Ractor-safety"
  raw_title: "Ractors, Rails, and Robots: Automating the Path to Ractor-safety - Andrew Novoselac"
  date: "2026-09-23"
  start_time: "11:15"
  end_time: "11:45"
  announced_at: "2026-06-22"
  language: "English"
  track: "Track 2"
  video_provider: "youtube"
  video_id: "MVKUx-B_wHs"
  description: |-
    Ractors let Ruby run code truly in parallel inside a single process. They combine the parallelism of processes with the shared memory of threads. So what would it take to run Rails on a Ractor-based web server? At Rails World 2026, Andrew Novoselac, a developer on Shopify's Ruby on Rails Infrastructure team, takes a look at the effort to make Rails Ractor-safe.

    Andrew starts by explaining how Ractors compare to processes and threads, and why a Ractor web server is worth pursuing. He then explains why making a framework the size of Rails Ractor-safe is hard, and how his team used an AI agent loop to map the problem. He closes with the work being upstreamed to Rails today and what's coming next.
  speakers:
    - Andrew Novoselac

