description: |-
    Hi all!
    Yesterday was the first Utrecht.rb meeting. The free wifi at the Stairway worked as advertised and we learnt about some great (pet) projects. In no particular order there was:
    -Klinkr (http://klinkr.net/, Eelco et al.), a desktop client for Plazes which doesn't suck an restores Plazes to it's old glory.
    -TVNotify (http://tvnotify.com/, Justin), always be the first to know when you favourite TV show airs a new episodes. Especially handy in the aftermath of the writers stike!
    -BlogGIT (Sam), blogging was never easier. Bye bye forms, hello git! Leverage the power of git to destribute your posts. Still in alpha stages.
    -roarDoc (Martijn), annoyed by the poor accessability of the Ruby/Rails documentation? This charming little website hopes to alleviate that pain (Dutch lion included!).

    Then there was the usual tech talk, ranging from mind boggling monits and Gödel to the new round of financing for Wakoopa (congrats on that!).

    Hope to see the lot of you again in a months time! (That's the 7th of July.)
