- id: "stephan-kaemper-tiny-ruby-conf-2026"
  title: "What Rubyists should know about Unicode"
  raw_title: "What Rubyists should know about Unicode by Stephan Kämper"
  date: "2026-10-01"
  start_time: "11:30"
  end_time: "12:00"
  published_at: "2026-10-28T06:15:22Z"
  language: "English"
  video_provider: "youtube"
  video_id: "EmoNgM3Iir4"
  description: |-
    Everyone uses Unicode, whether they know it or not. To reliably process and display text across cultures and software components, all parties must handle it correctly—but many still treat text like it's 1990. This talk tours Unicode's origins, encodings, normalisation, and string behaviour with Ruby examples, presents delightfully awful bugs, and suggests sources to test your own systems.
  speakers:
