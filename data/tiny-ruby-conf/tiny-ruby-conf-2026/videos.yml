- id: "augustin-gottlieb-tiny-ruby-conf-2026"
  title: "Turbo Desktop: Bringing Rails to desktop apps"
  date: "2026-10-01"
  start_time: "13:30"
  end_time: "14:00"
  language: "English"
  video_provider: "scheduled"
  video_id: "augustin-gottlieb-tiny-ruby-conf-2026"
  description: |-
    We all know and love the fact that with Rails and Turbo Native we can maintain one single repo and have both Android and iOS support for our app, but what about desktop?

    I was asking myself this question, so I ended up using Rust to build Turbo Desktop, to bring my Rails apps to Windows, macOS and Linux. If you're curious how to bring Rails to your desktop, this talk is for you.
  speakers:
    - Augustin Gottlieb

