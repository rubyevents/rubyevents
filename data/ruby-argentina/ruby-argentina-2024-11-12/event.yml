  This is a collection of talks from the RubySur Meetup held on November 12th, 2024.

  Noviembre 2024 - IA + Testing

  Para cerrar el año con todo, en RubySur vamos a tirar la casa por la ventana con dos charlas imperdibles sobre inteligencia artificial y buenas prácticas de testing. Este último evento del año promete y queremos que seas parte. ¡No te lo pierdas!

  “Ruby + IA: de la teoría a la práctica”
  Speaker: Juan Pablo Balarini, CTO de eagerworks
  Exploraremos el potencial de la inteligencia artificial, desde los conceptos clave hasta ejemplos prácticos en una aplicación de Ruby on Rails.

  “Testing: Buenas prácticas y performance”
  Speaker: Joaquín Vicente, de Razor y miembro activo de la comunidad de RubySur
  Una charla sobre cómo escribir y organizar tests eficientes, equilibrando la calidad del código, la practicidad y la performance. Joaquín compartirá estrategias para optimizar tiempos de ejecución y reducir la complejidad de las pruebas, asegurando una suite de testing confiable para el desarrollo de aplicaciones.

  📅 Fecha: 12 de Noviembre, 19:00 - presencial

  Sumate y seguí aprendiendo con la comunidad RubySur. ¡Nos vemos ahí!

