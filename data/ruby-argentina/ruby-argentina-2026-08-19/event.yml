  This is a collection of talks from the RubySur Meetup held on August 19th, 2026.

  Teuton: Test de Infraestructura

  David Vargas Ruiz | Profesor FP de Sistemas y Aplicaciones Informáticas

  Teuton es una gema Ruby que se empezó a desarrollar hace más de 10 años para solucionar el problema de automatizar la evaluación de los trabajos realizados por los alumnos en sus dispositivos. Empezamos con un pequeño script y poco a poco el proyecto fue creciendo y evolucionando mientras mejorábamos nuestro conocimiento del lenguaje. Al final, creamos una gema "Test de infraestructura".

  Sólo muestramos las posibilidades de la herramienta y cómo se usa.

  La gema está generando un pequeño ecosistema a su alrededor: gema "teuton-get" (descargar tests), "teuton-panel" (en desarrollo)


  Lo que Aprendí por Construir un Servidor de Videojuegos con Ractors!

  Miles Georgi | Creador de Foobara

  Miles va a hablar de ractors y concurrencia en Ruby! Compartiendo las cosas interesantes que aprendió y las epifanías que llegspearon por las malas al hacer un servidor de videojuegos con mucho uso de ractors. Vamos a hablar sobre las restricciones, deseos para el futuro de ractos, y preguntas para decidir si ractors tienen sentido para tu proyecto y equipo.
