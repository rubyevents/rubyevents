    Viktor Fonic describe su experiencia customizando Visual Studio Code para trabajar de manera más eficiente. Nos cuenta sobre algunas de las extensiones más populares y otras no tan conocidas (como Bust a gem, Custom CSS and JS loader), como hacer macros y configurar los keybindings para realizar acciones con pocos tecleos.

