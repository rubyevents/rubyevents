- id: "montreal-rb-meetup-september-2024"
  title: "Montreal.rb Meetup September 2024"
  event_name: "Montreal.rb Meetup September 2024"
  date: "2024-09-04"
  video_provider: "children"
  video_id: "montreal-rb-meetup-september-2024"
  description: ""
  talks:
    - id: "andy-maleh-montrealrb-meetup-september-2024"
      title: "Ruby GUI Desktop Development Hands-On Tutorial"
      kind: "workshop"
      event_name: "Montreal.rb Meetup September 2024"
      date: "2024-09-04"
      video_provider: "not_recorded"
      video_id: "andy-maleh-montrealrb-meetup-september-2024"
      description: |-
        Bring your laptop and learn how to instantly build Desktop GUI Applications in Ruby with a hands-on tutorial that teaches the basics of [Glimmer DSL for LibUI](https://github.com/AndyObtiva/glimmer-dsl-libui), a Ruby gem that won a [Fukuoka Ruby 2022 Special Award](https://www.digitalfukuoka.jp/topics/187?locale=ja) by Matz, the creator of Ruby, after it was presented to him and the Fukuoka Ruby judges in 2022. Desktop Development provides the simplest case of Visual Development of GUI (Graphical User Interface), so learning it transfers into better Web Development skills as well. Software Engineers who know Desktop Development make much better Web Developers. Everyone will walk out of this tutorial knowing how to build a simple Desktop Application in Ruby.

        Desktop Applications provide the foundation of every full-size computer Operating System, such as Mac, Windows, and Linux. Desktop Applications cover many areas like image processing (e.g. Photoshop), office productivity (e.g. Microsoft Office), personal management (e.g. Mac Calendar), web browsing and web-development-support (e.g. Chrome, meaning all Web Surfers & Web Developers use a Desktop Application whether they realize it or not), file system exploration (e.g. Finder), command line execution (e.g. Terminal), games (e.g. Solitaire), software development (e.g. RubyMine), database management (e.g. Toad), platform monitoring (e.g. Activity Monitor), and operating system configuration (e.g. System Settings).

        Before arriving at the meetup, make sure to install the cross-platform [Glimmer DSL for LibUI Ruby gem](https://github.com/AndyObtiva/glimmer-dsl-libui#setup) on your laptop by running `gem install glimmer-dsl-libui`, and then running `glimmer examples` to verify the ability to run a Ruby Desktop Application successfully. You may contact the project owner if you run into any setup issues before the meetup.

        After the tutorial is done, all attendees are welcome to optionally stay and hack on their laptops while asking questions and getting help with building their own Desktop Application ideas.

        https://www.meetup.com/montrealrb/events/302320603
      speakers:
        - Andy Maleh

