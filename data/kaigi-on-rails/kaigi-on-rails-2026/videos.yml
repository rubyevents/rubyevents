- id: "takafumi-onaka-kaigi-on-rails-2026"
  title: "その Valkey 使いこなしていますか？"
  event_name: "Kaigi on Rails 2026"
  date: "2026-10-17"
  start_time: "15:50"
  end_time: "16:05"
  language: "Japanese"
  track: "Lime Hall"
  slides_url: "https://speakerdeck.com/onk/2026-10-17-are-you-making-the-most-of-valkey"
  video_provider: "scheduled"
  video_id: "takafumi-onaka-kaigi-on-rails-2026"
  description: |-
    Valkey (Redis) は単なる KVS ではありません。多彩なデータ構造を備えたインメモリデータストアです。

    それなのに、普段のアプリケーション開発では session store や cache、Sidekiq の queue としてしか使っていない、というケースは少なくないのではないでしょうか。せっかくそこにある機能を使わないのは、少しもったいないと思っています。

    このセッションでは、まず Sorted Set を使ったランキング実装を題材にして Valkey のパワーを紹介します。ランキング専用のロジックをアプリケーション側に持たず、Valkey のデータ構造そのものに仕事を任せる設計は、とても気持ちが良いものです。

    さらに、公式モジュールである Valkey Search によるベクトル検索や、Bloom Filter のような確率的データ構造にも触れ、「Valkey をアプリケーションの機能として使う」という発想を紹介します。

    「Valkey = キャッシュ」ではもったいない。ランキング、検索、レコメンド、重複判定など、アプリケーションの中核となる機能を支えるデータストアとして Valkey を使い倒す。その面白さを、実例を交えながらお話しします。
  speakers:
    - Takafumi ONAKA

- id: "shinichi-maeshima-kaigi-on-rails-2026"
  title: "How to Design Configuration for Rails Applications"
  event_name: "Kaigi on Rails 2026"
  date: "2026-10-17"
  start_time: "16:15"
  end_time: "16:45"
  language: "Japanese"
  track: "Magenta Hall"
  slides_url: "https://speakerdeck.com/willnet/how-to-design-configuration-for-rails-applications"
  video_provider: "scheduled"
  video_id: "shinichi-maeshima-kaigi-on-rails-2026"
  description: |-
    Railsアプリケーションを動かすには、Railsやインフラの設定、アプリケーション固有の設定など、数多くの設定が必要です。その管理方法にも、環境変数、Credentials、YAML、DB、PaaSやIaaSの設定管理機能、各種gemなど、多くの選択肢があります。さらに、管理した設定値をアプリケーションからどのように参照するかにも、ENV、config.x、独自のクラスやメソッドなどの選択肢があります。これらをどのように組み合わせれば、開発者がアプリケーション開発に集中できるでしょうか。

    設定の管理方法は、アプリケーション開発の初期には深く検討されないことも少なくありません。そして、問題に気づいてもリファクタリングされにくい領域です。設定の変更は障害につながる可能性があり変更の心理的ハードルが高いうえ、そもそも設定の管理方法をリファクタリングするという発想自体が生まれにくいからです。

    この発表では、設定を「起点・中継点・終点」という流れと、秘密性や変更タイミングなどの性質から整理したうえで、「まとめる」「確認しやすい形にする」という2つの方針を軸に、Railsアプリケーションにおける設定の設計方法を説明します。発表を通じて、アプリケーションの規模や要件に応じて設定方法を選択し、設定に関する負債を溜めにくい設計を考えられるようになることを目指します。
  speakers:
    - Shinichi Maeshima

- id: "naoto-takai-kaigi-on-rails-2026"
  title: "3回つくってわかった、定期実行ジョブ基盤の本質情報"
  event_name: "Kaigi on Rails 2026"
  date: "2026-10-17"
  start_time: "16:15"
  end_time: "16:45"
  language: "Japanese"
  track: "Lime Hall"
  slides_url: "https://speakerdeck.com/takai/i-built-a-scheduled-job-platform-three-times-and-now-i-know-the-essential-truths"
  video_provider: "scheduled"
  video_id: "naoto-takai-kaigi-on-rails-2026"
  description: |-
    多くのRailsアプリケーションには、日次の集計やデータ連携のような、決まった時刻に動くジョブがあります。こうした処理は、Solid QueueやSidekiqのような非同期ジョブを使えば手軽に始められます。しかし、業務システムが複雑になると、定期実行ジョブには単なるスケジューリング以上の要件が求められるようになります。

    たとえば、同時実行の防止、長時間実行による突き抜け、失敗時の再実行、依存関係の制御、実行履歴の追跡、通知、可観測性などです。これらを扱うには、専用の実行管理基盤として進化させる必要があります。

    また、こうした基盤をアプリケーションの外につくっても、ジョブが実行するドメインロジックはRailsアプリケーションの中にあります。そのため、Railsに書かれた処理を基盤からうまく呼び出す工夫が欠かせません。

    この発表は、sidekiq-schedulerの定期実行ジョブを、AWS中心のクラウドネイティブな実行基盤へ移行した経験にもとづきます。発表者が定期実行ジョブ基盤をつくるのは、これで3回目です。Railsアプリケーションのための定期実行ジョブ基盤をどのように設計し、実装するかに焦点を当てます。どうやって既存のジョブを移行しやすくするか、どうやってアプリケーションエンジニアの認知的負荷を下げるか、どうやって運用しやすくするか、という観点から具体的に議論します。
  speakers:
    - Naoto Takai

- id: "akira-matsuda-kaigi-on-rails-2026"
  title: "Web Framework Benchmark Battle 2026, Any%"
  event_name: "Kaigi on Rails 2026"
  date: "2026-10-17"
  start_time: "16:55"
  end_time: "17:25"
  language: "Japanese"
  track: "Magenta Hall"
