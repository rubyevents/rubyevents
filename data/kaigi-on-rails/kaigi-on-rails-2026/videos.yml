- id: "kondo-uchio-kaigi-on-rails-2026"
  title: "Zen and the Art of File Upload Maintenance"
  event_name: "Kaigi on Rails 2026"
  date: "2026-10-17"
  start_time: "11:30"
  end_time: "12:00"
  language: "Japanese"
  track: "Lime Hall"
  slides_url: "https://udzura.jp/slides/2026/kaigionrails/"
  video_provider: "scheduled"
  video_id: "kondo-uchio-kaigi-on-rails-2026"
  description: |-
    ファイルアップロードは一見地味ですが、現代のWebサービスには欠かせない機能です。一方Railsでは、Active Storage登場以前のライブラリが本番環境で動き続けていることも多く、設計の負債が溜まりやすい領域でもあります。

    このトークでは、とある人事労務系SaaSで長年稼働してきたファイルアップロード機能を題材に、サービスを止めずに改善してきた実践の記録をお話しします。動き続ける古い基盤に対して、「どの順番で負債をほどくか」「今ある大量のデータをどう扱うか」「既存ライブラリをどこまで延命し、どこまでモンキーパッチし、どこから置き換えを検討するか」などなどの、現場の試行錯誤と格闘の過程をそのまま開示します。

    具体的には以下のテーマを扱います。

    - ファイルアップロードライブラリに共通するライフサイクルなど基本事項の理解
    - ファイルパスの決定ロジックや、「[履歴機能](https://kaigionrails.org/2025/talks/hypermkt/)」との相性が生んだ課題
    - 負債を一つずつほどいていく改善ロードマップと、その裏での試行錯誤
    - ライブラリを更新するか、置き換えるかの判断基準

    このトークが、皆さんにとって自分のサービスの負債と向き合うための道標となり、ファイルアップロード機能の「禅」に触れるきっかけになれば幸いです。
  speakers:
    - Kondo Uchio

- id: "ryusei-aoki-kaigi-on-rails-2026"
  title: "RailsはAIという責務をどう受け入れるのか — AIという新しい責務をRailsらしく設計する"
  event_name: "Kaigi on Rails 2026"
  date: "2026-10-17"
  start_time: "13:30"
  end_time: "13:45"
  language: "Japanese"
  track: "Magenta Hall"
  video_provider: "scheduled"
  video_id: "ryusei-aoki-kaigi-on-rails-2026"
  description: |-
    LLMを利用したAI機能をRailsアプリケーションへ組み込むこと自体は、それほど難しくありません。APIへプロンプトを送り、結果を受け取るだけであれば、これまでの外部API連携と同じように実装できます。

    しかし、実際にプロダクトへ導入してみると、プロンプト管理、モデル選択、Structured Output、非同期実行など、AIならではの設計上の課題に直面しました。AIでは、API通信だけでなく、アプリケーション側がAIの振る舞いそのものを設計する必要があります。

    本セッションでは、RailsアプリケーションへAI機能を導入した実例をもとに、「AIという責務をRailsでどのように設計するべきか」という問いに向き合った過程を紹介します。

    当初の実装でどのような課題が生まれたのか、どのような選択肢を検討したのか、そして最終的にどのような観点で責務を整理したのかを、実際の設計判断や採用しなかった選択肢も交えながら共有します。

    これからAI機能を導入する方はもちろん、すでに導入しているものの設計や責務分割に悩んでいるRailsエンジニアにとって、AIという新しい責務をRailsアプリケーションの中でどのように位置付けるべきかを考えるきっかけとなるセッションです。
  speakers:
    - Ryusei Aoki

- id: "taiju-higashi-kaigi-on-rails-2026"
  title: "Hypertext on Rails — HATEOAS が示す Rails の正しさ"
  event_name: "Kaigi on Rails 2026"
  date: "2026-10-17"
  start_time: "13:30"
  end_time: "13:45"
  language: "Japanese"
  track: "Lime Hall"
  video_provider: "scheduled"
  video_id: "taiju-higashi-kaigi-on-rails-2026"
  description: |-
    普段Railsで開発していて、フロントエンドとバックエンドを二重に管理している感覚はありませんか？その問題の原因と解決策のひとつは、RESTの**忘れ去られた4つめの制約**にあるのかもしれません。

    RESTの統一インターフェースには4つの制約があります。最初の3つはRESTful API設計でおなじみのものです。しかし4つめは **H**ypermedia **a**s **t**he **E**ngine **o**f **A**pplication **S**tateという制約で、後にHATEOASと名付けられましたが、あまり多くは語られてきませんでした。

    Fielding博士はこうも言っています。

    > REST APIs must be hypertext-driven

    気になります。私は「作者の気持ちを答えよ」の本当の正解が気になって仕方がないたちです。
    そこで、私はRailsでHATEOASを実践することをテーマに自分用の易占い（六十四卦）アプリを作り始めました。

    本トークでは易占いアプリの、特にHATEOASを意識した仕様や実装を紹介しながら、**アプリケーションの状態遷移をハイパーメディアに駆動させる**という設計がもたらす恩恵を具体的にお見せします。そして、普通のRailsアプリとHATEOASの関係、HotwireがHTMLを扱う必然性にも迫ります。
  speakers:
    - Taiju Higashi

- id: "yuji-teshima-kaigi-on-rails-2026"
  title: "ActionCableの相手はブラウザだけじゃない — Railsでデバイス群をリアルタイム管制する"
  event_name: "Kaigi on Rails 2026"
  date: "2026-10-17"
  start_time: "13:55"
  end_time: "14:25"
  language: "Japanese"
  track: "Magenta Hall"
  slides_url: "https://speakerdeck.com/yujiteshima/actioncable-no-aite-ha-dakejanai-rails-de-debaisugun-o-riarutaimu-kansei-suru"
  video_provider: "scheduled"
  video_id: "yuji-teshima-kaigi-on-rails-2026"
  description: |-
    ActionCable の相手は、いつもブラウザとは限りません。センサーを積んだ Raspberry Pi をコンシューマにすると、Rails はデバイス群にコマンドを配り、結果を受け取る「制御プレーン」になります。

    本発表では、その設計を実機の Raspberry Pi を繋いだ動くシステムで紹介します。物理デバイスを Device モデルと状態機械で扱い、heartbeat と定期照合で生死を追いかける。ActionCable を双方向の transport にして、結果は冪等に取り込む。ActiveJob で「実行先が物理デバイス」なジョブを組み、落ちる前提でリトライとバックプレッシャを設計する——おなじみの道具だけで、ここまで作れます。

    山場は「リアルタイムで Turbo Streams と生 ActionCable をどう使い分けるか」。毎秒届くスペクトルを HTML で撒くと転送量は約26倍、毎フレーム257個の DOM ノードが生まれます。実測ベンチから、低頻度の状態変化は Turbo Streams、高頻度の数値ストリームは生 ActionCable + canvas という判断基準を導きます。通知やダッシュボードなど、ふつうの Rails 開発にそのまま効く勘所です。

    ライブデモとともに、見慣れた Rails の意外な射程をお見せします。
  speakers:
    - Yuji Teshima

- id: "occhi-kaigi-on-rails-2026"
  title: "Railsで挑む大量データ永続化 〜600億件を永続化するための設計とボトルネックとの戦い〜"
  event_name: "Kaigi on Rails 2026"
  date: "2026-10-17"
  start_time: "13:55"
  end_time: "14:25"
  language: "Japanese"
  track: "Lime Hall"
  slides_url: "https://speakerdeck.com/occhi/rails-de-idomu-tairyou-deta-eizokuka-600-okuken-o-eizokuka-suru-tame-no-sekkei-to-botorunekku-tono-tatakai"
  video_provider: "scheduled"
  video_id: "occhi-kaigi-on-rails-2026"
  description: |-
    Railsアプリでの大量データ永続化や移行では、普段のCRUD中心の開発とは異なる設計が求められます。
    データ量が増えるにつれ、単純な保存処理だけではなく、データモデル、データストア、バッチアーキテクチャ、システム負荷まで考慮した設計が必要になります。
    弊社では、ユーザーの不正利用対策等のために、2.5億件を超える電話番号と、その20年以上にわたる使用履歴データをRailsアプリケーションへ取り込むプロジェクトに取り組みました。
    最初の課題は、20年以上の使用履歴をそのまま保存すると、600億件を超えるレコードになってしまうことでした。そこで、「状態が変化したタイミングだけを保存する」データモデルへ変更し、保存件数を大幅に削減しました。
    この変更により保存件数を大幅に削減できました。しかし、それでも数億件規模のデータを扱う必要があり、データストア選定、50GBを超えるCSVのストリーミング読み込み、並列Bulk Upsert、バッチのリラン設計、OOM、デッドロック、RDBMSのCPU負荷など、さまざまな課題に直面しました。
    本セッションでは、それぞれの課題に対する設計判断と、そのトレードオフを紹介します。
    単なる高速化テクニックではなく、Railsアプリケーションで大量データを安全かつ継続的に扱うための設計の考え方を持ち帰っていただける内容を目指します。
  speakers:
    - occhi

