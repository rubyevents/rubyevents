- id: "miyuki-koshiba-kaigi-on-rails-2026"
  title: "作れる、でも消せるか？──安全に「枯らして消す」機能削除術"
  event_name: "Kaigi on Rails 2026"
  date: "2026-10-17"
  start_time: "11:05"
  end_time: "11:20"
  language: "Japanese"
  track: "Magenta Hall"
  slides_url: "https://speakerdeck.com/chobishiba/drain-then-delete"
  video_provider: "scheduled"
  video_id: "miyuki-koshiba-kaigi-on-rails-2026"
  description: |-
    機能を作るのは簡単になりました。でも、消すのはどうでしょう？
    どこからも呼ばれていないと判断することは可能です、でも「呼ばれる経路は残っているが、使われない」機能はどうでしょう？

    目的があって追加した機能も、機能刷新や、別の機能に役割を奪われたりする場合もあります。検証のために追加したが、役目を終え不要になるケースもあります。そうして"あまり"使われなくなった機能は静かに積み上がります。残したままにすると、回帰テストは膨らみ、コードは少しずつ重くなり、変更のたびに足を引っ張る。

    では、どうすれば安全に消せるのか。鍵は「もう誰からも呼ばれていない」状態を作ることです。別のコードからも、積まれたジョブからも、古いアプリからも呼ばれなくなれば、その機能は安心して消せます。この「呼ばれなくしていく」作業を、このトークでは「枯らす」と呼びます。いきなり消すのではなく、まず使わせない。値を返すのをやめる。旧バージョンのアプリを壊さないよう受け止める。そうしてトラフィックやデータが枯れてから、順序を守って消す。

    実際に廃止したRails APIの機能を題材に、この「枯らしてから消す」一連の流れをお見せします。型を持てば、削除は一大事ではなく日常の選択肢になる。すると、作る合間に消せる。作るときから「どう消すか」も一緒に考える。そんな当たり前を持ち帰ってもらう15分です。
  speakers:
    - Miyuki Koshiba

- id: "hiroyuki-kanda-kaigi-on-rails-2026"
  title: "デプロイの先まで全部面倒を見る ― Kamal を社内 PaaS に育てた話"
  event_name: "Kaigi on Rails 2026"
  date: "2026-10-17"
  start_time: "11:05"
  end_time: "11:20"
  language: "Japanese"
  track: "Lime Hall"
  slides_url: "https://speakerdeck.com/dkan75/no-saki-made-zenbu-mendou-o-miru-kamal-o-shanai-paas-ni-sodateta-hanashi"
  video_provider: "scheduled"
  video_id: "hiroyuki-kanda-kaigi-on-rails-2026"
  description: |-
    「試しにアプリをデプロイしたい」— そう思っても、サーバーの準備に加えて DB やストレージを整えるにはインフラの知識が必要で、"ちょっと試す" には敷居が高い。結局ローカルで動かして終わり、という経験はないでしょうか。

    Rails 8 に標準搭載された Kamal を使うと、自前サーバーへのデプロイ自体はコマンド一発になります。それでも「アプリを動かすこと」までで、DB やストレージの準備、複数サーバーをうまく扱う運用の手間は、変わらず残ります。

    そこで、Kamal を土台に、その "残り" を丸ごと引き受ける社内 PaaS を Rails で作りました。リポジトリを選んでボタンを押すだけでサービスが動き出す、例えるなら社内版 Heroku です。
    狙いは "動かす" だけではなく、限られたサーバー群に多数のアプリを安全に同居させ、実運用に耐えること。複数サーバーへの自動分散やゼロダウンタイム入れ替えも裏側で担います。運用もデバッグもブラウザだけで完結。さらに API を通じて、AI Agent に会話で原因調査や修正まで任せられます。

    本発表では、Kamal にどこまで任せ、どこを作り込んだのかを紹介しながら、「インフラの仕組みも、使い慣れた Rails の道具で作れる」という実感を、きっと持ち帰ってもらえるはずです。
  speakers:
    - Hiroyuki Kanda

- id: "cristian-planas-kaigi-on-rails-2026"
  title: "The Revenge of the Cucumber: Safety Nets for AI Code"
  event_name: "Kaigi on Rails 2026"
  date: "2026-10-17"
  start_time: "11:30"
  end_time: "12:00"
  language: "English"
  track: "Magenta Hall"
  video_provider: "scheduled"
  video_id: "cristian-planas-kaigi-on-rails-2026"
  description: |-
    AI can generate code at unprecedented speed, but it can also generate bugs and regressions at unprecedented speed. As software creation becomes cheaper, the bottleneck shifts from writing code to verifying behavior.

    This talk revisits the rise and fall of Cucumber and BDD, exploring why executable specifications struggled to gain adoption and how AI may have changed the economics behind them. We'll discuss how Ruby teams can build practical testing pipelines for AI-generated code using AI-assisted system tests as a safety net.
