- id: "shugo-maeda-kaigi-on-rails-2026"
  title: "Refining Active Record"
  event_name: "Kaigi on Rails 2026"
  date: "2026-10-17"
  start_time: "15:50"
  end_time: "16:05"
  language: "Japanese"
  track: "Magenta Hall"
  slides_url: "https://speakerdeck.com/shugo/refining-active-record"
  video_provider: "scheduled"
  video_id: "shugo-maeda-kaigi-on-rails-2026"
  description: |-
    以下のコードのように、文字列操作やArelのようなメソッドチェインではなく、Rubyの自然な式でクエリを書きたいと思いませんか？

    ```ruby
    Employee.where { :age >= 50 }.select { [avg(:vacation_hours), sum(:sick_leave_hours)] }
    ```

    かつてRefinementsを使ってwhereを拡張するactiverecord-refinementsというgemがありましたが、Refinementsをブロックスコープで有効にする機能が処理系の実装上の都合でRuby 2.0から削除されてしまい、その夢は潰えました。
    Ruby 4.1の新機能となる予定のProc#refinedを使って、activerecord-refinementsを現代に蘇らせてみましょう。
  speakers:
    - Shugo Maeda
  additional_resources:
