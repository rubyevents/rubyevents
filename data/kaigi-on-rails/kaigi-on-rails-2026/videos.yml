- id: "yasuo-honda-kaigi-on-rails-2026"
  title: "Active Record Connection Adaptersにおける長年の課題に再び取り組む"
  event_name: "Kaigi on Rails 2026"
  date: "2026-10-16"
  start_time: "13:30"
  end_time: "14:00"
  language: "Japanese"
  track: "Magenta Hall"
  slides_url: "https://speakerdeck.com/yahonda/active-record-connection-adapters-niokeru-naganen-no-kadai-ni-futatabi-torikumu"
  video_provider: "scheduled"
  video_id: "yasuo-honda-kaigi-on-rails-2026"
  description: |-
    日々のCI failureや細かなライブラリの互換性変更といった、緊急性の高い作業に生成AIを活用できるようになった結果、これまで後回しにせざるを得なかった「重要だが緊急ではない」課題に、ようやく時間を割けるようになりました。

    私にとっては、Active RecordのConnection Adaptersにある2つの課題がそれにあたります。ひとつは2019年に自分の力不足で断念したマイグレーションのサードパーティアダプター対応で、いまも設計を何度も練り直しながら取り組んでいます。もうひとつは2017年から動きが止まっていた、SUPER権限なしでPostgreSQLの外部キー制約を一時的に無効化する対応で、こちらはPostgreSQLの修正をおこなったパッチがPostgreSQL 18.4でリリースされ、それを前提にRails 8.2でリリースされる予定です。

    生成AIはどんな問いにもそれなりの答えを返してくれるからこそ、その問いは本当に重要なのか、その答えは自分の課題を本当に解決するのかを考え抜く必要がある — この1年で得たその実感も含めてお話しします。
  speakers:
    - Yasuo Honda

- id: "yuta-onishi-kaigi-on-rails-2026"
  title: "FactoryBotをやめればRSpecは速くなるのか？"
  event_name: "Kaigi on Rails 2026"
  date: "2026-10-16"
  start_time: "13:30"
  end_time: "14:00"
  language: "Japanese"
  track: "Lime Hall"
  slides_url: "https://speakerdeck.com/yuta_onishi_97/factorybot-o-yamere-ba-rspec-ha-hayaku-naru-no-ka"
  video_provider: "scheduled"
  video_id: "yuta-onishi-kaigi-on-rails-2026"
  description: |-
    「いつの間にかCIの実行時間が伸びている…」

    Railsアプリケーションを運用するなかで、そんな経験をした方も多いのではないでしょうか？
    私もその一人です。

    CI高速化の手がかりを探していたある日、XでDHHのポストを発見しました。

    > [FactoryBot is the quickest way to kill your test suite performance with Rails. ... The secret? Rails Fixtures! ](https://x.com/dhh/status/1919291397909233858)

    このポストに影響を受けた私は、FactoryBotをRails Fixturesへ移行する取り組みを始めました。
    しかし、単純な置き換えでは済みませんでした。また、Fixturesを使えば必ず速くなるわけでもありませんでした。

    本セッションでは、FactoryBotからFixturesへの移行で直面した課題や失敗を振り返りながら、`let_it_be`やFixtureKitなども含め、それぞれの手段の特徴を整理します。
    そのうえで、実行速度、保守性、導入コストといった観点から、改善手段を選ぶための判断軸を紹介します。
  speakers:
    - Yuta Onishi

- id: "rira-kaigi-on-rails-2026"
  title: "AIエージェントのデバッグ能力を向上させよう — AI時代にRailsが輝く理由"
  event_name: "Kaigi on Rails 2026"
  date: "2026-10-16"
  start_time: "14:10"
  end_time: "14:25"
  language: "Japanese"
  track: "Magenta Hall"
  slides_url: "https://speakerdeck.com/rira100000000/ai-ejento-no-debaggu-nouryoku-o-koujou-saseyou-ai-jidai-ni-rails-ga-kagayaku-riyuu"
  video_provider: "scheduled"
  video_id: "rira-kaigi-on-rails-2026"
  description: |-
    AIエージェントにバグ修正を任せると、得意と不得意がはっきり分かれます。コードとテスト出力から原因を特定できるバグには強い一方、実行時の状態(レコードの実値、saveで実際に変わった属性、メモ化に残った古い値)に依存するバグでは切れ味が鈍ります。実行中のプロセスをその場で確かめる手段がないため、printの差し込みと再実行を重ね、最後は「動作確認をお願いします」と検証が人間に返ってきます。

    本トークでは、debug gemをMCP(AIエージェントに外部ツールを接続する共通規格)経由でAIに開放します。AIは実行中のRailsアプリをブレークポイントで止め、その瞬間の内部状態を自分で確かめ、仮説を事実として確定させてから修正し、直ったことまで変数レベルで検証できるようになります。
    実際にAIがrdbgに接続しバグを修正する様子をデモでお見せします。応用として、テスト失敗の瞬間のプロセスを保全しAIに調査させる構想にも触れます。

    この解法を支えているのは、Railsが積み上げてきた資産です。ActiveSupport::Notificationsを使えば、アプリのコードに手を入れずにSQL発行やジョブ投入をAIに観測させられます。モデルのリフレクションを使えば、スキーマ、関連、バリデーション定義をAIがその場で確認できます。これらがAI時代になぜ効くのかを整理して紹介します。
  speakers:
    - rira
  additional_resources:
    - name: "rira100000000/debug-mcp"
      type: "repo"
      url: "https://github.com/rira100000000/debug-mcp"

- id: "gogutan-kaigi-on-rails-2026"
  title: "Local CI × GitHub Actions ― 長所を活かすハイブリッドCIの実践"
  event_name: "Kaigi on Rails 2026"
  date: "2026-10-16"
  start_time: "14:10"
  end_time: "14:25"
  language: "Japanese"
  track: "Lime Hall"
  slides_url: "https://speakerdeck.com/gogutan/local-ci-x-github-actions"
  video_provider: "scheduled"
  video_id: "gogutan-kaigi-on-rails-2026"
  description: |-
    Rails 8.1で追加されたLocal CIは、CIの大幅な速度向上とコスト削減を両立する大きな可能性を秘めています。しかし、

    - 全てのCIをローカルで実行するのは不安
    - Dependabotなど、自動で起票されたPRの作業が不便になりそう

    などの懸念から導入を見送っていませんか？
    弊社では、Local CIとGitHub Actionsを併用することでこれらの懸念を解消し、それぞれの強みを活かして開発をしています。具体的には、mainブランチへのマージ時やDependabotのPRでは引き続きGitHub Actionsを利用しつつ、平常時はLocal CIを活用し、約140のモデルを持つRailsアプリケーションのCI実行時間を10分から2分程度に短縮しました。またGitHub Actionsのコストも約45%削減しました。
    本トークでは、まずLocal CIとそれを支えるGitHub CLI 拡張機能のgh-signoffを紹介し、Local CIの結果をGitHub上に安全に反映する仕組みについてお話しします。その後、Rails 8.2で導入予定の`group`を活用した高速化のコツ、CIの併用に必要なBranch protection rulesやWorkflowsの設定、両者の実行コマンドをDRYに保つ方法など、半年間の実運用で得たTipsを余すことなくお伝えします。
  speakers:
    - gogutan

- id: "svyatoslav-kryukov-kaigi-on-rails-2026"
  title: "Inertia Rails: The One-Person Framework with React & Friends"
  event_name: "Kaigi on Rails 2026"
  date: "2026-10-16"
  start_time: "14:35"
  end_time: "15:05"
  language: "English"
  track: "Magenta Hall"
  slides_url: "https://speakerdeck.com/skryukov/inertia-rails-the-one-person-framework-with-react-and-friends"
  video_provider: "scheduled"
  video_id: "svyatoslav-kryukov-kaigi-on-rails-2026"
  description: |-
    Rails promises a small team can stay productive across the whole stack. But what if you want to build your UI in React (or Vue, or Svelte)? Reach for it the usual way and Rails loses some of its magic. It becomes a JSON API behind a separate React app, and your small application grows into two codebases you sync by hand. The Rails ecosystem has a way out. Inertia Rails turns React into a view layer: your controllers still render the pages, with no API and no tangled client-state in between. Let's see how React learns to play by the rules of the One-Person Framework!
  speakers:
    - Svyatoslav Kryukov
  additional_resources:
    - name: "inertiajs/inertia-rails"
      type: "repo"
      url: "https://github.com/inertiajs/inertia-rails"

- id: "yuichi-goto-kaigi-on-rails-2026"
  title: "Domain Modeling with Vanilla Rails: 「操作」から再考するRailsの設計論"
  event_name: "Kaigi on Rails 2026"
  date: "2026-10-16"
  start_time: "14:35"
  end_time: "15:05"
  language: "Japanese"
  track: "Lime Hall"
  slides_url: "https://decks.yasaichi.com/20261016/domain-modeling-with-vanilla-rails"
  video_provider: "scheduled"
  video_id: "yuichi-goto-kaigi-on-rails-2026"
  description: |-
    複雑なロジックをどこに実装すべきか、そのために新しいレイヤーを導入すべきか。導入するならどこまでの責務を持たせるべきか。Railsコミュニティはこうした問いを長らく議論してきました。本発表は、これらの問いを一度手放すことを提案します。実装先に迷うとき、多くの場合、起きているのはレイヤーの不足ではなくモデリングの不足だからです。

    Railsのモデルはテーブルと対となる形で定義され、比較的単純なアプリケーションであればうまく機能します。しかし、機能要求が複雑になると、注文の確定や在庫の補充、ポイントの付与といった「操作」に固有のルールが現れます。Railsでは、操作のルールはその主体や対象となるモデルに実装されやすく、独立した概念として見落とされる傾向があります。その結果、これらのモデルが静かに肥大化し、保守性が低下していきます。

    本発表では、モデルとそのCRUD操作を中心としたRailsの設計が、高い生産性と引き換えにドメインにおける重要な操作を見落としやすい構造を持つことを解き明かします。そのうえで、ドメインのルールを、それを担うモデルごとに整理し、どの既存のモデルにも帰属しないルールから新しいモデルが生まれるまでの過程を設計判断とともに示します。

    本発表のあと、みなさんは実装先やレイヤーを議論する前に問うべきことを手にしているはずです。「このルールを担う概念は何か」という問いです。
  speakers:
    - Yuichi Goto

- id: "hayato-okumoto-kaigi-on-rails-2026"
  title: "PumaからFalconに移行したRailsアプリケーションでの実践"
  event_name: "Kaigi on Rails 2026"
  date: "2026-10-16"
  start_time: "15:50"
  end_time: "16:05"
  language: "Japanese"
  track: "Magenta Hall"
  slides_url: "https://speakerdeck.com/falcon8823/puma-kara-falcon-ni-ikou-shita-rails-apurikeshon-deno-jissen"
  video_provider: "scheduled"
  video_id: "hayato-okumoto-kaigi-on-rails-2026"
  description: |-
    ライブエンタメのチケット販売や会場物販、ECでは、熱狂的なファンが販売開始と同時にアクセスし、販売プラットフォーム全体で数分間に100万件を超えるリクエストが発生します。一方、クラウドプラットフォームの提供するオートスケーリングでは、アクセス増加の検知からコンテナ起動まで約5分かかり、増設が完了する頃にはピークを過ぎてしまいます。

    そこで、外部ID基盤とのプロトコル変換で販売開始時のログインを支えるRailsアプリケーションに、Fiberを活用するRack対応アプリケーションサーバ「Falcon」を使えないか検討しました。Pumaは外部API待ちにもスレッドを使いますが、FalconはFiber Scheduler対応のHTTP通信を待つ間に別のFiberへ処理を切り替えられます。定常時のコンテナ数を増やさず、短時間のピークを効率良く処理できる点に着目しました。

    このトークでは、既存のRailsアプリケーションへのFalcon本番導入を紹介します。既存のgemとHTTP通信の見直し、PumaとFalconを並行稼働させた段階導入、切り戻せる状態で比較・評価を進めた方法をお話しします。Falconと新しいHTTPクライアントを組み合わせた構成のレイテンシとCPU使用量、移行中の500エラー、運用上の注意点を、具体的な本番データで共有します。
  speakers:
    - Hayato OKUMOTO

- id: "emiko-ando-kaigi-on-rails-2026"
  title: "現場と育てるRailsモデリング 〜Spreadsheetから始めたモデル設計〜"
  event_name: "Kaigi on Rails 2026"
  date: "2026-10-16"
  start_time: "15:50"
  end_time: "16:05"
  language: "Japanese"
  track: "Lime Hall"
  slides_url: "https://speakerdeck.com/siroemk/genba-to-sodateru-rails-moderingu-spreadsheet-kara-hajimeta-moderu-sekkei"
  video_provider: "scheduled"
  video_id: "emiko-ando-kaigi-on-rails-2026"
  description: |-
    「エンジニアの知らないところで作られたSpreadsheetが重要な業務の一部になっている。Spreadsheetの運用をRailsアプリに移行したい。」

    こうした状況は多くの現場にあると思います。

    弊社は英語塾でRailsを使った学習管理システムを開発しています。弊社でもコーチングに欠かせない「レッスン報告」がGoogleスプレッドシート(以下、Spreadsheet)で管理されていました。

    東京から福岡まで分散する9つの校舎がそれぞれ独自のSpreadsheetを作り、レッスンごとに引き継ぎなどの業務日報を記録していました。レッスン報告は随時追記されるため、上書きで消える、データごとの権限管理ができないといった問題がありましたが、校舎ごとの差異が大きく、Railsアプリへの移行は長らく出来ずにいました。

    そこで私たちが最初に作ったのは「全校舎共通のシンプルなSpreadsheet」でした。

    当初は妥協案でしたが、このSpreadsheetが現場と業務概念を整理する場として機能し始めます。本セッションでは、半年の運用を通して業務概念が整理され、Railsアプリへの移行と約7万件のデータ移行が実現した過程を紹介します。

    理想のモデルを最初から設計できない状況で、現場と一緒に段階的にモデリングを進めるヒントを持ち帰っていただけたら嬉しいです。
  speakers:
    - Emiko Ando

