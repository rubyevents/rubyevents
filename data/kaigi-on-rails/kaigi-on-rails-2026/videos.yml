  video_provider: "scheduled"
  video_id: "akira-matsuda-kaigi-on-rails-2026"
  description: |-
    世間に出回っている「webフレームワークベンチマーク対決」みたいなコンテンツを眺めていると、Ruby on Railsは他言語のプロダクトたちに比べてかなり遅い部類のフレームワークという位置付けにされていることに気づきます。やられ役ですね。かませ犬ですね。そんな立場に甘んじているのはRailsのマーケティング上よろしくありません。どうにかしたいですね。

    そこで、本セッションでは、この手のベンチマークのスコアを、あらゆる手段を用いて改善してみます。要はRails本体をホゲるISUC○Nです。
    レギュレーションは、Any%とします。すなわち、対象のベンチマークがそれっぽく完走しさえすれば過程は問わないという競技となっています。

    本セッションを通じて、参加者の皆さまには、以下のようなものをお伝えできる予定です。
    - ソフトウェアのパフォーマンスをチューニングする際の考え方や進め方
    - Rails本体にパッチを当てる実作業の風景
    - OSSで遊ぶたのしさ
  speakers:
    - Akira Matsuda

- id: "rosa-gutierrez-kaigi-on-rails-2026"
  title: "Solid Queue: two years on Rails"
  event_name: "Kaigi on Rails 2026"
  date: "2026-10-17"
  start_time: "17:35"
  end_time: "18:05"
  language: "English"
  track: "Magenta Hall"
  slides_url: "https://rosa.codes/sq2026/"
  video_provider: "scheduled"
  video_id: "rosa-gutierrez-kaigi-on-rails-2026"
  description: |-
    Solid Queue 1.0 was released on 26 Sept 2024 and added as the default Active Job backend in Rails. Two years later, we're ready for version 2.0 in a totally different world. Let's review the basics and explore the path to a new major version. We'll go through new features such as single-process mode, batches or sharding, the non-linear path to them, and how maintaining an open-source project has changed since Solid Queue got started.
  speakers:
