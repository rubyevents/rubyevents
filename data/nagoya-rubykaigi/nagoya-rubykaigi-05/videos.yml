- id: "daichi-kamiyama-nagoya-rubykaigi-05"
  title: "特殊変数大全"
  date: "2026-09-19"
  start_time: "12:05"
  end_time: "12:25"
  language: "Japanese"
  video_provider: "scheduled"
  video_id: "daichi-kamiyama-nagoya-rubykaigi-05"
  description: |-
    `$~` `$_` `$1` `$&` `$!` `$stdout`… Ruby には `$` で始まる「特殊変数」が数多くあります。グローバル変数の一種ですが、内部を覗くと実態は違います。あるものは実行フレームにぶら下がるものだったり、あるものは仮想変数だったり、またあるものは Ractor や Ruby::Box ごとに隔離された値を持ちます。

    本トークでは、Ruby の特殊変数がどのような役割を持ち、それぞれが Ractor と Box でどのように扱われているのかについて深く見ていきます。
  speakers:
    - Daichi Kamiyama

