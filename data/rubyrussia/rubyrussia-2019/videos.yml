- id: "nikita-shilnikov-rubyrussia-2019"
  title: "Пишем функционально с алгебраическими эффектами"
  raw_title: "Пишем функционально с алгебраическими эффектами. Никита Шильников."
  date: "2019-09-28"
  published_at: "2019-10-22T08:40:35Z"
  language: "Russian"
  video_provider: "youtube"
  video_id: "Noeek0429rM"
  description: |-
    Алгебраические эффекты - относительно новая область, они позволяют программировать с эффектами просто, но при этом оставаясь в рамках чистых функций. В то время как статически типизированные языки смогут начать поддерживать такой подход только в будущем, динамические языки, такие как JavaScript или Ruby, могут практически реализовать его уже сегодня. Например, React internals теперь обернуты алгебраическими эффектами. Но в Ruby мы можем сделать это еще лучше! Я покажу, как вчерашняя теория решает сегодняшние проблемы (с файберами!).
  speakers:
    - Nikita Shilnikov

- id: "genadi-samokovarov-rubyrussia-2019"
  title: "Break, a debugger in plain Ruby"
  raw_title: "Break, a debugger in plain Ruby. Genadi Samokovarov."
  date: "2019-09-28"
  published_at: "2019-11-29T21:59:42Z"
  language: "English"
  video_provider: "youtube"
  video_id: "3QADeUVwJtA"
  description: |-
    Developing debuggers in C has given us a lot of maintenance headaches. In this talk, we’ll walk through the history of the CRuby debuggers and why we may want to reconsider C as their de facto language. We’ll learn about the API’s we have (and don’t have) in Ruby that can help us develop a full-featured debugger in plain Ruby. We’ll check-out break, which is an attempt to bring a debugger in IRB and Pry using only Ruby.
  speakers:
    - Genadi Samokovarov
