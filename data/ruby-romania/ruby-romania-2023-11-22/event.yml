description: |-
  Ruby Romania Meetup #01

  Welcome to the Inaugural Ruby Romania Meetup!

  Join us for our very first meetup where we'll have talks that delve into the practical application of Ruby in real-world scenarios and explore the latest developments in the language, presented by our two speakers, Jakob and Lucian.

  **Agenda**

  * "Ticket Alert! Crafting a Cinema Watchdog with Ruby" - [Jakob Cosoroabă](https://twitter.com/jcsrb)
  * "What's new in Ruby: A short history of language features from 2.7 to 3.2" - [Lucian Ghinda](https://twitter.com/lucianghinda)

  **Networking**

  Connect with fellow Ruby enthusiasts, exchange ideas, and collaborate on exciting projects.

  **Location**

  Softia provided the space for our first edition, we'll be meeting at their office in **Soseaua Virtutii 19D, Bucuresti**, etaj 2.

  Whether you're a seasoned Ruby developer or just starting your journey, this meetup is the perfect opportunity to learn, share, and grow within the Ruby community in Romania.
  See you there!
