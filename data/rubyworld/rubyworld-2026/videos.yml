- id: "irina-nazarova-rubyworld-2026"
  title: "Keynote: Ruby Startups Today"
  kind: "keynote"
  date: "2026-12-03"
  start_time: "10:55"
  end_time: "11:55"
  announced_at: "2026-06-30"
  language: "English"
  video_provider: "scheduled"
  video_id: "irina-nazarova-rubyworld-2026"
  description: |-
    Something is stirring. Quietly, a new generation of founders is choosing Ruby for their most ambitious work: not out of loyalty, but out of pragmatism.

    You'll meet them here: Y Combinator alumni, VC-backed teams, all asked the same questions: why Ruby, in 2026? What's great, and what's missing?

    Their answers live on the frontier: agentic software development, AI workflows written in Ruby, modern frontends built the Rails way, the arc from prototype to real scale. Let's hear their stories: where Ruby gives them leverage, where the ecosystem still has room to grow, and the shape of what is emerging across the cohort.

    Their success is Ruby's future. Let's talk about how each of us contributes: through open source, shared knowledge, and the experience we pass on. The next chapter of Ruby's story is being written right now. Let's write it together.
  speakers:
    - Irina Nazarova

- id: "shun-hiraoka-rubyworld-2026"
  title: "Run Ruby Everywhere with the seL4 Microkernel"
  date: "2026-12-03"
  start_time: "14:30"
  end_time: "14:45"
  language: "English"
  video_provider: "scheduled"
  video_id: "shun-hiraoka-rubyworld-2026"
  description: |-
    Ruby typically relies on various OS features to run. While this means it normally operates on a standard OS, we can also run Ruby on other machines by providing just the essential features through a custom kernel.

    In this session, I will talk about porting Ruby onto seL4, a microkernel, and how this enables running Ruby on a wide range of hardware platforms.
  speakers:
    - Shun Hiraoka

- id: "kota-koyama-rubyworld-2026"
  title: "Ruby × LLM: Is It Really Improving the User Experience? — Lessons from Error Detection and Anti-Patterns"
  original_title: "Ruby×LLMでユーザー体験は本当に向上していますか？——エラー検知から辿るアンチパターン"
  date: "2026-12-03"
  start_time: "14:50"
  end_time: "15:05"
  language: "Japanese"
  video_provider: "scheduled"
  video_id: "kota-koyama-rubyworld-2026"
  description: |-
    More and more products are integrating LLMs into applications built with Ruby.

    We implemented an AI-powered feature the way we normally would: using a transaction to ensure consistency and handling the work synchronously before transitioning to the next screen. The code passed review and all tests. Yet in production, users found themselves stuck on a loading screen, while our monitoring system fired an ActiveRecord::LockWaitTimeout alert.

    The code was working as designed. And yet, the user experience that AI was supposed to improve had actually gotten worse. Have you ever experienced something similar?

    In this session, we’ll take a single error that occurred in an AI-powered application form autofill feature and trace the journey from root cause to improvement, using before-and-after code and real-world measurements. Whether you’re planning to integrate LLMs into your application or are already dealing with the challenges, this session will provide practical insights to help you make better design decisions.
  speakers:
    - Kota Koyama

- id: "naoyuki-sato-rubyworld-2026"
  title: "Graduating from SaaS, Crossing the Sea: In-House Rails Behind 2,000 Unstaffed Gyms, and How AI Shifted the Build-vs-Buy Break-Even Point"
  original_title: "SaaSを『卒業』して、海を渡る — 無人ジム2,000店を支えるRails内製と、AIが動かしたBuild vs Buyの分岐点"
  date: "2026-12-03"
  start_time: "15:40"
  end_time: "16:10"
  language: "Japanese"
  video_provider: "scheduled"
  video_id: "naoyuki-sato-rubyworld-2026"
  description: |-
    chocoZAP runs 20,000 in-store cameras, digital signage, and a reservation system. All three started on SaaS and have since been replaced with in-house Rails systems. It all started with a lesson we learned when we relied on outsourcing. This talk shares, with real numbers, five years of bringing development in-house with a team that is half new graduates, and how the arrival of AI agents moved the break-even point of Build vs. Buy. We will also explain why we keep choosing Ruby in the AI era, and how our in-house platform has begun crossing the sea to Hong Kong and Taiwan.
  speakers:
    - Naoyuki Sato

- id: "george-asfour-rubyworld-2026"
  title: "Circuit Breakers for Ruby in the AI Era"
  date: "2026-12-03"
  start_time: "16:15"
  end_time: "16:45"
  language: "English"
  video_provider: "scheduled"
  video_id: "george-asfour-rubyworld-2026"
  description: |-
    This talk explores cascading failures, where delays in third-party APIs exhaust application resources and bring down unrelated parts of a system. It covers the basics of the circuit breaker pattern, its implementation in Ruby, production use with Redis, and the design and internals of the open-source circuit breaker gem Stoplight. It also explores how Lua scripts can improve performance by eliminating bottlenecks caused by Redis round trips.
  speakers:
    - George Asfour

