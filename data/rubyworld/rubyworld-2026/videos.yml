- id: "koichi-ito-rubyworld-2026"
  title: "Fine-Tuning LLMs with Ruby"
  original_title: "RubyではじめるFine-Tuning"
  date: "2026-12-04"
  start_time: "11:30"
  end_time: "11:45"
  language: "Japanese"
  video_provider: "scheduled"
  video_id: "koichi-ito-rubyworld-2026"
  description: |-
    Technologies for building LLM applications, such as RAG and MCP, are gradually gaining traction in the Ruby ecosystem. But what about fine-tuning, which adapts the LLM itself to specific requirements?

    While RAG provides a model with relevant external context at inference time, fine-tuning adapts the model's parameters to shape its behavior for a particular task. Fine-tuning is typically done in Python, with its mature machine learning ecosystem, but it can also be used from Ruby.

    This talk introduces the fundamentals of fine-tuning and shows how to work with it using Ruby, focusing on LoRA (Low-Rank Adaptation), a parameter-efficient fine-tuning technique. While the underlying machine learning backend is implemented in Python, Ruby code through PyCall provides a practical way to understand how fine-tuning works. The talk also explores how fine-tuning is used with local LLMs and shares the current state of the Ruby ecosystem around AI.
  speakers:
    - Koichi ITO

- id: "hiroshi-shibata-rubyworld-2026"
  title: "Ruby on Windows"
  date: "2026-12-04"
  start_time: "11:50"
  end_time: "12:05"
  language: "English"
  video_provider: "scheduled"
  video_id: "hiroshi-shibata-rubyworld-2026"
  description: |-
    Windows is the standard environment for companies, local governments and schools in Japan. Yet because setting it up is hard, many organizations have left Ruby out of their technology choices. This talk introduces a new way to install prebuilt Ruby with a single command, requiring neither administrator privileges nor an installer. I will also cover how we prepared a distribution that can pass a corporate security review. Ruby you can use with confidence on Windows lets AI agents take on more of the work, and raises the productivity of engineers regardless of the environment they work in.
  speakers:
    - Hiroshi SHIBATA

- id: "hasumi-hitoshi-rubyworld-2026"
  title: "REST Rebooted: What Funicular on Rails Carries"
  original_title: "REST再始動: Funicular on Rails が運ぶもの"
  date: "2026-12-04"
  start_time: "13:05"
  end_time: "13:20"
  language: "Japanese"
  video_provider: "scheduled"
  video_id: "hasumi-hitoshi-rubyworld-2026"
  description: |-
    Funicular lets you write the frontend of a Rails application in native Ruby. At its core, the Object-REST Mapper maps Rails resources onto Ruby objects that live in the browser.

    This talk revisits Roy Fielding's REST constraints one by one and shows that the code a Rails developer already writes satisfies each of them. Along the way it reveals the true face of the forgotten constraint, Code on Demand, and explains why Rails and REST have set out on a new journey together.
  speakers:
    - HASUMI Hitoshi

- id: "jumpei-ito-rubyworld-2026"
  title: "Bringing Ruby Camp DXRuby games to the browser: Rebuilding the game execution environment with PicoRuby.wasm"
  original_title: "Ruby合宿のDXRubyゲームをブラウザへ —— PicoRuby.wasmでゲーム実行環境を作り直す"
  date: "2026-12-04"
  start_time: "13:25"
  end_time: "13:40"
  language: "Japanese"
  video_provider: "scheduled"
  video_id: "jumpei-ito-rubyworld-2026"
  description: |-
    A game my teammates and I built with DXRuby at "Ruby Camp" in Shimane required a DirectX environment, so it was not something anyone could easily play. In this talk, I will share how I brought the game back to life so that it runs entirely in the browser using PicoRuby.wasm. I will discuss the challenges I faced while developing PicoDX, a DXRuby-like library I built for the port, as well as what I was and was not able to achieve. A live demo running in the browser will be shown at the venue.
  speakers:
    - Jumpei Ito

- id: "toshiaki-bash-koshiba-rubyworld-2026"
  title: "The Story of My Solo Hobby Project Bringing AI, MCUs, PCs, Smartphones, and Smartwatches Together through the Super-Kawaii AI Desktop Robot Stack-chan PicoRuby Edition"
  date: "2026-12-04"
  start_time: "13:45"
  end_time: "14:00"
  language: "English"
  video_provider: "scheduled"
  video_id: "toshiaki-bash-koshiba-rubyworld-2026"
  description: |-
    Since this spring, I have been developing a solo hobby project: a PicoRuby edition of "Super kawaii AI desktop robot" Stack-chan. I fully adopted PicoRuby across the entire stack, from the robot firmware and AI control to communication protocols and controller apps for Mac, iPhone, and Apple Watch, achieving seamless multi-device coordination.

    In this talk, I will share the technologies and communities that made this wide-ranging hobby project possible. I will present this journey as an example of a development style that scales effectively, even as a solo developer.
  speakers:
    - "Toshiaki \"bash\" KOSHIBA"

- id: "sampo-kuokkanen-rubyworld-2026"
  title: "From RubyWorld to Ruby PR: Fixing defined? and Giving Back"
  date: "2026-12-04"
  start_time: "14:05"
  end_time: "14:20"
  language: "English"
  video_provider: "scheduled"
  video_id: "sampo-kuokkanen-rubyworld-2026"
  description: |-
    At RubyWorld Conference, Matz told us to go out and send pull requests to Ruby. So I tried. I started small, writing tests for MRI and ruby/spec. While working on defined?, I found a bug in Ruby itself, and ended up fixing it.

    I'll show how I found the bug, how I tracked it down, and what it took to get the fix into Ruby. I'll also talk about getting started with open source, and how talking about your contributions keeps you going. Maybe even far enough to start a local meetup.
  speakers:
    - Sampo Kuokkanen

- id: "katsutoshi-fujihara-ko-ichiro-sugiyama-rubyworld-2026"
  title: "An mruby/c Programming Environment for Multiple Microcontroller Platforms and Its Educational Applications: From Block-Based Programming to Text-Based Coding, and from Browsers to Local Code Editors"
  original_title: "マイコン横断型mruby/cプログラミング環境の開発と教育実践  －ブロックからテキスト，ブラウザからローカルコードエディタまで－"
  date: "2026-12-04"
  start_time: "14:25"
  end_time: "14:55"
  language: "Japanese"
  video_provider: "scheduled"
  video_id: "katsutoshi-fujihara-ko-ichiro-sugiyama-rubyworld-2026"
  description: |-
    This presentation introduces an mruby/c programming environment for multiple microcontroller platforms that allows learners to progress step by step from block-based programming to text-based coding in Ruby, and from browser-based programming to development using a local code editor. We explain the roles of the individual tools that make up the environment, how they interact with one another, and how they are implemented. We also report on its use in regional robot contests and school education, support for the transition to text-based coding, and educational activities conducted in collaboration with the local Ruby community. The presentation includes live demonstrations of the environment.
  speakers:
    - Katsutoshi Fujihara
    - Ko-ichiro Sugiyama

- id: "miyuki-koshiba-rubyworld-2026"
  title: 'From "Fun" to Beyond: The Art of Workshop Design'
  original_title: "「たのしい」を入り口に、その先へつながるワークショップの作り方"
  date: "2026-12-04"
  start_time: "15:30"
  end_time: "15:45"
  language: "Japanese"
  video_provider: "scheduled"
  video_id: "miyuki-koshiba-rubyworld-2026"
  description: |-
    Workshops offer a supportive environment to take that daunting first step. Having hosted Ruby creative coding and PicoRuby workshops ranging from 30 minutes to 4 hours, I believe the goal in a limited timeframe is not complete mastery, but a sense of achievement: "I did it!" and "That was fun!"

    This session covers key goal-setting principles, criteria for streamlining content, and versatile structural frameworks adaptable to any timeframe. Real-world examples of corporate participation in workshops will also be presented.
  speakers:
    - Miyuki Koshiba

- id: "yuki-torii-rubyworld-2026"
  title: "How Are Teens Living with AI? — Notes from a Ruby Programming Contest for Young Coders"
  original_title: "中高生はAIとどう付き合っているか ― 中高生Rubyプログラミングコンテストの現場から"
  date: "2026-12-04"
  start_time: "15:50"
  end_time: "16:20"
  language: "Japanese"
  video_provider: "scheduled"
  video_id: "yuki-torii-rubyworld-2026"
  description: |-
    Now that generative AI has become part of everyday life, how are middle and high school students bringing it into their programming? In this talk, I will present data on AI usage gathered through the Ruby Programming Contest for Middle and High School Students. I will also share how Waffle, a nonprofit working to close the gender gap in tech, has positioned and incorporated AI into its programs, and how participants have responded. Drawing on both data and voices from the field, I will explore how young people learn programming in the age of AI, and what adults can do to support them.
  speakers:
    - Yuki Torii
