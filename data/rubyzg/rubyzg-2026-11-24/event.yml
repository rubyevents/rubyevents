description: |-
  Hello Rubyists!

  I'm happy to announce our November meetup featuring two interesting talks. We'll hear two different perspectives on using AI to build
  software and what the experience taught our speakers.

  This month our host is Opulento, an accounting firm that specializes in services and IT businesses. They also offer [21sitnica](https://21sitnica.com), a seminar for new business owners. Check it out if you're a freelancer or run your own company.

  Big thanks to Opulento for supporting the Ruby community!

  Here are our topics for the event:

  **How to use AI as your antifreeze buddy**
  by Iskren Nemet

  This is a somewhat personal story about my dreams and my first Rails project, which I worked on for almost a year recently finished with help from Claude Code.

  I'll walk you through how AI helped me as a junior developer to handle my anxiety and "ALL OR NOTHING" syndrome (also known as *perfectionism*) that kept freezing me. I'll also share what I learned and the tools I built along the way.

  **Building an app for scientific studies with Fable**
  by Marko Avlijaš
  After spending 40 hours a week programming at work, I wanted Fable to do as much of the work as possible while I did as little as possible.

  In this talk, I'll present the app we built for scientific studies and walk through key moments in the process, using prompts and responses to show where Fable worked well and where it needed direction. I'll also share how the experience changed the way I develop software.
