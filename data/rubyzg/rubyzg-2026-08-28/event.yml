description: |-
  Hi everyone!

  Summer means it’s time for another Zagreb Developers Drinkup! 🍻 Yup, we're again stepping out of our comfort zone and meeting people from other meetup groups!

  On **August 28th**, **7 local developer meetup groups** will once again get together for a joint drinkup.

  This year, we’ll be meeting at [Zmajska Pivovara “SIP”, Trnjanska cesta 111a](https://maps.app.goo.gl/zHcCyEyGsi5VBwPV9), from 6 PM until midnight.

  The format stays the same: no prepared talks, no presentations, no agenda — just drinks, casual conversations and a chance to meet other developers from Zagreb’s tech community.

  Since several meetup groups are joining forces, this is a great opportunity to step outside your usual community, meet some new people and find out what other developers and groups are up to. And with more people than at our regular drinkups, we’re expecting a pretty lively evening!

  Feel free to invite your developer friends, colleagues or anyone else from the tech community, even if they’re not active members of any of the meetup groups. **If you’re a developer, you’re invited!**

  **Here are the other meetup groups taking part:**
  Elixir Zagreb - [https://lu.ma/elixirzg](https://lu.ma/elixirzg)
  Golang ZG - [https://www.meetup.com/golang-zg/](https://www.meetup.com/golang-zg/)
  Google Developer Group Zagreb - [https://gdg.community.dev/gdg-zagreb/](https://gdg.community.dev/gdg-zagreb/)
  JavaScript Zagreb - [https://www.meetup.com/javascript-zagreb/](https://www.meetup.com/javascript-zagreb/)
  Python Hrvatska - [https://www.meetup.com/python-hrvatska/](https://www.meetup.com/python-hrvatska/)
  ZgPHP - [https://www.meetup.com/ZgPHP-meetup/](https://www.meetup.com/ZgPHP-meetup/)
  Zagreb Software Crafters - [https://www.meetup.com/zagreb-software-crafters/](https://www.meetup.com/zagreb-software-crafters/)
