description: |-
  Hello Rubyists!
  I'm happy to announce our October meetup with two interesting talks.

  This month our host is [Opulento](https://opulento.hr) \- an accounting firm that specializes in services and IT work\. This is the second time we have an event at their office \- first one was in 2023\, just after Covid lockdown\. Big thanks to Opulento for supporting Ruby community\.

  Here are our topics for the event:

  **RailsBilling - new commercial gem**
  by Bruno Sutić
  RailsBilling is a gem for adding modern billing subscriptions to your Rails app. It works out of the box, and installation takes a couple minutes. In this speech you will learn why it's needed and I'll also share some numbers about the launch of the project.

  **Hotwire++**
  by Fran Zekan
  Vanilla hotwire is great, but in larger projects it can be lacking. We'll explore some additional tooling to improve developer experience when scaling. We'll also look into how to use some more complex JS patterns when and if needed, exploring pros and cons of different patterns.
