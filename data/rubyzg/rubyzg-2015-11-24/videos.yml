  description: |-
    Ako vam se vaš Redis-backed background job library (Resque, Sidekiq ...) čini kao hrpa crne magije onda je ovo talk ko' stvoren za vas. U talku ćemo objasniti kako Sidekiq koristi Redis za queueing i scheduling te na koji način dodane jobove (efikasno) obrađuje. Bit će riječi o QUEUEovima, SETovima, ZSETovima, threadvoima i sličnim ezoteričnim ljepoticama.
