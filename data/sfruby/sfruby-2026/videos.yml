- id: "madison-sites-sfruby-2026"
  title: "The System Nobody Understood (Including AI)"
  date: "2026-11-10"
  language: "English"
  video_provider: "scheduled"
  video_id: "madison-sites-sfruby-2026"
  description: |-
    Every scaled Rails app has a stretch of backcountry nobody dares hike into: the part no one fully understands, so you patch it for years, until you can't. Ours had a critical bridge out there. The map showed it, the report said passable; I hiked in and it was all but gone. Our dashboards, our tenured engineers, and our AI were all confidently wrong. This is how we learned to trust only the ground.
  speakers:
    - Madison Sites

- id: "jp-camara-sfruby-2026"
  title: "Multiplayer Rails: collaborative editing, no Node required"
  date: "2026-11-10"
  language: "English"
  video_provider: "scheduled"
  video_id: "jp-camara-sfruby-2026"
  description: |-
    Your Rails app can be multiplayer! Last year I showed how to build real-time collaboration into Rails from scratch with Yjs. That work became yrby-rails and lexxy-realtime, which give Rails and Lexxy first-class Yjs support. Learn how to make your Rails app collaborative for humans and AI agents alike.
  speakers:
