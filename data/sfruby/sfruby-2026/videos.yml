- id: "alex-coomans-sfruby-2026"
  title: "Keeping Your Head on Straight in Concurrent & Complex Ruby Applications"
  date: "2026-11-11"
  language: "English"
  video_provider: "scheduled"
  video_id: "alex-coomans-sfruby-2026"
  description: |-
    Ruby applications depend on execution-scoped state, but Threads, Fibers, requests, and jobs can lose it, leak it, or restore it incorrectly. This talk introduces Persona's Context abstraction for safely inheriting and overriding that state, shows how we built dynamic configuration systems on top of it, and offers patterns you can apply in your own Ruby applications.
  speakers:
    - Alex Coomans

