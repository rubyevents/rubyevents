  title: "Reactive Rails Views, No Rewrite Required"
  date: "2026-11-11"
  language: "English"
  video_provider: "scheduled"
  video_id: "marco-roth-sfruby-2026"
  description: |-
    What if your existing Rails views could become reactive without rewriting them? In this talk, we'll explore how ReActionView brings fine-grained reactivity to HTML+ERB while staying compatible with Action View. We'll look at how existing templates can become reactive, how updates are tracked and rendered, and what this could mean for the future of the Rails view layer.
