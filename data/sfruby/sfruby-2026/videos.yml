- id: "cj-avilla-sfruby-2026"
  title: "Assign to Claude: Making an Agent a First-Class Teammate in Your SaaS"
  date: "2026-11-10"
  language: "English"
  video_provider: "scheduled"
  video_id: "cj-avilla-sfruby-2026"
  description: |-
    Most AI features are a chat box bolted onto the product. The good ones are woven through it: an agent you assign a card to, that triages the ticket before you read it, that spots a bad deploy and opens the incident itself. We'll build all three live in one Rails app on Claude Managed Agents (MCP, custom tools, memory, human approvals) and leave you a map of the agent-shaped holes in your product.
  speakers:
    - CJ Avilla

- id: "sergey-karayev-sfruby-2026"
  title: "The Multiplayer AI Manifesto"
  date: "2026-11-10"
  language: "English"
  video_provider: "scheduled"
  video_id: "sergey-karayev-sfruby-2026"
  description: |-
    AI has made individuals faster, but teams are not seeing proportional productivity gains. One reason is that today's AI tools are fundamentally single-player. Drawing on our team's experience, we present five principles for truly multiplayer AI and offer practical guidance for building or choosing a solution.
  speakers:
    - Sergey Karayev

- id: "ryan-sherlock-sfruby-2026"
  title: "Who Watches the Agents? Closing the Rails Loop from Code to Customers"
  kind: "keynote"
  date: "2026-11-10"
  language: "English"
  video_provider: "scheduled"
  video_id: "ryan-sherlock-sfruby-2026"
  description: |-
    At Fin, over 95% of pull requests are Agent-driven and most are approved without human review. This talk follows changes through our fifteen-year-old, three-million-line Rails monolith, from automated review and selective testing to production monitoring and rollback. Safe speed comes from layers of evidence, bounded authority, and fast recovery, not one perfect reviewer.
  speakers:
    - Ryan Sherlock

