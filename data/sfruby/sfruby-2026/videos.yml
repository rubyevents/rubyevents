- id: "ben-sheldon-sfruby-2026"
  title: "Building the same app twice: same problems, different decade"
  date: "2026-11-10"
  language: "English"
  video_provider: "scheduled"
  video_id: "ben-sheldon-sfruby-2026"
  description: |-
    Ten years ago I helped build and scale a welfare benefits app to aid more than 1 million people a year. Now, I'm doing it all again from the beginning. I'll compare the original 2016 product roadmap to what's possible in 2026, including feature appetites, team composition and enablement, and very, very different build-vs-buy decisions for an even more monolithic product.
  speakers:
    - Ben Sheldon

- id: "svyatoslav-kryukov-sfruby-2026"
  title: "Agents Scale, Humans Don't: Hiring Without Slowing Down"
  date: "2026-11-10"
  language: "English"
  video_provider: "scheduled"
  video_id: "svyatoslav-kryukov-sfruby-2026"
  description: |-
    One founder plus thirty agents ships more than a team of ten. Hire a second engineer and everything slows down. Why? You didn't add an engineer, you added a second team. We'll look at the fixes that fail, then at those I believe work well with Rails, and finally at what a founder must give up to get faster.
  speakers:
    - Svyatoslav Kryukov

- id: "carmine-paolino-sfruby-2026"
  title: "RubyLLM 2.0: The AI Framework Ruby Deserves"
  date: "2026-11-10"
  language: "English"
  video_provider: "scheduled"
  video_id: "carmine-paolino-sfruby-2026"
  description: |-
    RubyLLM made Ruby an AI language: one beautiful API for every provider, 11+ million downloads. 2.0 makes it a full framework: the agentic loop as public API, durable approval-gated agents, the most precise cost ledger in AI, caching, batches, fallbacks, citations, cancellation, server tools, speech, video, OCR, reranking, and a generator that writes provider gems. Ruby is where you ship AI.
