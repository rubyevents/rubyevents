description: |-
  Hey, Bay Area builders and tinkerers,

  In January [Persona](https://withpersona.com/) is hosting the first SF Ruby in 2026🥳

  Take the stage for 10-30 minutes. Here's what we are looking for:
  - demos of new and ambitious Ruby startups (just tell us what you're building with Ruby!)
  - new open source in Ruby/Rails ecosystem (including your wild experiments and new ideas in established open source projects)
  - real stories from Ruby/Rails apps and teams, solving complex, tricky, or fun problems
  Send your talk details here: [https://forms.gle/C9HQzaT5jvwA5xwc7](https://forms.gle/C9HQzaT5jvwA5xwc7)

  Agenda (preliminary):

  5.30 Intro
  5.40 Samuel Giddins (Persona): The 3Rs of Ruby Performance: Reduce, Reuse, Recycle (Objects)
  6.10 Enrique Mogollán (Handshake): Breaking Nil to fix Bugs
  6.40 break
  7.00 open mic
  7.10 Vitor Oliveira (Strides): What to Expect from Ruby 4.0
  7.40 Todd Kummer (Rockridge Solutions): Customizing form helpers and tag helpers
  8.10 wrap up

  ---

  Ruby is the quiet force behind the Bay Area's most successful tech organizations and startups from GitHub, Shopify and Stripe to Figma, Chime, and [bolt.new](https://bolt.new).

  We are gathering every month to learn, share, inspire each other, and it feels great because of MINASWAN 💗.

  Our meetups explore building and scaling Ruby and Rails applications. We go deep into technical topics and don't shy away from new ideas and weird experiments! We always have an open mic for everyone's announcements or questions🎙️! Join us in discovering the nicest Ruby HQs  🏙️❤️

  Catch you on the flip side! A massive shoutout to Persona for hosting and sponsoring the event.

