  Hey, Bay Area builders and tinkerers!

  In September we're excited to be hosted by our friends from Datadog 🐶.

  **✨ Be prepared to come on stage**

  Three great technical talks, followed by a full round of intros, and connecting.

  Agenda

  - 5:00 PM Doors open, food, drinks, mingling
  - 5:30 PM Welcome + community announcements, Irina Nazarova (Evil Martians)
  - 5:40 PM Jordan González (Datadog) "Ruby in the Age of Agents"
  - 6.10 PM Enrique Carlos Mogollán (Handshake) MCP Wins for the Context Window
  - 6:30 PM Konstantin Gredeskoul (ReinventONE) What you should have in your PostgreSQL skill
  - 6:50 break
  - 7:10 PM Intros: everyone gets 60 seconds on stage to introduce themselves (no slides), and after that we talk and connect!
  - 8:30 PM — Wrap

  **Want to speak?**

  10–30 minute talks on startups built on Ruby/Rails, open source you're shipping, hard problems you've solved, weird edge cases, AI/agent integrations — all welcome. Submit here: [https://forms.gle/C9HQzaT5jvwA5xwc7](https://forms.gle/C9HQzaT5jvwA5xwc7)

  Conference

  In November we're hosting a large scale conference, gathering 450 Ruby and Rails builders, engineers and founders. This is a must-go! Grab your ticket at sfruby.com

