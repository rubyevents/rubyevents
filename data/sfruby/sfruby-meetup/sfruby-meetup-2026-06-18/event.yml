description: |-
  Hey, Bay Area builders and tinkerers!

  This month we're hosted by PlanetScale and their new HQ!  PlanetScale's main API is a Rails monolith, and they ship [https://github.com/planetscale/planetscale_rails](https://github.com/planetscale/planetscale_rails) for zero-downtime migrations. Sam's (CEO) [demo at the SF Ruby ](https://sfruby.com/talks/?talk=planetscale-demo)Conference last November was a cool preview. PlanetScale for Postgres just hit GA, let's talk!

  **✨ New format**

  Let's try something different: fewer talks, more connecting. Two great talks, followed by a full round of intros, then we split into small interest-based circles so you actually get to know the people you're spending the time with.

  Agenda

  - 5:00 PM — Doors open, food, drinks, mingling
  - 5:30 PM — Welcome + community announcements
  - 5:40 PM — Irina Nazarova (Evil Martians): Discoverability of Ruby and Rails Resources for LLMs
  - 5:50pm — Irina Nazarova (Evil Martians): Local-first Rails with pglite and Electric: A Demo
  - 6:00 PM — Jeremy Evans (Ubicloud): Implementing Core Set
  - 6:30 PM — Hal Spitz: ActiveJob: Call Me Maybe
  - 7:00 break
  - 7:20 PM Networking: everyone gets 30 seconds on stage to introduce themselves (no slides), and after that we talk and connect!
  - 8:30 PM — Wrap

  **Want to speak?**

  10–30 minute talks on startups built on Ruby/Rails, open source you're shipping, hard problems you've solved, weird edge cases, AI/agent integrations — all welcome. Submit here: [https://forms.gle/C9HQzaT5jvwA5xwc7](https://forms.gle/C9HQzaT5jvwA5xwc7)

  **Community**

  - Slack: [join here](https://join.slack.com/t/sf-ruby/shared_invite/zt-3mi22dwb9-MGN_s0j_jNrt7hb4rvqkHg) and introduce yourself to connect with fellow Bay Area Rubyists
  - Past meetup recordings, talks, and the new (freshly audited!) job board: [https://sfruby.com](https://sfruby.com)
  - MINASWAN — Matz is nice and so we are nice. Come build new Ruby friendships.

  A massive shoutout to PlanetScale for hosting and sponsoring the event. 🙏

  Organized by Evil Martians.
