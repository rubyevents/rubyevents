description: |-
  Hey, Bay Area builders and tinkerers!

  This month we are hosted by our big friends from Sentry 🔥 and their hospitable HQ 😋!

  **✨ New format**

  We're doing something different: fewer talks, more connecting. Three great talks, followed by a full round of intros, and connecting.

  Agenda

  - 5:00 PM Doors open, food, drinks, mingling
  - 5:30 PM Welcome + community announcements, Irina Nazarova (Evil Martians)
  - 5:40 PM Cameron Dutro (Cisco) Garnet.js: Implementing the YARV Virtual Machine
  - 6 PM Alexander Baygeldin (Evil Martians) "Fair by design: orchestrating background jobs in Ruby"
  - 6:30 PM Marco Roth "The Anatomy of an ERB Rendering Engine"
  - 7:00 break
  - 7:10 PM Intros: everyone gets 30/60 seconds on stage to introduce themselves (no slides), and after that we talk and connect!
  - 8:30 PM — Wrap

  **Want to speak?**

  10–30 minute talks on startups built on Ruby/Rails, open source you're shipping, hard problems you've solved, weird edge cases, AI/agent integrations — all welcome. Submit here: [https://forms.gle/C9HQzaT5jvwA5xwc7](https://forms.gle/C9HQzaT5jvwA5xwc7)

  **Community**

  - Slack: [join here](https://join.slack.com/t/sf-ruby/shared_invite/zt-3mi22dwb9-MGN_s0j_jNrt7hb4rvqkHg) and introduce yourself to connect with fellow Bay Area Rubyists
  - Past meetup recordings, talks, and the new (freshly audited!) job board: [https://sfruby.com](https://sfruby.com)
  - MINASWAN — Matz is nice and so we are nice. Come build new Ruby friendships.

  A massive shoutout to Sentry for hosting and sponsoring the event. 🙏

  Organized by Evil Martians.
