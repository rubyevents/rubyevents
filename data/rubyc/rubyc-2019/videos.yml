- id: "yevhen-kuzminov-rubyc-2019"
  title: "A year with Hanami in production: the Good, the Bad and some Recipes"
  raw_title: "RubyC 2019.  Yevhen Kuzminov: \"A year with Hanami in production: the Good, the Bad and some Recipes\""
  date: "2019-09-14"
  published_at: "2019-09-20T10:58:16Z"
  video_provider: "youtube"
  video_id: "jDMUBRPI5zc"
  description: |-
    A story of one commercial project grown with Hanami:

    • Brief comparison major differences between Hanami and Ruby on Rails web apps;

    • Solving "well known" issues using Hanami and facing "now known yet";

    • Recipes for what we used to with Rails: "doсkerization", Trailblazer, background jobs, caching, WebSockets, etc.; 

    • Vision of the ideal Hanami app, comparison with Elixir/Phoenix;

    • Hanami as a modular puzzle - an example of building somewhat exotic.
  speakers:
    - Yevhen Kuzminov

- id: "walerian-sobczak-rubyc-2019"
  title: "Distributed stream processing in Ruby"
  raw_title: "RubyC 2019. Walerian Sobczak: \"Distributed stream processing in Ruby\""
  date: "2019-09-14"
  published_at: "2019-09-20T10:58:10Z"
  video_provider: "youtube"
  video_id: "iNJza23EbMw"
  description: |-
    How to handle and process hundreds of thousands of requests per minute? How does introducing a distributed real-time computation platform can help build a reliable product? Let’s figure it out by discovering Apache Storm topologies and their functionalities powered by Ruby. Continuous data streams are becoming omnipresent and the software we build is required to process those huge volumes of data. This is where Apache Storm comes in with its benchmarked million tuples processed per second. Let’s see how the Storm topologies work, how to build them using Ruby and how they can help us build powerful and predictable data transformation pipelines.
  speakers:
    - Walerian Sobczak

- id: "yulia-oletskaya-rubyc-2019"
  title: "RPC frameworks overview"
  raw_title: "RubyC 2019. Yulia Oletskaya: \"RPC frameworks overview\""
  date: "2019-09-14"
  published_at: "2019-09-21T21:39:24Z"
  video_provider: "youtube"
  video_id: "6PjgBY-yClo"
  description: |-
    Lately, a lot of web developers tend to find out that REST isn't always the ultimate solution for services communication problems. Some people thrift to search for new architectural styles (e.g. GraphQL) and others give a new breath to long-forgotten of RPCs. This talk is a brief overview of existing RPC frameworks (e.g. gRPC, Apache Thrift, Twirp) including Ruby specific pitfalls.
  speakers:
    - Yulia Oletskaya
