- id: "aleksander-dabrowski-rubyc-2019"
  title: "10 performance sins of Rails applications"
  raw_title: "RubyC 2019. Aleksander Dąbrowski: \"10 performance sins of Rails applications\""
  date: "2019-09-14"
  published_at: "2019-09-20T10:58:21Z"
  video_provider: "youtube"
  video_id: "_MUez2wuhh0"
  description: |-
    It’s easy to write Rails app. It’s also easy to write slow Rails app. In this talk you will learn abthe out most popular performance smells, and how to fix them. It will include database, caching, views and serialisation anti-patterns.
