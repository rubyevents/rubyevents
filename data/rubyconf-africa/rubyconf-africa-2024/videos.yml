- id: "harrison-kamau-rubyconf-africa-2024"
  title: "Breaking the Storage Barrier: Running AWS Lambda Functions with Ruby"
  date: "2024-07-27"
  language: "English"
  video_provider: "not_recorded"
  video_id: "harrison-kamau-rubyconf-africa-2024"
  description: |-
    In the world of serverless computing, AWS Lambda functions offer unparalleled scalability and flexibility. However, the ephemeral storage limit can pose challenges for data-intensive applications. In this session, we'll explore innovative techniques to overcome these limitations using Ruby as our primary language. Join us as we dive deep into the architecture of AWS Lambda, uncovering strategies to efficiently manage storage and maintain performance. We'll demonstrate practical solutions, including leveraging AWS services like ECR, to extend storage capabilities beyond the default limits.

    Key Takeaways:
    - Understanding the ephemeral storage limits of AWS Lambda.
    - Implementing Ruby-based solutions to handle larger datasets.
    - Integrating AWS services to extend storage capacity.
    - Real-world examples and best practices for optimizing Lambda functions.
  speakers:
    - Harrison Kamau

