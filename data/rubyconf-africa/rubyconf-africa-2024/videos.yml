- id: "renen-watermeyer-rubyconf-africa-2024"
  title: "Transacting in Africa"
  raw_title: "RubyConf Africa 2024 - Transacting in Africa - by  Renen Watermeyer CEO / CTO - SASA Finance"
  date: "2024-07-26"
  published_at: "2025-03-24T20:07:45Z"
  language: "English"
  video_provider: "youtube"
  video_id: "wWLM0vqY8uc"
  description: |-
    Over the past eight years, SASA Technologies has delivered financial solutions in nine African countries: Tanzania, Kenya, Uganda, Malawi, Ghana, South Africa, Zambia, Zimbabwe, and Botswana. Our cloud-based, full-featured solutions, such as loan and agricultural management, are built in Africa, by Africans, for Africans. Using Rails and leveraging technologies like Progressive Web Apps, USSD, and SMS, we facilitate transactions between farmers, input suppliers, off-takers, and manage loans and wallets. In this talk, I'll discuss our technology stack, the patterns we use for financial transactions, and how we operate in an offline-first world. We'll explore our key technology choices and team structure that enable us to deliver world-class solutions.
  speakers:
    - Renen Watermeyer

