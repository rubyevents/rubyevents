- id: "bernard-banta-rubyconf-africa-2026"
  title: "Sanarei: Offline Web Browsing with Ruby"
  date: "2026-08-21"
  published_at: "2026-09-22T10:23:47Z"
  language: "English"
  video_provider: "youtube"
  video_id: "_-xry-fF9Pk"
  description: |-
    This talk introduces Sanarei, a Ruby middleware that leverages USSD to enable offline-friendly web experiences on basic mobile phones. Attendees will learn how to build web applications that function without internet access and how to extend digital services to billions of underserved users worldwide. Discover how Ruby can help drive meaningful financial and digital inclusion.
  speakers:
    - Bernard Banta

- id: "annglorious-mueni-rubyconf-africa-2026"
  title: "From Frontend to Full Stack: Building Real-World Applications That Actually Work"
  date: "2026-08-21"
  published_at: "2026-09-07T09:37:08Z"
  language: "English"
  video_provider: "youtube"
  video_id: "kxM6HEkqs0E"
  description: |-
    What does it really take to move from frontend development to building complete, real-world applications?

    In this talk at RubyConf Africa 2026, AnnGlorius Mweni explores the journey from frontend development to fullstack engineering, focusing on what it takes to build applications that work beyond the demo.

    AnnGlorius shares practical insights into connecting the different pieces of an application, thinking beyond the user interface, and approaching fullstack development with a focus on building reliable, useful products.

    Whether you're a frontend developer looking to expand your skills or an aspiring fullstack engineer, this talk offers practical perspectives on making that transition and building applications for the real world.
  speakers:
    - AnnGlorious Mueni

