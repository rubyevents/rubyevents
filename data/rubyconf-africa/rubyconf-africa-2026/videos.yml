- id: "amani-kanu-rubyconf-africa-2026"
  title: "Beyond Code: From Ruby Engineers to AI-Native Builders"
  date: "2026-08-22"
  published_at: "2026-09-18T12:49:10Z"
  language: "English"
  video_provider: "youtube"
  video_id: "eVVStzqpSb4"
  description: |-
    AI is changing how software teams build, ship, and scale products. But the future does not belong to developers who only use AI tools. It belongs to engineers who can rethink workflows, lead with clarity, and combine technical skill with product thinking, community, and business impact.

    In this session, I will share practical lessons from engineering, solution architecture, DevRel, and community building across African tech ecosystems. The talk will explore how Ruby and Rails developers can grow beyond writing code into becoming AI-native builders who design better systems, move faster, mentor others, and create stronger opportunities for the next generation of African developers.
  speakers:
    - Amani Kanu

