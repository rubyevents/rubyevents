- id: "aaron-patterson-mountain-rb-2010"
  title: "Working with the Community: The Many Hats of an OSS Hacker"
  kind: "keynote"
  date: "2010-10-07"
  language: "English"
  video_provider: "not_recorded"
  video_id: "aaron-patterson-mountain-rb-2010"
  description: |-
    Open Source Software isn't just about writing and maintaining cool code. Once we've set our software free, The Community is able to get their hands on it. Just who is this ominous beast? What are they doing with our software? Let's examine this symbiotic relationship that we maintain with this creature. We must study The Community and figure out what we can learn from these people, and how we can use them to ultimately improve not only our software, but also improve ourselves.
  speakers:
    - Aaron Patterson

