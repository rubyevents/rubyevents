- id: "tony-arcieri-mountain-rb-2010"
  title: "Reia: Ruby Evolved"
  date: "2010-10-07"
  language: "English"
  video_provider: "not_recorded"
  video_id: "tony-arcieri-mountain-rb-2010"
  description: |-
    We all love Ruby, but it has its foibles, especially when dealing with issues like concurrency or I/O. Reia is a new language which serves up Erlang sandwiches on warm, crispy, delicious Ruby-flavored buns. Reia makes it easier to solve the kinds of problems which are presently difficult in Ruby, such as building complex distributed systems which can automatically leverage all of the cores of a host CPU. Reia lets you build Erlangy systems leveraging robust distribution, fault tolerance, and concurrency, all without having to deal with Erlang's nasty syntax. Reia wraps up the elegance of Ruby and the power of Erlang in a single, delicious Reia sandwich.
  speakers:
    - Tony Arcieri

- id: "jonathan-dahl-mountain-rb-2010"
  title: "Programming and minimalism: lessons from Orwell and the Clash"
  date: "2010-10-07"
  language: "English"
  video_provider: "not_recorded"
  video_id: "jonathan-dahl-mountain-rb-2010"
  description: |-
    Programming is writing. A programmer's job is to express abstract ideas in a specific language - just like the poet, the essayist, and the composer. But while writers and composers spend years improving their style, many programmers think style stops with "two-space indentation". This needs to change. This presentation will discuss style in music, writing, and software. We'll look at such diverse sources as George Orwell, Mozart, and punk music, and will find that much of art revolves around complexity and minimalism - just like software. Finally, we'll look at specific patterns and tools for writing software that is effective, efficient, and beautiful.
  speakers:
    - Jonathan Dahl

- id: "peter-jackson-mountain-rb-2010"
  title: "Introduction to Geospatial Programming with GeoRuby, PostGIS, and OpenLayers"
  date: "2010-10-07"
  language: "English"
  video_provider: "not_recorded"
  video_id: "peter-jackson-mountain-rb-2010"
  description: |-
    Location-based applications are everywhere, yet most modern Rubyists haven't ventured far beyond superimposing a few locations on a Google Map. In this talk, the Rubyist will learn about the many spatial programming possibilities within the Ruby landscape, including non-location-based applications, geographic applications using custom imagery, answering difficult questions using spatial queries, Moving Beyond the Dot-On-The-Map, and how to get started with Geospatial Programming today.
  speakers:
    - Peter Jackson

- id: "cj-kihlbom-mountain-rb-2010"
  title: "Frontend Testing Frontier"
  date: "2010-10-07"
  language: "English"
  video_provider: "not_recorded"
  video_id: "cj-kihlbom-mountain-rb-2010"
  description: |-
    While most Ruby developers are very familiar with testing their code, frontend and JavaScript-testing is still a new frontier for many. This talk will show you how to easily write and run JavaScript integration tests with Capybara and Cucumber, and unit tests with Evergreen and Jasmine. The goal is to get you excited about frontend testing, and point you in the right direction to get started yourself!
  speakers:
    - CJ Kihlborn

- id: "jay-mcgavren-mountain-rb-2010"
  title: "Ruby on Android with Ruboto"
  date: "2010-10-07"
  language: "English"
  video_provider: "not_recorded"
  video_id: "jay-mcgavren-mountain-rb-2010"
  description: |-
    Ruboto is a full JRuby interpreter for Android devices, meaning you can run Ruby on your phone. Even better, you can interact with the full Android API, giving your scripts all the power of a native application. In this talk, you'll see how to set up a working development environment (on desktop or phone). More importantly, you'll learn how to manipulate Android from Ruby, giving you access to widgets (buttons and text fields), canvases (paint to the screen), even sensors (compass and accelerometer). Android novices will learn everything they need to get up and running, and pros will gain a powerful new language for their toolkit.
  speakers:
    - Jay McGavren

- id: "keavy-mcminn-mountain-rb-2010"
  title: "Must. Try. Harder."
  date: "2010-10-07"
  language: "English"
  video_provider: "not_recorded"
  video_id: "keavy-mcminn-mountain-rb-2010"
  description: |-
    Are you pushing yourself with the right force, in the right direction, to achieve what you want, what makes you happy, what you're capable of? Based on her experience of training for Ironman distance triathlons, Keavy will discuss the preparation involved in pushing herself towards her own mental and physical limits, and the effects this has had on other areas of her work and life. The talk will explore some areas in the practice and performance of sport that are critical in reaching your full potential. It will look at how these approaches can also benefit the journey not just of personal development, but career development. It won't be about achieving some grand vision of mastery, but rather on pursuing outcomes that are true to the individual; on making informed, conscious decisions about what to focus your energy on; and maintaining the drive to get there. This talk aims to inspire people to try harder.
  speakers:
    - Keavy McMinn

- id: "blake-mizerany-mountain-rb-2010"
  title: "1000 ways to kill a Buffalo"
  date: "2010-10-07"
  language: "English"
  video_provider: "not_recorded"
  video_id: "blake-mizerany-mountain-rb-2010"
  description: |-
    I've wrestled them with my bare hands; been trampled by them; chased a few for days on end until they surrender themselves to me. I once took a large male down with a ball of yarn and an ice-cream scooper. Problems, are like buffalos. Finding one worthy of a fight isn't easy and only few have the guts and know-how to take them down. I'll show you best of breed problems worthy of a solid challenge and how they can help you sharpen your skills, fight a good fight, and profit greatly from it.
  speakers:
    - Blake Mizerany

