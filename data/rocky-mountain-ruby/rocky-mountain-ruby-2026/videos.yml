- id: "christine-seeman-rocky-mountain-ruby-2026"
  title: "Optimize Your Mindset (Without Overclocking)"
  date: "2026-09-28"
  language: "English"
  video_provider: "scheduled"
  video_id: "christine-seeman-rocky-mountain-ruby-2026"
  description: |-
    As developers, we're always optimizing our workflows, but why don't we optimize our thoughts? Your career isn't 100% code, and in the age of AI tools, constant notifications, and information overload, the skills that matter most aren't technical. Everyone struggles with focus, managing stress, accepting feedback, or finding time for what matters. But you don't have to stay stuck.

    This talk tells the story of four people and four research-backed techniques to level up your work and life: mindfulness for breaking thought loops and managing stress, growth mindset for embracing challenges and continuous learning, habit building for sustainable change, and deep work strategies for maintaining focus in a distracted world. Whether you're new to the field, a seasoned developer, or someone who's never explored human skills talks, these practical strategies will help you grow, improve, and actually stick with new habits.
  speakers:
    - Christine Seeman

- id: "giovanni-panasiti-rocky-mountain-ruby-2026"
  title: "Building an Agentic RAG in the Rails Way with RubyLLM"
  date: "2026-09-28"
  language: "English"
  video_provider: "scheduled"
  video_id: "giovanni-panasiti-rocky-mountain-ruby-2026"
  description: |-
    When my company needed an AI assistant over our documents, we did the sensible corporate thing first: we handed the project to one of Italy's best-known consultancies. They delivered a working system spread across six services in four languages plus two databases. It worked. But I'm a Rails developer, and I couldn't accept that answering a question required a whole microservice fleet. I was sure there was a better way. So I studied to find a way and rebuilt the whole system the Rails' way. The result is an simple RAG application with agents running entirely in Rails.
    I don't want this to either be an hype talk neither a framework demo. I want to show, with production code, that the boring version is the better one and we, as Ruby developers, have so many tools in our hands that we can really do everything we want without the need to move to other languages. What I want to state is that Rails developers are not second-class citizens in the AI conversation.
  speakers:
    - Giovanni Panasiti

- id: "drew-bragg-rocky-mountain-ruby-2026"
  title: "Your own AI Agent in ~400 lines of Ruby"
  date: "2026-09-28"
  language: "English"
  video_provider: "scheduled"
  video_id: "drew-bragg-rocky-mountain-ruby-2026"
  description: |-
    AI coding agents feel like magic. They autocomplete your thoughts, refactor your code, and sometimes hallucinate with alarming confidence. But we've all had that moment where you bundle open a gem and go "oh, that's all it is?" AI agents deserve that same moment. Turns out they're just an API call, a conversation history, a system prompt, some optional tools, in a loop (of course). In this talk we'll build one together but in Ruby. Starting from 15 lines and iterating through until we have a full agent. About 400 lines, start to finish.
    Right now most agent frameworks are written in TypeScript or Python, we deserve to see an agent written in the language we love. You'll leave this talk with a clear mental model of how these tools actually work, and the code to prove Ruby belongs in this space.
  speakers:
    - Drew Bragg

