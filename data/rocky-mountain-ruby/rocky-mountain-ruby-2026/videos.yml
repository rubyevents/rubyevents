- id: "nicolas-erlichman-rocky-mountain-ruby-2026"
  title: "Modeling Class Hierarchies in Active Record"
  date: "2026-09-28"
  language: "English"
  video_provider: "scheduled"
  video_id: "nicolas-erlichman-rocky-mountain-ruby-2026"
  description: |-
    Single-table inheritance and purely abstract classes work… until they don’t.

    So where do you turn when things start to get messy?

    In the early days of Rails, there were only two ways class hierarchies could be mapped in Active Record, single-table inheritance and purely abstract classes. While both have their places, they also have their own challenges, not making it suitable for every situation.

    Enter Delegated types, the final piece of the Active Record’s modeling Swiss army knife. A middle ground offering a cleaner and more flexible way to model the reality where the existing approaches fall short.

    Modeling can get messy, trying to balance simplicity, performance and maintainability. In this talk, we’ll break down single-table inheritance, purely abstract classes, and delegated types, discussing when each makes sense, where they fall short, and how to choose the right tool for the job.
  speakers:
    - Nicolas Erlichman

- id: "marco-roth-rocky-mountain-ruby-2026"
  title: "Herb in Rails 8.2: Your ERB views, now HTML-aware"
  date: "2026-09-28"
  language: "English"
  video_provider: "scheduled"
  video_id: "marco-roth-rocky-mountain-ruby-2026"
  description: |-
    With teams, companies, and open source projects adopting Herb in their daily workflows, the foundation is proving itself at scale and is on track to become an opt-in view engine in Rails 8.2.

    This talk explores what Herb brings to Rails: how it integrates with ActionView and the tooling and developer experience every Rails developer gains as a result.

    But that's only the beginning. To complete the Hotwire story, Rails needs reactivity.

    Herb's understanding of HTML and ERB makes this possible. I'll introduce the first production-ready version of ReActionView, bringing Phoenix LiveView-like fine-grained reactivity to standard Rails templates. Fully optional. Gradual to adopt. No JavaScript framework. No new file format.

    Your HTML+ERB templates, now reactive.
  speakers:
    - Marco Roth

- id: "travis-turner-rocky-mountain-ruby-2026"
  title: "Got AI ontological shock? No worries: UFOs, Theology, and Psychedelics with Ruby-Colored Reverence"
  date: "2026-09-28"
  language: "English"
  video_provider: "scheduled"
  video_id: "travis-turner-rocky-mountain-ruby-2026"
  description: |-
    What does it mean to be a programmer?

    I’ve talked to colleagues, family, industry peers, friends, and strangers. This has inspired a talk on integrating AI into programming life in a productive, happier way. We do so by naming our shared psychological experience, identifying the blocks to coping with it, and creating frameworks for personal integration.

    First, I will lay out the context and explain some terms and the premise of my talk.

    Ontology is the branch of philosophy concerned with being. “Ontological shock” is the psychological and intellectual experience when something new fundamentally disturbs our sense of being or reality.

    I argue that programmers, the tech industry, and society are feeling that shock now. For the former group, the questions about job duties, tooling, and job security are actually downstream of this shock, but not the heart of the issue itself. Further, we are all coming to terms with it in different ways and at different times.

    That means we’re not all on the same page, and this makes things tricky. There is a path forward. However, to take it, it’s critical to acknowledge and understand this experience more deeply.
  speakers:
    - Travis Turner

- id: "sonja-peterson-rocky-mountain-ruby-2026"
  title: "Confident On-Call: Building Incident Response Skills as a Ruby Engineer"
  date: "2026-09-28"
  language: "English"
  video_provider: "scheduled"
  video_id: "sonja-peterson-rocky-mountain-ruby-2026"
  description: |-
    Your phone starts blaring with an alert: something is broken in production! If imagining that fills you with anxiety, you’re not alone. But it is possible to go from panicking every time you get paged to responding with confidence - and I can show you how.

    In this talk, I’ll share a training plan for Ruby engineers looking to improve their incident response skills. No need to wait until the next incident to begin learning - you can start now by observing your system’s normal state so you can better spot anomalies later, brushing up on the computer science topics (like memory, CPU, and I/O) behind the graphs in your monitoring tools, and fixing elusive bugs and performance problems when you aren’t under pressure. I’ll also talk about specific strategies to lean on during incidents, like developing theories and disproving them until you can narrow in on a root cause. Throughout, I’ll illustrate with examples relevant to typical Ruby web applications.

    You’ll leave feeling ready for your next on-call shift, and on your way to becoming known as the person who can resolve even the trickiest incidents with ease.
  speakers:
    - Sonja Peterson

- id: "andrea-fomera-rocky-mountain-ruby-2026"
  title: "High-Octane Onboarding: Ramping into a Rails Codebase with AI Agents"
  date: "2026-09-28"
  language: "English"
  video_provider: "scheduled"
  video_id: "andrea-fomera-rocky-mountain-ruby-2026"
  description: |-
    Joining a new Rails codebase used to mean weeks of reading code and slowly building a mental model before you could really contribute. For me, ramping up at Zipline this year, that math changed

    This is a field report from my first 90 days as a Senior Rails engineer, and the AI-assisted practices that let me actually ship value while I was still figuring out where everything lived. We'll cover the artifacts that prime both humans and agents for context (think personal and team READMEs you can hand to an LLM), MCP integrations that make Jira and Confluence queryable, and using agents for codebase archaeology when you're three layers deep in a service object.

    You'll leave with a playbook you can actually use, plus the honest gotchas, because the agents will lie to you with full confidence.
  speakers:
    - Andrea Fomera
