- id: "fernando-perales-rocky-mountain-ruby-2026"
  title: "Slowly We Rot: signs of a Rails app’s decay"
  date: "2026-09-28"
  language: "English"
  video_provider: "scheduled"
  video_id: "fernando-perales-rocky-mountain-ruby-2026"
  description: |-
    Rails apps rarely collapse all at once. What starts as a TODO comment quietly becomes code you're afraid to touch: hard to understand, harder to change, and worse with every workaround. You might be eyeing a rewrite but, do you actually know how it got there?

    After 13 years consulting on Rails apps, I've seen the same patterns of rot show up again and again. This talk is about those patterns: how they start, why they compound, and what you can actually do about them before they become someone else's problem (or yours, six months from now).
  speakers:
    - Fernando Perales

- id: "ben-reubenstein-rocky-mountain-ruby-2026"
  title: "Commit for Good"
  date: "2026-09-28"
  language: "English"
  video_provider: "scheduled"
  video_id: "ben-reubenstein-rocky-mountain-ruby-2026"
  description: |-
    I’ve built software for charities pro bono since 2006 — from scrappy early experiments to a three-year commitment building for Fully Liberated Youth. What I’ve found is that the need is enormous, the work is some of the most rewarding you’ll do, and the barrier to entry is lower than you think. Nonprofits are sitting on problems that a single motivated developer can meaningfully solve.
    This is a practical guide to getting involved: how to find the right organizations, what skills actually matter (most of them aren’t technical), and how to build something that genuinely lasts. Whether you’ve got a weekend or you’re ready for a longer commitment, I’ll show you how to put your Ruby to work for a cause — and why you’ll probably get more out of it than you give.
  speakers:
    - Ben Reubenstein

