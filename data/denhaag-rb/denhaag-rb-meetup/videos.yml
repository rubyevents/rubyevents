  event_name: "DenHaag.rb December 2024"
  date: "2024-12-12"
  video_provider: "children"
  video_id: "denhaag-rb-december-2024"
  description: |-
    Den Haag Ruby Meetup but then in Rotterdam.

    A couple of months ago the Den Haag.rb group was about to lose its page, we at Beequip picked up the tab and claimed the group. Since Den Haag an Rotterdam are quite close to each other we think we can provide for the whole area. That's why I'm reposting the event of Rotterdam.rb in this group.

    The Rotterdam Ruby meetup is back and we're kicking off with international speaker, Tim Kächele, from Berlin! You might've seen him at Baltic Ruby or EuRuKo 2024. He is a Software Engineer at Börse Stuttgart.

    Schedule
    18:00 Doors open
    19:00 Tim Kächele - Mechanical sympathy, or: writing fast ruby programs
    19:45 Break
    20:00 Daniël de Vries - TBD
    20:45 Drinks & Networking

    Hosted at BEEQUIP, Willemskade 18, Rotterdam.
    https://www.meetup.com/denhaagrb/events/304522962/
  talks:
