- id: "denhaag-rb-december-2012"
  title: "DenHaag.rb December 2012"
  event_name: "DenHaag.rb December 2012"
  date: "2012-12-11"
  video_provider: "children"
  video_id: "denhaag-rb-december-2012"
  description: |-
    Digidentity.eu, next to Den Haag Hollands Spoor train station will be hosting our next joint DenHaag.rb/Rotterdam.rb meetup. Digidentity builds online authentication and e-signing services and is an all-rails company since 2008.

    We'll have two tech talks, drinks and food.

    Hosted at Digidentity, Waldorpstraat 17p, The Hague.
    https://www.meetup.com/denhaagrb/events/92177592/
  talks:
    - id: "jurriaan-kamer-denhaag-rb-december-2012"
      title: "RoR for large scale enterprise grade applications"
      event_name: "DenHaag.rb December 2012"
      date: "2012-12-11"
      video_provider: "not_recorded"
      video_id: "jurriaan-kamer-denhaag-rb-december-2012"
      description: |-
        We all know Rails is popular in startups, but how does Rails perform in a more enterprisey environment? How to reconcile agile and test-driven development with separate developer and tester job descriptions? Can you apply traditional software quality metrics to the Rails world? What about agile when the customer already has the functionality totally spec-ed out? And last but not least: does it scale?

        Loosely based on a well known large-scale software project in the Netherlands.
      speakers:
        - Jurriaan Kamer

    - id: "benoist-claassen-redmar-kerkhoff-denhaag-rb-december-2012"
      title: "Your dream development/deployment pipeline"
      event_name: "DenHaag.rb December 2012"
      date: "2012-12-11"
      video_provider: "not_recorded"
      video_id: "benoist-claassen-redmar-kerkhoff-denhaag-rb-december-2012"
      description: |-
        With tools like Vagrant and Chef you can set up a virtualized development environment on your machine that replicates your deployment environment(s). Scripts can spawn instances of your app (or clusters of interoperating apps!): where you like, as many as you like, as often as you like.

        Benoist Claassen and Redmar Kerkhoff will walk you through: Vagrant and chef: when and why to use? Howto: Vagrant setup, provisioning. Test Driven deployment: use vagrant for CI, and auto-deploy after successful test on the CI.
      speakers:
        - Benoist Claassen
        - Redmar Kerkhoff

