- id: "mohnish-jadwani-rug-b-2024-09-05"
  old_id: "mohnish-jadwani-rug-b-meetup-september-2024"
  title: "Connection Before Correction"
  date: "2024-09-05"
  video_provider: "not_recorded"
  video_id: "mohnish-jadwani-rug-b-2024-09-05"
  description: |-
    We humans are social animals & social connection is the number one source of happiness, success, good health & much of the sweetness of life. On other hand working with people can be hard and can at times feel really overwhelming.

    Many a times, we are able to get to people but aren’t able to get through them in order for them to understand us.

    We end up wondering, how do we bridge that communication gap amongst fellow colleagues?

    This talk intends to discuss via some personal stories(of failures + successes) & other examples of ways around that. We will explore how the absence of connectedness & its presence among us can lead to related fumbles & more successful outcomes, respectively.
  speakers:
    - Mohnish Jadwani
