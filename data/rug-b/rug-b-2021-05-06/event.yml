description: |-
  Hello everyone,

  we're back with another remote-friendly Ruby User Group! The time is 19:00 CEST so that's 17:00 UTC or well 5pm UTC.

  You're welcome wherever you're from as long as you adhere to our [Code of Conduct](https://berlincodeofconduct.org/) - the meetup is in English.

  Current schedule is two ~20min talks including Q&A, followed by splitting the audience into smaller groups for virtually hanging out (optional) :)

  **The meetup will be on zoom and it will be recorded**

  * if you don't want your video to be visible to others, then turn it off/leave it off
  * if you can't make it/don't want to be on zoom, watch the recording!

  We're aware of the **privacy concerns** surrounding zoom and we share them. We're looking for better tools, we haven't found them yet.

  Meanwhile, if you don't want to use the desktop client the zoom browser link above should work for you. If it doesn't you can usually get to it like this: the join link should also show a tiny _join from browser_ link at the bottom of the window. It doesn't appear to require an account anymore. If the link doesn't show up, open the _Download and Install Zoom_ link in a separate tab, that should make the link appear. Dark UI patterns 😖

  ## Participating in the meetup

  - We'll take Q&A questions in Zoom via the _raise hand_ feature (click on participants, there's a little raise hand link)
  - There is also a #rugb-live channel in the Ruby Berlin Slack, you can join the slack here
  - the _socializing_ part is optional, naturally, our aim is to not lose that part of our meetup - we'll try to use Zoom's breakout feature to split you into random groups and give you some ice breaker questions to kick it off

  ## Patience

  Your feedback is very welcome. Things will go wrong, we'll try to fix them.

  ## See you

  Looking forward to see y'all Rubyists from Berlin and maybe all over the world.

  Amr, Pascal & Tobi
