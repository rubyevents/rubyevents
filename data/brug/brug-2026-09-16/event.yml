  Hello Rubyists! [EuRuKo](https://2026.euruko.org) is less than a month away, and if you already have your ticket, you probably noticed that there will be a meetup before the big event. Thanks to the conference organizers, we are able to hold this (free) community meetup at the same venue. If you have your ticket, at the meetup you will also have the opportunity to register and pick up your badge early, allowing you to skip the queues the next morning.

  **Date:** Wednesday, September 16, 2026
   **Time:** 18:00 – 20:00
   **Location:** [Hotel Passage](https://www.hotelpassage.eu), Lidická 23, Brno, Czech Republic

  ## Talks

  #### Hitoshi Hasumi - Funicular on Rails: Write Your Rails Frontend in Pure Ruby

  Funicular is a Rails plugin for building SPA frontends in Ruby instead of JavaScript.
  It runs on PicoRuby.wasm, a compact WebAssembly Ruby runtime, and plugs into familiar Rails pieces: asset pipeline, routing, CSRF protection, ActionCable, JSON APIs, tests, and server-side rendering.
  This talk walks through a working Rails app to show what Funicular looks like in practice, what works today, and where Ruby in the browser fits.
  The goal is not to replace all JavaScript, but to make Ruby a practical frontend option when Rails conventions, small runtime size, and one test flow matter.

  #### Tetiyana Chupryna - Based on Vibes: Expertise in the Age of AI

  Software development is undergoing a fundamental shift. The consensus is emerging that the engineer of the future will be a manager of agents. Code can be written by machines, but decisions and accountability still require humans. And the thing that makes a human engineer valuable is their technical intuition. Pattern recognition built from years of making things work, and more often, watching them fail. Assign all the coding tasks to AI agents and it's not obvious where the next generation of senior engineers comes from. And that’s exactly the question we’re here to explore.

  #### Josef Šimánek - [gem.coop](https://gem.coop): Building a Community-Owned Home for RubyGems [[pdf]](/assets/archive/2026-08/gem-coop.pdf)

  Why does [gem.coop](https://gem.coop) exist, how is it structured, and where is it going? This short talk gives a short overview of the motivation behind the project, its cooperative model, the current state of the service, and our plans for building sustainable, community-owned Ruby infrastructure.
