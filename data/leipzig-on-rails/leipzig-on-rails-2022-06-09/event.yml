description: |-
  Das erste Treffen seit über zwei Jahren! Klönen, fachsimplen, draußen sitzen – was gibt es schöneres an einem lauen Sommerabend? Und schon weil es das erste Mal nach so langer Zeit ist, soll es an nichts fehlen: about:source hat extra den veganen 12-Sterne-Koch noch mal für abends engagiert, der ansonsten jeden Donnerstagmittag für uns kocht. Stellt Euch deswegen ein auf:

  - feinste Grillbarkeiten (ggf. auch fleischlich) und Salate
  - ein Fässchen Bier der »Plagwitzer Brauerei«, einer Kleinbrauerei gleich im Nachbargebäude (es gibt aber auch noch andere kalte Getränke)
  - einen Tageslichtbeamer, denn 19h00 ist es ja noch lange hell, und wir wollen draußen sitzen.

  Das heißt auch: Wir brauchen noch Themen. Mindestens eins könnte zwar von uns kommen, aber es dürfen gern mehr werden – wie gesagt, es ist das erste Mal seit langem, die Queue sollte ja recht voll sein ;-)

  Wir wollten dieses Treffen auf jeden Fall noch vor der Sommerpause machen, und wer weiß, ob uns nicht danach wieder die bekannten Misslichkeiten einen Strich durch die Rechnung machen werden, also kommt zahlreich und lasst uns dieses Treffen genießen! Wenn Du kommen möchtest, trag Dich bitte – ggf. mit Deinem Thema – hier ein, damit unser Koch gut planen kann.

  (Es gibt auch eine Schlechtwetter-Variante in einem Raum mit Theke)
