description: |-
  We're kicking off Berlin.rb, a new, regular meetup for Berlin's Ruby community!
  Join us for our first get-together, kicking off with a couple of talks.
  Carmine Paolino, the author of RubyLLM, presents RubyLLM 2.0 - Beyond Agents.
  Paweł Strzałkowski presents HiFuMi - The story of building an online Rails apps generator.
  But more than anything, this evening is about bringing Berlin's Ruby community together.
  Whether you've been writing Ruby for 15 years or you're just curious about the language, everyone's welcome.
  Drinks and snacks provided. Interested in giving a talk at a future meetup, or hosting/sponsoring one? Reach out to hello@berlinrb.org.
  Venue: ablefy GmbH, Potsdamer Str. 125, 10783 Berlin, Germany.
  Getting there: the venue is wheelchair accessible. If you need anything else to join us, write to hello@berlinrb.org and we will arrange it.
