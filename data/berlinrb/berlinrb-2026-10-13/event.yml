  Berlin.rb is a regular meetup for Berlin's Ruby community. Join us for talks, food and time to get to know each other.
  Talks:
  - Rafał Cymerys, CTO at Upside: Let Your Software Write Its Own Code: Runtime Code Generation in Production.
  - Stephen Margheim: The ZARchitecture: How and Why we evolved a fintech for AI-driven development.
  Whether you've been writing Ruby for 15 years or you're just curious about the language, everyone's welcome. Food and drinks provided.
  Interested in giving a talk at a future meetup, or hosting or sponsoring one? Reach out to hello@berlinrb.org.
  Watching from home: the talks are streamed live. There is a separate livestream event on Luma.
  Venue: Techtelmechtel - Coworking Space & Eventlocation, Gürtelstraße 25/Etage 4, 10247 Berlin, Germany.
