    - id: "andrzej-krzywda-berlinrb-meetup-november-2026"
      title: "Rails architecture in the age of AI"
      event_name: "Berlin.rb Meetup November 2026"
      date: "2026-11-10"
      language: "English"
      video_provider: "scheduled"
      video_id: "andrzej-krzywda-berlinrb-meetup-november-2026"
      description: |-
        After over 15 years of doing DDD in Rails at Arkency, Andrzej will reflect which parts still make sense with AI. The economy has changed and so do architectural decisions. One example is the choice between refactoring and a rewrite. Andrzej will also present the current state of the art when it comes to human legacy code vs AI slop.
