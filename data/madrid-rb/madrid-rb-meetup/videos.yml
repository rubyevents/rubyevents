  description: |-
    Reunión de Madrid.rb de Febrero 2011
  talks:
    - id: "madrid-rb-event-230-topic-310"
      title: "A g[r]eek talking about Heroku"
      event_name: "Febrero 2011"
      date: "2011-02-24"
      video_provider: "not_recorded"
      video_id: "madrid-rb-event-230-topic-310"
      description: |-
        Undoubtedly, Heroku is the new black. The Salesforce guys sure think so, and so do all the cool kids on the ruby-block. So, you wonder, is it right for you?

        In this short talk I plan to recount my experience migrating [Jobandtalent](http://jobandtalent.com) to Heroku.

        Time permiting, I will try to cover the following subjects, some superficially, some in more detail:

        - PostgreSQL; differences to MySQL, quirks, hidden features, performance considerations
        - Heroku's read only file system, and how it might affect your application
        - Heroku Add-Ons. The Essential, The Nice-to-have, The Rest
        - Anecdotal tales of the platform's quality of service and support

        **AVISO:** El idioma de la charla será español, inglés, griego o _spangreesh_ en función del número de cervezas que lleve encima el ponente al comienzo de la misma

        ### Resources
      speakers:
        - Christos Zisopoulos

- id: "madrid-rb-event-242"
  title: "Marzo 2011"
  event_name: "Marzo 2011"
  date: "2011-03-31"
  video_provider: "children"
  video_id: "madrid-rb-event-242"
  description: |-
    Reunión de Madrid.rb de Marzo 2011
  talks:
    - id: "madrid-rb-event-242-topic-324"
      title: "Sequel: una alternativa a Active Record"
      event_name: "Marzo 2011"
      date: "2011-03-31"
      video_provider: "not_recorded"
      video_id: "madrid-rb-event-242-topic-324"
      description: |-
        Los que trabajamos con Ruby on Rails estamos acostumbrados a utilizar ActiveRecord para "hablar" con la base de datos. Y con razón, Active Record es muy potente y completo, y de verdad facilita la vida del programador. Pero está bien, de vez en cuando, mirar alrededor y ver alternativas, sobre todo porque te llevas gratas sorpresas.

        [Sequel](http://sequel.rubyforge.org/) es un "toolkit" escrito en Ruby para conectarse e interactuar contra una base de datos, mucho más flexible y configurable que ActiveRecord, aunque con el mismo potencial y la misma magia.

        El objetivo de esta charla es darlo a conocer e introducir sus conceptos básicos, intentando que os quedéis con el mismo buen sabor de boca con el que me quedé yo cuando empecé a utilizarlo.

        ### Recursos

        - [Slides de la charla](http://www.slideshare.net/ferblape/sequel-madridrb)
      speakers:
        - Fernando Blat

    - id: "madrid-rb-event-242-topic-325"
      title: "Pair programming: una forma de desarrollar software"
      event_name: "Marzo 2011"
      date: "2011-03-31"
      video_provider: "not_recorded"
      video_id: "madrid-rb-event-242-topic-325"
      description: |-
        La idea de la charla es dar a conocer el pair programming como una herramienta de trabajo y como poder aprovecharla en nuestro trabajo en el día a día. Intentaré explicar desde mi experiencia personal las ventajas y desventajas prácticas del pair programming y en qué situaciones nos puede resultar más ventajoso. Repasaremos algunos conceptos básicos, distintas modalidades y setups de trabajo distintos, tanto para trabajar en un local como en remoto.

        ### Recursos

        - [Slides de la charla](http://diasjorge.github.com/pair-programming-slides)
      speakers:
        - Jorge Dias

