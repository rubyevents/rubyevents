- id: "madrid-rb-event-247"
  title: "Mayo 2011"
  event_name: "Mayo 2011"
  date: "2011-05-26"
  video_provider: "children"
  video_id: "madrid-rb-event-247"
  description: |-
    Reunión de Madrid.rb de Mayo 2011
  talks:
    - id: "madrid-rb-event-247-topic-330"
      title: "Cosicas de Sphinx que lo mismo no sabías"
      event_name: "Mayo 2011"
      date: "2011-05-26"
      video_provider: "not_recorded"
      video_id: "madrid-rb-event-247-topic-330"
      description: |-
        Desde que @pablete nos presentó Sphinx en la conferencia rails 2007, hemos sido muchos los que nos hemos decantado por esta opción a la hora de implementar búsqueda de texto libre en nuestra aplicación. Sin embargo, gracias a lo fácil que es la integración mediante thinking sphinx, en muchos casos no se sabe muy bien cómo funciona sphinx por debajo, y qué cosas se pueden hacer con él más allá de los ejemplos simplones de la documentación de thinking sphinx.

        En esta charla, aprovecharé para contar un poco cómo funciona Sphinx, algunas de las cosas que podemos hacer con él y que no se usan demasiado, y las posibles implicaciones en rendimiento de utilizar funcionalidades como el resaltado de ocurrencias en los resultados de búsqueda.
      speakers:
        - javier ramirez

    - id: "madrid-rb-event-247-topic-331"
      title: "Introducción a Solr-Lucene en Rails con Sunspot"
      event_name: "Mayo 2011"
      date: "2011-05-26"
      video_provider: "not_recorded"
      video_id: "madrid-rb-event-247-topic-331"
      description: |-
        No tan conocido como Sphinx para montar tu buscador en aplicaciones Rails pero basado en una solución muy potente y compleja como Solr-Lucene os contaré como montar tu buscador utilizando la gema Sunspot en tu aplicación Rails. Como introducción contaré una notas básicas sobre configuración y utilización de la gema, sin centrarnos en detalles de Solr-Lucene.
      speakers:
        - Paco Guzmán

