      event_name: "Julio 2014"
      date: "2014-07-31"
      video_provider: "not_recorded"
      video_id: "madrid-rb-event-263-topic-348"
      description: |-
        No todo el mundo se va de vacaciones a la vez. Y los que se quedan en Madrid, puede que echen de menos un Madrid.rb.

        Para eso existe el Terracismo.rb.

        En una reunión normal de Madrid.rb hay una charla dada por algún ponente, seguida de unas preguntas, y luego charlas con comida y bebida, mayormente cervezas.

        Terracismo.rb es más minimalista; no hay charla ni ponente, vamos directamente a las cervezas. Todos son bienvenidos. Juntemos nuestros jarros de cerveza y llamemos al Capitán Planeta, para que nos haga una tarde digna del mejor terracismo.
      speakers:
        - Enrique García Cota

- id: "madrid-rb-event-264"
