      description: |-
        **GraphQL** es una tecnología relativamente nueva que plantea una nueva forma de entender las APIs. Está diseñada con el objetivo de solventar algunas de las deficiencias de las APIs REST (especialmente cuando se utilizan desde dispositivos móviles), y rompe completamente con el concepto de "endpoints".

