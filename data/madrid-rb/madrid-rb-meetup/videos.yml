      slides_url: "https://vimeo.com/166169766"
      video_provider: "not_recorded"
      video_id: "madrid-rb-event-337-topic-452"
      description: |-
        Rails viene con una serie de componentes, Active Record, Active Support, etc., bastante independientes uno del otro, pero cuando lanzas una aplicacion o abres una consola de algun modo las cosas se han organizado para tener una experiencia integrada del sistema. Como funciona esto?

