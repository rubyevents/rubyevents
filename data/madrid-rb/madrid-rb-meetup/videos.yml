- id: "madrid-rb-event-597"
  title: "Abril 2020"
  event_name: "Abril 2020"
  date: "2020-04-30"
  video_provider: "children"
  video_id: "madrid-rb-event-597"
  description: |-
    Evento virtual
  talks:
    - id: "madrid-rb-event-597-topic-856"
      title: "Docker & rails. Where to begin? ¯\\_(ツ)_/¯"
      event_name: "Abril 2020"
      date: "2020-04-30"
      slides_url: "https://learndocker.online"
      video_provider: "not_recorded"
      video_id: "madrid-rb-event-597-topic-856"
      description: |-
        Docker has been out for some years already. A lot has happened since its release in 2013, and today it has become a de facto standard and a fundamental part in deploying and scaling apps. How does this affect Rails? Well... to this day there's no "official way" of  dockerizing a rails app. There's plenty of online tutorials explaining custom ways to do its. It's difficult to know where to begin ... or, at least, it was difficult for me.

        On this talk I want to share with you how I use Docker to develop Rails apps and how I went from not understanding anything to not having Rails installed in my dev machine at all: everything I do with ruby or Rails goes through Docker. I'll present the concepts and steps needed in order to achieve this.

        Note: This talk will be done online, and in English.

        ---

        Docker & rails. ¿Por dónde empezar? ¯\_(ツ)_/¯


        Docker lleva ya unos años en el mercado. Desde que se liberó en marzo de 2013 ha llovido mucho y a día de hoy se puede considerar un estándar de facto y una pieza fundamental para el despliegue y la escabilidad de aplicaciones. ¿Y qué pasa con Rails? Bueno... pues que todavía no existe una forma "oficial" de dockerizar una aplicación en rails. Existen multitud de sitios en los que se explica cómo hacerlo, pero no tenemos una manera estándar de hacerlo y que sea igual para todo el mundo. Vamos, que cuando quieres ponerte a hacerlo no sabes muy bien por dónde empezar... o eso es al menos lo que me pasó a mí.

        En esta charla quiero compartir con vosotros cómo uso docker para desarrollar aplicaciones en Rails y cómo pasé de no entender nada a no tener Rails instalado en mi máquina de desarrollo: cualquier cosa que hago con ruby o rails va a través de docker. Hablaré de cuáles son todas las piezas que tenéis que conocer y cómo empezar a dar los primeros pasos.

        Nota: Esta charla será online, y en inglés.
      speakers:
        - Alfonso Alba

- id: "madrid-rb-event-644"
  title: "Noviembre 2020"
  event_name: "Noviembre 2020"
  date: "2020-11-26"
  video_provider: "children"
  video_id: "madrid-rb-event-644"
  description: |-
    Evento virtual
  talks:
    - id: "madrid-rb-event-644-topic-907"
      title: "Historias cortas sobre Métricas de Rendimiento"
      event_name: "Noviembre 2020"
      date: "2020-11-26"
      slides_url: "https://github.com/rafadc/talk_metrics"
      video_provider: "not_recorded"
      video_id: "madrid-rb-event-644-topic-907"
      description: |-
        En **Stuart** gestionamos **decenas de miles de entregas simultáneas** utilizando **Ruby**, **Rails** y muchos otros ingredientes. Los últimos meses hemos crecido mucho y hemos tenido que trabajar más de lo habitual en que **todo funcione suficientemente rápido**.

