- id: "madrid-rb-event-1640"
  title: 'Mayo 2025 - Roundtable: "Real world usage of LLMs and AI in software development"'
  event_name: 'Mayo 2025 - Roundtable: "Real world usage of LLMs and AI in software
    development"'
  date: "2025-05-29"
  video_provider: "children"
  video_id: "madrid-rb-event-1640"
  description: |-
    Madrid.rb Mayo 2025
  talks:
    - id: "madrid-rb-event-1640-topic-2316"
      title: 'Roundtable: "Real world usage of LLMs and AI in software development"'
      event_name: 'Mayo 2025 - Roundtable: "Real world usage of LLMs and AI in software
        development"'
      date: "2025-05-29"
      slides_url: "https://vimeo.com/1130823376"
      video_provider: "not_recorded"
      video_id: "madrid-rb-event-1640-topic-2316"
      description: |-
        With:

        - **Rafael de Castro**, Staff Engineer at  Amenitiz
        - **German Del Zotto**, Senior Software Engineer at Workato
        - **Izel Nakri**, Entrepreneur

        Moderator: *Josep Egea*

        Since ChatGPT appeared into the public scene, the amount of news, predictions and new products around the usage of LLMs in software development has been rivaled only by an equal amount of FUD spread among software developers and how our job is going to be impacted.

        In this roundtable we'd like to share the experience of real-world, close-to-home, Ruby developers using these technologies in their day-to-day work. What is being used in real life, what works, and what doesn't and how much it has affected our lives.

        Some of the topics we'd like to discuss:

        - Are we happy with LLMs as a knowledge source
        - How much we're using LLM generated code in our projects
        - What kind of workflows are emerging around tools like Copilot, Cursor, Aider, Windsurf, etc
        - Code reviews: Who's reviewing whom
        - What about managers: are they pushing for more or less AI
        - Are LLMs impacting the size of development teams

        Together with Rafael, Germán and Izel, we'll discuss this topics, trying to bring some light into this brave new world.
      speakers:
        - Josep Egea Sánchez

- id: "madrid-rb-event-2069"
  title: "Octubre 2025: Building a ruby gem for OpenFGA"
  event_name: "Octubre 2025: Building a ruby gem for OpenFGA"
  date: "2025-10-30"
  video_provider: "children"
  video_id: "madrid-rb-event-2069"
  description: |-
    Madrid.rb - Octubre 2025
  talks:
    - id: "madrid-rb-event-2069-topic-2943"
      title: "Building a ruby gem for OpenFGA"
      event_name: "Octubre 2025: Building a ruby gem for OpenFGA"
      date: "2025-10-30"
      slides_url: "https://vimeo.com/1147732476?share=copy&fl=sv&fe=ci"
      video_provider: "not_recorded"
      video_id: "madrid-rb-event-2069-topic-2943"
      description: |-
        In this talk, I'll share my experience comparing hand-written and generated code, exploring the trade-offs between automation and readability. We'll discuss how any approach might have an impact on developer experience-- how it affects maintainability, debugging and long-term sustainability.

        But how did I get here? Well, after working for a bit with OpenFGA, an open source authorization solution, I learned that you could use SDK generators, this is something OpenAPI does, for example.

        When I tried to use it, the code felt like a foreign language. You could tell it was machine-made rather than human- friendly. So I tried to implement the gem myself, and that led me to ask myself the question: which is better? generated code or human written code? Whether you're deciding between writing your own gem or letting a generator do the work for you, this talk will give you the insights to make an informed decision and improve the developer experience along the way.
      speakers:
        - Carla Urrea Stabile

