      title: "Mini implementación de ActivityPub en Ruby"
      event_name: "Noviembre 2017"
      date: "2017-11-30"
      slides_url: "https://vimeo.com/256483933"
      video_provider: "not_recorded"
      video_id: "madrid-rb-event-418-topic-567"
      description: |-
        ActivityPub es el estándar de la web social federada. Este protocolo nos permite dar vida a una red distribuida de nodos donde sus usuarios independientemente del servidor o la instalación en la que están registrados pueden interactuar e intercambiar mensajes. Una red que dada su estructura distribuida es mucho más resiliente y liberadora que los grandes silos centralizadores como Twitter o Facebook.

