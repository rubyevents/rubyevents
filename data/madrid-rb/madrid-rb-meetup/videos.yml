- id: "madrid-rb-event-204"
  title: "Febrero 2015"
  event_name: "Febrero 2015"
  date: "2015-02-26"
  video_provider: "children"
  video_id: "madrid-rb-event-204"
  description: |-
    Reunión de Madrid.rb de Febrero (El Irish Rover)
  talks:
    - id: "madrid-rb-event-204-topic-282"
      title: "El camino a los 10 millones de usuarios, partiendo el monolito"
      event_name: "Febrero 2015"
      date: "2015-02-26"
      video_provider: "not_recorded"
      video_id: "madrid-rb-event-204-topic-282"
      description: |-
        ¿Cómo escalar una aplicación hasta los 10 millones de usuarios?

        [Jobandtalent](http://www.jobandtalent.com)  es un caso real de crecimiento explosivo. Veremos como hemos conseguido dar servicio a más de 3,5M de usuarios, con picos sostenidos de hasta 30.000 rpm al backend. Una historia de aciertos y errores que nos permiten seguir creciendo hacia los 10 millones de usuarios.

        ¿Se puede romper el monolito? ¿Rails no escala?
      speakers:
        - Sergio Espeja

- id: "madrid-rb-event-210"
  title: "Marzo 2015"
  event_name: "Marzo 2015"
  date: "2015-03-26"
  video_provider: "children"
  video_id: "madrid-rb-event-210"
  description: |-
    Reunión de Madrid.rb de Marzo (Irish Rover)
  talks:
    - id: "madrid-rb-event-210-topic-288"
      title: "Growing alive things... Like software"
      event_name: "Marzo 2015"
      date: "2015-03-26"
      video_provider: "not_recorded"
      video_id: "madrid-rb-event-210-topic-288"
      description: |-
        El mundo del desarrollo del software se ha venido transformando en los últimos años y se han estado rescatando ideas viejas junto con conclusiones nuevas. La más importante y eje central es que el software es un sistema complejo adaptativo. Un ente vivo. En ese sentido: No podemos crear cosas vivas, solo podemos hacerlas crecer; entonces, no podemos hablar de crear software, solo podemos hablar de hacerlo crecer. ¿Qué implicaciones tiene esto sobre lo que ya conocenos como desarrollo de software? ¿Qué consecuencias directas pone este nuevo tópico sobre la mesa? Apúntate a la discusión y lo descubriremos juntos...
      speakers:
        - Gerardo Barcia

- id: "madrid-rb-event-270"
  title: "Abril 2015"
  event_name: "Abril 2015"
  date: "2015-04-30"
  video_provider: "children"
  video_id: "madrid-rb-event-270"
  description: |-
    Reunión de Madrid.rb de Abril 2015
  talks:
    - id: "madrid-rb-event-270-topic-353"
      title: "Diseño Orientado a Objetos con Ruby"
      event_name: "Abril 2015"
      date: "2015-04-30"
      video_provider: "not_recorded"
      video_id: "madrid-rb-event-270-topic-353"
      description: |-
        *Diseño* es una de esas palabras que puede significar muchas cosas. En esta charla utilizaremos la definición de Sandi Metz en [POODR](http://www.poodr.com/). Explicaremos qué entiende ella por diseño, y veremos algunos conceptos partes de su libro.

        Para venir a la charla no es necesario haber leído POODR previamente (aunque siempre es recomendable, es un libro excelente). Si estás empezando con ruby (o con otro lenguaje de programación orientado a objetos), esta charla es especialmente recomendable. Si ya tienes experiencia o ya has leído POODR puede servir para repasar conceptos o debatirlos.
      speakers:
        - Enrique García Cota

- id: "madrid-rb-event-276"
  title: "Mayo 2015"
  event_name: "Mayo 2015"
  date: "2015-05-28"
  video_provider: "children"
  video_id: "madrid-rb-event-276"
  description: |-
    Reunión de Madrid.rb de Mayo 2015
  talks:
    - id: "madrid-rb-event-276-topic-365"
      title: "GitHub presenta a Monolito Gafotas en \"Pobre Monolito!\""
      event_name: "Mayo 2015"
      date: "2015-05-28"
      video_provider: "not_recorded"
      video_id: "madrid-rb-event-276-topic-365"
      description: |-
        En el capítulo de hoy hablamos de arquitectura de aplicaciones web basadas en Rails, usando como ejemplo una de las apps de Rails más grandes y con más tráfico del mundo: GitHub.com.

        Veremos los límites de escalabilidad de una app monolítica en Ruby, trucos y consejos para extraer servicios de una app existente, la cosa esa del SOA que está muy de moda ahora, historias de batalla del Tio Pepe (de cuando GitHub corría en una sola máquina virtual -- os acordáis de aquellos tiempos?) y una larga lista de errores que hemos cometido y lecciones que hemos aprendido al diseñar la arquitectura de GitHub.

        Guaymente.
      speakers:
        - Vicent Martí

- id: "madrid-rb-event-282"
  title: "Junio 2015"
  event_name: "Junio 2015"
  date: "2015-06-25"
  video_provider: "children"
  video_id: "madrid-rb-event-282"
  description: |-
    Reunión de Madrid.rb de Junio 2015
  talks:
    - id: "madrid-rb-event-282-topic-371"
      title: "JSON API"
      event_name: "Junio 2015"
      date: "2015-06-25"
      video_provider: "not_recorded"
      video_id: "madrid-rb-event-282-topic-371"
      description: |-
        Uno de los aspectos principales al realizar una API con Ruby (ya sea en Rails, Sinatra o lo que esté en auge ahora mismo) es cómo organizar nuestro JSON. Existen algunas especificaciones por ahí (por ejemplo, HAL, OData o JSONRequest) pero hace bien poquito ha aparecido una nueva: JSON API.

        JSON API nace hace más de dos años de la mano de Yehuda "Omnipresente" Katz cuando se encontraba creando el RESTAdapter de Ember Data.

        Si te pica la curiosidad por este nuevo formato y quieres más información o cerveza gratis, pásate por la charla.
      speakers:
        - Sergio Arbeo

- id: "madrid-rb-event-285"
  title: "Julio 2015"
  event_name: "Julio 2015"
  date: "2015-07-30"
  video_provider: "children"
  video_id: "madrid-rb-event-285"
  description: |-
    Reunión de Madrid.rb de Julio 2015
  talks:
    - id: "madrid-rb-event-285-topic-376"
      title: "Rails & React: A Hipster Love Story"
      event_name: "Julio 2015"
      date: "2015-07-30"
      video_provider: "not_recorded"
      video_id: "madrid-rb-event-285-topic-376"
      description: |-
        Una de las principales batallas donde parece que Ruby on Rails empieza a perder terreno es en la parte de front-end. Nuestras apps cada día son más complejas a nivel de front y en ocasiones necesitamos buscar soluciones adicionales fuera del stack habitual de Rails para poder manejar dicha complejidad.

        En esta charla haremos una breve introducción a [React.js](http://facebook.github.io/react/), la librería javascript de moda creada por Facebook para construir componentes reutilizables para vuestras UIs.

        Os contaremos diferentes tipos de integración de Rails + React que hemos realizado en proyectos de [Diacode](https://diacode.com) y [Gudog](https://gudog.com): desde utilizar React solo para pequeños componentes como datepickers, hasta crear verdaderas Single Page Apps apoyándonos en Flux (gracias a [Marty.js](http://martyjs.org/)).
      speakers:
        - Javier Cuevas

