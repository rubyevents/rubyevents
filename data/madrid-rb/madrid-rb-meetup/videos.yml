      date: "2026-02-26"
      video_provider: "not_recorded"
      video_id: "madrid-rb-event-2399-topic-3768"
      description: |-
        Coding agents are powerful, but they’re missing half the picture — they can read your code but can’t see your app running.

        In this session, Paulo Alves Pereira (VP of Engineering at Lingokids, co-author of Microservices in Action and author of Elixir Cookbook) will show how Tidewave bridges that gap by connecting agents like Claude Code to your application’s runtime, giving them access to logs, database queries, and live application state.

