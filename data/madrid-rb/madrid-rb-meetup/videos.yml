      title: "How to Build a Boring(TM) Pub-Sub System"
      event_name: "Madrid.rb February 2025"
      date: "2025-02-27"
      published_at: "2025-03-16"
      slides_url: "https://speakerdeck.com/christos/building-a-boring-pub-sub-madrid-dot-rb-feb-2025"
