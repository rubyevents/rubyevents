        En [BeBanjo](http://www.bebanjo.com/) algunas de nuestras aplicaciones tienen suites de tests, llamémoslas "curiosas", y por unas o por otras la agilidad en el desarrollo se estaba viendo afectad por una Integración Continua que no estaba a la altura. Os contaré nuestra andadura hacia una solución que creemos escalable y ágil sin muchas pretensiones; pero con detalles técnicos que me han parecido muy interesantes.
      speakers:
