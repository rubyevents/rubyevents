    - id: "madrid-rb-event-257-topic-345"
      title: "Croupier: probabilidades, muestras y enumerables."
      event_name: "Octubre 2013"
      date: "2013-10-24"
      video_provider: "not_recorded"
      video_id: "madrid-rb-event-257-topic-345"
      description: |-
        Croupier es una gema que permite trabajar con muestras aleatorias de forma fácil. Como no sólo de distribuciones de probabilidad viven los datos aleatorios, también cuenta con otro tipo de "distribuciones" (por ejemplo, tarjetas de crédito).

        En esta charla veremos no sólo cómo trabajar con la gema sino cómo son sus tripas y cómo añadir nuestras propias distribuciones. Todo nos servirá como excusa para familiarizarnos con la creación de Enumerators.

        ## Extra

        Haremos la segunda batalla de [RTanque](https://groups.google.com/forum/?hl=en#!topic/madrid-rb/0H84KsjkuV0) en la que todo el mundo puede participar.
      speakers:
        - Sergio Arbeo

- id: "madrid-rb-event-254"
