      date: "2013-11-28"
      video_provider: "not_recorded"
      video_id: "madrid-rb-event-254-topic-338"
      description: |-
        En el mundo científico hoy en día, en todos los campos de investigación existen tareas que necesitan programación y desarrollos a medida a la hora de analizar datos o producir resultados. Sin embargo cuando un científico sin experiencia en programación se encuentra con un problema que requiere código en casi ningún caso utiliza Ruby ¿Por qué? En esta charla intentaremos responder a esta pregunta, veremos cual es el estado actual de Ruby como herramienta para usos científicos e intentaremos ver qué podemos hacer para convertir a Ruby en el lenguaje preferido para la ciencia.
      speakers:
