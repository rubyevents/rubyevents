      description: |-
        El de Ruby es un universo relativamente reducido, especialmente en nuestro país. Pero, dentro de él, aún podemos encontrar un grupo más pequeño: **¡El de las desarrolladoras Ruby!**

        Históricamente, la informática y el software han tenido predominancia masculina, y, a pesar de múltiples iniciativas para lograr un mayor equilibrio, lo cierto es que estamos lejos de la paridad.

        En lugar de teorizar sobre las razones, hemos pensado que sería mejor **darles la palabra a ellas**, las desarrolladoras.

        ¿Por qué entraron en este mundo? ¿Echan de menos algo? ¿Cómo animarían a futuras colegas?

        Por ello hemos invitado a 4 desarrolladoras con larga experiencia trabajando con Ruby en nuestro país:

        - **Ismary Cruz**, RoR Developer en Platform 161
        - **Marina Aranda**, Software Developer en Reedsy
        - **Heyling Márquez**, Junior Backend Ruby on Rails Developer en Kelisto
        - **Verónica Castro**, Senior Backend Developer en The Cocktail

        Moderador: Josep Egea, organizador de Madrid.rb

        En la mesa trataremos estas y otras cuestiones, y, sobre todo, nos interesaremos por su experiencia.

        Esperamos vuestra asistencia, en persona o a través de Twitch!
