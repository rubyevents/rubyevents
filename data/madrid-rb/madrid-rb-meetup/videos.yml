  talks:
    - id: "madrid-rb-event-222-topic-302"
      title: "Coding Dojo"
      event_name: "Diciembre 2010"
      date: "2010-12-30"
      video_provider: "not_recorded"
      video_id: "madrid-rb-event-222-topic-302"
      description: |-
        **ZOMG!** Para la quedada de Diciembre del grupo de usuarios de Ruby de Madrid, contagiados por el espíritu festivo propio de las fechas, proponemos acabar el año con estrella invitada y actividad especial.

        Tenemos el lujo de contar con [Enrique Comba Riepenhausen](http://ecomba.org/), uno de los líderes del movimiento Software Craftmanship, y con su ayuda organizamos un [Coding Dojo](http://codingdojo.org/cgi-bin/wiki.pl?WhatIsCodingDojo). En particular, practicaremos una [Randori Kata](http://codingdojo.org/cgi-bin/wiki.pl?RandoriKata) en Ruby.

        Las cervezas, la buena conversación y la diversión de después, ya sabéis que también están aseguradas (Nuestra última estrella invitada [da fe de ello](http://twitter.com/hlame/status/8990488170332160))

        La quedada será el **Jueves, 30 de Diciembre** , a las **19:45** , en [**Utopic\_US**](http://www.utopicus.es/) ( [mapa](http://maps.google.es/maps?f=q&source=s_q&hl=es&geocode=&q=Calle+de+la+Concepci%C3%B3n+Jer%C3%B3nima,+22,+28012+Madrid&sll=40.396764,-3.713379&sspn=10.504732,23.269043&ie=UTF8&hq=&hnear=Calle+de+la+Concepci%C3%B3n+Jer%C3%B3nima,+22,+28012+Madrid,+Comunidad+de+Madrid&lr=lang_es%7Clang_en&view=map)). Recordad que hay una [lista de correo](http://groups.google.com/group/madrid-rb) y una cuenta de [twitter](http://twitter.com/madridrb) del grupo para manteneros al día.

        Como siempre, cualquiera es bienvenido (sea a participar o sólo a mirar) pero esta vez os pedimos que, si tenéis previsto acercaros, os apuntéis en la lista de abajo para poder gestionar adecuadamente el tema del espacio.
      speakers:
        - Luismi Cavallé

- id: "madrid-rb-event-226"
  title: "Enero 2011"
  event_name: "Enero 2011"
  date: "2011-01-27"
  video_provider: "children"
  video_id: "madrid-rb-event-226"
  description: |-
    Reunión de Madrid.rb de Enero 2011
  talks:
    - id: "madrid-rb-event-226-topic-306"
      title: "A [git] workflow"
      event_name: "Enero 2011"
      date: "2011-01-27"
      video_provider: "not_recorded"
      video_id: "madrid-rb-event-226-topic-306"
      description: |-
        Todos sabemos usar Git (o estamos a un [libro](http://progit.org/) de distancia de ello) pero, ¿cómo sacarle mayor partido?

        Git es una herramienta flexible y _agnóstica de workflow_, lo que quiere decir que podemos implementar nuestro flujo de trabajo, sea cual sea, sin tener que “pelearnos” con Git para reflejar en nuestros repositorios nuestra forma de trabajar. Al contrario, Git nos puede ayudar a estar seguros de que estamos siguiendo nuestras propias reglas de trabajo.

        En esta charla se propondrá un workflow, de los infinitos posibles a la hora de desarrollar software, inspirado muy de cerca en el que usamos en BeBanjo para desarrollar nuestros tres productos, basado a su vez en ideas ágiles como _continuous delivery_ y _kanban_, y se explicará también cómo hacer que Git no sólo lo soporte sino que se convierta en la herramienta clave para llevarlo a cabo.

        **AVISO** : Aunque a primera vista parece que esta charla no tiene relación con Ruby, a su final habrá ingesta masiva de cerveza, quedando demostrada así la falsedad de esa apariencia.

        ## Resources

        - [Slides de la charla](http://slidesha.re/gvbvl5)
        - [Wallpaper de regalo](http://bit.ly/gnPV10) (cortesía de [@bomberstudios](http://twitter.com/bomberstudios))
      speakers:
        - Sergio Gil Pérez de la Manga

- id: "madrid-rb-event-230"
