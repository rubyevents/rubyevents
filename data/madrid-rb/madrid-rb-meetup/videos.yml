        Que sirva esto como mensaje tranquilizador: no habrá _demasiado_ contenido matemático en la charla. Hablaremos de complejidad y de estructuras de datos, principalmente del trie.

        Las estructuras de datos son como los gadgets de Batman: el batrepelente de tiburones puede parecer lo más inútil del mundo hasta que el escualo se te engancha a la pierna. Por suerte, las estructuras de datos no ocupan tanto lugar (el _Art of Computer Programming_ en tapa dura no cuenta) ni las tienes que llevar en el cinturón batcinturón. Sospecho que tampoco sirve de mucho contra los [selacimorfos](http://es.wikipedia.org/wiki/Selachimorpha) [**Nota:** Pedantería patrocinada por _Saber y Ganar_]
