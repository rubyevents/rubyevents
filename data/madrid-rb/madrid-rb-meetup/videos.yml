      description: |-
        Join me for a practical dive into TimescaleDB, the open-source time-series database built on PostgreSQL, and its Ruby integration!

        We'll explore:

        - What makes TimescaleDB unique for time-series data (hypertables, compression, retention)
        - Getting started with the timescaledb gem in Rails/Ruby apps
        - Tips for working with continuous aggregates and time-based queries
        - Performance optimization techniques

        I'll share real examples of production use, and we'll have time for a Q&A. Whether you're new to time-series data or looking to level up your analytics stack, you'll walk away with practical knowledge you can use.
