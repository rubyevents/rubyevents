  video_provider: "children"
  video_id: "madrid-rb-meetup-january-2025"
  description: |-
    hosted by Josep Egea Sánchez by SNGULAR StageONE (www.sngular.com) - 30.01.2025 at 19:30

    Madrid.rb - January 2025

    https://www.madridrb.com/events/january-2025-solid-queue-internals-externals-and-all-the-things-in-between-1145
  talks:
    - id: "madrid-rb-meetup-january-2024-rosa-gutierrez"
      title: "Solid Queue internals, externals and all the things in between"
      event_name: "Madrid.rb January 2025"
      date: "2025-01-30"
      video_provider: "scheduled"
      video_id: "madrid-rb-meetup-january-2024-rosa-gutierrez"
      description: |-
        We’ve used Resque and Redis to run background jobs in multiple apps for many years at 37signals.

        However, performance, reliability, and our own apps’ idiosyncrasies led us to use a lot of different gems, some developed by us, some forked or patched to address our struggles.

        After multiple war stories with background jobs, looking at our increasingly complex setup, we wanted something we could use out-of-the-box without having to port our collection of hacks to every new app and with fewer moving pieces.

        After exploring existing alternatives, we decided to build our own and aim to make it the default for Rails 8.

        In this talk, I’ll present Solid Queue, explain some of the problems we had over the years, how we designed Solid Queue to address them, and all the Fun™ we had doing that.
      speakers:
        - Rosa Gutiérrez

