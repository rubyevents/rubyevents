        Os contaremos la historia que hay detrás de [bank\_scrap](https://github.com/ismaGNU/bank_scrap), una gema Ruby para acceder a información bancaria como transacciones o saldos de diferentes bancos. Desde como utilizamos ingeniería inversa sobre una aplicación móvil, hasta como creamos una abstracción para ampliar bank\_scrap a múltiples bancos.
