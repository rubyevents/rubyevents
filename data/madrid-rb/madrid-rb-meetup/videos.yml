      event_name: "Octubre 2014"
      date: "2014-10-30"
      video_provider: "not_recorded"
      video_id: "madrid-rb-event-261-topic-346"
      description: |-
        El Open Data prometía abrir las administraciones a los ciudadanos y generar una ola de transparencia. Pero los datos más jugosos no están en la superficie, esperando para ser tratados de forma estructurada y en formatos reutilizables, sino que se esconden en tablas imposibles y PDFs puñeteros. Hablaremos de cómo aplicar Ruby a la extracción y tratamiento de información pública para realizar investigaciones (con ejemplos internacionales y del trabajo que realizamos en [Civio](http://www.civio.es/)) y cómo los informáticos se han convertido en un elemento indispensable –y codiciado- en las redacciones.
      speakers:
        - David Cabo

- id: "madrid-rb-event-265"
  title: "Noviembre 2014"
  event_name: "Noviembre 2014"
  date: "2014-11-27"
  video_provider: "children"
  video_id: "madrid-rb-event-265"
  description: |-
    Reunión de Madrid.rb de Noviembre 2014
  talks:
    - id: "madrid-rb-event-265-topic-350"
      title: "Deuda técnica: achicando agua, que el barco se hunde"
      event_name: "Noviembre 2014"
      date: "2014-11-27"
      video_provider: "not_recorded"
      video_id: "madrid-rb-event-265-topic-350"
      description: |-
        El concepto de deuda técnica no es nuevo. En todos los proyectos quien más quien menos, tenemos deuda técnica, pero ¿dónde se encuentra? ¿de dónde viene? ¿por qué se crea? y sobre todo, ¿se puede gestionar? Contaré cuáles han sido mis experiencias a lo largo de mi vida como desarrollador y lo que he aprendido durante este tiempo.
      speakers:
        - eLafo

- id: "madrid-rb-event-266"
