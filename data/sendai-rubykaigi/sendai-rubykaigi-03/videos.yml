- id: "kitamura-daisuke-sendai-rubykaigi-03"
  title: "メンテナンス可能な全部入りライブラリは可能なのか？Ruby製xlsxライブラリ作成の現場から"
  date: "2026-11-21"
  language: "Japanese"
  video_provider: "scheduled"
  video_id: "kitamura-daisuke-sendai-rubykaigi-03"
  description: |-
    機能の拡張を進めると多くの要望に応えられるライブラリになります。しかし無秩序な拡張は利用者がどう使ってよいか迷うAPIになったり、将来にわたってのメンテナンス可能性を下げてしまいます。多くのライブラリ製作者はこの見定めを賢明に行っていることでしょう。生成AIの普及はこの点をどう変えたでしょうか。Ruby製Excelライブラリxlsxrbの開発を通して、生成AIを使えば機能の網羅とメンテナンス可能性は両立するだろう、だが開発者が強くかかわるべきポイントはまだあるという見通しを立てられたので共有します。
  speakers:
    - KITAMURA Daisuke

