- id: "laura-kirby-rubyconf-kenya-2019"
  title: "Building a Customer Facing Analytics"
  date: "2019-07-26"
  language: "English"
  video_provider: "not_recorded"
  video_id: "laura-kirby-rubyconf-kenya-2019"
  description: |-
    My team at Aspera IBM created a real-time data analytics platform using Kafka, Cassandra and Ruby on Rails. Cassandra can keep up with the high frequency of writes. Kafka can stream data from our daemon to our Rails Application. We now show our customers real-time & highly detailed historical data.
  speakers:
    - Laura Kirby

- id: "amr-abdelwahab-rubyconf-kenya-2019"
  title: "Deconstructing a Hype: What People Think Is Wrong with Ruby?"
  date: "2019-07-26"
  language: "English"
  video_provider: "not_recorded"
  video_id: "amr-abdelwahab-rubyconf-kenya-2019"
  description: |-
    Have you heard the so called "senior engineers" complaining about Ruby recently? Attended a Conference with a talk titled "Ruby is dead"? Did your team decide to ditch ruby?

