- id: "from-your-workstation-to-the-client-the-journey-of-code-rubyconf-kenya-2019"
  old_id: "sigu-magwa-rubyconf-kenya-2019"
  title: "From Your Workstation to the Client: The Journey of Code"
  raw_title: "From your workstation to the client - The journey of code - Nairuby   RubyConf2019 by Sigu Magua"
  date: "2019-07-25"
  published_at: "2019-09-23T19:10:43Z"
  language: "English"
  video_provider: "youtube"
  video_id: "oy2T8zh8g5k"
  description: |-
    You will rarely write software alone, you will most likely not use it alone - you need to ship it. I will be covering how you can effectively collaborate on software projects and ways of deploying it out to the world. Collaboration, communication, and automation

    What really is the best way to work in a team collaborating in software? How can a developer just write code then it finds its way to the server? I understand working in teams is a challenge, some of the challenges might include: - Should you do code reviews? - Should you write tests? - If yes what should be tested, should it be tdd or bdd - How can you have your git branches merged?

    I will be able to answer all these and more by covering the journey of code from the moment it’s written on a developers workstation to the time it runs on one or thousands of servers to be used by real-world clients. By the end of the session, your teamwork should be way better, your deployment should be smoother than before.
  speakers:
    - Sigu Magwa

