- id: "purity-maina-rubyconf-kenya-2019"
  title: "Blitzscaling with Ruby for Software"
  date: "2019-07-26"
  language: "English"
  video_provider: "not_recorded"
  video_id: "purity-maina-rubyconf-kenya-2019"
  description: |-
    Blitzscaling is a specific set of practices that prioritizes speed over efficiency allowing companies to go from "startup" to "scale up" at a furious pace. How can software engineers build scalable products on stable infrastructure when the business puts speed over efficiency?
