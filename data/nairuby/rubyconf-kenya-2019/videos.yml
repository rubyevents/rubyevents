- id: "stella-maris-rubyconf-kenya-2019"
  title: "How to Make Your Applications Secure"
  date: "2019-07-26"
  language: "English"
  video_provider: "not_recorded"
  video_id: "stella-maris-rubyconf-kenya-2019"
  description: |-
    Security is a major concern for any company involved in software development. This must be taken into account right from the beginning of a project. It is important for software developers to understand the kind of threats/vulnerabilities and application is likely to encounter and how best to prevent them. This presentation will give an overview of some of the breaches and how to prevent them.
