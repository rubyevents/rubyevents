- id: "kirsten-westeinde-rubyconf-kenya-2018"
  title: "Designing Software that Maximizes Developer Productivity"
  raw_title: "Designing Software that Maximizes Developer Productivity by Kirsten Westeinde"
  date: "2018-06-29"
  published_at: "2018-10-22T19:17:49Z"
  language: "English"
  video_provider: "youtube"
  video_id: "nbbWF8r89XM"
  description: |-
    Working with monolithic codebases can be tedious and kill developer productivity. We'll discuss implementation details of two possible alternatives. We'll discuss how to identify when an app has become a monolith in need of a refactor, and present patterns and tools to do said refactor.

    Having worked extensively in the Shopify codebase, one of the largest rails apps in existence, I have experienced firsthand some of the downsides of working in monolithic codebases. I have worked on a project team that extract an entire product out of Shopify into its own app, and have lots of insights/stories to share from this experience. On another project team, we built a micro service architecture from the get go. I learned a lot about the topic from all of these experiences (all in Ruby) and am excited to share some code samples, and stories of what has worked and what hasn't for us at Shopify.
  speakers:
    - Kirsten Westeinde

- id: "paul-stefan-ort-rubyconf-kenya-2018"
  title: "Reflection in Ruby: Understanding the Implications of Loading Gems and Files"
  raw_title: "Reflection in Ruby: Understanding the Implications of Loading Gems and Files by Paul Stefan Ort"
  date: "2018-06-29"
  published_at: "2018-10-22T19:17:38Z"
  language: "English"
  video_provider: "youtube"
  video_id: "kVNVbBs0DJQ"
  description: |-
    Have you wondered what is provided by a gem? What about monkey patches? Can you be sure that new changes do not conflict with old ones? We will demonstrate how to use Ruby's built-in reflection methods to address all of these topics, building up from foundations available to every Ruby developer.
    " Introduction to Ruby methods for detecting available classes and methods
    " Detecting classes and methods made available by requiring a gem
    " Detecting direct modification of existing behavior (via monkey - patching)
    " Detecting indirect modification of existing behavior (module inclusion)
    " Recommendations for further exploration of the topic
    This live coding talk is accessible to beginners, and contains material useful for experts

    Building from tools like Object constants and Object const_get, it uses short examples to demonstrate discovery of details from gems, monkey- patches, and modules.

    I have been refining this presentation over the last few months, giving versions of it at B'more on Rails, NYC.rb, the New York Public Library, and (most recently) the DC Ruby Users' Group (to positive reviews).
  speakers:
    - Paul Stefan Ort

- id: "tim-rogers-rubyconf-kenya-2018"
  title: "Miles More Maintainable: Building APIs with the Middleware Pattern"
  raw_title: "Miles More Maintainable: Building APIs with the Middleware Pattern by Tim Rogers"
  date: "2018-06-29"
  published_at: "2018-10-22T19:18:04Z"
  language: "English"
  video_provider: "youtube"
  video_id: "yO2rOwbk3bw"
  description: |-
    When you're building an API, things start simple. But before you know it, there's logic to reuse, from authentication to validation. This usually means a confusing list of before_actions. But there is a solution: moving from convoluted controllers to robust, maintainable chains of middleware.

    When you're building an API, things start off simple. But before you know it, there's lots of logic you want to build abstractions around and reuse - for example authentication, input validation and pagination.

    This usually means having a long list of callbacks living in your ApplicationController using Action Controller's before_action magic. This leads to:

    tangled data dependencies (where callbacks depend on data retrieved by other callbacks and stored in instance variables - the authenticated user, for example) hidden behavior (all those excepts and only on your before_actions are hard to reason about and separated from your code, usually living in ApplicationController!) difficulties with testing (unit testing methods inside a controller is hard!)

    The middleware pattern can help us to bring sanity to our APIs and make them miles more maintainable

    This pattern, used by Elixir's Phoenix, Node's Express and even Ruby's Rack help' to untangle our data dependencies, make our code much more explicit and easily unit test complex behavior. We can apply this pattern to our Rails application to move faster and write more maintainable code.

    In this talk, you'll learn how to move from convoluted controllers to robust, maintainable and well-tested chains of middleware built using an open-source gem, Coach (https://github.com/gocardless/coach).

    Each middleware can do exactly one job - for example, authenticating a user or validating input - and then either send a response to the client (for example an "invalid access token") error or it can pass data along (for example the authenticated user) and call the next middleware.

    This talk is based on a blog post I wrote, "When good controllers go bad: getting started with Coach" (https://gocardless.com/blog/getting-started-with-coach/).
  speakers:
    - Tim Rogers

- id: "brian-holt-rubyconf-kenya-2018"
  title: "Chaos Monkeys in Your Browser: What Chaos Engineering Means for the Front End"
  raw_title: "Chaos Monkeys in Your Browser: What Chaos Engineering Means for the Front End by Brian Holt"
  date: "2018-06-29"
  published_at: "2018-08-29T13:52:00Z"
  language: "English"
  video_provider: "youtube"
  video_id: "9SbPpSWZcP8"
  description: |-
    Chaos Monkey, but for your web app. Come learn how intentional failure injection is not only good for the back end but also for the front end. Hint: it means you'll get paged less at 3AM, and I think we're all happy about that.

    Chaos engineering is taking the web development world by storm, and for good reason. Chaos engineering is the emergent methodology of intentional causing random failures into your system. If you're expecting your system to failure at any time, you'll be ready for it when actually fails, right?

    This, until now, has been a back end practice: causing database read fails, app server lockups and the like. However we as the front end have a lot to gain from intentional failures. As an engineer at Netflix, I first hand got to see the pandemonium that Chaos Monkey causes. But more than that I got to learn quickly where our system came apart when failures happen. I'll be share with you my hard-earned knowledge of how intentional failure injection can help your system be more resilient.
  speakers:
    - Brian Holt

- id: "joannah-nanjekye-rubyconf-kenya-2018"
  title: "Ruby in Containers"
  raw_title: "Ruby in containers  by Joannah NANJEKYE"
  date: "2018-06-29"
  published_at: "2018-10-22T19:17:44Z"
  language: "English"
  video_provider: "youtube"
  video_id: "AwxSIFXyN6M"
  description: |-
    Because of the benefits of containers, ruby applications have been containerized recently. Containers have magically changed the way ruby applications are managed.

    This talk shall emphasize the different ways we can leverage containers and kubernetes to deploy and run robust applications.

    Containers have magically changed the way we deploy and manage ruby applications allowing us to build, develop, test, and even deploy ruby applications on a single system with no upgrade downtimes.

    In this talk, I will talk about how we can containerize and run ruby applications on kubernetes which is the missing layer that gives us the ability to manage many containers by providing features that enable containers to scale, talk to each other and work in harmony.
  speakers:
    - Joannah Nanjekye

