- id: "caleb-hearth-rubyconf-kenya-2018"
  title: "Don't Get Distracted"
  raw_title: "Don't Get Distracted by Caleb Thompson"
  date: "2018-06-28"
  published_at: "2018-08-20T15:10:00Z"
  language: "English"
  video_provider: "youtube"
  video_id: "JLAmRFWpaKo"
  description: |-
    He worked on a Wi-Fi geolocation app for a DoD contractor. When I realized its use was to track down and kill people. I was faced with a moral dilemma. I'll share the technical details of the app that made it so interesting to me & discuss the ethics of building tools without understanding their use.

    In 2011, with a team of interns at the Department of Defense contractor, I created a Wi-Fi geolocation app to locate hotspots. It could find the location in 3D space of every hotspot near you in seconds. We made formulas to model signal strength and probable distances. We used machine learning to optimize completion time and accuracy.

    He was so caught up in the details that it took me months to see it would be used to kill people. What do we do when we discover that we're building something immoral or unethical? How can we think through the uses of our software to avoid this problem entirely?
  speakers:
    - Caleb Hearth

- id: "aaron-cruz-rubyconf-kenya-2018"
  title: "Boom! Zap! PoW! (The Blockchain)"
  raw_title: "Boom! Zap! PoW! (The Blockchain) by Aaron Cruz"
  date: "2018-06-28"
  published_at: "2018-10-22T19:16:59Z"
  language: "English"
  video_provider: "youtube"
  video_id: "kkwAn3U5MLs"
  description: |-
    Even my grandma has been telling me about "The Blockchain" lately. Well, that's not true, but it could be true in today's cryptophile climate.

    I've been managing a mining farm, consuming thousands of kilowatt hours for most of the last year. The question people ask me the most is "Why do you have to use soooo much energy?" and the answers to this question bring up a lot more question s that almost always leads to the question asked frustratingly saying "That's soooo stupid!"

    In this talk, I will explain what Proof of Work (PoW) is, the pros and cons (i.e why it is and isn't soooo stupid), some alternatives and we'll even do some mining in Ruby!
  speakers:
    - Aaron Cruz

