  description: |-
    Montreal.rb Ruby Talk 2026/09 - Ruby Version Managers in 2026 - Andy Maleh - Senior Full-Stack Engineer - Eltropy Canada

    It is often useful to install more than one Ruby version on one's machine, whether to explore newer Ruby versions before committing to them on a Rails project, or to support multiple Rails projects running on multiple Rubies. Additionally, being able to scope gems by a Ruby project can be very helpful in ensuring the safety of running a Ruby app in complete isolation from other Ruby apps. The Ruby ecosystem contains multiple Ruby Version Managers that help with installing Ruby and scoping Ruby gems by project. This talk will cover the common Ruby Version Manager options in 2026, such as RVM, RBENV, CHRUBY, and ASDF.

