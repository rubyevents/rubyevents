  description: |-
    Rails 8 made deploying to your own server the default with Kamal, but the database is where people get nervous. How WAL archiving and base backups work, how to restore to a timestamp into a throwaway Postgres without touching production, and how to prove backups work by restoring them on a schedule. Based on what I built for Railyard, the deploy platform I run (written up at https://almokhtar.dev/blog/point-in-time-recovery-on-your-own-server/).
