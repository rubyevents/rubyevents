  Doors open at 6:00pm (pre-networking). Talk starts at 7:00pm. Book Club starts at 8:00pm. Networking time starts at 9:00pm. Must check-in on the computer upon arrival because Anticafe is a coworking space. The coworking space fee includes coffee/tea/snacks and costs about $10 per person. If you cannot afford it, let the organizer know and the organizer can take care of it.

  **Point-in-Time Recovery for Postgres on a Server You Own [1h] - Almokhtar Bekkour**

  Rails 8 made deploying to your own server the default with Kamal, but the database is where people get nervous. How WAL archiving and base backups work, how to restore to a timestamp into a throwaway Postgres without touching production, and how to prove backups work by restoring them on a schedule. Based on what I built for Railyard, the deploy platform I run (written up at https://almokhtar.dev/blog/point-in-time-recovery-on-your-own-server/).

  **Bio:**

  A senior software engineer in Quebec, Canada. Written production Ruby on Rails since 2017, and Go for Railyard's server agent, CLI and Terraform provider.

