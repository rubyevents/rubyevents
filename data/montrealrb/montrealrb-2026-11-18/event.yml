  **De Age of Empires II aux taxis électriques: Bâtir une intelligence sans IA [45m] - Hugues Lamy**

  « Est-ce que ma civilisation a besoin de plus de bois ? » « Quels taxis sont prêts pour ce client ? » Deux questions en apparence simples, mais aux ramifications multiples : comment agréger de l'information provenant de plusieurs sources et en tirer une décision ? Quels sont les critères ? Un engin à base de règles offre une grande flexibilité pour modéliser ces décisions à partir d'une masse d'information. L'expert y sculpte la logique selon son expérience et peut raffiner l'ensemble au fil du temps. Produire plus d'archers ou renvoyer un taxi à une borne de recharge par -20°C : dans les deux cas, la réponse est déterministe, rapide et traçable. Là où l'IA générative improvise, un engin à base de règles est précis — et chaque décision peut être expliquée. J'ai le plaisir de vous proposer un retour dans le passé avec un gem Ruby peu connu, Aristotle, et la notion de moteur de règles, pour ouvrir vos horizons sur l'intelligence sans IA.

  **Bio:**

  Consultant indépendant en technologie. Plus de 30 ans d'expérience TI, "couteau suisse" de la transformation numérique. Programmeur Ruby on Rails depuis 20 ans. "Programmais" en Basic sur un TRS-80 à l'age de 10 ans. Ingénieur de formation de l'École Polytechnique de Montréal. Projet notable: TéoTaxi. Fan de jeux vidéo (No Man's Sky, Guild Wars 2), de jeux de société et de disque golf.

