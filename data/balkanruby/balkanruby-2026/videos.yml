- id: "wojtek-wrona-balkanruby-2026"
  title: "From PostgreSQL to SQLite in Rails: Our Migration Journey, Challenges, and Lasting Trade-Offs"
  raw_title: "From PostgreSQL to SQLite in Rails – Wojtek Wrona – Balkan Ruby 2026"
  event_name: "Balkan Ruby 2026"
  date: "2026-05-16"
  published_at: "2026-07-28T09:20:41Z"
  language: "English"
  video_provider: "youtube"
  video_id: "gbIqDEXyaic"
  description: |-
    SQLite's rise in production use - boosted by recent Rails improvements - has caught many developers' attention. But beyond the buzz, what does it take to migrate a Rails app from PostgreSQL, and what trade-offs come with it?

    In this talk, I'll share our real-world migration story: the incremental process we followed, the challenges we faced, and the ongoing post-migration quirks you'll need to accept.

    Whether you're drawn to the promise of a simpler, more cost-effective setup or are cautious about potential compromises, you'll leave with clear, practical insights.
  speakers:
    - Wojtek Wrona

- id: "galia-kraicheva-balkanruby-2026"
  title: "Stop Tuning Hyperparameters. Start Looking at Your Data."
  raw_title: "Stop Tuning Hyperparameters. Start Looking at Your Data – Galia Kraicheva – Balkan Ruby 2026"
  event_name: "Balkan Ruby 2026"
  date: "2026-05-16"
  published_at: "2026-07-28T09:21:52Z"
  language: "English"
  video_provider: "youtube"
  video_id: "BUlYXuUw1ek"
  description: |-
    Why do so many AI projects fail — even with fancy models and impressive metrics?

    Because we obsess over algorithms and ignore the one thing that actually matters: the data.

    In this talk, we'll challenge the "model-first" mindset that dominates modern data science. Instead of jumping straight to XGBoost, deep learning, or the latest AI trend, we'll step back and ask a simpler question: Have we actually looked at our data?

    We'll talk about how skipping proper exploratory data analysis leads to false confidence, hidden leakage, biased predictions, and systems that work great in a notebook… and fall apart in production. Through practical examples and clear principles, I'll argue that understanding your data-generating process is more valuable than any hyperparameter search strategy.

    Better models don't start with better tuning. They start with better questions.
  speakers:
    - Galia Kraicheva

