- id: "giovanni-panasiti-balkanruby-2026"
  title: "Rails Engines Are the Best-Kept Secret (And You're Using Them Wrong)"
  raw_title: "Rails Engines Are the Best-Kept Secret – Giovanni Panasiti – Balkan Ruby 2026"
  event_name: "Balkan Ruby 2026"
  date: "2026-05-15"
  published_at: "2026-07-28T09:26:22Z"
  language: "English"
  video_provider: "youtube"
  video_id: "YsJNyEe3IaU"
  description: |-
    Rails engines are the most powerful architectural tool Rails gives you. After 5+ years building engines in production (including the 440+ star Active Storage Dashboard), I've learned that engines aren't just "gems with views." They're the missing piece between "monolith that's getting painful" and "let's rewrite everything as microservices." In this talk, I want to share the patterns that work, the mistakes that will ruin your week, and my zero-dependency philosophy that keeps engines maintainable for years. I'll also introduce ActiveCanvas a new open-source Rails engine that is a CMS/builder where marketing views can be dynamically changed by the marketing team without requiring too much html knowledge and without redeploy every time. Hot take: You don't need microservices. You don't need a team of ten. You need engines.
  speakers:
    - Giovanni Panasiti

- id: "roman-samoilov-balkanruby-2026"
  title: "Rage Under the Hood: Breaking Rack and Embracing Fibers"
  raw_title: "Rage Under the Hood: Breaking Rack and Embracing Fibers – Roman Samoilov – Balkan Ruby 2026"
  event_name: "Balkan Ruby 2026"
  date: "2026-05-15"
  published_at: "2026-07-28T09:27:10Z"
  language: "English"
  video_provider: "youtube"
  video_id: "FTcUoAMkmj0"
  description: |-
    "Ruby is not dead" has become the ecosystem's favourite reassurance. It's also the wrong conversation. Ruby is alive — but companies are still leaving, and the reasons are concrete: blocking I/O by default, framework overhead that's become Ruby's reputation, and generic abstractions that prioritise backend-swappability.

    Rails.cache, Active Job, the Rack interface itself — these are designed to work with everything, which means they're optimised for nothing.

    This talk introduces Rage, a framework that takes the opposite approach: every layer is purpose-built for a fiber-based, single-process runtime. No generic adapters but tailored solutions for a specific architecture. Rage challenges the status quo by coupling directly with the web server and leveraging the Fiber Scheduler to achieve asynchronous I/O that feels synchronous to write. In this talk, we'll open up the framework and look at the decisions inside:

    The "Synchronous Illusion" — how Rage lets developers write linear Ruby that executes asynchronously, with no callbacks and no new syntax.
    "Promise.all" style concurrency using Ruby Fibers — and the scheduler mechanics that make it possible.
    What we learned by replacing ActiveRecord's connection pool — and how it unlocked a 2.6x throughput gain in CPU-bound workloads.
    Real-world load tests comparing Rage against standard Rails setups under sustained heavy traffic.

    This talk is for anyone who believes Ruby's best days aren't behind it — but only if we're willing to rethink the foundations.
  speakers:
    - Roman Samoilov

- id: "hans-schnedlitz-balkanruby-2026"
  title: "Gems Are Overrated: or How I Learned to Stop Worrying and Love Copy-Pasting"
  raw_title: "Gems Are Overrated – Hans Schnedlitz – Balkan Ruby 2026"
  event_name: "Balkan Ruby 2026"
  date: "2026-05-15"
  published_at: "2026-07-28T09:27:56Z"
  language: "English"
  video_provider: "youtube"
  video_id: "zkXrwpFF5Hg"
  description: |-
    When I started working with Ruby, I embraced its rich ecosystem. My Gemfile for any new project immediately grew longer than Gandalf's beard. Unfortunately, using Gems comes with downsides. On the practical side, pulling in third-party libraries exposes your app to supply-chain attacks that are increasingly common. However, what's even worse is that most Gems are pure bloatware. They add thousands of lines of code you'll never need, and churn constantly.

    The alternative, obviously, is to build everything from scratch. In this talk, we'll look at some examples of how some well-known gems can be boiled down to a single file that you can copy-paste to any new project. We'll also look at the limits of this approach, and when you actually should reach for that Gem.
  speakers:
    - Hans Schnedlitz

- id: "marco-roth-balkanruby-2026"
  title: "HTML-Aware ERB: The Path to Reactive Rendering"
  raw_title: "HTML-Aware ERB: The Path to Reactive Rendering – Marco Roth – Balkan Ruby 2026"
  event_name: "Balkan Ruby 2026"
  date: "2026-05-16"
  published_at: "2026-07-28T09:22:49Z"
  language: "English"
  slides_url: "https://speakerdeck.com/marcoroth/html-aware-erb-the-path-to-reactive-rendering-at-balkan-ruby-2026-sofia-bulgaria"
  video_provider: "youtube"
  video_id: "hRW4zmMw1rs"
  description: |-
    ERB templates in Ruby are traditionally rendered by engines that treat templates as string generators, which makes it difficult to reason about HTML structure, state changes, or incremental updates. These limitations become especially visible in modern HTML-over-the-wire workflows.

    In this talk, we explore what it would take to build a reactive ERB rendering engine. We begin by revisiting how existing ERB engines compile templates into Ruby code and look at how recent advances in HTML-aware parsing and tooling make new approaches possible.

    Using Herb::Engine as a concrete example, we examine how structural understanding enables state-aware rendering, diff-based updates, and a more responsive development experience, including instant updates without full page reloads and rich in-browser developer tools. Such as template outlines, partial and ERB structure views, jump-to-source navigation, and many other innovations.
  speakers:
    - Marco Roth

- id: "carmine-paolino-balkanruby-2026"
  title: "Ruby Is the Best Language for Building AI Web Apps"
  raw_title: "Ruby Is the Best Language for Building AI Web Apps – Carmine Paolino – Balkan Ruby 2026"
  event_name: "Balkan Ruby 2026"
