  end_time: "16:40"
  language: "Japanese"
  video_provider: "not_published"
  video_id: "takumi-shotoku-kagoshima-rubykaigi-01"
  description: |-
    このトークではGemの一部をRustで書き、Rubyから呼び出す方法を紹介します。Rubyは動的言語というのもあり、どうしてもコンパイルする言語にパフォーマンスで劣ります。このような場合にC拡張を使うこともできますが、C言語のメモリ管理は煩雑なのであまり書きたくありません。そこで、速度・並行性・安全性の全てにおいて完璧で、素晴らしい言語であるRustを使ってみました。Rust拡張のGemの良さを話します。
