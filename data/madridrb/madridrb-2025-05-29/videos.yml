  description: |-
    With:

    - Rafael de Castro, Staff Engineer at  Amenitiz
    - German Del Zotto, Senior Software Engineer at Workato
    - Izel Nakri, Entrepreneur

    Moderator: Josep Egea

    Since ChatGPT appeared into the public scene, the amount of news, predictions and new products around the usage of LLMs in software development has been rivaled only by an equal amount of FUD spread among software developers and how our job is going to be impacted.

    In this roundtable we'd like to share the experience of real-world, close-to-home, Ruby developers using these technologies in their day-to-day work. What is being used in real life, what works, and what doesn't and how much it has affected our lives.

    Some of the topics we'd like to discuss:

    - Are we happy with LLMs as a knowledge source
    - How much we're using LLM generated code in our projects
    - What kind of workflows are emerging around tools like Copilot, Cursor, Aider, Windsurf, etc
    - Code reviews: Who's reviewing whom
    - What about managers: are they pushing for more or less AI
    - Are LLMs impacting the size of development teams

    Together with Rafael, Germán and Izel, we'll discuss this topics, trying to bring some light into this brave new world.
