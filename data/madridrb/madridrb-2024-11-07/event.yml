  The Spain Triangle Project
  Get ready for an unforgettable Ruby meetup as we wrap up the Ruby Europe: Spain Triangle Project - a pioneering initiative to unite and invigorate the Ruby community across Spain!

  What sets this event apart:

  As the final stop in our Ruby journey across Spain, this meetup is your chance to be part of a historic moment. Let's make Madrid a beacon for Ruby developers!

  Speakers:

  🎤 Mariusz Kozieł - 'Beyond Meetups: Creating Ruby Ecosystem’
  🎤 Egor Iskrenkov - ‘Code review automation: getting rid of "you forgot to..." comments’
  🎤 Paweł Strzałkowski - ‘My LLM is smarter than yours - RAG and Vector Search in Ruby’
  The Spain Triangle Project

  We're thrilled to host the final event of the Spain Triangle Project, an initiative by Ruby Europe. Catch up on what you missed:

  Barcelona.rb on November 5th
  Valencia.rb on November 6th Postponed due to recent tragic events
  Madrid.rb on November 7th
