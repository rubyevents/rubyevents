description: |-
  El verano se acaba (que no el calor) y una terraza apetece más que nunca!!

  Nos encantaría programar un terracismo real y disfrutar de una cerveza real, viéndonos fuera de una pantalla... pero no parece la mejor idea, todavía.

  No obstante, todos hemos cogido ya mucha experiencia en hacer de todo por videoconferencia, incluso divertirnos, así que hemos pensado que podemos hacer un nuevo Terracismo virtual!!

  El programa es sencillo: coge tu bebida favorita, conéctate al Meet, enciende la cámara y prepárate a echar unas risas con otros compañeros de batallas rubystas!!

  No tenemos ninguna actividad específica preparada, aunque sí algún recurso para romper el hielo. Si tienes alguna idea que te gustaría contar, avísanos y lo encajamos!!

