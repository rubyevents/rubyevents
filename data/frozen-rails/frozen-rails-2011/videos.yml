- id: "josh-kalderimis-sven-fuchs-frozen-rails-2011"
  title: "Travis CI - Distributed, Continuous Integration for the Ruby community"
  date: "2011-09-20"
  start_time: "15:45"
  end_time: "16:30"
  language: "English"
  video_provider: "not_recorded"
