- id: "peter-jackson-burlington-ruby-conference-2012"
  title: "Location based apps"
  date: "2012-07-29"
  start_time: "10:45"
  language: "English"
  slides_url: "http://assets.en.oreilly.com/1/event/59/Geospace%20your%20Rails%20Apps_%20Presentation.pdf"
  video_provider: "not_recorded"
  video_id: "peter-jackson-burlington-ruby-conference-2012"
  description: |-
    This session is intended for intermediate Rails developers who would like to start building location based applications, but may not know the full breadth of the toolkits available.

    We will start by examining the different types of location-based applications. Then we will look at the anatomy of a typical location-based application, and the elements of the spatial tool stack that apply to each geospatial element in the application.

    Finally, we will explore some examples of geospatial applications that are 1) inspiring and 2) use different elements of the stack as discussed during the session.
  speakers:
    - Peter Jackson
