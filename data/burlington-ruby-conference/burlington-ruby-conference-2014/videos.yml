- id: "phil-cohen-burlington-ruby-conference-2014"
  title: "Cooking Continuously - Infrastructure Automation Patterns with Chef"
  date: "2014-08-03"
  start_time: "09:45"
  end_time: "10:00"
  language: "English"
  video_provider: "not_recorded"
  video_id: "phil-cohen-burlington-ruby-conference-2014"
  description: |-
    Well-tested code deployed frequently and automatically is nothing new for many Rubyists, yet the idea that these practices can also be applied to infrastructure has yet to catch on the same way. We will explore the usage of RSpec and Minitest with Chef, and look at building an automated pipeline to deliver your entire infrastructure from a development Vagrant image to multi-cloud production clusters. I will discuss some workflows, tooling, and security considerations when adopting these strategies.
  speakers:
    - Phil Cohen

- id: "kerri-miller-burlington-ruby-conference-2014"
  title: "How to Interview and Why"
  raw_title: "Kerri Miller - How to Interview and Why - Burlington Ruby Conference 2014"
  date: "2014-08-03"
  start_time: "10:15"
  end_time: "10:45"
  published_at: "2014-08-16T17:49:17Z"
  language: "English"
  video_provider: "vimeo"
  video_id: "103598190"
  description: |-
    An interview too often feels like a first date - awkward, strange, and not entirely predictive of what's to follow. There are countless books and websites to help you when you're a job seeker, but what about when you're the one doing the hiring? Will you just ask the same puzzle questions or sort algorithm problems? What are your metrics for evaluating or contextualizing the answers? In this talk, I'll discuss successful practices and techniques to help you find someone who will innovate your business, bring new energy to your team, get the work done, AND be someone you'll want to work with.
  speakers:
    - Kerri Miller

- id: "starr-horne-burlington-ruby-conference-2014"
  title: "Five Machine Learning Techniques That You Can Use Today"
  date: "2014-08-03"
  start_time: "11:00"
  end_time: "11:30"
  language: "English"
  video_provider: "not_recorded"
  video_id: "starr-horne-burlington-ruby-conference-2014"
  description: |-
    Machine learning is everywhere: People have started to expect features like search, voice recognition, and recommendations to be in apps.

    Fortunately, you don't have to be a math whiz to make your apps smarter with standard machine learning techniques.

    In this presentation we'll cover five important machine learning techniques that you can use today. It's a wide and shallow introduction, for Rubyists, with plenty of simple code examples.

    By the end of the presentation, you won't be an expert, but you'll know about a class of tools you may not have realized were available.
  speakers:
    - Starr Horne

- id: "neal-kemp-burlington-ruby-conference-2014"
  title: "Effectively Testing Services"
  raw_title: "Neal Kemp - Effectively Testing Services - Burlington Ruby Conference 2014"
  date: "2014-08-03"
  start_time: "14:00"
  end_time: "14:30"
  published_at: "2014-08-16T19:09:06Z"
  language: "English"
  video_provider: "vimeo"
  video_id: "103601557"
  description: |-
    Our Ruby world is becoming increasingly service oriented. Even in trivial applications, we often glue on multiple services ranging from Twitter to AWS. Services can, however, be confusing to test.

    Many questions arise such as: How thoroughly should I test a service? Should I stub out responses or consume an API in test mode? How do I know a service is returning what I believe it returns?

    In this talk, Neal will answer these questions and more so that you may test services more effectively.
  speakers:
    - Neal Kemp

- id: "doug-alcorn-burlington-ruby-conference-2014"
  title: "How to Consume Lots of Data"
  raw_title: "Doug Alcorn - How to Consume Lots of Data - Burlington Ruby Conference 2014"
  date: "2014-08-03"
