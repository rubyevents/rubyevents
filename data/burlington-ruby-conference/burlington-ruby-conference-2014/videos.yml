- id: "robert-jackson-burlington-ruby-conference-2014"
  title: "Rails + Ember.js + ember-cli = ♥"
  raw_title: "Robert Jackson - Rails + Ember.js + ember-cli = ♥ - Burlington Ruby Conference 2014"
  date: "2014-08-03"
  start_time: "09:00"
