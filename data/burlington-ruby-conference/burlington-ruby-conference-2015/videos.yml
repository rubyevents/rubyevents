- id: "mark-sobkowicz-burlington-ruby-conference-2015"
  title: "Agile Teaching"
  date: "2015-08-01"
  start_time: "10:00"
  end_time: "10:30"
  language: "English"
  video_provider: "not_recorded"
  video_id: "mark-sobkowicz-burlington-ruby-conference-2015"
  description: |-
    As developers we are often called upon to teach elements of our craft to others. While we know our subject and our work, we might not know the best ways to share that knowledge with students. In this talk, I'll discuss how to apply well known themes of software development to the process of education. Reframing our students as customers brings their needs into focus, and defines our mission. Defining desired outcomes explicitly and clearly help us choose appropriate activities. Drawing from a career teaching students to code, I'll share some successes and failures and leave you with techniques to help you be a more effective and inspiring teacher.
  speakers:
    - Mark Sobkowicz

- id: "sam-phippen-burlington-ruby-conference-2015"
  title: "Extremely Defensive Coding"
  date: "2015-08-01"
  start_time: "11:00"
  end_time: "11:30"
  language: "English"
  video_provider: "not_recorded"
  video_id: "sam-phippen-burlington-ruby-conference-2015"
  description: |-
    Defensive programming is one of those abstract ideas that seems great. We all want to use these ideas to ensure the long-term maintainability of our codebases. It is, however, often unclear what we should be defending against and what form those defenses should take. We can find places where defensive patterns could be added by looking at the edge cases that occur in our system. Where it seems appropriate, we can then apply ideas and patterns from defensive programming.
  speakers:
    - Sam Phippen

- id: "sara-simon-burlington-ruby-conference-2015"
  title: "Learning Fluency"
  date: "2015-08-01"
  start_time: "14:00"
  end_time: "14:30"
  language: "English"
  video_provider: "not_recorded"
  video_id: "sara-simon-burlington-ruby-conference-2015"
  description: |-
    As Ruby devs, we tend to be strict in our devotion to the "just get your hands dirty and play around with the code" learning style. It's what I like to think of as natural context learning. It's being thrown in the deep end and forced to swim to shore. It's hands-on. It's incredibly valuable. It works, but it works faster and better if it's not a stand-alone method. This is a talk about the other methods. It's a talk about the tricks I used to become nearly fluent in Mandarin Chinese, and about how I applied those same tricks to learning Ruby. In a nutshell, it's about the foreignness of programming languages and about the ways we can program our brains to learn a foreign one. I've found intrinsic similarities between foreign and programming languages, and with each, I've found a simple and straightforward path to fluency.
  speakers:
    - Sara Simon

- id: "aaron-kalin-burlington-ruby-conference-2015"
  title: "Anatomy of a Distributed Denial of Service Attack"
  date: "2015-08-01"
  start_time: "15:00"
  end_time: "15:30"
  language: "English"
  video_provider: "not_recorded"
  video_id: "aaron-kalin-burlington-ruby-conference-2015"
  description: |-
    Ever been to a website or tried to use an internet service that was suddenly not working? It may have been the victim of a Distributed Denial of Service attack or DDoS as they are called. They happen almost daily in varying shapes and sizes, but you don't always get the details of how and why. You'll hear the story of such an attack from someone who was a victim along with detail of how it happened, why it happened, and what they are doing to protect themselves the next time it happens so you can too.
  speakers:
    - Aaron Kalin

- id: "sharon-steed-burlington-ruby-conference-2015"
  title: "How to Talk to Humans: A Different Approach to Soft Skills"
  date: "2015-08-01"
  start_time: "16:00"
  end_time: "16:30"
  language: "English"
  video_provider: "not_recorded"
  video_id: "sharon-steed-burlington-ruby-conference-2015"
  description: |-
    Developers are trained to communicate to things with a goal in mind. When you're talking to something like, say a computer, you type in your code and it responds by giving you back what you want. Nine times out of ten, it works perfectly. Why, then, is it so difficult to do this same thing when talking to a client about a project, updating a superior on your progress, or pitching an investor your million-dollar idea? Because talking to people requires a special set of skills - namely, empathy and a little bit of storytelling. In an industry filled with brilliant minds, great ideas and mass disruption, so few of the best and brightest know how to tell their compelling story. The takeaways from this talk will be learning how to value the listener, improved social connection and becoming a master at building a relationship quickly and effectively.
  speakers:
    - Sharon Steed

- id: "tim-krajcar-burlington-ruby-conference-2015"
  title: "kenny_g.rb: Making Ruby Write Smooth Jazz"
  date: "2015-08-01"
  start_time: "16:45"
  end_time: "17:15"
  language: "English"
  video_provider: "not_recorded"
  video_id: "tim-krajcar-burlington-ruby-conference-2015"
  description: |-
    For too long, computers have been shut out of the red-hot music-to-listen-to-while-relaxing-in-the-bathtub genre. Today, that all changes. Our smooth-jazz-as-a-service startup is primed to disrupt this stale industry. In this talk we'll introduce the basic protocols of digital music and take a whirlwind tour of musical harmonic theory. We'll survey some Ruby tools that make noise and we'll dig deep into using Ruby to generate beautiful piano music with audience-selected chords. It will all culminate in a showdown between man and machine to decide the fate of the musical universe as our program battles a real live musician.
