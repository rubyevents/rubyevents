- id: "eileen-m-uchitelle-burlington-ruby-conference-2015"
  title: "How to Performance"
  date: "2015-08-02"
  start_time: "15:00"
  end_time: "15:30"
  language: "English"
  video_provider: "not_recorded"
  video_id: "eileen-m-uchitelle-burlington-ruby-conference-2015"
  description: |-
    Understanding performance output can feel like reading tea leaves. It makes sense to a few people, but many of us are left in the dark; overwhelmed and frustrated by the data. On top of that there are a ton of performance tools to choose from; StackProf, RubyProf, AllocationTracer. Where do you even start?

    While working on speeding up integration tests in Rails source, I learned that the key to improving performance of Ruby code is having a baseline, not relying on one profiler and understanding the advantages and limitations of your tools. By utilizing these methods integration test are now 3 times faster than they were in Rails 4.2.0, with more improvements being made every day.

    In this talk we will not only look at how to read performance output, but when and how to use the right profilers for the job. We'll discuss a variety of methods and techniques for benchmarking and profiling so you can get the most out of each performance tool.
  speakers:
    - Eileen M. Uchitelle

- id: "hiro-asari-burlington-ruby-conference-2015"
  title: "Why am I Waiting for a Long Time for the Build to Start?, Or, the First Lessons in Control Theory."
  date: "2015-08-02"
  start_time: "15:45"
  end_time: "16:15"
  language: "English"
  video_provider: "not_recorded"
  video_id: "hiro-asari-burlington-ruby-conference-2015"
  description: |-
    As Travis CI grew in popularity, a common question users started asking is: 'Why is my build slow to start on Travis CI?'. While the work to improve this experience for our users is an ongoing multi-faceted story, this talk will focus on one aspect of that story: control theory.

    The principal aim of control theory is to systematize methods of controlling systems under consideration. In this context, a 'system' can be simple with a single input and a single output (e.g., a thermostat), or quite complex with multiple inputs and multiple outputs (e.g., a human body). A 'controller' looks at the signal which the system emits, and applies corrective action to the input to the system so that the desired level of output is produced by the system. The controllers can also be complex, of course, but it can also be surprisingly simple to be an effective controller.

    The theory can be applied in many situations in the world, and Travis CI is no exception. We will discuss what role the theory plays in our process, and how we could improve the overall user experience.
  speakers:
    - Hiro Asari
