  🌵 Hi fellow Rubyist!

  Great news! Physical meetups are finally back!

  For our first physical RubySG meetup in 2 years, Adrian will share about how he used [Searchkick gem](https://github.com/ankane/searchkick) (SK) to build search features with ElasticSearch (ES). He will be covering various topics such as why and how he use SK / ES (using it with ActiveRecord); How to query using SK using the different search options (pagination, limit etc.); Reindexing options; Similarity search; Multi-search (batching search queries into 1 query) and more!
