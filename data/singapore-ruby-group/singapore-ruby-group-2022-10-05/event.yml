  🌵 Hey fellow Rubyist, it's time for another in-person RubySG meetup!

  For this edition, we have Peter Hoeg, Founder at Speartail, who will be sharing with us how we can make Ruby deployments an enjoyable experience! 🤩

  Painless Ruby deployments
  As nice as it is *writing* Ruby, getting it to run in production is a very different situation. This talk explores how to use the nix package manager (and expression language) to create self-contained, immutable and reproducible production environments for ruby code with instant development environments thrown in for good measure.
