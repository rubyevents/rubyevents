description: |-
  It's going to be ONE of the two talks below, from Jim with love:

  Talk #1 is on RSpec-Given, an extension to RSpec that allows Given/When/Then syntax with RSpec. I will also rant about testing in general and hopefully provide some tips on writing more expressive and less brittle tests.

  Talk #2 is a live coding session where we derive the mysterious Y-Combinator, of Functional programming fame. We will delve into the Fixpoints, Higher Order Functions and Functional Refactorings to come to understand this often mentioned, but rarely understood function. I promise you will see some of the strangest Ruby code you have ever seen and almost nothing in the talk will be useful in your day to day programming life.
