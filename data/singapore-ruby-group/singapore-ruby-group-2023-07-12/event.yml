  🌵 Hey fellow Rubyist, it's time for another in-person RubySG meetup!

  For this edition, we have Khoon Hiang and Ted Johansson! 🤩

  “Ruby Things I've Taken For Granted” - Khoon Hiang
  A short and (hopefully) interactive talk about a few Ruby methods I wished were available in other languages, inspired by the hair-pulling experience of having to implement them in Javascript when I needed them.

  "The State of Parallel Testing" - Ted
  We all agree tests are good. We all agree slow test runs are bad. Still it is not uncommon for test suites to slowly grow upwards to half an hour or more. One solution to this is running tests in parallel, but why is that seemingly so hard in Ruby, and what are our options?
