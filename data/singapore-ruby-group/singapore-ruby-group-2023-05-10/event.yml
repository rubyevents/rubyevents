  🌵 Hey fellow Rubyist, it's time for another in-person RubySG meetup!

  For this edition, we have Melvrick Goh, Director of Engineering at Ascenda! 🤩

  “Be conservative in what you send, be liberal in what you accept”
  This principle has been fundamental to the design of many internet protocols and is a key part of their robustness. In code, or systems’ architecture, it’s presence is more sublime. In this session, we will explore the intersection of Postel’s Law and robustness, looking at samples for building more resilient systems that balance the need for flexibility with the importance of simplicity & stability.
