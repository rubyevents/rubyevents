  🌵 For November's meet up, we will be having our fourth of six series of Behind the Gems, RubySG Miniseries.

  We are inviting makers from the Ruby community to share with us their journey and what they have built. For this talk, Kang Sheng will be sharing about his experience building YetAnotherYear, a New Year's Resolutions app. YetAnotherYear is build on Ruby on Rails and a modern frontend framework. This talk will mostly be focusing on the different touch points between Ruby on Rails and the modern frontend framework and how Ruby on Rails can still power web apps today.
