description: |-
  Join us for our July meetup; it's been a while! This time, there will only be 1 speaker.

  SEO on Rails — Learn how to optimize your app for search engines

  Oscar (Dung Huynh) will share tips, gems, and techniques to implement SEO — “Search Engine Optimization” — on Rails. The talk will also cover some fundamental SEO concepts such as Core Web Vitals, Structured Data, and HTML meta tags and attributes. At the end of the talk, we will do some quick dives into your projects and how you can improve your SEO.

  Oscar was formerly a Growth Engineer at Happy Scribe (happyscribe.com), where he built a podcast transcript platform that grew to 350k monthly visits. He’s now building Where Should We Go (whereshouldwego.co), a search engine for local events.
