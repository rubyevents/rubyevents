- id: "emily-stolfo-singapore-ruby-group-2017-06-20"
  title: "Confess your MongoDB opinions"
  raw_title: "Confess your MongoDB opinions - Singapore Ruby Group"
  kind: "discussion"
  date: "2017-06-20"
  published_at: "2017-06-20T14:46:34Z"
  video_provider: "youtube"
  video_id: "BjBIOUPkyY0"
  description: |-
    As the maintainer of Mongoid, the ActiveRecord replacement for using MongoDB with Rails, I'm aware that MongoDB isn't the first database choice of Rails users. I'd like to find out what I can do to help developers more often choose to use MongoDB with Rails. Can I build tools to help you migrate data? Can I provide a connector that allows you to convert SQL queries to MongoDB queries? Should I make the query DSL totally different from that of ActiveRecord and more similar to MongoDB's JSON-like query language? I invite you to openly confess your MongoDB opinions to help me provide better support for the Rails community in this brief two-way presentation.
  speakers:
    - Emily Stolfo

