description: |-
  Do you want to learn how to program and develop web applications for Ruby on Rails and have no idea where to start? Or, are you a company that has staff that need to get up to speed on Ruby on Rails?

  You are invited to attend the Ruby on Rails InstallFest, brought to you by Ruby Singapore, sponsored by reInteractive (http://www.reinteractive.net) from Australia and Silicon Straits.

  This is the first time that we are doing such an event in Singapore and reInteractive, who pioneered this movement in Australia, has gladly agreed to help in whatever ways they can (Thank you, reInteractive)!

  Event Details:Date : 5 Oct 2013 (Saturday)
  Time : 09:30am to 12:30pm
  Venue : Silicon Straits, 71 Ayer Rajah Crescent, #06-11/12, Singapore 139951

  For a start, we are looking at filling 35 seats (due to space constraint), and if we have a sizeable demand, we'll look into conducting Rails InstallFest monthly or once every two months. So, fret not if you can't get a seat this time.

  What is it exactly about?

  This will be your opportunity to get your laptop or computer working with a full Ruby on Rails development environment, all setup and working. Most importantly, it's a FREE service!

  We get your laptop up and running on Rails. This can take a bit of work. You are welcome to bring your Windows, Mac or Linux PC, our team can help get you running on any of these.

  Once you have installed Rails, we get you building your own blog powered by Ruby on Rails, by the end of the session, you should have this up and running, online and published on the Internet :)

  Then, we'll get your published blog personalised, with Javascript, CSS and headers and footers. All the while learning more about Rails.

  Wait, what do I bring?

  The only requirement is you bring your computer along with whatever power charger you need, and also, please, make sure your computer works :) Power boards will be provided, everything else is up to you.

  OK, I need one more incentive. How about free food?

  We're on it, and will make sure that there'll be light snacks and drinks to go around.
