description: |-
  The "How does it work?" meetup was inspired by Guo Xiang's suggestion to have a meetup talk about how Sprockets actually works.

  After the first meetup we decided to vote about the topic for next month. The chosen option was Concurrent Ruby, a toolset that provides a bunch of higher-level abstractions for concurrency in Ruby.

  Concurrent Ruby is a big library, therefore we decided to pick just a part of it to discuss and learn together how it works

  Preparation

  1. Download code from https://github.com/ruby-concurrency/concurrent-ruby

  2. Read the description and code of promise feature. https://github.com/ruby-concurrency/concurrent-ruby/blob/master/lib/concurrent/promise.rb

  3. Read the description and code of async feature. https://github.com/ruby-concurrency/concurrent-ruby/blob/master/lib/concurrent/async.rb

  Meetup plan

  We meet at 7.30pm and start by discussing how promises work. Everyone can participate, show some example and explain how the code works. Everyone can ask questions whenever something is not clear.

  Depending on the length of the first part, we'll try to cover async feature as well.
