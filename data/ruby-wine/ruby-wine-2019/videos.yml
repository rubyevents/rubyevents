- id: "ivan-zarea-ruby-wine-2019"
  title: "What happens in a request, stays... where?"
  raw_title: "What happens in a request, stays... where? - Ivan Zarea (ENG) | Ruby Wine"
  date: "2019-04-13"
  published_at: "2019-05-02T14:34:17Z"
  video_provider: "youtube"
  video_id: "CmWTnu9mIzQ"
  description: |-
    Speech of  Ivan Zarea, Lead Architect at YoungCapital, at Ruby Wine in Chisinau, 13.04.2019
    http://www.rubywine.org

    During the talk, I will guide the audience through everything that happens in a Rails app from the moment a browser sends a request request to the app returning a response response. The talk covers DNS resolution, reaching Puma (or Unicorn, if that's your thing), how Rails finds the relevant code to execute. It also goes a bit into middleware and finally, how your browser interprets the response rendered by your Rails app.

    The talk is aimed to fill the gaps for junior-mid level developers in their understanding of the web stack and how Rails operates. I'm certain it will be fun!

