- id: "ivan-nemytchenko-ruby-wine-2019"
  title: "Embrace multi-model thinking!"
  raw_title: "Embrace multi-model thinking! - Ivan Nemytchenko (ENG) | Ruby Wine"
  date: "2019-04-13"
  published_at: "2019-05-02T12:40:05Z"
  video_provider: "youtube"
  video_id: "lSihfT1Z3NY"
  description: |-
    Speech of  Ivan Nemytchenko at Ruby Wine in Chisinau, 13.04.2019
    Slides - 
    http://www.rubywine.org

    "Building apps is a complex and multi-paradigm process. Rails made it easy for us, but when you're building a very big app, conceptual compression no longer works. Even minor flaws lead to serious unwanted effects. This is how legendary Big Balls of Mud apps are born.

    To understand complex things, people develop multiple mental models and combine them during the decision-making process. We'll use these seven different points of views to inspect our job as Rails developers:

    - State management
    - Object types (diversity) management
    - Logic management (Application and Business logic)
    - Entry point management
    - Dispersion management (Levels of abstractions)
    - Execution flow management
    - Side effects management

    It will not make you a CTO but definitely will improve your ability to win a dispute about application architecture

