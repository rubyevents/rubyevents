    The audience for this talk ranges from beginner to advanced; the concepts are easy to understand, but even advanced Rubyists will likely learn something new.

    Fibers: they’re often associated with threads, but they’re a different beast altogether. Fibers subvert common understanding of how typical computer programs work (functions that can return twice?!).This talk is an introduction to fibers, and also demonstrates practical and interesting applications.

