- id: "alexander-kudrin-ruby-wine-2019"
  title: "Domain Driven Design"
  raw_title: "Domain Driven Design - Alexander Kudrin (ENG) | Ruby Wine"
  date: "2019-04-13"
  published_at: "2019-05-02T10:34:18Z"
  video_provider: "youtube"
  video_id: "C9kpq7_Ccyw"
  description: |-
    Speech of  Alexander Kudrin, Teach Lead at Amarkets, at Ruby Wine in Chisinau, 13.04.2019
    Slides - 
    http://www.rubywine.org

    Each successful commercial project contains a large number of business processes. Over time, the number of them increases, current processes are often changing, as a result - rise in entropy. Entropy leads to a decrease in productivity of the development team, one hour task takes up to two days. I would like to talk about Domain Driven Design, which may help to solve this problem. This approach comes from Java and .NET worlds where it has been working for more than 15 years. But what to do if your project is written on Rails?Proposed agenda: 
    1) Short review of the methodology. 
    2) Talk about ubiquitous language 
    3) Bounded context 
    4) Model-Driven Design 
    5) What to start from?

