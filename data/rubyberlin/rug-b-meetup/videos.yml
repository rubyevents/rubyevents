  talks:
    - id: "tim-kachele-rug-b-meetup-february-2024"
      title: "Hat der Markt geregelt?, or: how to build an exchange"
      event_name: "RUG::B Meetup February 2024"
      date: "2024-02-01"
      video_provider: "not_recorded"
      video_id: "tim-kachele-rug-b-meetup-february-2024"
      description: |-
        While you shouldn't believe all the fairy tales told by the financial industry, such as that a free market can solve everything (affordable housing *cough*), you can believe this: this talk is going to show you how to build an exchange system in ruby.

        You may not have to build an exchange on a day to day basis, but the ideas involved can be transfered to other domains and can help you build your own scalable services.

        We are going to look at the requirements, the data structures and how to make it reliable.
      speakers:
        - Tim Kächele

    - id: "tobias-pfeiffer-rug-b-meetup-february-2024"
      title: "Going Staff"
      event_name: "RUG::B Meetup February 2024"
      date: "2024-02-01"
      video_provider: "not_recorded"
      video_id: "tobias-pfeiffer-rug-b-meetup-february-2024"
      description: |-
        What's up with becoming a Staff Engineer? What does it mean? Is it just for people who want to keep coding? How do you become a Staff Engineer and what does the work entail?
        What if I told you, that being a Staff engineer actually required a lot of communication and collaboration skills?

        In this talk, let's answer all those questions - as it's still quite fuzzy what a Staff engineer actually is.
