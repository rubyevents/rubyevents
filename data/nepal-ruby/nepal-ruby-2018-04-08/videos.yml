    Talk Abstract
    Did you ever get bored executing large query for complex search and not getting the result you really want? What if you could use the feature that elasticsearch has within Rails application? Don’t worry, Searchkick has us covered. And the best part of them is, they are both open source.

    Talk Description
    Have you ever thought of using elasticsearch in Rails? Do you want to get your search results more precise? Do you wish for tools to visualize your search data? Well, here is elasticsearch to rescue us which can be setup in rails application using Searchkick gem. This talk will cover about basic elasticsearch intro along with searchkick setup in rails application.

