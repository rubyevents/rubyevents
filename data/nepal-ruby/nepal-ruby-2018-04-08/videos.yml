  description: |-
    Talk Abstract
    When you stand in front of the project that aims to come with mobile and web application, going for combo Rails, React.js & ReactNative is easy choice. But to decide how to handle the data flow is a different story. My team made this decision and it enabled us to share most of the business logic .

    Talk Description
    Writing React with Rails apps is awesome for both web and mobile… so why not share code between your two implementations? This talk will cover about how Redux allows to build apps and easily switch frameworks without having to rewrite any business logic.
