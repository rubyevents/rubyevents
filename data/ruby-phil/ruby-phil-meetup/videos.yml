    - id: "artem-blazhievskii-ruby-phil-meetup-june-2026"
      title: "The One Person Framework"
      date: "2026-06-25"
      published_at: "2026-06-28T00:00:00Z"
      video_provider: "youtube"
      video_id: "HhziHFbTOh4"
      description: |-
        In this talk, Artem shares his journey of discovering Ruby and becoming a commercial Rails developer. He introduces his open-source carpooling app, Pasabaya, built using the vanilla Rails way.

        The talk focuses heavily on "The One Person Framework" philosophy and how Rails 8.1 components like SQLite in production, the Solid Trifecta (Solid Cache, Solid Cable, Solid Queue), Kamal, and Hotwire empower a solo developer or a tiny team to build, deploy, and launch real, modern single-page-app-like products fast without overcomplicating the infrastructure.
      speakers:
        - Artem Blazhievskii

