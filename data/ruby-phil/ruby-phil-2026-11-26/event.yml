  **Talks**

  **"Ruby Playground: Learn Ruby by Working with Code" | Nestor Pestelos**
  Nestor is building Ruby Playground for newcomers learning Ruby and experienced Rubyists who want to keep up as the
  language evolves. Each lesson asks you to predict what an example prints, run it, then change the code. I'll share the
  roadmap, which covers the fundamentals and what changed in specific Ruby versions.

  ***"Taming Rails for AI Agents" | Gerard Cruz***
  Your AI assistant should debug directly in your application, not through log files. Give coding agents a Rails console that
  keeps its state, a server they control and a real debugger over MCP.

  ***Ruby on ICP now has OpenSSL inter-cycle clock-ticks | Al*** *-* Al's Ruby on ICP runtime has now implemented some of the very tricky problems introduced by the blockchain environment randomness (as a basis for strong encryption) and inter-block clock handling. We'll talk about how this affects the design of blockchain-based ruby applications.

