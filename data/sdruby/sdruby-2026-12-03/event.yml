description: |-
  Please join us for SD Ruby's holiday meetup.

  **Location**
  We meet at [Ivy Street Coworking](https://ivystreet.co/) in South Park, San Diego. The entrance is on the Ivy Street side near the corner of 30th and Ivy Street.
  [Map of location](http://%5Bhttps//www.google.com/maps/place/Ivy+Street+Coworking/@32.7287541%5D(https://www.google.com/maps/place/Ivy+Street+Coworking/@32.7287541),-117.1329429,17z/data=!3m1!4b1!4m6!3m5!1s0x80d955c4ce742567:0xc95fb3d299348442!8m2!3d32.7287541!4d-117.130368!16s%2Fg%2F11gr64ql8z?entry=ttu)
  2986 Ivy Street, San Diego, CA 92014

  **Parking and Transportation**

  * Parking in South Park can be a little tricky. Your best bet is on the west side of 30th along Dale Street.
  * South Park is accessible via the [MST Bus Route #2](https://www.sdmts.com/getting-around/departures-and-schedules/schedules/2) at the Juniper and 30th Street stop.
  * There are bike racks on the Ivy Street side of the building near the door.

  **Agenda**

  * 7:00pm - Welcome from the SD Ruby organizers
  * 7:15pm - Advent of Code challenges
  * 8:00pm - Attendee introduction and hiring/looking announcements
  * 8:30pm - Social hour at Station Tavern

  **Social Hour**
  Please join us for beer and tater tots across the street at [Station Tavern](https://stationtavern.com/).

