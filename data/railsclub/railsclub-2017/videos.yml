- id: "anna-shcherbinina-railsclub-2017"
  title: "Сказ о синхронных и асинхронных парадигмах"
  raw_title: "Анна Щербинина. Сказ о синхронных и асинхронных парадигмах"
  date: "2017-09-23"
  published_at: "2017-10-22T20:17:38Z"
  language: "Russian"
  video_provider: "youtube"
  video_id: "ZIReRhnSiL0"
  description: |-
    Web основан на коммуникации: взаимодействие между сервисами, серверами, утилитами, классами в приложении. Изначально выделились две полярности, синхронное взаимодействие между компонентами и асинхронное. Очевидно, без синхронного взаимодействия не обойтись когда реакция напрямую связана с ответом, полученным на запрос. С асинхронными запросами тоже довольно просто, нам не важно когда они выполнятся, главное, чтобы были выполнены. Позже появились гибриды, которые семантически синхронны, а в реализации асинхронны. Как пример - общеизвестный лонг-пуллинг. Для асинхронных нередко указывается время за которое они должны отработать. Случается, что ответить надо нескольким клиентам, вместо одного. Каждый из типов имеет свои особенности, сильные и слабые стороны, которые мы рассмотрим. Но что если взглянуть на синхронность и асинхронность под другим углом?
  speakers:
    - Anna Shcherbinina
