- id: "bart-ten-brinke-willem-van-bergen-rubyenrails-2009"
  title: "Tuning your rails application - to measure is to know"
  raw_title: "ReR09 - Bart ten Brinke - To Measure is to Know"
  event_name: "RubyEnRails 2009"
  date: "2009-10-30"
  published_at: "2009-11-16"
  language: "English"
  track: "Centre room"
  video_provider: "vimeo"
  video_id: "7642650"
  description: |-
    In their talk, Bart and Willem will discuss an often neglected part in BDD: performance. Because performance doesn't matter, until it does.

    We will explain how to prepare for the time when the shit does hit the fan, so you won't be caught with your pants down. How to drill down to the core of the problem, and then how to solve it. In performance there is no such thing as a silver bullet, but after this talk you will know which tools should be in your toolbox. And more important: how they should be used.
  speakers:
    - Bart ten Brinke
    - Willem van Bergen

