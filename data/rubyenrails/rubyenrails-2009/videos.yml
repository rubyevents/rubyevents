- id: "bart-zonneveld-sjoerd-tieleman-rubyenrails-2009"
  title: "Lessons learned while building omroep.nl"
  raw_title: "ReR09 - Bart Zonneveld & Sjoerd Tieleman"
  event_name: "RubyEnRails 2009"
  date: "2009-10-31"
  published_at: "2009-11-16"
  language: "English"
  track: "Centre room"
  video_provider: "vimeo"
  video_id: "7642657"
  description: |-
    Omroep.nl is the largest of many Ruby on Rails applications we have built for the Dutch Public Broadcasting organisation. In this talk we will give an overview of tools and technologies we used in the process of building this website. Also, we will present various strategies we used to get the best performance and stability for incorporating various sources of external data.
  speakers:
    - Bart Zonneveld
    - Sjoerd Tieleman

