- id: "erik-veenstra-rubyenrails-2006"
  title: "Magic with Metaprogramming in Ruby"
  original_title: "Magie met meta-programmeren in Ruby"
  event_name: "RubyEnRails 2006"
  date: "2006-05-18"
  language: "Dutch"
  video_provider: "not_recorded"
  video_id: "erik-veenstra-rubyenrails-2006"
  description: |-
    Erik Veenstra is een van de weinige Nederlandse Ruby-deskundigen. Hij is auteur van o.a. RubyScript2Exe, waarmee Ruby-programma's in een standalone executable verpakt kunnen worden. In deze sessie vertelt hij hoe je kunt meta-programmeren in Ruby en wat het nut daarvan is.
  speakers:
    - Erik Veenstra
