- id: "frank-oxener-rubyenrails-2006"
  title: "Introduction to Rails"
  original_title: "Introductie Rails"
  event_name: "RubyEnRails 2006"
  date: "2006-05-18"
  language: "Dutch"
  video_provider: "not_recorded"
  video_id: "frank-oxener-rubyenrails-2006"
  description: |-
    Voor beginnende Rails-ontwikkelaars zal Frank Oxener van Agile Dovadi een introductie in Rails verzorgen aan de hand van een concreet voorbeeld met behulp van Google Maps. Binnen het tijdsbestek van deze korte workshop willen we een applicatie maken waarmee we Ruby letterlijk en figuurlijk op de kaart zetten!
  speakers:
    - Frank Oxener
  additional_resources:
    - name: "Blog Post"
      title: "Workshop RubyEnRails 2006"
      url: "https://web.archive.org/web/20060526174918/http://agiledovadi.com/blog/articles/2006/05/22/workshop-rubyenrails-2006"
      type: "blog"

- id: "geert-rozendom-rubyenrails-2006"
  title: "Supply Chain Integration with Rails"
  original_title: "Ketenintegratie met Rails"
  event_name: "RubyEnRails 2006"
  date: "2006-05-18"
  language: "Dutch"
  slides_url: "https://web.archive.org/web/20060619094414/http://www.newminds.nl/navrails.ppt"
  video_provider: "not_recorded"
  video_id: "geert-rozendom-rubyenrails-2006"
  description: |-
    Newminds is een startup uit het oosten van het land. Het bedrijf heeft veel ervaring met Microsoft's erp-software Dynamics (voorheen Navision), en werkt momenteel aan een web-interface in Ruby on Rails. De sessie gaat in op de business case (ketenintegratie in de agrarische sector) en op de technische koppeling tussen Dynamics en Rails.
  speakers:
    - Geert Rozendom

- id: "michiel-de-mare-rubyenrails-2006"
  title: "How Ruby Makes Rails Possible"
  original_title: "Hoe Ruby Rails mogelijk maakt"
  event_name: "RubyEnRails 2006"
  date: "2006-05-18"
  language: "Dutch"
  slides_url: "https://web.archive.org/web/20060619183806/http://rubyenrails.nl/files/rorpresentatie.pdf"
  video_provider: "not_recorded"
  video_id: "michiel-de-mare-rubyenrails-2006"
  description: |-
    In deze sessie zal Michiel de Mare, bekend van de rubyenrails.nl site, een korte introductie geven tot Ruby. De eigenschappen van Ruby die de taal zo geschikt maken voor Rails, zoals het objectmodel en blocks, zullen extra nadruk krijgen.
  speakers:
    - Michiel de Mare

- id: "stefan-kaes-rubyenrails-2006"
  title: "Performance Rails"
  event_name: "RubyEnRails 2006"
  date: "2006-05-18"
  language: "English"
  slides_url: "https://railsexpress.de/blog/files/slides/rubyenrails2006.pdf"
  video_provider: "not_recorded"
  video_id: "stefan-kaes-rubyenrails-2006"
  description: |-
    Stefan Kaes is a Rails performance guru, who has made many performance-related contributions to the Rails code. His session will be all about performance measurement, performance tuning and refactoring for performance. This will include an overview of Rails architecture, session container options, good/bad caching approaches and demos.
  speakers:
    - Stefan Kaes

- id: "wilco-bauwer-rubyenrails-2006"
  title: "A Ruby Compiler for the Microsoft .NET Framework"
  original_title: "Ruby-compiler voor het Microsoft .Net framework"
  event_name: "RubyEnRails 2006"
  date: "2006-05-18"
  language: "Dutch"
  slides_url: "https://web.archive.org/web/20060618141756/http://www.wilcob.com/Wilco/Downloads/Programming/IronRuby/Presentatie.ppt"
  video_provider: "not_recorded"
  video_id: "wilco-bauwer-rubyenrails-2006"
  description: |-
    Wilco Bauwer ontwikkelt een Ruby-compiler waarmee Ruby-programma's in het .Net framework kunnen draaien. In zijn sessie vertelt hij over de technische opzet en kan hij wellicht al een demo geven.
  speakers:
    - Wilco Bauwer
  additional_resources:
