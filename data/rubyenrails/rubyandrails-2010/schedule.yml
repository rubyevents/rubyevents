        end_time: "17:00"
        slots: 1

      - start_time: "20:30"
        end_time: "23:00"
        slots: 1
        items:
          - title: "Gem sessions"
            description: |-
              A fun event where you can give a short pitch (2 or 3 minutes at most) for your (open source) code and speak about a certain problem with your implementation. Everyone else will give some of their braincycles and views on how to improve.

              Short discussions, beer and a nice way to get participants for your open source projects!

              Location: De Bekeerde Suster

  - name: "Conference Day 2"
    date: "2010-10-22"
    grid:
      - start_time: "09:00"
        end_time: "09:30"
        slots: 2
        items:
          - "Doors open"
          - title: "RubyAndRails Rumble"
            description: |-
              An action and stress packed competition running all day in the second room, introduced in 2009 and back by popular demand.

      - start_time: "09:30"
        end_time: "10:30"
        slots: 1

      - start_time: "10:30"
        end_time: "11:30"
        slots: 1

