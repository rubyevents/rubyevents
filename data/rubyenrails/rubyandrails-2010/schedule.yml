# Schedule: RubyAndRails Europe 2010
# Source: https://web.archive.org/web/20130114155751/http://rubyandrails.eu/program
#
# The program page lists no end times for the off-site evening items, so the end
# times for the pre party, gem sessions, geek dinner and code retreat are estimates.
---
days:
  - name: "Pre-party"
    date: "2010-10-20"
    grid:
      - start_time: "20:30"
        end_time: "23:00"
        slots: 1
        items:
          - title: "Pre party"
            description: |-
              Like every year we kick off the event by having a drink on the night before the conference.

              Location: De Bekeerde Suster

  - name: "Conference Day 1"
    date: "2010-10-21"
    grid:
      - start_time: "08:30"
        end_time: "09:15"
        slots: 1
        items:
          - "Doors open"

      - start_time: "09:15"
        end_time: "09:30"
        slots: 1
        items:
          - "Start conference"

      - start_time: "09:30"
        end_time: "10:30"
        slots: 1

      - start_time: "10:30"
        end_time: "11:30"
        slots: 1

      - start_time: "11:30"
        end_time: "11:45"
        slots: 1
        items:
          - "Coffee"

      - start_time: "11:45"
        end_time: "12:45"
        slots: 2

      - start_time: "12:45"
        end_time: "13:45"
        slots: 1
        items:
