            description: |-
              To finish up the conference we will join for a geek dinner after the last talk.

              Location: Restaurant Fifteen

  - name: "Code Retreat"
    date: "2010-10-23"
    grid:
      - start_time: "09:00"
        end_time: "17:00"
        slots: 1
        items:
          - title: "Code retreat with Corey Haines"
            description: |-
              Corey Haines will not only speak at the conference, but will also host a Code Retreat on Saturday for approximately 40 participants.

              Location: Hogeschool van Amsterdam

