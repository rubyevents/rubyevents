        slots: 1
        items:
          - "Lunch"

      - start_time: "13:45"
        end_time: "14:45"
        slots: 1

      - start_time: "14:45"
        end_time: "15:45"
        slots: 1

      - start_time: "15:45"
        end_time: "16:00"
        slots: 1
