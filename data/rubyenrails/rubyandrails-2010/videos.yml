- id: "rick-olson-rubyandrails-2010"
  title: "Git: the stupid NOSQL database"
  raw_title: "Git: the stupid NOSQL database"
  event_name: "RubyAndRails Europe 2010"
  date: "2010-10-21"
  language: "English"
  track: "Room 1"
  video_provider: "not_published"
  video_id: "rick-olson-rubyandrails-2010"
  description: |-
    Many of us use Git as our source control tool of choice. But the man page says Git is a “stupid content tracker.” Apps and libraries are able to use Git for all sorts of other things, such as a distributed key/value store. We’ll take a look at how you can start using Git as the canonical data store for your app, why you would want to, and what the pitfalls you might run into are.
  speakers:
    - Rick Olson

