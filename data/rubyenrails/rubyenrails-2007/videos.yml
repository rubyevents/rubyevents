- id: "roderick-van-domburg-sjoerd-andringa-rubyenrails-2007"
  title: "YouTube on Rails in 45 Minutes"
  original_title: "YouTube on Rails in 3 kwartier"
  event_name: "RubyEnRails 2007"
  date: "2007-06-07"
  language: "Dutch"
  track: "Groene zaal"
