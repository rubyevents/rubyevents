- id: "dr-nic-williams-rubyenrails-2007"
  title: "Extending Ruby/Rails with DSLs – “How to make your code look beautiful”"
  event_name: "RubyEnRails 2007"
  date: "2007-06-07"
  language: "English"
  track: "Auditorium"
  slides_url: "https://www.slideshare.net/drnic/rubyenrails2007-dr-nic-williams-diy-syntax"
  video_provider: "not_recorded"
  video_id: "dr-nic-williams-rubyenrails-2007"
  description: |-
    One of the reasons that development in Rails is rapid is the elegant syntax for doing common tasks: fetching database rows into objects, rendering pages and partials, routing urls to controllers and actions, or capistrano recipes. As you write your own Ruby code you can always keep in mind – you can write my own beautiful syntax.

    In this session we'll discuss

    - metaprogramming, with examples from Dr Nic's Magic Models, the Magic Multi-Connections, and Map by Method,
    - creating new RubyGems to package new extensions (using the New Gem Generator and Hoe), and
    - creating new Rails plugins to package Rails-only extensions
  speakers:
    - Dr. Nic Williams

