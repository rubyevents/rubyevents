- id: "zed-a-shaw-rubyenrails-2008"
  title: "Talk by Zed A. Shaw" # TODO
  date: "2008-06-10"
  language: "English"
  video_provider: "not_recorded"
  video_id: "zed-a-shaw-rubyenrails-2008"
  description: |-
    Zed is duidelijk de enfant terrible van de Ruby en Rails gemeenschap. Heeft met zijn rant “Rails is a ghetto” op aardig wat teentjes getrapt binnen de Rails community.

    Zed komt in Amsterdam spreken over de voors en tegen van de Rails community, een presentatie die je niet mag missen!
  speakers:
