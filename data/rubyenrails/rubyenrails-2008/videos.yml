- id: "ninh-bui-hongli-lai-rubyenrails-2008"
  title: "Talk by Ninh Bui and Hongli Lai" # TODO
  date: "2008-06-10"
  language: "Dutch"
  video_provider: "not_recorded"
  video_id: "ninh-bui-hongli-lai-rubyenrails-2008"
  description: |-
    Ninh en Hongli staan de laatste weken flink in de belangstelling. Deze Nederlandse Ruby ontwikkelaars zijn verantwoordelijk voor de ontwikkeling van Mod_Rails. Deze Apache module zorgt ervoor dat de deployment van Rails applicaties easy-as-pie wordt.
