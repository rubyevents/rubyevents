  title: "Hands-on! Wrapping FileMagic as a RubyGem"
  kind: "workshop"
  date: "2007-04-14"
  video_provider: "not_recorded"
  video_id: "olle-jonsson-rupy-2007"
  description: |-
    Tutorial on how to wrap existing software as RubyGems.

    RubyGems is the way to mass-distribute your code. This hands-on tutorial gets you started wrapping up existing Ruby software as gems. We will wrap the FileMagic app, which sits in the Ruby Application Archive, as a gem, and discover the features RubyGems like that. Ruby skills needed: beginner. You should be comfortable working with a command shell to like this tutorial.
