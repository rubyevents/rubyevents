- id: "ivan-necas-rupy-2011"
  title: "Documentation with pleasure"
  date: "2011-10-15"
  video_provider: "not_recorded"
  video_id: "ivan-necas-rupy-2011"
  description: |-
    Many people hate them - those lying bastards hidden behind # sign which use to get obsolete almost immediately - our API documentation. However, is avoiding them really the solution? (ask users of your code) With such a dynamic languages, like Ruby is, it's almost a crime not to try different approach to this.

    I will talk about a project I started a while ago (github.com/iNecas/active_doc) - a DSL for documentation. I will explain reasons of it's creation and it's objectives. I will also show some implementation details, such as how to describe the DSL with the same DSL :). I'm looking forward to the feedback and discussion.
  speakers:
    - Ivan Necas

- id: "michal-fojtik-rupy-2011"
  title: "Open clouds with Deltacloud API"
  date: "2011-10-15"
  video_provider: "not_recorded"
  video_id: "michal-fojtik-rupy-2011"
  description: |-
    Apache Deltacloud is a REST-based cloud abstraction API written in Sinatra, that enables management of resources in different IaaS clouds using a single API. A series of back-end drivers 'speak' each cloud provider's native API and providing you freedom of cloud provider choice without being vendor lock-in.
  speakers:
    - Michal Fojtik

- id: "xavier-noria-rupy-2011"
  title: "Documenting from the trenches"
  kind: "keynote"
  date: "2011-10-15"
  video_provider: "not_recorded"
  video_id: "xavier-noria-rupy-2011"
  description: |-
    This is a talk about documentation, why is it important, why is it hard, we’ll discuss some myths and reflect about this topic. In the particular case of Ruby we have a very dynamic language. This complicates things quite a bit to document APIs, to the point that parsers are not enough for Ruby on Rails. We’ll see specific issues depicted with examples from the very Rails source code. We’ll also explain what is docrails, what’s going on in this aspect of the Rails project, ideas for the future, and how people can contribute to the Rails documentation.
  speakers:
    - Xavier Noria

