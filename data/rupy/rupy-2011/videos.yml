- id: "piotr-sarnacki-rupy-2011"
  title: "Everything you wanted to know about HTTP"
  date: "2011-10-16"
  video_provider: "not_recorded"
  video_id: "piotr-sarnacki-rupy-2011"
  description: |-
    HTTP is used more and more in the recent years, thanks to the growth of popularity of various APIs, Web Services, NoSQL databases with HTTP interface and of course HTML apps. Although we use HTTP a lot, the underlying concepts of it are sometimes ignored and we tend to rely on fact that it just works, whether it comes to consuming APIs or make ajax calls in a browser. In this talk I would like to show why should you care about details of HTTP protocol and how that can help you with your work. I will also try to show best debugging practices and tools that you can use to solve problems.
  speakers:
    - Piotr Sarnacki

- id: "julian-fischer-workshop-rupy-2011"
  title: "Deploying web apps from scratch using Chef and Capistrano"
  kind: "workshop"
  date: "2011-10-16"
  video_provider: "not_recorded"
  video_id: "julian-fischer-workshop-rupy-2011"
  description: |-
    Do you remember the days? Get a server, configure linux, install linux libraries, your runtime environment, prepare your web server and all the other things to be done when performing a cold deployment. Luckily things have changed and nobody is forced anymore to execute those annoying steps manually. Instead you just describe the master plan of your infrastructure and let it be built for you.

    With Chef you provision and install application dependencies and prepare your system for future deployments. In addition to that Capistrano will be the tool of your choice to continuously deploy your app. In this workshop you will learn how to deploy an exemplary web app from scratch using state of the art tools such as opscode Chef and Capistrano.
  speakers:
    - Julian Fischer

- id: "dennis-ushakov-oleg-shpynov-rupy-2011"
  title: "Ruby Code Analysis Tools, \"Fighting Code Smells\""
  kind: "workshop"
  date: "2011-10-16"
  video_provider: "not_recorded"
  video_id: "dennis-ushakov-oleg-shpynov-rupy-2011"
  description: |-
    Nobody likes when their code smells. To help avoid it, dozens of special tools and approaches have been designed. Efficient coding tools, refactorings, code metrics, code analysis, code testing and debugging are all crucial for creating quality, maintainable code. During this talk we’ll show you how to efficiently detect code smells, eliminate them using refactoring, and validate the changed code. By the end you’ll have a ‘swiss army knife’ full of techniques for making better code.
  speakers:
    - Dennis Ushakov
    - Oleg Shpynov

- id: "michal-czyz-rupy-2011"
  title: "Acceptance Testing using Ruby"
  kind: "workshop"
  date: "2011-10-16"
  video_provider: "not_recorded"
  video_id: "michal-czyz-rupy-2011"
  description: |-
    This is going to be one day workshop, where you will learn how to write acceptance tests in efficient and practical way, in the context of Ruby On Rails framework (using tools like: rspec and capybara). During this course you will also learn about approaches that turn your acceptance tests into invaluable documentation, that includes information about your application's requirements and specification.
  speakers:
    - Michał Czyż
