- id: "joao-paulo-lethier-ruby-summit-brasil-2021"
  title: "Usando database views em aplicações Rails"
  raw_title: "Usando database views em aplicações Rails por João Paulo Lethier"
  date: "2021-12-04"
  published_at: "2022-02-09T20:30:01Z"
  language: "Portuguese"
  video_provider: "youtube"
  video_id: "a8-KlTSqWLc"
  description: |-
    O uso de views e materialized views (mviews) do banco de dados pode ser uma boa alternativa para melhoria de performance e até melhoria do uso dos recursos do banco de dados, inclusive sendo uma alternativa mais simples, se comparado a ferramentas mais robustas e complexas, e ainda assim entregar um ótimo resultado. Mas o que exatamente são views e mviews? Como podemos usar? É fácil integrar em aplicações rails? Abordarei essas perguntas, além de compartilhar um case de sucesso que tivemos ano passado na Zygo durante a entrega do deliverydobem
  speakers:
    - João Paulo Lethier

- id: "daniel-moreto-ruby-summit-brasil-2021"
  title: "Arel - Consultas além do Active Record"
  raw_title: "Arel - Consultas além do Active Record por Daniel Moreto"
  date: "2021-12-04"
  published_at: "2022-02-08T20:30:01Z"
  language: "Portuguese"
  video_provider: "youtube"
  video_id: "Jy6v3DyrV18"
  description: |-
    A idéia da palestra é abordar tópicos de construção de consultas mais complexas utilizando o Arel.Para consultas simples, como buscar um model ou contar a quantidade de registros o Active Record geralmente funciona muito bem, mas as consultas SQL tem complexidades que podem envolver a necessidade de sub-queries, multiplicação de campos, extração de data e afins.Por exemplo, se eu tenho um Ecommerce, para descobrir o total de uma venda precisaria fazer uma operação bem próxima SELECT SUM(line_items.price * line_item.quantity) FROM line_items, onde o Active Record já não atenderia tão bem, porém uma operação com Arel deixaria a construção "programável" e compreensível. Na palestra eu quero mostrar de modo prático, com terminal aberto, o Arel envolvendo operações SQL simples, como "LIKE", operações mais complexas que envolvam cálculos de contagem e soma e possivelmente construções que envolvam sub-queries.
  speakers:
    - Daniel Moreto

