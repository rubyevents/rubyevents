  published_at: "2021-02-12T21:43:21Z"
  language: "Portuguese"
  video_provider: "youtube"
  video_id: "1t2D4MJcC8A"
  description: |-
    Comentar sobre os números que permeiam esse tema de "diversidade". Mas o principal ponto seria criticar essa nossa abordagem de diversidade na TI, que utiliza um termo genérico pra tentar encaixar todas as minorias nele, acabando por apagar as peculiaridades de cada um desses grupos. Além disso, falar sobre como isso impacta a TI e acaba por criar produtos racistas, machistas, transfóbicos, capacitistas, etc.
