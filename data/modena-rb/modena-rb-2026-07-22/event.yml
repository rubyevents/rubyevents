description: |-
  We all know that the use of technology can sometimes be questionable from an ethical and environmental sustainability perspective.

  In the July edition of our Modena.rb meetup, Giovanni Foiani from Fancy Pixel will show us that having code with a conscience is possible, as he introduces Agrimove.

  Agrimove is a platform that guarantees legal and dignified transportation for farmworkers, and 100% of its code was written by an artificial intelligence, not a human. It is the story of how a high-social-impact project blends with development entrusted to an agent: the Rails 8.1 stack, the process from tasks to mockups and code reviews, and what worked versus what didn’t. Surprising speed, but also the areas where human supervision remains essential: testing, context, and security.

  Come join us at "Fabbriche Binarie" in Modena for an amazing Ruby Night!
