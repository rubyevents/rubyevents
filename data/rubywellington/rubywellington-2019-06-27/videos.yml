  description: |-
    What role should technology play in discourse? What are our obligations as software developers, to our companies and to society, when we are asked to build discourse features into our apps? Written in the wake of the mosque shootings, this talk tackles some of the questions that this tragic act raised about the part technology plays in amplifying hate speech and inciting violence, and suggests a framework in which to think about these issues. This talk is largely non-technical, but aimed at technologists.
