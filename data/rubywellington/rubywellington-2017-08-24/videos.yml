  description: |-
    The talk will cover the basics of implementing a chatbot through Facebook Messenger using a Natural Language Processing (NLP) api called RecastAI.

    During the talk we'll address:

    - NLP - how to identify user intents
    - NLP - how to train and improve your bot
    - Messenger - how to create a hello world chatbot using the facebook-messenger gem
    - Example - Overview of the development of BravoWellyBot in Ruby, https://www.facebook.com/bravowellybot
