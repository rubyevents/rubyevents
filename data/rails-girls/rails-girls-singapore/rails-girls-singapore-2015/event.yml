description: |-
  Southeast Asia’s largest Ruby conference, Red Dot Ruby Conference, is back! Rails Girls Singapore is joining forces with RDRC to bring you this special edition of Rails Girls.

  How special, you ask? We will be inviting Linda Liukas, the founder of Rails Girls, coming to speak to us all the way from Helsinki, Finland!

  Linda is the author and illustrator of Hello Ruby, a childrens picture book about the whimsical world of computers, as well as the founder of Rails Girls, a global movement to teach young women programming in over 220 cities. She loves Muji, Zelda Fitzgerald, software and sparkly things.

  On top of that, you will also hear a special talk by Vaidehi Joshi. She is formerly a teacher, sometimes a writer, and currently a web developer at Friends of The Web in Baltimore, Maryland. Vaidehi is a graduate of the Flatiron School and a big time cheesecake enthusiast.

  Join us in learning Rails on 6th June! Light snacks will be provided.

