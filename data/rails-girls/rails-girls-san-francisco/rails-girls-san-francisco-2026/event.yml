description: |-
  Build your first Rails app with a coding agent. In one day you'll make a small tool for yourself, your team, family or friends.

  The event is open for all, but we focus on women, and especially those in non-technical roles at Ruby companies: product, design, marketing, sales, support, ops, recruiting. Everyone curious is welcome. You don't need any coding experience.

  You work in a small group with a mentor, who writes Ruby for a living. You describe what you want, the coding agent writes the code, and your mentor helps you understand what it built.
