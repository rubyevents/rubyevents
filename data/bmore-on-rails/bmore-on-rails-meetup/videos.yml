  description: |-
    At August's meetup, we're gonna have a Hack Night unlike any other. We'll work in pairs on the same problem, but all work will be driven by AI. The goal at the end of the night isn't to have something working, but rather to share and learn how to best leverage AI coding tools.

    To participate, you will need to bring your own tokens. If you can't find any, pair up with somebody who's got tokens to spare. Or you can try running an open model locally.

