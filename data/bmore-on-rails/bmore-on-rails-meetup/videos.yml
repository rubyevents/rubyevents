- id: "bmore-on-rails-meetup-2026-05-14"
  title: "B'more on Rails Goes Golfing 🏌️"
  slug: "b-more-on-rails-goes-golfing-may-2026"
  event_name: "B'more on Rails - May 2026"
  date: "2026-05-14"
  language: "English"
  video_provider: "not_recorded"
  video_id: "bmore-on-rails-meetup-2026-05-14"
  description: |-
    https://luma.com/cbhwa7rj

    This is not the golf you're thinking about! Join us at our May meetup for a round of code golf. To play code golf, you take a problem and try to solve it in the fewest characters possible. For example, instead of writing long, descriptive variable names you might use single characters. Every keystroke counts because it's like golf where the lowest score wins.

    We'll work in pairs on a problem to see who can get the lowest score.

    We'll be using code.golf (https://code.golf) because yes, there's a website for this already. If you want to get some practice rounds in, start with the tutorial (https://code.golf/tutorial#ruby) and check the wiki (https://code.golf/wiki) for tips.

