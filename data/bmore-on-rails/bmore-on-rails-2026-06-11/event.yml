  At June's meetup, we'll be hearing talks from you! You can talk about anything Ruby, Rails, or tech related. If you have an idea and you're not sure if it's good enough for a talk…it is! Click on the Contact the Host link to sign up.

  Lineup

  Cornelius Hairston - Baltimore Tech Meetup Cornelius is the organizer of Baltimore Tech Meetup. He'll tell us more about Baltimore Tech Meetup and how people can get involved.

  Sal Hernandez - What AI Actually Changes About Software Engineering From the speaker: I’ll be sharing how I’m using AI agents in real engineering workflows, from automatic bug triage and PR creation to Claude Code feature-building sessions and Notion-triggered Cursor agents. The talk is less about AI hype and more about what’s actually working, what still needs human judgment, and how these tools start becoming useful when they’re plugged into the systems where engineering work already happens.

  We have space for another talk! Please reach out if you're interested.

