  ​At March's meetup, we'll be hearing talks from you! You can talk about anything Ruby, Rails, or tech related. If you have an idea and you're not sure if it's good enough for a talk…it is! Click on the Contact the Host link to sign up.

  Lineup

  Sean Dickinson - Contributing to Ruby for Good If you've ever wondered how you could use your programming skills to help non-profits, this is the talk for you! Sean will share his experiences working with Ruby for Good (https://rubyforgood.org/) and ways you can get involved.

  Eric Sauter - The Evolution of Agentic Coding Eric will take us through how AI coding has changed from the days of fancy autocomplete that was meh to the much more capable agentic coding we have today. Where will this evolution take us next?

  We have space for one more short talk. Please reach out if you'd like to speak.

