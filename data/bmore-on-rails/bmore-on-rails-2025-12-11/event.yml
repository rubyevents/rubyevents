  At December's meetup, we'll be hearing talks from you! You can talk about anything Ruby, Rails, or tech related. If you have an idea but not sure if it's good enough for a talk…it is! We have space for 2 or 3 talks.

  Lineup

  Rosanna Speller - What time is it? This talk will guide you through dealing with dates, times, and time zones in Rails.

  Gary Moore - Comparing traditional Machine Learning with LLM performance when evaluating Privacy Policies While this talk isn't directly Ruby/Rails related, it'll be an interesting way to look at AI.

  Matt Scilipoti - A guide to working in dev containers Another less Rails specific talk, but another good one! Learn how to use containers to manage running different dependencies/projects on your machine.

  Please drop us a message if you'd like to give a talk at a future meetup.

