  description: |-
    Hanami just released version 2.2 which represents the completion of the new vision the team has for Hanami. Starting with 2.0 they have been looking at how to modernize and improve the Hanami framework, rethinking everything including the base routing, actions, etc. In 2.0, new views in 2.1, and now in 2.2 a new persistence layer is introduced. We'll build a new Hanami app and see what it might look like to use an alternative to Rails when building a web app.
