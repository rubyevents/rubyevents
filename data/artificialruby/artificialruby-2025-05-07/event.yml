description: |-
  Join us for an evening of Ruby x AI demos and drinks at Betaworks! This happy hour & demo night offers the perfect opportunity to connect with the community while enjoying amazing views. Whether you're a seasoned Rubyist exploring AI possibilities or simply curious about the intersection of these technologies, you'll find something valuable here.

  We look forward to seeing you there!

  Important: Please bring a valid photo ID that matches your RSVP for admission.

  Agenda:

  6:00-6:45: Arrive, mingle, drinks and refreshments
  6:45-7:00: Intros
  7:00-8:00: Demos
  8:00-9:00: Food, drinks and connections

  Demos:

  * Chris Power (aka: Typecraft): "AI Critiques Your Vim-fu" - What if AI could be more than an encyclopedia? At Typecraft, we merge bite-sized Vim challenges and deep-dive mini-courses to analyze every keystroke—evaluating your edits and coaching you on techniques you never knew (or have forgotten), making learning a true two-way street.
  * Keith Harper: "The future is here, and anyone can code it." - My experience as a designer working with AI to launch an MVP
  * Brian Fountain: "World Premier of 1000 Notes" - At the last meetup Scott challenged the community to build and share weird ideas, and Brian Fountain answered that call. You won't want to miss it!

