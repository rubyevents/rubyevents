name: "Pathé Tuschinski"
description: |-
  A movie theatre in the heart of Amsterdam. Built in 1921 by its namesake Abraham Icek
  Tuschinski, the Hijman Louis de Jong-designed building is a spectacular mix of architectural
  styles: Amsterdam School, Jugendstil, Art Nouveau and Art Deco. The main auditorium usually
  plays host to movie premieres in the Netherlands, and is considered one of the most beautiful
  cinemas in the world.
