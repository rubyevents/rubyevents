- id: "elise-huard-euruko-2012"
  title: "Ruby's bin men: a closer look at the garbage collector"
  raw_title: "Elise Huard - Ruby's bin men: a closer look at the garbage collector"
  event_name: "EuRuKo 2012"
  date: "2012-06-01"
  published_at: "2012-06-11T16:48:56Z"
  video_provider: "vimeo"
  video_id: "43855243"
  description: |-
    The Garbage Collector: how does it work?
    What does it mean when people speak about stop-the-world, mark-and-sweep, generational garbage collectors?
    How does ruby fare at collecting its own garbage?
    What does it mean when they say 1.9.3's garbage collector has improved?
    This talk will explain those concepts, what the impact of garbage collection is on our programs, and what future could be
  speakers:
    - Elise Huard

- id: "roy-tomeij-euruko-2012"
  title: "Modular & reusable front-end code with HTML5, Sass and CoffeeScript"
  raw_title: "Roy Tomeij - The Joy of Front-End, A Journey with Bob Ross"
  event_name: "EuRuKo 2012"
  date: "2012-06-01"
  published_at: "2012-06-11T15:21:47Z"
  video_provider: "vimeo"
  video_id: "43848347"
  description: |-
    Most Ruby developers use Rails for their everyday projects. Often they toy around with front-end themselves or outsource it, ending up tangled in a web of css-all-over-the-place.

    Keeping your front-end code clean is hard. Before you know it you're suffering from CSS specificity issues and not-really-generic partials. Find out how to keep things tidy using the HTML5 document outline and modular Sass & CoffeeScript, for truly reusable code.
  speakers:
    - Roy Tomeij

