- id: "eloy-duran-euruko-2012"
  title: "CocoaPods - A tale of two star-cross'd communities"
  raw_title: "Eloy Durán - CocoaPods - A tale of two star-cross’d communities"
  event_name: "EuRuKo 2012"
  date: "2012-06-01"
  published_at: "2012-06-11T16:09:28Z"
  video_provider: "vimeo"
  video_id: "43852163"
  description: |-
    But with a happy ending!

    This talk is about CocoaPods, “The best way to manage library dependencies in Objective-C projects”. As the tag-line implies, this is a package-manager for Objective-C libraries, promoting open-source libraries by providing a convenient way to work with them.

    But besides a mere introduction to the project, and shameless plugs asking for more collaboration, this talk will also take a critical look at our usage of dependencies, when it has become so convenient as it has in our (Ruby) community.

    This talk may, or may not, include ‘unicorns’, ‘rockstars’, ‘content’, and the likes.
  speakers:
    - Eloy Durán

