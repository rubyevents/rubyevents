- id: "sarah-lima-remy-hannequin-euruko-2026"
  title: "Workshop: It's about Time"
  kind: "workshop"
  date: "2026-09-18"
  language: "English"
  video_provider: "scheduled"
  video_id: "sarah-lima-remy-hannequin-euruko-2026"
  description: |-
    Time looks simple until it breaks your code. A "day" isn't always 86400 seconds, Time.parse silently lies, and 1:30 AM can happen twice. Or never. In this hands-on workshop, we'll trace timekeeping from ancient calendars to atomic clocks, and dive into Ruby's Time, Date, and DateTime, plus ActiveSupport's safety tools. Through guided exercises, you'll handle time zones, DST gaps, leap seconds, storage, background jobs, and flaky tests. You'll be ready to spot and fix time bugs before they reach production.
  speakers:
    - Sarah Lima
    - Rémy Hannequin
