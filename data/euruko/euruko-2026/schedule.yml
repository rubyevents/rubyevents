        items:
          - title: "BRUG Meetup"
            description: |-
              BRUG (Brno Ruby Users Group) hosts a free community meetup on the eve of the conference, in the same venue. Three short talks, then drinks and conversation.
              Hitoshi Hasumi – Funicular on Rails: Write Your Rails Frontend in Pure Ruby. Funicular is a Rails plugin for building SPA frontends in Ruby instead of JavaScript, running on PicoRuby.wasm. A walkthrough of a working app: what it looks like in practice, what works today, and where Ruby in the browser actually fits.
              Tetiyana Chupryna – Based on Vibes: Expertise in the Age of AI. If code can be written by machines but decisions and accountability still need humans, where does the next generation of senior engineers come from? A look at technical intuition and what it's built from.
              Josef Šimánek – gem.coop: Building a Community-Owned Home for RubyGems. Why gem.coop exists, how the cooperative model works, where the service stands now, and the plan for sustainable community-owned Ruby infrastructure.
              Conference registration is also open in the lobby during the meetup, so you can pick up your badge and skip the queue on Thursday morning.

