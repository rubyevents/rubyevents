            description: |-
              Community-run popup meetup, right after the official program wraps. Rails gave us omakase for the web. Omarchy is the same idea for Linux: Arch, Hyprland, zero yak-shaving, beautiful from the first boot. No talks, no agenda — just a casual hangout for anyone who's curious. Whether you daily-drive Omarchy, tinker on weekends, or have never touched Linux: come by, check out some live setups, and chat. Feeling adventurous? Bring a laptop — we'll have USB sticks ready, and you can walk out running Omarchy. Everyone welcome. RSVP: Luma

