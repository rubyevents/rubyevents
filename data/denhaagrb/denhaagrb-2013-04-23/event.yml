description: |-
  Delft.rb @ OGD! (or: where Rotterdam.rb and DenHaag.rb meet up)

  OGD is an allround ICT company with some 700 employees. Part of its business is software development, both in project and developer-for-hire form. OGD also develops part of its own software. The largest and longest project currently running is Coconut, a Private Social Network for companies with 50 employees or more, which centralizes communication, filesharing, documentation and social aspects. Coconut is developed in Ruby on Rails, using technologies such as SCSS, Ember.JS and of course the ever-present jQuery.

  Hosted at OGD, Motorenweg 23, Delft.
