  🙏 Meetup kindly sponsored by mobilidée and RoRvsWild!

  For this last meetup before the Summer break, Yannis (@yannis) will demonstrate how to use OpenAI's GPT-4 and Embedding APIs to implement a semantic search system in Ruby on Rails, using the pg_vector PostgreSQL extension and the neighbor gem. He will illustrate this with concrete examples from MyFoodRepo, the application he is currently working on.

  What to Expect:
  * A presentation of about 30-45 minutes
  * Networking with Drinks and Snacks: After the presentation, join us for drinks and snacks. It's the perfect time to mingle, network, and dive deep into discussions about all things Ruby, Rails and more.
  * Open to Everyone: Whether you're a seasoned Rubyist, a Rails enthusiast, or just beginning your journey as a developer, we warmly welcome you to join and contribute.
