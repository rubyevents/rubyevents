  Foreword
  For its 2025 kickoff, Genevarb is exceptionally relocating to Qoqa!

  ––––

  Over 2025, Marco explored a new direction for Rails views — starting with Herb (an HTML-aware ERB parser) and developer tools (formatter, linter, language server).

  Echoing his recent talk at Rails World 2025, he’ll present ReActionView, an ERB engine built on Herb that stays compatible with html+erb while providing HTML validation, improved error messages, reactive updates, and built-in tooling.

  ––––

  What to Expect:

  * A presentation of about 30-45 minutes
  * Networking with Drinks and Snacks: After the presentation, join us for drinks and snacks. It's the perfect time to mingle, network, and dive deep into discussions about all things Ruby, Rails and more.
  * Open to Everyone: Whether you're a seasoned Rubyist, a Rails enthusiast, or just beginning your journey as a developer, we warmly welcome you to join and contribute.

