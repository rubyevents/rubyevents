description: |-
  🙏 Meetup kindly sponsored by mobilidée and RoRvsWild!

  In his latest blog post, Alexis Bernard (RoRvsWild) shared his insightful habits on running load tests, opening up a world of optimization for us. At our next meetup, Alexis will take this discussion from theory to practice with a live demonstration on a real production application!

  Prepare to be captivated as Alexis expertly shows us how to initiate a load test using a variety of tools, and then, more importantly, how to decode the results. But that's not all—we'll dive deeper into the tech world by monitoring servers and profiling code, all in our quest to uncover those elusive bottlenecks.

  Don't miss this opportunity to see load testing in action and to gain valuable knowledge that can transform your approach to application performance. Let's learn, engage, and optimize together!

