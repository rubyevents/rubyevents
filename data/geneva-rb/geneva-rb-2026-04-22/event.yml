description: |-
  👉 Notice to attendees

  The event will be held in a different room than usual. We will meet in room 011 of the main building of the UOG, on the 1rst floor!

  ––––

  Join us for a deep dive into transforming Ruby on Rails into a powerful SEO engine — not just for Google and Bing, but for the emerging wave of AI-driven search experiences.

  Valentin Ducrettet (La Vertikale (https://la-vertikale.io)) will walk us through a real-world case study: the creation of a Ruby on Rails website designed to rank a fiduciary business in Geneva on highly competitive local queries. This is not a theoretical talk. Valentin will break down exactly what has been implemented from clean, scalable Rails architecture and ultra-fast rendering, to advanced SEO strategies combining both white-hat fundamentals and more aggressive, unconventional approaches.

  You’ll discover how to:

  - Structure a Rails app for maximum crawlability and indexationLeverage programmatic SEO and content generation at scale
  - Optimize for local search intent and high-conversion keywords
  - Take advantage of how search engines (and AI) interpret technical signals

  Everything shared will come directly from this use case, with actionable insights you can reuse in your own projects.

  ––––

  What to Expect:

  - A presentation of about 30-45 minutes
  - Networking with Drinks and Snacks: After the presentation, join us for drinks and snacks. It's the perfect time to mingle, network, and dive deep into discussions about all things Ruby, Rails and more.
  - Open to Everyone: Whether you're a seasoned Rubyist, a Rails enthusiast, or just beginning your journey as a developer, we warmly welcome you to join and contribute.

