  video_id: "marco-roth-geneva-rb-2026-11-04"
  description: |-
    A year ago, Marco introduced ReActionView, a new ActionView-compatible ERB engine built on Herb, his HTML-aware ERB parser. Since then, teams, companies and open-source projects have adopted Herb in their daily workflows, and it's on track to become an opt-in view engine in Rails 8.2.

    Echoing his recent talk at Rails World 2026, he'll walk us through what Herb brings to Rails: how the integration with ActionView was made possible, how ActionView was adapted and extended, and the toolchain every Rails developer gets out of the box as a result. He'll also show how ReActionView builds on it to bring fine-grained reactivity to standard HTML+ERB templates, with no JavaScript framework and no new file format.
