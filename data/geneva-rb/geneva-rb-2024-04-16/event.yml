description: |-
  🙏 Meetup kindly sponsored by mobilidée and RoRvsWild!

  ✨ Hotwire has significantly altered the landscape of building interactive web applications with Ruby on Rails, marking a pivotal evolution toward seamless Full-Stack development.

  With the release of Turbo 8, the ecosystem has gained new momentum, influencing how developers approach application design and interaction.

  This session, led by Marco Roth, a core maintainer of Stimulus, StimulusReflex, and CableReady, dives into capabilities introduced with Turbo 8, reevaluating its impact on the whole Rails and Hotwire ecosystem.

  What to Expect:
  🎤 Presentation: A 30-45 minute presentation
  🍹 Networking with Drinks and Snacks: After the presentation, join us for drinks and snacks. It's the perfect time to mingle, network, and dive deep into discussions about all things Ruby, Rails and more. A great chance to connect with fellow developers and forge lasting friendships.
  🙌 Open to Everyone: Whether you're a seasoned Rubyist, a Rails enthusiast, or just beginning your journey as a developer, we warmly welcome you to join and contribute. This meetup is about mutual learning and sharing, so don't hesitate to participate, no matter your level of expertise.
