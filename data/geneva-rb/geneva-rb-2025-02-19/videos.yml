    Remote presentation

    Joel Hawksley is a staff software engineer at GitHub, based in Louisville, CO, USA. He's the creator of ViewComponent, a framework for building encapsulated, unit-testable view components in Ruby on Rails.

    In his talk, Joel will share reflections from five years of UI architecture at GitHub, focusing on three key lessons: native is the new baseline, design systems are victims of their own success, and frontend costs 10x backend.
