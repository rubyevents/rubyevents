description: |-
  At QoQa, we deploy several times a day, and every backend developer can deploy to production.

  We are also a bit lazy, so we try to optimize the process to be as simple as possible.

  The result: the developer in charge of the releases only discusses with a bot to make all deployment and, all steps of the process are easily accessible through Slack to let everyone understand what happened and see what arrived in production.

  Let's see together how it works.

  PS: if you love trains, you will be pleased with this presentation.

  What to Expect:
  * A presentation of about 30-45 minutes
  * Networking with Drinks and Snacks: After the presentation, join us for drinks and snacks. It's the perfect time to mingle, network, and dive deep into discussions about all things Ruby, Rails and more.
