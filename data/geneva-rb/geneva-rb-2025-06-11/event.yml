description: |-
  Ben Colon (mobilidée) will take you on a humorous journey through the chaos of race conditions in Ruby on Rails. When a well-meaning dad builds a Rails app to sell his kid's Pokémon cards, success comes fast—and so do race conditions. Follow his funny and chaotic path as he discovers the pitfalls of concurrency, and learns how to fix them using transactions, optimistic and pessimistic locks, and advisory locking before every rare card manages to sell out twice.

  What to Expect:
  * A presentation of about 30-45 minutes
  * Networking with Drinks and Snacks: After the presentation, join us for drinks and snacks. It's the perfect time to mingle, network, and dive deep into discussions about all things Ruby, Rails and more.
  * Open to Everyone: Whether you're a seasoned Rubyist, a Rails enthusiast, or just beginning your journey as a developer, we warmly welcome you to join and contribute.

  🙏 Meetup kindly sponsored by RoRvsWild and Ruby Central!
