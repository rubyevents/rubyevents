  🎉 Genevarb is back!

  We’re kicking off a new season of Genevarb with one of our more informal, community-driven formats.

  Instead of a traditional speaker and presentation, this month’s meetup is all about sharing what’s useful, interesting, and inspiring in the Ruby & Rails world right now.

  Have you discovered a great gem?
  Found a tool that has changed your workflow?
  Have a Rails trick you wish you’d known years ago?
  Experimenting with AI, testing, performance, architecture, or something else?
  Or simply have a topic you’d love to discuss with other Ruby developers?

  Bring it along! 🚀

  💬 What to expect

  - Short, informal tips and demos
  - Ruby & Rails tools, gems and techniques
  - Interesting things you’ve discovered recently
  - Lessons learned from projects
  - Topics and trends worth discussing
  - Open conversations with fellow developers

  Whether you’ve been working with Rails for years or are just getting started, everyone is welcome to contribute—or simply come along, listen, and join the conversation.

  🍻 As always, expect a relaxed evening, good conversations, and plenty of Ruby.

  Got something to share? Bring your laptop if you want to demo something, but no slides or preparation are required.

  See you at Genevarb!

