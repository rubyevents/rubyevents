  Herb & Rubydex

  最近のRubyとRails界隈で話題のツール、HerbとRubydexについてみんなでワイワイ話します。HerbはRails8.2でデフォルトのHTMLビューレンダリングエンジンになる予定です。RubydexはRubyのコード解析を行うツールで、Rubyの静的解析関連ツールの土台として広く使われていく予定のものです。

