  Neste ano excepcional, realizaremos nosso segundo meetup do ano online. Não é a mesma coisa, não teremos o tradicional coffee-break, mas é mais inclusivo (quem mora fora do RJ pode participar) e teremos o principal: conteúdo de qualidade. Espero vocês!

  RubyOnRio é a comunidade que reúne os rubystas cariocas. O grupo funciona como um meio para aproximar pessoas interessadas em Ruby e nas tecnologias que orbitam o seu ecossistema. Networking, troca de conhecimento sobre frameworks, bibliotecas, metodologias e padrões de projeto... Chega mais!

