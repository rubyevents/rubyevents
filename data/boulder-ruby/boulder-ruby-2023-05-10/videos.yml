  description: |-
    The automation of building & testing code with CI/CD enables us to ship code easily and frequently with a high level of trust that bugs won't impact end-users. Why then are our CI/CD systems still often painfully slow, unreliable & our ability to deliver frequently blocked? Site Reliability Engineering (SRE) aims to reduce the pain caused by unhealthy platforms & processes that affect the reliability & stability of production systems.

    Mel will look at CI/CD through the SRE lens; you'll learn how to define meaningful SLOs (service-level objectives) & SLIs (service-level indicators), and use error budgets to tune your test suites & pipelines to manage CI just as you would your production systems.

    Bio: Mel is a Developer Advocate at Buildkite. She's spent the past decade delivering software wearing many hats; Ruby Developer, Production Coordinator, Project Manager. She's driven by creating safe spaces, inclusive teams and communities. She's organised and emceed numerous RubyConfs in Australia, and most recently launched Buildkite's own developer conference; Unblock. When she's not clickity clacking, she's hanging out with her two Border Terriers, eating strawberries, and learning German.
