  description: |-
    In this talk, we’ll move past the introductory Turbo tutorials. I’ll deconstruct an app I built using the full range of Turbo’s features, including broadcasts, drive and frames. I’ll also share what I’ve learned and how I’m approaching Turbo Native for the (in progress) native mobile applications. Turbo has a lot to offer, but getting started can be tough. Along the journey of building my app I stumbled and learned a bunch of lessons. All of which I’m excited to share with you.

    Bio: Andy is a solo founder of a bootstrapped communications and help-desk product called Doorkeep. He's been doing this development thing for many years, but most of that time has been focused on Ruby on Rails and native mobile (iOS and Android) development.
