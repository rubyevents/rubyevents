  description: |-
    In this talk, I'll be introducing the use of Amazon S3 buckets for photo storage within your Rails application. We'll cover the initial setup, explore different use cases, and discuss situations where Amazon S3 might not be the best choice. Additionally, we'll cover Active Storage and "blobs". Whether you're an experienced AWS software engineer or a bootcamp graduate looking to learn a new tool, this talk offers valuable insights and a chance to refresh your knowledge or learn something entirely new.

    Bio: Kyle Brackman is a Software Engineer who recently started his second role in the industry at a startup called Accelant. In his personal work, Kyle is developing a user-to-user gear rental platform using Rails, which he aims to release in the coming months. Outside of software development, Kyle is a passionate rock climber, which is what he spends basically all of his free time doing.
