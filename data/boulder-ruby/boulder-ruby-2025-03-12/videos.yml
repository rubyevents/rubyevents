  description: |-
    A Quest for Joy and Work-Life Balance: One Engineer's Journey by Steve Brauner

    ​Description: Most engineers and scientists I know didn’t pursue the profession to seek out ways to be emotionally emerged, and certainly not vulnerable. In fact, we are trained that there is always a logical, fact-based, and verifiable answer to each problem. But the “business” of science and engineering is ultimately a people “business”, and people are inherently inspired, controlled, limited, liberated, and otherwise hopelessly intertwined with emotions. On top of this reality, our society continues to move at an accelerating rate of information generation, expectations, and drive for productivity - much of which is being live-streamed, curated, and otherwise manipulated to portray perfection in a way that doesn’t exist, while criticizing imperfections and mistakes. Does any of this sound familiar? And, if so, how does one experience joy, live an authentic life, and achieve a work-life balance?

    ​ This session will start with a proposition that we are all (unknowingly) doing two jobs at work, delve into brain science to understand why, and explore ways that empower you to experience well-being and balance at work, at home, and at play.  Your active participation and engagement during and in the networking time after this session will make the experience more meaningful and richer for you and your fellow meetup participants; please come be a part this journey into the human side of the field we have chosen to be a part of.

    ​Bio: Dr. Steve Brauner is a registered professional engineer with decades of experience in project management, client development, site investigation, compliance matters, and the identification of creative solutions to environmental restoration challenges. Dr. Brauner’s technical acumen is complemented by his exemplary skills in communication, organization, leadership, and collaboration.  In his most recent endeavor, he has pursued how to be a better leader, coach, mentor, and friend as part of starting and nurturing a new office for Environmental Works, Inc. (EWI).
