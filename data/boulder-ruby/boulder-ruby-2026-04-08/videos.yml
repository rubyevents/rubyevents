  description: |-
    ​Stealing your cookie is 'almost' as bad as stealing your password. This talk will cover proposals circulated in the browser community to tie session credentials to a single device in hopes of disrupting the black-market bake sales of user cookies. We'll also discuss why, from a developer’s perspective, the proposals may need more time in the oven.

    ​Bio:
    ​Mark has been a professional penetration tester specializing in web applications for more than 10 years and has been involved in enterprise web hosting and development since they coined the phrase "eBusiness". He is a leader of the Boulder chapter of OWASP, a non-profit organization dedicated to spreading application security knowledge globally.
