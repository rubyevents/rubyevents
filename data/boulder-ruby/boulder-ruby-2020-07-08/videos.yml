    Bio: Kevin Glynn is a three time public and private company Chief Information Officer (CIO), including being recognized as the 2019 CIO Innovator of the Year in Chicago. Mr. Glynn’s technology leadership includes shifting legacy systems to cloud based platforms, building big data capabilities, implementation of Agile techniques, early work in Artificial Intelligence, and the use of drones and moveable robots in a warehouse environment. Mr. Glynn currently serves as Chair of the Advisory Board for Northwestern University’s MS IT program. He has a BS in Industrial Engineering from Northwestern University and a Master of International Management from Thunderbird School of Global Management.
