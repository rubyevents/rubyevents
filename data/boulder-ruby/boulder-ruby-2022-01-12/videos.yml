  description: |-
    During a recent collaborative technical challenge, my group was required to create a method that merges 2 hashes using a customized process (ex: summing, concatenating, or subtracting the values of matching keys, etc). We needed to pass both hashes as arguments as well as a block function. Say what? We had no idea that you could pass a block as an argument or why you would want to do this in the first place. Without fully understanding the problem, we wrote a test followed by some google searching which led us to the yield keyword and a solution. In this talk, I plan to walk through the technical challenge as well as some additional use cases for the yield keyword.

    Bio: Antonio King (he/him) is a recent graduate from the Backend Engineering program at Turing School of Software and Design, where he specialized in Ruby on Rails. Curiosity and process improvement drew him into tech and now he’s excited to find ways to make an impact which allows people to spend more time solving the problems that matter.

    Prior to tech, he was a nuclear operator in the navy serving aboard a nuclear powered submarine. When his contract ended in 2017, he moved to Colorado and applied his background in submarine acoustics while working as an acoustical engineer for an environmental noise mitigation firm.
