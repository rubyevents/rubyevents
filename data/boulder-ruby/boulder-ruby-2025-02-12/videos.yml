  description: |-
    Discover the unexpected combination of Jupyter notebooks and Ruby as we explore Retrieval-Augmented Generation (RAG). In this demonstration, Landon will show you how to leverage Ruby within the Jupyter environment to help build and ideate your AI projects.

    Landon has been working to educate the Ruby community on AI integration. In 2023, he demonstrated the fundamentals of training ML models at RailsConf while working at Test Double. He then launched an AI and software boutique called Identus Consulting. In 2024, he partnered with Max Irwin of MAX.IO to launch rubyaitraining.com, the first comprehensive Ruby and AI training program on the market. The program has successfully helped developers learn AI fundamentals including AI search, RAG, agents, vectors, named entity recognition, fine-tuning, and more. Landon currently works as an AI Engineer in the automotive industry, improving an LLM-backed chatbot, and shares his knowledge of life and AI through his newsletter, Curious Centroid.
