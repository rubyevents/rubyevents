    3 years ago we were stalled with our development of new features at DNSimple. Projects were shipped late or not at all and were often missing key elements that customers expected. We decided to try Shape Up to see if it could help us address some of our issues and, spoiler alert: it did. In this talk I will talk about how Shape Up works, how we adopted it, and how we've changed it in certain ways to fit our needs.

    ​Bio: Anthony Eden is a seasoned software developer with30 years of development experience, and is the founder and CEO of DNSimple, a domain registrar and DNS provider used by individuals and businesses around the world. Anthony has appeared on numerous podcasts where he has spoken about software development,  entrepreneurship, and the challenges of building and growing a fully-remote technology business. Anthony currently spends his time between the US and France, collaborating with team members from Asia, to Europe, and North, Central, and South America. You can find Anthony at https://dnsimple.social/@aeden where he talks about running DNSimple.
