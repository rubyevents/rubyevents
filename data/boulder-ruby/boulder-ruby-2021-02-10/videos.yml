  description: |-
    Description: Crystal is a statically typed, compiled language, built on LLVM, that is particularly interesting for Rubyists because Crystal's syntax is heavily influenced by Ruby's syntax. Developing with Crystal means writing code that executes very quickly, while still retaining most of the familiar Ruby ergonomics, and because of the syntactic similarities with Ruby, Rubyists can become productive with Crystal very quickly. Tonight we're going to go on a tour of Crystal, surveying its capabilities and both some of the similarities and some of the differences from Ruby.

    Bio: Kirk has been writing software and managing systems since the early 1990s. He wrote Perl for dot.com startups in the first wave of the internet. A polyglot developer with a strong Ruby bias, Kirk has been a member of the Ruby community since the very early 2000s, working on open and close source projects daily. Kirk is a Principal Developer Relations Engineer at New Relic.
