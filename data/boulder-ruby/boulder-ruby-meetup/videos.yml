  event_name: "Boulder Ruby January 2024"
  date: "2024-01-10"
  video_provider: "children"
  video_id: "boulder-ruby-meetup-january-2024"
  description: |-
    https://www.meetup.com/boulder_ruby_group/events/297947066
  talks:
    - id: "joel-hawksley-boulder-ruby-meetup-january-2024"
      title: "How to make your application accessible (and keep it that way!)"
      event_name: "Boulder Ruby January 2024"
      date: "2024-01-10"
      video_provider: "not_recorded"
      video_id: "joel-hawksley-boulder-ruby-meetup-january-2024"
      description: |-
        Our industry is shockingly bad at accessibility: by some estimates, over 70% of websites are effectively unavailable to blind users! Making your app accessible isn’t just the right thing to do, it’s the law. In this talk, we’ll share what it’s taken to scale GitHub’s accessibility program and equip you to do the same at your company.
      speakers:
        - Joel Hawksley

- id: "boulder-ruby-meetup-march-2024"
  title: "Boulder Ruby March 2024"
  event_name: "Boulder Ruby March 2024"
  date: "2024-03-13"
  video_provider: "children"
  video_id: "boulder-ruby-meetup-march-2024"
  description: |-
    https://www.meetup.com/boulder_ruby_group/events/298910801
  talks:
    - id: "cody-norman-boulder-ruby-meetup-march-2024"
      title: "Attraction Mailbox - Why I love Action Mailbox"
      event_name: "Boulder Ruby March 2024"
      date: "2024-03-13"
      video_provider: "not_recorded"
      video_id: "cody-norman-boulder-ruby-meetup-march-2024"
      description: |-
        Email is a powerful and flexible way to extend the capabilities of your Rails application. It’s a familiar and low friction way for users to interact with your app.

        As much as you may want your users to access your app, they may not need to. Email is a great example of focusing on the problem at hand instead of an over-complicated solution.

        We’ll take a deeper look at Action Mailbox and how to route and process your inbound emails.
      speakers:
        - Cody Norman

