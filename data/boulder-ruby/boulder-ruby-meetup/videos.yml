  talks:
    - id: "marty-haught-bekki-freeman-chase-gray-elnaz-moshfeghian-kasey-mccurdy-boulder-ruby-meetup-may-2024"
      title: "Panel: What being engineer number 2 to number 5 is like"
      kind: "panel"
      event_name: "Boulder Ruby May 2024"
      date: "2024-05-15"
      video_provider: "not_recorded"
      video_id: "marty-haught-bekki-freeman-chase-gray-elnaz-moshfeghian-kasey-mccurdy-boulder-ruby-meetup-may-2024"
      description: |-
        Software startups aren't only about the founding team. As they find product market fit, they need more engineers to build the product and support customers. This panel will discuss the challenges and benefits of joining a startup as an early engineer.
      speakers:
