    - id: "bekki-freeman-boulder-ruby-meetup-april-2024"
      title: "Using no-code to augment traditional web applications"
      event_name: "Boulder Ruby April 2024"
      date: "2024-04-10"
      video_provider: "not_recorded"
      video_id: "bekki-freeman-boulder-ruby-meetup-april-2024"
      description: |-
        From MVP to delegating features across team skillsets, no-code tools can speed up your development and achieve business goals faster. But choose wisely because maintaining no-code tools can be challenging and difficult to debug.
