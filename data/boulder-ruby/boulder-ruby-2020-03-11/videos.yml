  description: |-
    Want to architect your software to be "cloud native" as well as be
    easy to work with/change? In this talk, Mike will take us through an
    evolutionary architecture that allows your codebases to stay flexible
    and workable to evolve as your business needs evolve. Yes we will
    eventually end up at microservices but along the way we will explore
    other evolution points that may work better for your software.

    If you have ever wondered why monolithic applications are seen as
    "bad" and wonder how they can regain their glory, this talk is for
    you.

    Bio:
    Mike is an advisory solutions architect in the education department at
    VMWare (formerly Pivotal). His career spans almost 20 years writing
    software, leading engineering teams and teaching developers how to
    write better software. His current claim to fame is that he's put
    something like 12 different programming languages into production.
    When he's not writing code, you can find him out on his mountain bike
    in the hills of Colorado.
