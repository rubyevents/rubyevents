  description: |-
    Pilots, wedding planners, surgeons, and home inspectors all use checklists to ensure safe and correct operations by reducing or eliminating human error and oversight. Using Atul Gawande’s “The Checklist Manifesto” as a starting point, we examine cases where checklists, that is, explicitly named and auditable requirements, might help us to do better, more correct, and more joyful work, all without sacrificing creativity or giving way to the Big Up Front Design. Along the way, we discuss case studies, both successful and not.

    Bio:
    Andrew Ek is the development director for Unabridged Software, where he mostly works with people but also uses Elixir, Ruby, and Javascript. Prior to becoming a software developer, Andrew taught middle-and-high-school language arts and math and college computer science, and taught teachers all across Nebraska how to teach poetry, performance, and creative writing. He lives in Lincoln, Nebraska, with his excellent spouse and kiddo and their remarkably adequate cat.
