  description: |-
    Through building Sublayer, some principles have emerged of what does and does not work well when using generative AI to build products. This talk will share some specific ideas that internalized from working in Ruby and Rails over a long career, and how they’ll apply to the new paradigm we all will be working in soon.

    Bio: Scott Werner has been a professional rubyist for the last 10 years. He can be found everywhere from early stage startups to big companies as an engineer, manager, and founder. He was an early engineer @ Sidetour (acquired by Groupon), CTO of SaySpring (acquired by Adobe, and most recently that team released Adobe Podcasts). Now Scott is CEO and co-founder of Sublayer, a product management app built from the ground up to get the most out of generative AI. Husband to Gretchen and father to Clark, who (very, very) occasionally goes to bed on time.
