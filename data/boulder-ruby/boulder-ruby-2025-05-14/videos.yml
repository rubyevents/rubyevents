  description: |-
    Derailing Our Application: How And Why We Are Decoupling Our Code From Rails by Alan Ridlehoover and Fito von Zastrow from Cisco Meraki

    ​Description: Cisco Meraki is probably the largest Rails shop you’ve never heard of. Our 2 million line Rails monolith has been under continuous development since 2007. As with any large codebase, ours is not without challenges. In “Derailing Our Application,” we share how our architecture has evolved to decouple 800,000 lines of Ruby code from Rails constructs in order to enable us to scale our team to 1,000 engineers and beyond without losing the benefits of Rails. Join us on the track less traveled! All aboard!

    ​Bio: Alan is a passionate Rubyist and an empathetic leader at Cisco. He's also a fallible human who has written his fair share of flaky tests. For that he apologizes. In his spare time, Alan is a swell photographer and a rusty drummer. He also owns too many hats given he only has the one head.

    ​Fito is a Staff Software Engineer @ Cisco Meraki. He is a SF Bay Area transplant from Asunción, Paraguay. He enjoys hiking, watching soccer, video games, and pair-programming.
