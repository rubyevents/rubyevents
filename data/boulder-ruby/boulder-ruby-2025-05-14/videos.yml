  description: |-
    In this video, we go over a couple basic scientific simulations written in Ruby. The first models a chemical reaction in series in a batch reactor, and the second is a computational fluid dynamics model of liquid flowing over a sphere in the laminar flow regime. We also take a brief look at parallel computing with the Mandelbrot set fractal.


    Bio: Neil Hendren writes scientific simulations at the University of Colorado, Boulder, in the Chemical and Biological Engineering department. All of his simulations are available on LearnChemE.com and most run in-browser.
