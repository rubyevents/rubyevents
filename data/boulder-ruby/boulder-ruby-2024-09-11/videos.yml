  description: |-
    ​In this talk, Jesse Spevack, a Senior Engineer at Stripe, will share key observations and lessons learned from his journey in the tech industry. Whether you're an early-career developer or looking to advance to the next level, this talk will demystify what it means to be a Senior Engineer. Jesse will provide actionable insights on ownership, mentorship, transparency, and the balance of technical and non-technical skills essential for career growth. Join us to gain practical tips and strategies to elevate your engineering career!

    ​Bio:
    ​Jesse is a Senior Engineer at Stripe, a fintech company with a mission to grow the GDP of the Internet. He works on Stripe's risk systems and writes mostly Sorbet flavored Ruby. Before joining Stipe, Jesse worked at Ibotta, a cash back for shopping app built in Denver, CO. Prior to that Jesse was an educator and made his way to software engineering by way of Turing. He's a dad of twins, a marathoner, and writes verynormal.info.
