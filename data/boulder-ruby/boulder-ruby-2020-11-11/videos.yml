  description: |-
    Description: Rails is amazing - from MVC to convention over configuration, Rails has helped start many businesses, launch many products, and gotten so many people into coding. But…are we missing something?

    What about the alternatives? Trailblazer, Sinatra, Cuba, Volt, Lotus…even (gulp) Phoenix and Elixir?!?

    This talk will take a look at when to use Rails and when it might be better to use an alternative. We will also talk about what those alternatives are and where they fit in in the Rails world.

