  description: |-
    Nothing instills confidence like good documentation, and nothing documents RESTful APIs like Swagger. Swagger enables developers to simultaneously generate both documentation and test cases. This talk will examine how this tool allows developers to effectively streamline the process of developing, interacting with, and documenting APIs.

    Bio: Zeke is an RoR/React.js software developer with a background in politics and environmental consulting. A graduate of the Turing School of Software and Design, he has recently concluded a fellowship with Bound Digital and CorePower Yoga, and is looking forward to his next opportunity. He is passionate about music, the outdoors, and environmental and social justice.
