  description: |-
    Kevin created an open source gem ("bulma_form_rails") for easy Rails forms using the Bulma CSS library. It includes helpers for most standard HTML5 fields, plus custom fields, aggregate radio groups, and editable collections, all with automatic labeling. Some page layout and message box helpers are available as well. In this presentation, he'll provide a brief overview and demonstration to illustrate the gem's benefits.

    Bio: Kevin Weller is a software development veteran of over 3 decades, with experience in 30-some-odd programming languages in environments from mainfraimes to web to mobile. Along with Python, Geographic Information Systems, and the FME enterprise integration platform, he has been building applications with Ruby on Rails since 2006. He owns Modern geoSystems, a solution development consultancy founded in July 2006. He works solo or manages teams as appropriate to fulfill his clients' needs, including solutions to the most thorny problems that have defeated many other industry players.
