description: |-
  The Ruby User Group in Dresden welcomes everyone with an interest in the Ruby programming language.
  Our ninth meetup will take place on November 19, 2026, at 19:00.

  We aim to foster knowledge exchange, share experiences, and spark new ideas through regular meetups, talks, and occasional hands-on workshops. Members can learn from one another, showcase creative projects, and discuss the latest trends in the Ruby community. Plus, there will be snacks and drinks - everyone is welcome!

  For updates, check back here or join our [Discord](https://discord.gg/K7TMrZRj6n)

  ### We're looking for speakers!

  We are still looking for talks for this evening. Got an interesting problem you solved, a new gem you found useful or a project you're excited about? We'd love to hear from you - feel free to reach out! Also speakers will receive a free Dresden.rb T-Shirt! (limited availability)

  ### Ruby Passport Initiative

  Dresden.rb is an official issuer of the Ruby Passport. The Ruby passport is a real-life way to keep memories of Ruby events you visited and enjoyed. You can grab a new passport at our event and get the [Dresden.rb stamp](https://www.rubyevents.org/events/dresden-rb-meetup/collectibles) to expand your collection!

  You can read more about the Ruby Passport Initiative [here](https://therubypassport.com/)!
