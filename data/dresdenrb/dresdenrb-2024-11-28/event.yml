  Die neue Ruby User Group in Dresden richtet sich an alle Interessierten, die sich für die Programmiersprache Ruby und deren vielfältige Anwendungen begeistern. Am 28.11.2024 um 19:00 findet das erste Meetup statt.

  Ziel ist der Austausch von Wissen, Erfahrungen und Ideen durch regelmäßige Treffen, Vorträge und evtl. kleinere Workshops. Mitglieder können voneinander lernen, kreative Projekte vorstellen und die neuesten Trends der Community diskutieren. Ein paar Snacks und Getränke gibt es auch, und jeder ist herzlich willkommen!

  The new Ruby User Group in Dresden is aimed at anyone interested in the Ruby programming language. The first meetup will take place on 28.11.2024 at 19:00. We want to exchange knowledge, experiences and ideas through regular meetings, lectures and possibly smaller workshops. Members can learn from each other, present creative projects and discuss the latest trends in the community. There are also a few snacks and drinks, and everyone is welcome!
