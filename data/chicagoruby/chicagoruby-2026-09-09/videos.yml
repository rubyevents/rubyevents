- id: "chris-fung-chicagoruby-2026-09-09"
  title: "Stop Fighting Ruby I18n: Message Format Is All You Need"
  date: "2026-09-09"
  video_provider: "not_recorded"
  video_id: "chris-fung-chicagoruby-2026-09-09"
  description: |-
    Ruby I18n tries to do the simplest thing that works in the most common situations. But do you know all of the pitfalls and trip-ups hiding within? What if there was an alternative that was just as simple and didn't require remembering gotchas?

    This talk is aimed at experienced Rails developers who have worked on multi-lingual applications. This talk will introduce i18n-message_format as an alternative to the built-in I18n module that ships with every Rails app.
