  description: |-
    When working with the same risk averse client, it's not enough to say "we added a unique constraint to the database." We know that Postgres's features are rock solid, but the client doesn't. They need proof.

    The conventional wisdom is that database features are hard to test. That might be true when it comes to performance issues. It's not the case when it comes to business logic and data integrity. With the flexibility of RSpec custom matchers we can write database tests in the same style as the Thoughtbot shoulda-matchers, covering unique constraints (partial and multi-column too), Listen/Notify, triggers, encryption, default values, and various race conditions and locks.
  speakers:
