  description: |-
    Moving a self-hosted Postgres instance to a managed service like Azure is more than a data transfer—it’s a high-stakes mission where "spot-checking" simply won't cut it. When downtime is limited and a risk-averse client demands absolute proof of data integrity, you can’t rely on luck.

    This talk tells the story of migrating a multi-terabyte database with millions of rows by building a custom, Ruby-orchestrated validation framework. We’ll move beyond simple row counts to explore how we used pgcrypto, custom aggregate functions, and information_schema introspection to generate cryptographic proof that every byte arrived safely. We’ll also dive into the "Third Act Twists"—from the hidden time-tax of generated columns to the "string paradox" of JSON and binary data—and why a successful migration is actually won during the dry run.
  speakers:
    - Steve Zelaznik

