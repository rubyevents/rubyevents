- id: "gys-muller-nic-botes-rubyfuza-2019"
  title: "Mission Impossible: Due Date Deadline and Data Science"
  raw_title: "Rubyfuza 2019: Gys Muller & Nic Botes - Mission Impossible: Due Date Deadline and Data Science"
  date: "2019-02-07"
  published_at: "2019-04-29T11:06:36Z"
  video_provider: "youtube"
  video_id: "lEr7g4AZSrg"
  description: |-
    This talk details our two-week mission impossible scenario to significantly change a fundamental business process. I’ll focus on methodology around moving fast, as well cover how we solved a significant technical challenge using data science, the adapter design pattern, and smart feature toggling.
  speakers:
    - Gys Muller
    - Nic Botes

- id: "daniel-smith-rubyfuza-2019"
