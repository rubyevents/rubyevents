- id: "kenneth-kalmer-rubyfuza-2019"
  title: "Reframing your next Single Page App"
  raw_title: "Rubyfuza 2019: Kenneth Kalmer - Reframing your next Single Page App"
  date: "2019-02-07"
  published_at: "2019-04-29T11:08:59Z"
