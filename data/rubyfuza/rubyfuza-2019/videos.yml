- id: "bala-kumar-rubyfuza-2019"
  title: "Avoid cascading failures in a multisharded Rails application with Semian"
  raw_title: "Rubyfuza 2019: Bala Kumar - Avoid cascading failures in a multisharded Rails application with Semian"
  date: "2019-02-07"
  published_at: "2019-04-17T10:55:07Z"
  video_provider: "youtube"
  video_id: "dLKPiSUgjTg"
  description: |-
    Hardware is meant to fail and software is meant to work - going by this philosophy, blocking nature of RoR apps can lead to frequent cascading failures. This talk is about how we built solid RoR webapps at Freshworks using Semian - circuit breaker gem ensuring High availability and resiliency.
  speakers:
    - Bala Kumar

- id: "raoul-de-villiers-rubyfuza-2019"
  title: "Moving Karri from .Net to Elixir/Phoenix"
  raw_title: "Rubyfuza 2019: Raoul de Villiers - Moving Karri from .Net to Elixir/Phoenix"
  date: "2019-02-07"
  published_at: "2019-04-17T10:55:58Z"
  video_provider: "youtube"
  video_id: "EmW2wFAZ3qE"
  description: |-
    In January 2018 two developers at Karri started building a Phoenix web app to replace a problematic dotNet one. By April 2018 the new site was live and performing like a Lamborghini at Nürburgring. Join me for a journey into the practical details of implementing an Elixir/Phoenix app with scale.
  speakers:
    - Raoul de Villiers

- id: "ruan-brandao-rubyfuza-2019"
