- id: "simon-van-dyk-rubyfuza-2019"
  title: "How to authenticate a user without a username, password, or database"
  raw_title: "Rubyfuza 2019: Simon van Dyk - How to authenticate a user without a username, password, or database"
  date: "2019-02-07"
  published_at: "2019-04-29T11:09:58Z"
  video_provider: "youtube"
  video_id: "k75-WWxNzTk"
  description: |-
    How do you authenticate your users? Authentication is such a common feature we don’t even think about it anymore. Let’s challenge the status quo and authenticate a user with, well, nothing. Not even a database, and no API in its place. Do we need databases at all? Let’s talk.`
  speakers:
    - Simon van Dyk

