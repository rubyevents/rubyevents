  date: "2019-02-07"
  published_at: "2019-04-17T10:56:48Z"
  video_provider: "youtube"
  video_id: "Ff8VtbCCnus"
  description: |-
    Keeping your web application is crucial, but it is not easy. There are lots of different ways you web app can be attacked. In this talk you will know the most common types of web vulnerabilities, and how you can protect your applications from it.
  speakers:
    - Ruan Brandão

- id: "matias-korhonen-rubyfuza-2019"
  title: "Ruby like it's 1995"
  raw_title: "Rubyfuza 2019: Matias Korhonen - Ruby like it's 1995"
  date: "2019-02-07"
  published_at: "2019-04-29T11:03:10Z"
  video_provider: "youtube"
  video_id: "Nw9C5UrrKag"
  description: |-
    Cast your mind back to the year 1995. Gansta’s Paradise is the top hit of the year. Friends is the hottest show on TV. And just days after I turn nine, Matz releases Ruby publicly for the first time. In this talk I go back to Ruby 0.95 and see what it takes to get it running on modern hardware.
  speakers:
    - Matias Korhonen

- id: "tanaka-mutakwa-rubyfuza-2019"
  title: "Onboarding for Developers"
  raw_title: "Rubyfuza 2019: Tanaka Mutakwa - Onboarding for Developers"
  date: "2019-02-07"
  published_at: "2019-04-29T11:04:06Z"
  video_provider: "youtube"
  video_id: "nSQJDiRtChw"
  description: |-
    Every company would like a new software developer to become productive as quickly as possible. There are 3 key areas to focus on as soon as a new developer joins: tools & technologies, domain knowledge, and soft skills. This talk will help guide everyone on how to provide awesome on-boarding.
  speakers:
    - Tanaka Mutakwa

- id: "clive-corbishley-rubyfuza-2019"
  title: "The how's and why's of setting up a bug triage system"
  raw_title: "Rubyfuza 2019: Clive Corbishley - The how's and why's of setting up a bug triage system"
  date: "2019-02-07"
  published_at: "2019-04-29T11:05:17Z"
  video_provider: "youtube"
  video_id: "R_vd-1q-UyI"
  description: |-
    Bugs are part of the software development reality. But we don’t really talk about them too much other than their effects on the system. We should be talking about how they affect WIP and developer satisfaction. I also will touch on how to do this for a Rails app based on our recent experience.
  speakers:
    - Clive Corbishley

- id: "raounak-sharma-rubyfuza-2019"
  title: "World of CLI (command line apps) with Ruby"
  raw_title: "Rubyfuza 2019: Raounak Sharma - World of CLI (command line apps) with Ruby"
  date: "2019-02-07"
  published_at: "2019-04-29T11:05:58Z"
  video_provider: "youtube"
  video_id: "REmCO0_3EZg"
  description: |-
    Ever wonder how these CLI apps work? Whether it is a simple UNIX terminal or Git or Rubocop everything is so fast and powerful. Ever thought why system admins like CLI applications more than GUI for their work? Do you want to make your own personal CLI application? Yes? Cool then, let’s dive.
  speakers:
