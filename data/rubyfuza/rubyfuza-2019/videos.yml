- id: "michael-prins-rubyfuza-2019"
  title: "Visioneering a Platform"
  raw_title: "Rubyfuza 2019: Michael Prins - Visioneering a Platform"
  date: "2019-02-07"
  published_at: "2019-04-17T10:54:15Z"
  video_provider: "youtube"
  video_id: "sDbts70Pggs"
  description: |-
    What would your typical work day look like if you could have it your way? By starting from the developer’s viewpoint and pretending the technology to support our ideal process exists we can design an application platform that allows building stable, performant and scalable applications quickly.
