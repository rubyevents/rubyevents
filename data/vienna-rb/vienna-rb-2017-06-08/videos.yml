- id: "david-halasz-vienna-rb-2017-06-08"
  title: "Socket Hijacking and TCP Smuggling in Rack/Ruby"
  date: "2017-06-08"
  video_provider: "not_recorded"
  video_id: "david-halasz-vienna-rb-2017-06-08"
  description: |-
    Have you ever wondered how WebSockets can be implemented in Rack? Did you know that the same technology can be used to "smuggle" any protocol through an open HTTP connection? Those questions motivated me in creating Purr, a proof of concept TCP-through-HTTP solution. Its main purpose is to retire HTML5 VNC/Spice clients in ManageIQ, our web-based cloud management application. However, I'd love to see other people using it in their own ideas :)
