description: |-
  It's Christmas, it's time for Vienna.rb! 🎄 Are you interested in the Ruby language or Ruby on Rails? Join us. We have great talks, good vibes, and yummy snacks! 😋

  Taking place on December 3rd, this meetup marks the one-year anniversary of this incarnation of Vienna.rb! To celebrate the occasion, we have something special in store for you.

  We're proud to host two world-class speakers, coming to Vienna to give talks at Vienna.rb! Oh, and it's Christmas time, so we are going to have a little cookie exchange! See below for additional information 👇

  Paweł Strzałkowski is the CTO of Visuality, and a full-stack developer since the 90s. He's the author of many articles showcasing a creative approach to using Rails, and a frequent speaker at conferences such as Rails World and the San Francisco Ruby Conference. He's currently excited about AI’s potential and cross-tech discoveries.

  Rosa Gutiérrez is a principal programmer at 37Signals, whom you might know for her work on Solid Queue. She has spoken at conferences such as Rails World, RailsConf, and Tropical Ruby, among many others. She loves cities, mathematics, theoretical computer science, learning languages for humans and computers, puzzles & bicycles. Importantly, she's the human to Mochi 🐕

  Cookie Exchange 🍪
  ~~~~~~~~~~~~~~~~~~~~~~~

  A cookie exchange is a fun and delicious way to share the joy of Christmas cookies with your fellow Rubyists. Just bring a batch of your favorite holiday cookies to share with others.

  The cookie exchange is entirely voluntary! You're welcome to join, cookies or no cookies 🤗

  Talks
  ~~~~~~~~~~~~~~~~~~~~~~~

  🗣️ Paweł Strzałkowski
  ▶️ AI Interface in 5 Minutes - Model Context Protocol on Rails
  🗒️ This talk delivers a low-risk, high-value AI strategy that applies to any Rails app, new or old. It proves the ecosystem's power to modernize existing assets in the AI era without the need for expensive rewrites. It teaches one of the key aspects of the modern AI tech stack, giving a competitive advantage.

  🗣️ Rosa Gutiérrez
  ▶️ Machines that talk about themselves
  🗒️ We'll start with four symbols and a printing machine. From there, we'll explore how a mathematical crisis from the 1930s ended up shaping everything we do as programmers today. No math background needed, just your curiosity.

