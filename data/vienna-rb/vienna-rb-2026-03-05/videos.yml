  title: "Structured Logging in Ruby: Where We Are and Where We're Heading"
  date: "2026-03-05"
  published_at: "2026-03-11T11:45:53Z"
  announced_at: "2026-02-09"
  video_provider: "youtube"
  video_id: "A367dhj3W4g"
  description: |-
    Ruby's logging ecosystem is evolving, and there's a lot of momentum to build on. In this talk, we'll explore the current state of logging in Ruby and compare it with ecosystems like Elixir, where a more capable, well-designed logger is built right into the standard library. We'll dive into recent developments in Rails - including its new structured events API - and how they connect to the broader picture of structured logging, error handling, and tracing. Along the way, we'll build a vision for what Ruby's standard library could offer: a powerful, extendable logger that makes structured logging a natural part of every Ruby project.
  speakers:
    - Peter Solnica

