  description: |-
    What do you end up with when you strip Rails from a Rails developer? Plain Ruby. Join me as I explore the language behind the framework through the lens of game development. By building a simple terminal game and a 2D platformer, I'll break down the essential building blocks every game is built on - from loops and input handling to visuals. We'll look at how stepping away from the 'magic' of Rails to build games can lead to a deeper understanding of Ruby logic and application structure.
  speakers:
    - Marie-Therese Fischer

