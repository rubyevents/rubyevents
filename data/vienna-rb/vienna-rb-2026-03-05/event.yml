description: |-
  Vienna.rb #67 - Ruby Spring Meetup

  Join us for the first meetup in 2026! ⭐️

  Are you interested in the Ruby language or Ruby on Rails? Join us. We have great talks, good vibes, and yummy snacks! 😋

  Talks
  ~~~~~~~~~~~~~~~~~~~~~~~

  🗣️ Peter Solnica
  ▶️ Structured Logging in Ruby: Where We Are and Where We're Heading
  🗒️ Ruby's logging ecosystem is evolving, and there's a lot of momentum to build on. In this talk, we'll explore the current state of logging in Ruby and compare it with ecosystems like Elixir, where a more capable, well-designed logger is built right into the standard library. We'll dive into recent developments in Rails - including its new structured events API - and how they connect to the broader picture of structured logging, error handling, and tracing. Along the way, we'll build a vision for what Ruby's standard library could offer: a powerful, extendable logger that makes structured logging a natural part of every Ruby project.

  🗣️ Marie-Therese Fischer
  ▶️ Building Games with Ruby
  🗒️ What do you end up with when you strip Rails from a Rails developer? Plain Ruby. Join me as I explore the language behind the framework through the lens of game development. By building a simple terminal game and a 2D platformer, I'll break down the essential building blocks every game is built on - from loops and input handling to visuals. We'll look at how stepping away from the 'magic' of Rails to build games can lead to a deeper understanding of Ruby logic and application structure.

  🗣️ Christoph Lipautz
  ▶️ The Art of Testing Nothing
  🗒️ Traditional CI/CD pipelines often waste significant resources re-validating unchanged code, creating a bottleneck in the development lifecycle. This session explores the results of my attempts to shift from exhaustive execution to smart omission. I'll discuss how doing nothing turns into a technical strategic advantage while maintaining confidence.

