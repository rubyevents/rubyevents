  Summer break is over and we're back in action! ⭐️

  Are you interested in the Ruby language or Ruby on Rails? Join us. We have great talks, good vibes, and yummy snacks! 😋

  Talks
  ~~~~~~~~~~~~~~~~~~~~~~~

  🗣️ Aaron Cruz
  ▶️ If You Didn't Record It, It Didn't Happen - Practical Observability for Rails
  🗒️ Your Rails app is in production. A user says it’s slow. Another says a feature just broke. You need answers fast.
  This talk shows how to make your app observable: capturing metrics, logs, and traces, then feeding them into open source monitoring tools. You’ll see what’s worth recording, how to avoid drowning in noise, and how to set alerts that lead straight to the cause.
  Walk away ready to see inside your app when it matters most and fix problems before everything is on fire.

  🗣️ Grzegorz Jakubiak
  ▶️ Retro, Ruby and Frontend
  🗒️ A short story of what nostalgia taught me about WebAssembly in Ruby. When I was 8 years old I got my first cell phone, it was Nokia 3310 and i couldn’t stop playing snake. After seeing Euruko 2024 presentation about WebAssembly in Ruby I decided to rebuild my nostalgic memory in the browser using the language that brings me joy.

  🗣️ Jan Grodowski
  ▶️ Rails Migrations at Scale: How Shopify Moved from Trigger-Based Online Schema Changes to gh-ost
  🗒️ Shopify runs thousands of schema changes per year across a 1.5 PB sharded MySQL database. In this talk, we’ll look at how we preserve the Rails migration experience while executing schema changes safely across many databases. We’ll cover how Shopify moved from trigger-based migrations with LHM to trigger-less migrations with gh-ost, and how we turn Rails migrations into a controlled, observable, and recoverable production workflow. You’ll leave with practical ideas for keeping Rails migrations simple for developers while making production execution safer as your database grows.

