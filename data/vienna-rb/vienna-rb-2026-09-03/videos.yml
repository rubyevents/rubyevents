  description: |-
    Shopify runs thousands of schema changes per year across a 1.5 PB sharded MySQL database. In this talk, we’ll look at how we preserve the Rails migration experience while executing schema changes safely across many databases. We’ll cover how Shopify moved from trigger-based migrations with LHM to trigger-less migrations with gh-ost, and how we turn Rails migrations into a controlled, observable, and recoverable production workflow. You’ll leave with practical ideas for keeping Rails migrations simple for developers while making production execution safer as your database grows.
  speakers:
