description: |-
  Hi everyone,
  It's been many years since I've done this but I'd like to organize a cross-meetup barbecue for all of the meetups I organize in my Kleingarten house in beautiful Klosterneuburg.

  Included meetups
  - Freelancing in Vienna
  - Elixir Vienna
  - vienna.rb

  You can bring your own meat or veggie things to grill (I'll keep a meat-free area on the grill ;) ) and I will provide some salads and drinks.
  The house is right on a Danube sidearm so if you want to swim, go out on the row boat, SUP or go out in the leaky kayak, you're welcome to.

  The only parking is a 10 minute walk away. It is a 15 minute walk from the Klosterneuburg train station which is easy to get to via Heiligenstadt.

  I don't want to share the address here so if you want to come, send me a message here on meetup and I'll send you directions and a map link.
  See you there!
  Aaron
