  Spitalgasse/Währinger Straße

  An evening before a (mini) conference (http://www.rossconf.io/) calls for burgers. Veggie burgers, meaty burgers, fishy burgers, ALL THE BURGERS. And with Arne Brasseur, Katrina Owen, Michał Papis, Piotr Szotkowski and Lisa Passing joining, we surely won't fall short on things to talk about.

  Where?

  Since we had such a good time at Chiq Chaq last time, we're going there again! Chiq Chaq is located very close to the corner of Nußdorferstrasse and Währingerstrasse. You can either walk from the Währingerstrasse U6 station or take the street car (5, 37, 38) to the Spitalgasse/Währinger Straße stop. The address says Nußdorferstrasse, but it is actually located on Fluchtgasse a block into the triangle (see map).
