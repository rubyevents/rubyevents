description: |-
  Vienna.rb #65 - Ruby Autumn Meetup

  It's the Vienna.rb autumn edition! 🍂 Are you interested in the Ruby language or Ruby on Rails? Join us. We have great talks, good vibes, and yummy snacks!

  Taking place alongside Rails World 2025!

  Talks
  ~~~~~

  🗣️ Clemens Helm
  ▶️ Smart Queries for Dumb Models
  🗒️ Complex data filtering in Rails often leads us down a rabbit hole of custom scopes, service objects, and Arel acrobatics. But what if we let the database do what it’s best at? In this talk, you’ll see how SQL views paired with plain ActiveRecord and Ransack can turn messy logic into elegant, powerful queries — without giving up the Rails way.

  🗣️ Wolfgang Hotwagner
  ▶️ Know Your Weaknesses
  🗒️  ‘We take care of security at the end of the project’ was the approach in the past. Today, software quality is improved by addressing security from the start. In this talk, I will demonstrate how to easily integrate security into your development process without expert knowledge, using an open-source Ruby application as an example.
