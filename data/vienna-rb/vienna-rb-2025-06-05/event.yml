description: |-
  It's Summer; it's time for Vienna.rb! 🏖️

  Are you interested in the Ruby language or Ruby on Rails? Join us. We have great talks, good vibes, and yummy snacks! 😋

  We have something very special in store this time.

  First, we're excited to host Hana Harencarova! Hana works at GitHub and is traveling all the way from Switzerland to give a talk. She's in love with Ruby and shares her passion by teaching at Ruby Monstas Zürich and co-organizing the Helvetic Ruby conference.

  Second, we're happy to announce the first-ever Vienna.rb Ruby Quiz! Everyone can participate, and there will be awesome prizes, sponsored by the Ruby Community, to win! 🏆

  Talks
  ~~~~~~~~~~~~~~~~~~~~~~~

  🗣️ Hana Harencarova
  ▶️ How To Ship 1000+ Commits to a Rails Monolith Daily
  🗒️ Rails helps us prototype quickly, but true velocity comes from delivering those changes to customers just as fast. At GitHub, we ship hundreds of commits to our Rails monolith every day through a deployment process built for speed, safety, and reliability. In this talk, you’ll learn the key practices and tools that help us ship fast and confidently at scale.

  🗣️ Alexander Fiedler
  ▶️ Building Buildings with Rails
  🗒️ PlanRadar provides a platform for construction management, and that platform is built on Ruby on Rails! Let's learn how the team at PlanRadar uses Rails, and discover why they chose it in the first place.

