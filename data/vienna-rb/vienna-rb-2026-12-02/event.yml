description: |-
  It's time for the Vienna.rb Christmas Edition! 🎄

  We have some special treats for you this time. Bozhidar Batsov - the creator of Rubocop - and Stephen Margheim - who popularized the use of SQLite for Rails - are visiting Vienna to take the stage. You don't wanna miss this.

  Are you interested in Ruby or Ruby on Rails? Come join us. Great talks, good company, and a chance to catch up with your fellow Rubyists before the holidays. New faces are always welcome!

  [Bozhidar Batsov](https://batsov.com/)
  You probably know Bozhidar for his work on RuboCop or the Ruby Style Guide. He works on open-source tools for Ruby, Clojure, and Emacs (!), helping developers spend a little less time fighting their tools.

  [Stephen Margheim](https://fractaledmind.com/)
  Stephen (aka fractaledmind) is joining us from Berlin. He's the author of High Leverage Rails, and best known for his work on bringing SQlite to Rails. A former philologist, he brings a love of words and ideas to his work as a developer.

