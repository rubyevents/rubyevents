- id: "michael-wallbaum-rughh-2018-08-08"
  old_id: "rughh-event-450-topic-614"
  title: "Ruby on the Road - Transition from office worker to location independent consultant/freelancer"
  date: "2018-08-08"
  video_provider: "not_recorded"
  video_id: "michael-wallbaum-rughh-2018-08-08"
  description: |-
    Working with Ruby is a lot of fun. Building Software in general is an incredibly exciting profession.

    But sometimes the confines of an office can feel a bit overwhelming. _You could always change jobs, right?_ Well, at some point it just did not cut it anymore.

    I will talk about my journey from working for startups and small companies to becoming a location independent freelancer and eventually consultant. Pointing out some pitfalls and sharing incredibly stupid mistakes that happened in the first attempts of this journey and listing a number of reasons and circumstances when you definitely should not seek out this kind of life (yet).

    Also I will talk about the awesome feeling of accomplishment, when you finally "get it" and are able to sustain this lifestyle that allows you to eventually travel the world.
  speakers:
    - Michael Wallbaum
