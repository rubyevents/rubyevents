  description: |-
    I will explain how you can automatically scrape data from third-party websites with your Rails application, using Nokogiri. This will include some basics of XPath to find nodes within an HTML document.

    I will then explain in detail how you can scrape data from a website widget of a *l*arge *i*nternational social media website, and how you can use the data to re-create the widget so that it conforms with German and EU privacy laws. :-)
