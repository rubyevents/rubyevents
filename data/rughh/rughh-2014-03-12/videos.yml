  title: "Customized Event-Tracking mit Google Analytics und Ruby on Rails"
  date: "2014-03-12"
  video_provider: "not_recorded"
  video_id: "tim-adler-rughh-2014-03-12"
  description: |-
    Ich würde für unsere Runde zum Thema "Rails und JavaScript" anbieten mal zu zeigen, wie wir bei einem Projekt Google Analytics eingesetzt haben, um Usern individuelle Statistiken anzuzeigen.

    Dabei haben die Nutzer der Plattform Zugriff auf ein Dashboard, dass ihn anzeigt, wie ihre Inhalte auf der Plattform durch andere Besucher genutzt wurden.

    Themengebiete, die es dazu zu lösen gilt sind:
    - Einbinden der Google-Analytics-Tags, an den richtigen Stellen
    - URL-Gestaltung
    - Analyse, Aggregation der Daten, um sie auf die gewünschten Ereignisse abzubilden
    - Import vs. Live-Zugriff
    - Umgehen mit Google API-Limits
    - Passende GEMs
  speakers:
    - Tim Adler

