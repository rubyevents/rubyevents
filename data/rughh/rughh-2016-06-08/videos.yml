  date: "2016-06-08"
  video_provider: "not_recorded"
  video_id: "jens-hinrichs-rughh-2016-06-08"
  description: |-
    ### Headhunters from Hell

    Als Head of Web Development von **"Wer liefert was"** habe ich jede Woche mit Recruitern zu tun. Ich bekomme fast täglich Anfragen über **Xing** oder **LinkedIn**, aber nicht nur mit Jobangeboten, sondern hauptsächlich mit Profilen von EntwicklerInnen.
    In meiner aktiven Zeit als Entwickler habe ich natürlich auch regelmäßig Jobangebote bekommen oder zu mindestens Anfragen von Recruitern.
    Ich würde gerne von beiden Phasen berichten und einige lustige Anekdoten mitbringen, die ich in den Jahren gesammelt habe. Ausserdem möchte ich ein paar Insights und Sichtweisen von meiner Position als "Head of" mit euch teilen.
  speakers:
    - Jens Hinrichs

