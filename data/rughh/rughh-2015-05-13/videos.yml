  video_id: "peter-schroeder-rughh-2015-05-13"
  description: |-
    Heroku is a pretty awesome app platform. Most of that awesomeness comes from the zillion of plugins that you can install on your app.

    Heroku has done a pretty decent job of streamlining the plugin development.

    I want to show you how to build your own plugin, basically implementing your own logging-service like Loggly or Papertrail for Heroku apps!

