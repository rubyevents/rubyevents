  date: "2012-11-14"
  video_provider: "not_recorded"
  video_id: "lucas-rughh-2012-11-14"
  description: |-
    Reveal.js ist ein in-browser "Präsentations-Framework" welches es ermöglicht, Präsentationen wie man sie vorher mit Keynote, PowerPoint, etc. erstellt hat im Browser zu gestalten (ein klein wenig HTML/CSS/JS Kenntnisse vorausgesetzt).

    Features:

    * Hübsche CSS3 Übergänge
    * Ansicht für den präsentierenden mit aktuellem und nächstem Slide in separatem Fenster
    * Markdown Support
    * Voll anpassbar, da HTML/CSS/JS
    * Sinnvoll versonierbar
    * Leicht zu veröffentlichen
    * Keine kaputten Keynote-Dateien mehr :D
