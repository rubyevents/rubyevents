  Hey Hamburg Rubyists,

  It’s time for a slightly different kind of meetup. We need to have an open, honest conversation about the future of our usergroup.

  Lately, we’ve been running into a few hurdles—specifically when it comes to securing consistent locations and finding speakers for talks. We are also thinking it might be a good time to bring some fresh energy and potential changes into the organizing team.

