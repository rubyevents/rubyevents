  description: |-
    [pico-8](www.pico-8.com) is a so-called phantasy console, a game system you can very simply write games in and share them on the web. pico-8 is programmed in Lua and contains tools to create graphics and sound for your game as well. This makes creation incredibly easy and fast and also makes starting very easy as there is a very small API surface to learn.
