  talks:
    - id: "rughh-event-541-topic-688"
      title: "Monitoring Wonderland"
      event_name: "Ruby Usergroup Hamburg - March 2019"
      date: "2019-03-13"
      slides_url: "https://speakerdeck.com/seiffert/monitoring-wonderland"
      video_provider: "not_recorded"
      video_id: "rughh-event-541-topic-688"
      description: |-
        At Jimdo, we are running around 400 services on our internal cloud platform called Wonderland. In order to make sure these services are available and performant at all times, we integrated a couple of monitoring tools tightly with the platform. 

        In my talk, I will present how we monitor clusters of EC2 instances running multiple thousands of Docker containers as well as the applications running on top. To make this dry topic a bit more exciting, I will guide you through a (fictional) incident that will show how we act in cases of emergencies.
      speakers:
