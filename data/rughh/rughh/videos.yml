      video_provider: "not_recorded"
      video_id: "rughh-event-12-topic-21"
      description: |-
        Wir würden gerne wissen ob ihr Interesse an einem Vortrag über ein sehr detail- und funktionsreiches und trotzdem super einfach zu bedienendes Ruby on Rails CMS (Alchemy) habt.

        Unser Wunsch ist es Entwickler zu gewinnen die von dem Projekt überzeugt sind, es selbst einsetzen möchten und sich an der Weiterentwicklung beteiligen.
