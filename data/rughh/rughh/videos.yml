- id: "rughh-event-8"
  title: "Ruby Usergroup Hamburg - Mai 2011"
  event_name: "Ruby Usergroup Hamburg - Mai 2011"
  date: "2011-05-11"
  video_provider: "children"
  video_id: "rughh-event-8"
  description: |-
    Am Mittwoch, den 11.05.2011 findet wie gewohnt um 19:00 Uhr das Treffen der Hamburger Ruby Usergroup statt.
  talks:
    - id: "rughh-event-8-topic-14"
      title: "Diskussion: Git-Workflows"
      event_name: "Ruby Usergroup Hamburg - Mai 2011"
      date: "2011-05-11"
      video_provider: "not_recorded"
      video_id: "rughh-event-8-topic-14"
      description: |-
        Anlässlich einer Diskussion auf Twitter, an der ich in den letzten Tagen beteiligt waren, ist es mal wieder Zeit, sich mit einem eher Ruby-fernen Thema zu beschäftigen - Ich würde mich gerne mit Euch darüber unterhalten, in was für Projekten ihr welche Workflows für den Umgang mit git (oder jedem beliebigen anderen DVCS) einsetzt, welche Projektgröße welche Workflow-Komplexität verträgt, wann und warum ein linearer master nicht mehr ausreicht und und und und.

        Ich stelle ein paar einleitende Folien, wenn jemand ein-drei Sätze zu git-flow erzählen könnte (ich hab das selber noch nie produktiv eingesetzt), fände ich das super. Und dann: Diskussion mit dem kompletten Publikum.
      speakers:
        - Jan Krutisch

    - id: "rughh-event-8-topic-15"
      title: "Spaß mit Dragonfly!"
      event_name: "Ruby Usergroup Hamburg - Mai 2011"
      date: "2011-05-11"
      video_provider: "not_recorded"
      video_id: "rughh-event-8-topic-15"
      description: |-
        Ah, die wundervolle Welt der File-Upload-und-Bild-Transformadings-Plugins! Mein Lieblings-Gem aus dieser Kategorie ist derzeit "Dragonfly". Es macht lazy thumbnailing (= juhu!), liefert seine Files per Rack-Middleware aus, ist toll erweiterbar und versteht sich selbstverständlich prima mit S3, CouchDB & Freunden. Details in meinem kurzen Talk. (Enthält Katzenfotos.)
      speakers:
        - Hendrik Mans

