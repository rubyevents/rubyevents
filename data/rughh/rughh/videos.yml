  description: |-
    The **Ruby Usergroup Hamburg** invites you to the monthly meeting of the Hamburg Ruby community!

    Join us at the offices of **Akra** for an evening of insightful talks, networking, and delicious refreshments. Please note that **attendance is strictly limited to 20 people**, so be sure to register early!

    Whether you are an experienced Ruby developer, a curious beginner, or a fan of Ruby on Rails – this meetup is a great opportunity to connect with fellow developers, share knowledge, and learn something new.

    ### 🗓 Event Details

    * **Date:** Wednesday, November 12, 2025
    * **Time:** 7:00 PM (19:00)
    * **Location:** **AKRA**
        * Domstraße 17, 20095 Hamburg
    * **Attendance Limit:** **20 Persons** (Registration required via the OnRuby platform)

    ### 🗣 Agenda (Talks)

    The current main topic for the evening is:

    * **Short overview, Discussion: Okay, so what's up with bundler and rubygems?** (Jan Krutisch)

    **What to Expect:**  
    * Welcome and quick agenda rundown.  
    * Engaging talk and community discussion.  
    * Plenty of time for networking and socializing (optional) with fellow Rubyists.  
    * Refreshments provided by the host, **Akra**.  

    **Please register your attendance as soon as possible** due to the capacity limit. See you there! Can't wait ✨.
  talks:
    - id: "rughh-event-2102-topic-3042"
      title: "Short overview, Discussion: Okay, so what's up with bundler and rubygems?"
      event_name: "Ruby Usergroup Hamburg - November 2025"
      date: "2025-11-12"
      video_provider: "not_recorded"
      video_id: "rughh-event-2102-topic-3042"
      description: |-
        Unless you live under a rock, you have probably heard about the odd situation around bundler, rubygems.org, the former maintainers, the withdrawal of access, the waffling around and Ruby core taking over.

