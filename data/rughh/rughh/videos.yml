      video_id: "rughh-event-385-topic-524"
      description: |-
        75% of our sensoric neurons are reserved for visuals. So why do we keep writing complicated text into Jira tickets? Why do we endure endless meetings with lots of talking and little listening? Didn’t they say “show, don’t tell”?!

        Sketching creates ownership, alignment and commitment across roles and teams with very little time investment. It convertes abstract ideas into specific form, which in turn resolves misunderstandings *before* they are crafted into shiny Photoshop mockups or production code.

        Don’t worry: sketching is not drawing and this is not art school. You can do it! :)
      speakers:
        - Fabian Fabian

