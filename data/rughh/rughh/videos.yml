- id: "rughh-event-450"
  title: "Ruby Usergroup Hamburg - August 2018"
  event_name: "Ruby Usergroup Hamburg - August 2018"
  date: "2018-08-08"
  video_provider: "children"
  video_id: "rughh-event-450"
  description: |-
    Our next meetup will be hosted at REBELLE. REBELLE has launched a fashion platform for  Second Hand Designers and offers fashion und accessories for the luxury and high-end consumer.
  talks:
    - id: "rughh-event-450-topic-613"
      title: "Journey of a rails application - preparing for TV commercials"
      event_name: "Ruby Usergroup Hamburg - August 2018"
      date: "2018-08-08"
      video_provider: "not_recorded"
      video_id: "rughh-event-450-topic-613"
      description: |-
        This talk is about the steps we took for preparing our rails e-commerce application for TV commercials / peak traffic. This includes:

        - Moving from AWS to Google Cloud
        - Introducing HTTP level caching with varnish
        - Dockerizing everything and scaling with Kubernetes
        - Building a new frontend with react + typescript
        - Related pitfalls ;)
      speakers:
