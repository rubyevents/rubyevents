  talks:
    - id: "rughh-event-13-topic-22"
      title: "Managing the logs of your (Rails) applications"
      event_name: "Ruby Usergroup Hamburg - Oktober 2011"
      date: "2011-10-12"
      video_provider: "not_recorded"
      video_id: "rughh-event-13-topic-22"
      description: |-
        The good thing: Most companies started collecting and centralizing their logs. The bad part: Most of them did not unleash the power of log management and analysis yet. In this talk I will show you how to effectively manage your logs and the scope of Rails specific log analysis. I am the author of Graylog2 (www.graylog2.org) and work at XING where we have a really mature Rails logging environment.
      speakers:
        - Lennart Koopmann

    - id: "rughh-event-13-topic-23"
      title: "fpm-cookery - Software bauen und paketieren"
      event_name: "Ruby Usergroup Hamburg - Oktober 2011"
      date: "2011-10-12"
      video_provider: "not_recorded"
      video_id: "rughh-event-13-topic-23"
      description: |-
        fpm-cookery ist ein Ruby-Framework zum kompilieren und paketieren von Software für Linux. Es benutzt dafür die (aus dem Mac OS Umfeld bekannte) Homebrew DSL.

        Ich werde erzählen welche Schmerzen mich dazu gebracht haben fpm-cookery zu schreiben und wie man es einsetzt.
      speakers:
        - Bernd Ahlers

