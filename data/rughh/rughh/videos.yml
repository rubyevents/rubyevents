- id: "rughh-event-206"
  title: "Ruby Usergroup Hamburg - März 2015"
  event_name: "Ruby Usergroup Hamburg - März 2015"
  date: "2015-03-11"
  video_provider: "children"
  video_id: "rughh-event-206"
  description: |-
    Und weiter geht es mit den 'neuen Programmiersprachen' und dazu gibt es ein wenig Emailverschlüsselung mit pixelated
  talks:
    - id: "rughh-event-206-topic-284"
      title: "Opposing mass surveillance with easy to use encrypted email and federated hosting"
      event_name: "Ruby Usergroup Hamburg - März 2015"
      date: "2015-03-11"
      video_provider: "not_recorded"
      video_id: "rughh-event-206-topic-284"
      description: |-
        I am currently working on an open source project called Pixelated. 

        Pixelated aims at making email encryption simple and secure email hosting a satisfactory experience. 

        While encryption tools can be cumbersome and difficult to learn, Pixelated’s main goal is to offer a seamless user experience (for email users as well as system administrators), a practical response to mass surveillance and an alternative to current centralized email applications.

        Pixelated doesn't focus on protecting against targeted surveillance, but when widely adopted will make mass surveillance more difficult and expensive. Pixelated will also re-federate data and communications for groups, companies and agencies running their own email server. 
        Pixelated is open source software that values privacy and the right to communicate. 

        Pixelated's tech stack doesn't contain Ruby (yet ;) ), but is built mainly in Python and flight JS, using puppet recipes to help server side configuration. We are building on and collaborating closely with the open source project LEAP.

        see also:
        https://leap.se/
        https://pixelated-project.org/
      speakers:
        - lieblingswelt

    - id: "rughh-event-206-topic-289"
      title: "OpenResty, Lua, Moonscript, oh my!"
      event_name: "Ruby Usergroup Hamburg - März 2015"
      date: "2015-03-11"
      video_provider: "not_recorded"
      video_id: "rughh-event-206-topic-289"
      description: |-
        Forget Node, React and Rust; let's go full hipster and take a look at some stuff that _really_ nobody uses (but is, in fact, quite awesome.) Includes a quick look at OpenResty, Lua, Moonscript and Lapis, with a quick cameo of mruby. Bring your fixed-gear bikes and craft beers, by tomorrow this stuff is going to be old news!
      speakers:
        - Hendrik Mans

