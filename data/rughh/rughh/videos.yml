  talks:
    - id: "rughh-event-371-topic-514"
      title: "Elixir & Phoenix – fast, concurrent and explicit"
      event_name: "Ruby Usergroup Hamburg - Dezemburg 2016"
      date: "2016-12-14"
      video_provider: "not_recorded"
      video_id: "rughh-event-371-topic-514"
      description: |-
        Elixir and Phoenix are known for their speed, but that’s far from their only benefit. Elixir isn’t just a fast Ruby and Phoenix isn’t just Rails for Elixir. Through pattern matching, immutable data structures and new idioms your programs can not only become faster but more understandable and maintainable.

        This talk will take a look at what’s great, what you might miss and augment it with production experience and advice.

