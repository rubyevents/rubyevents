  talks:
    - id: "rughh-event-501-topic-679"
      title: " Serverless Ruby Bundler with AWS Cloud Development Kit (CDK)"
      event_name: "Ruby Usergroup Hamburg - February 2019"
      date: "2019-02-13"
      slides_url: "https://github.com/rughh/planning/files/2917020/geminator.pdf"
      video_provider: "not_recorded"
      video_id: "rughh-event-501-topic-679"
      description: |-
