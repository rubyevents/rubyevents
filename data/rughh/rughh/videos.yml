- id: "rughh-event-132"
  title: "Ruby Usergroup Hamburg - Februar 2014"
  event_name: "Ruby Usergroup Hamburg - Februar 2014"
  date: "2014-02-12"
  video_provider: "children"
  video_id: "rughh-event-132"
  description: |-
    Wie bei der letzten Usergroup angekündigt, würden wir den zukünftigen Treffen gerne jeweils ein Thema widmen. Starten werden wir (aus anhaltendem Anlass) im Februar mit dem Thema "Sicherheit". Wir freuen uns auf Vorträge, Fragen und DIskussionen rund um NSA, Verschlüsselung, Sicherheitslücken, Privatsphäre, etc.
  talks:
    - id: "rughh-event-132-topic-182"
      title: "Common Security Fuck-Ups"
      event_name: "Ruby Usergroup Hamburg - Februar 2014"
      date: "2014-02-12"
      video_provider: "not_recorded"
      video_id: "rughh-event-132-topic-182"
      description: |-
        I will rant about security vulnerabilities that are serious, but yet widespread.  For the larger part, this will not be about application security, but more about the security of the infrastructure that we base our applications on.  Depending on your level of knowledge and your cynicism, those things will be either shocking to you, not new to you (i.e., boring), or you find them funny.  Especially for the cynical and bored people, I will highlight steps that we can take in order to improve our situation.
      speakers:
        - Klaus Trainer

    - id: "rughh-event-132-topic-183"
      title: "Risiko, Sicherheit und menschliche Entscheidungsfindungen."
      event_name: "Ruby Usergroup Hamburg - Februar 2014"
      date: "2014-02-12"
      video_provider: "not_recorded"
      video_id: "rughh-event-132-topic-183"
      description: |-
        Es gibt bestimme Muster in der Entscheidungsfindung von Menschen. Diese Muster bestimmen wesentlich mit,  ob man ein Sicherheitstool eingesetzt, man eine Sicherheitsoption eingeschaltet wird, oder ob man einfach den Markennamen des Monitors als Passwort nimmt, den Anhang mit den total süßen Katzenvideo öffnet, die Eingabeparameter per Mass-Assignment an die Datenbank weiterreicht. Der Vortrag gibt einen kurzen Überblick.

        [Vortragfolien und Ergänzungsmaterial](http://meier-online.com/2014/02/risiko-sicherheit-und-menschliche-entscheidungsfindungen/ " Vortrag zu Sicherheitspsychologie von Karsten Meier") findet ihr auf meinem Blog.
      speakers:
        - Karsten Meier

    - id: "rughh-event-132-topic-184"
      title: "State of the Art SSL-Deployments."
      event_name: "Ruby Usergroup Hamburg - Februar 2014"
      date: "2014-02-12"
      video_provider: "not_recorded"
      video_id: "rughh-event-132-topic-184"
      description: |-
        In einem meiner letzten Blog-Beiträge habe ich den Weg beschrieben wie ich meinen Blog mit SSL ausgestattet habe. Ich habe dabei versucht, möglichst viel best practices zu berücksichtigen und so meinen Benutzern die maximal mögliche Sicherheit zu bieten, auch wenn das bei einer statischen Website erst einmal unsinnig erscheint. 

        * [Blog Post](https://jan.krutisch.de/en/2014/01/06/going-full-encryption.html)
        * [Slides](https://speakerdeck.com/halfbyte/ssl-deployment-best-practices)
      speakers:
        - Jan Krutisch

    - id: "rughh-event-132-topic-185"
      title: "client side certificates"
      event_name: "Ruby Usergroup Hamburg - Februar 2014"
      date: "2014-02-12"
      video_provider: "not_recorded"
      video_id: "rughh-event-132-topic-185"
      description: |-
        Schneller Einblick wie ihr mit Hilfe von &lt;keygen> und  OpenSSL Client Side Certificates erzeugt.

        Ich werde dabei versuchen jede erdenkliche Sicherheitslücke gekonnt zu missachten. 
        Definitiv nicht Production-Ready! oder auch: "nicht sicher" – Idiocracy

        Slides: http://ben.rexin.at/clientcert-slide
      speakers:
        - Ben Rexin

- id: "rughh-event-137"
  title: "Ruby Usergroup Hamburg - März 2014"
  event_name: "Ruby Usergroup Hamburg - März 2014"
  date: "2014-03-12"
  video_provider: "children"
  video_id: "rughh-event-137"
  description: |-
    Diesen Monat treffen wir uns wieder bei Hanse Ventures in der Hafencity. Das Thema ist “JavaScript und Ruby/Rails” und wir suchen noch Vortragende.
  talks:
    - id: "rughh-event-137-topic-196"
      title: "Customized Event-Tracking mit Google Analytics und Ruby on Rails"
      event_name: "Ruby Usergroup Hamburg - März 2014"
      date: "2014-03-12"
      video_provider: "not_recorded"
      video_id: "rughh-event-137-topic-196"
      description: |-
        Ich würde für unsere Runde zum Thema "Rails und JavaScript" anbieten mal zu zeigen, wie wir bei einem Projekt Google Analytics eingesetzt haben, um Usern individuelle Statistiken anzuzeigen. 

        Dabei haben die Nutzer der Plattform Zugriff auf ein Dashboard, dass ihn anzeigt, wie ihre Inhalte auf der Plattform durch andere Besucher genutzt wurden. 

        Themengebiete, die es dazu zu lösen gilt sind: 
        - Einbinden der Google-Analytics-Tags, an den richtigen Stellen
        - URL-Gestaltung
        - Analyse, Aggregation der Daten, um sie auf die gewünschten Ereignisse abzubilden
        - Import vs. Live-Zugriff
        - Umgehen mit Google API-Limits
        - Passende GEMs
      speakers:
        - Tim Adler

    - id: "rughh-event-137-topic-197"
      title: "Rails und JavaScript Apps. Discuss."
      event_name: "Ruby Usergroup Hamburg - März 2014"
      date: "2014-03-12"
      video_provider: "not_recorded"
      video_id: "rughh-event-137-topic-197"
      description: |-
        JavaScript Apps, oder auch Single Page Apps, haben in den letzten Jahren ziemlich an Verbreitung zugenommen. Auch vor Rails-Anwendungen macht dieses Paradigma nicht halt und wir wollen heute mit Euch darüber reden was da eigentlich so geht, was nicht geht, wie man die verschiedenen Welten zusammen bringt und was noch fehlt.

        Diskussionsrunde, Impulsvorträge, Spontanrants: Hauptsache mitmachen.
      speakers:
        - Jan Krutisch

    - id: "rughh-event-137-topic-198"
      title: "EmberJS mit Rails"
      event_name: "Ruby Usergroup Hamburg - März 2014"
      date: "2014-03-12"
      video_provider: "not_recorded"
      video_id: "rughh-event-137-topic-198"
      description: |-
        Kurzer Talk darüber, wie man EmberJS-Apps mit Rails als Backend entwickeln kann. Es geht um EmberJS selbst, wie man eine REST-API auf Rails-Basis anbindet, um Deployment und mehr.
      speakers:
        - Ralph von der Heyden

- id: "rughh-event-138"
