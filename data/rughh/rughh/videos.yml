  event_name: "Ruby Usergroup Hamburg - September 2012"
  date: "2012-09-12"
  video_provider: "children"
  video_id: "rughh-event-31"
  description: |-
    Am Mittwoch findet wie gewohnt das Treffen der Hamburger Ruby Usergroup statt.

