    - id: "rughh-event-49-topic-75"
      title: "oembed - open embed format"
      event_name: "Ruby Usergroup Hamburg - Neujahrstreffen 2013"
      date: "2013-01-09"
      video_provider: "not_recorded"
      video_id: "rughh-event-49-topic-75"
      description: |-
        [oEmbed](http://oembed.com/) is an open format for embedding media from third-party providers, e.g. videos, pictures or tweets. It turns a URL into an embeddable representation of the media content. If, for example, a link to a video is shared on a blog or social network, it can automagically be turned into an embedded video. The talk starts with a summary of oembed considering both API provider and consumer. The second part focuses on how to turn a rails app into an oembed provider.
      speakers:
        - titanoboa

