    - id: "rughh-event-366-topic-506"
      title: "Squashing API Development Bottlenecks -A story of a journey to freedom at XING AG"
      event_name: "Ruby Usergroup Hamburg - November 2016"
      date: "2016-11-09"
      video_provider: "not_recorded"
      video_id: "rughh-event-366-topic-506"
      description: |-
        This is a story about many developers, several codebases building a big product and being represented on the mobile app- the journey to the freedom of contributing code quick and with high quality to big codebases.
        Imagine a bunch of teams working for several products. All these products are represented on web as well as on one mobile app. Having one central mobile and API team can cause a lot of bottleneck situations and slows down the deployments.
        So how to scale in API development when you have fast growing teams and topics? How can you resolve the bottleneck situation with a central API and mobile team?
        Just by adding the the summand of freedom can bring happiness to the equation of
        many devs +big codebase + freedom = happiness
        In this talk I would like to share our experiences and ideas about scaling in API development when you have a fast going developer environment and what the summand freedom means.
      speakers:
        - Uygar Soenmez

    - id: "rughh-event-366-topic-507"
      title: "The boundaries of duck typing and how to properly read Ruby's documentation"
      event_name: "Ruby Usergroup Hamburg - November 2016"
      date: "2016-11-09"
      video_provider: "not_recorded"
      video_id: "rughh-event-366-topic-507"
      description: |-
        A short lesson to A) not rely on undocumented behaviour and B) duck typing fails in spectacular ways in some grey areas of Ruby.

        I've learned this lesson the hard way, by debugging someone else's code that behaved pretty erratically from my point of view.
      speakers:
        - Jan Krutisch

