- id: "rughh-event-197"
  title: "Ruby Usergroup Hamburg - Januar 2015"
  event_name: "Ruby Usergroup Hamburg - Januar 2015"
  date: "2015-01-14"
  video_provider: "children"
  video_id: "rughh-event-197"
  description: |-
    Im Januar, Februar und eventuell sogar März wird es mal wieder darum gehen, den Horizont zu erweitern: Wir sprechen über "neue Programmiersprachen", vor allem über Sprachen, die in Feldern eingesetzt werden, in denen auch Ruby zum Einsatz kommt.
  talks:
    - id: "rughh-event-197-topic-269"
      title: "Surprises in Swift"
      event_name: "Ruby Usergroup Hamburg - Januar 2015"
      date: "2015-01-14"
      video_provider: "not_recorded"
      video_id: "rughh-event-197-topic-269"
      description: |-
        Whenever we learn a new programming language, we are surprised by those traits of the new language that deviate from what we are used to. Let's take a look on the most surprising traits of Swift from a Ruby perspective.
