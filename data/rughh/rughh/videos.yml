- id: "rughh-event-161"
  title: "Ruby Usergroup Hamburg - Juli 2014"
  event_name: "Ruby Usergroup Hamburg - Juli 2014"
  date: "2014-07-09"
  video_provider: "children"
  video_id: "rughh-event-161"
  description: |-
    Und es ist Sommer.

    Wie beim letzten Mal angekündigt, werdet Ihr den Spaß haben zwei Talks die später auf dem Eurucamp gehalten werden sollen zu betatesten. Es wäre aber durchaus noch Platz für 1, 2 weitere kurze Talks, also nur her damit!
  talks:
    - id: "rughh-event-161-topic-223"
      title: "How I tried to self medicate my depression by doing sports"
      event_name: "Ruby Usergroup Hamburg - Juli 2014"
      date: "2014-07-09"
      video_provider: "not_recorded"
      video_id: "rughh-event-161-topic-223"
      description: |-
        In my talk, I'll explain the hows and whys of depression based on what I’ve experienced first hand. You will hear about how I recognized that something might be wrong with my life. I’ll show you the rather unusual way I tried to self medicate my symptoms instead of reaching out to family or friends. A way that was costing me quite some cash and a lot of my free time. You will also hear a few strategies that have helped me dealing with my depression inspiring you to think outside of the box of the "normal" developer life!

        This talk will be held at this years eurucamp and therefore is a test run. I'm excited to be hearing your feedback afterwards.
      speakers:
        - André Cedik

    - id: "rughh-event-161-topic-226"
      title: "Decentralise ALL THE THINGS!"
      event_name: "Ruby Usergroup Hamburg - Juli 2014"
      date: "2014-07-09"
      video_provider: "not_recorded"
      video_id: "rughh-event-161-topic-226"
      description: |-
        The web's original architecture is decentralised, and for good reasons. Somehow, though, we managed to forget that throughout the last years. We use centralised services like twitter, facebook and gmail without thinking (or even blinking). I'm going to argue in this talk that decentralisation matters a lot because it makes the web resilient against technical and non technical threats which are, as we now know, thanks to Snowden, real and not only theoretical. What can we do about it? We need new technologies, but we also need to think about how to find forms of organisations and ways of doing business to accommodate decentralised structures. The future is, indeed, not equally distributed, and it is upon us to fix that.
      speakers:
        - Jan Krutisch

- id: "rughh-event-168"
  title: "Ruby Usergroup Hamburg - August 2014"
  event_name: "Ruby Usergroup Hamburg - August 2014"
  date: "2014-08-13"
  video_provider: "children"
  video_id: "rughh-event-168"
  description: |-
    Es ist immer noch Sommer.

    Vielleicht hast Du schonmal eine öffentliche API entworfen, implementiert oder betreut? Dann interessieren uns Deine Erfahrungen damit! 

    Habt Ihr gems verwendet? Wie macht Ihr das mit der Versionierung? Seit Ihr in Probleme gelaufen wegen (fehlender) Concurrency? Oder weil active record zu langsam war? Vielleicht habt Ihr gleich entschieden, dass ruby für Eure API nicht taugt - auf welche Technologie setzt Ihr stattdessen, und warum?

    Es muss ja nicht gleich ein ganzer Vortrag sein, wir freuen uns auch über ein paar kurze Diskussionsbeiträge.

    Weitere Vorträge sind natürlich auch willkommen - nicht nur zum Thema APIs.
  talks:
    - id: "rughh-event-168-topic-234"
      title: "Operating a high traffic public API with Ruby on Rails"
      event_name: "Ruby Usergroup Hamburg - August 2014"
      date: "2014-08-13"
      video_provider: "not_recorded"
      video_id: "rughh-event-168-topic-234"
      description: |-
        I want to share some experiences that we made while building, maintaining and operating the [XING API](https://dev.xing.com/).

        Topics that I'd like to share:

        - As part of the application, we wrote our own DSL that we use to describe our endpoints.
        - How we test and verify the APIs behavior on a regular basis.
        - Tools that we use to monitor the API.
        - ... and more
      speakers:
        - Jan Ahrens

