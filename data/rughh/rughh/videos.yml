      title: "Codename Amiko: Forking Rails - You can't know if you haven't tried it"
      event_name: "Ruby Usergroup Hamburg - August 2026"
      date: "2026-08-12"
      video_provider: "not_recorded"
      video_id: "rughh-event-2696-topic-4626"
      description: |-
        Under the codename Amiko (Esperanto for "Friend"), a group of people started to wonder, what an actual fork of Rails would look like after DHH, again, had a normal one on his Blog. 

        The group is currently small, but full of experienced, motivated people who are willing to at least try. 

        I'm currently more lurking than anything else, but I am watching the channels and I can give a good, brief summary of what's happening and why. Let's have a discussion afterwards - Does this make sense? Is it necessary? What else could we do? How about framework alternatives like Hanami? Etc. etc. - Bring your opinions, leave the dogwhistles at home, please.
