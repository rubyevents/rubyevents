  description: |-
    Railscasts ist seit über zehn Jahren Geschichte – und fehlt vielen von uns bis heute.
    Mit [Elbcasts.dev](https://elbcasts.dev) knüpfe ich an das Format an:
    *Short screencasts. Real code. Straight from the terminal.*

    Eine gute Folge von Hand zu produzieren, dauert Stunden. Deshalb habe ich eine
    automatisierte Pipeline gebaut, mit der ich mindestens drei neue Folgen pro Woche
    veröffentliche.

    Im Vortrag zeige ich:

    - wie eine Folge von der Idee bis zur Veröffentlichung entsteht
    - welche Schritte automatisiert sind (z. B. Aufnahme / Schnitt / Voice-Over / Untertitel)
    - welche Rolle Ruby & Rails dabei spielen – Elbcasts.dev ist selbst eine Rails-App
    - was nicht funktioniert hat und wo Automatisierung an ihre Grenzen stößt

    Mit Live-Demo, wenn die Vorführeffekte gnädig sind. 😉
  speakers:
    - Mathias Karstädt
