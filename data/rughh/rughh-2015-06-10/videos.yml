  title: "RuboCop - Coding With Style"
  date: "2015-06-10"
  video_provider: "not_recorded"
  video_id: "sebastian-korfmann-rughh-2015-06-10"
  description: |-
    [RuboCop](https://github.com/bbatsov/rubocop) is a static code analyzer for Ruby. Out of the box it will enforce many of the guidelines outlined in the community [Ruby Style Guide](https://github.com/bbatsov/ruby-style-guide).

    Within the company I'm working for, we've agreed on certain styles for our Ruby projects and we're enforcing it via RuboCop. I'll give an overview of the experience we've made with adapting the style guide and using RuboCop over the last year.

    Talk in Deutsch oder Englisch, vermutlich irgendwas um die 15 - 20 Minuten.
