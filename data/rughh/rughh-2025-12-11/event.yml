  **Ho Ho Ho Rubyists,** 🎅💎

  It’s the most wonderful time of the year! Join us for our special **Christmas Edition** of the Ruby Usergroup Hamburg. Let’s wrap up 2025 together with great conversations, festive cheer, and – of course – some Ruby talk.

  Whether you want to discuss the latest gems, reflect on the year's coding challenges, or simply enjoy the company of the community, this is the place to be.

  Whiskey Tango Foxtrot GmbH offered a 'Weihnachtsbäckerei' themed snack station with a selection of holiday baked goods.

  ## Event Details

  * **📅 Date:** Thursday, December 11, 2025
  * **⏰ Time:** 17:00 (5:00 PM) up to 21:00 (9:00 PM)
  * **📍 Location:** Whiskey Tango Foxtrot GmbH, Schäferkampsallee 16, 20357 Hamburg

  **Agenda**

  * 17:00 - Open Doors.
  * 17:00 - 19:00 Networking.
  * 19:00 Let's see what kind of future predictions we had.
  * 19:30 Talks
  * 21:00 move on to some mulled wine.

  Come along to connect with old friends and meet new faces before the holiday break.

  👉 **IMPORTANT: This time it's __not__ on wednesday and it starts earlier and we have to leave earlier but maybe we can join together to get a Glühwein at Sternschanze**

  👉 **INFORMATION: Whisky Tango Foxtrott ist planning to record a reel about the event. Therefore we have two VJs there.**

  We look forward to seeing you there!

  Cheers,
  The Hamburg on Ruby Team
