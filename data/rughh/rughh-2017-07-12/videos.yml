  title: "REST-Assured, fun with API hacking"
  date: "2017-07-12"
  video_provider: "not_recorded"
  video_id: "val-rughh-2017-07-12"
  description: |-
    This workshop is meant to be fun and easy to get started with, not educational per se.
    Participants will need a laptop with ruby installed, the client code can be found here: https://github.com/adaline/rest-assured-client
    I will need a projector and we should be able to connect to each other through wifi (some networks are configures to stop this for security).

    For those new to working with APIs this may be interesting as a little getting started session. For those that want to explore more - we will play a little game where we try and hack our fictional bank. Mixing some basic Ruby, some healthy competition, and a little creative thinking, we will see if we can get filthy (fake) rich by hacking a (fake) bank!
