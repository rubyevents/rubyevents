  description: |-
    Even before starting at my first job generating pdfs was part of life. In this talk I will reflect on the different types of pdf I was generating at different companies, adding some pros and cons of the different approaches including:

    Styling XML documents using XSLT and XSL FO
    draw a rectangle - generating package labels using prawn
    filling the gaps - using word documents and Sablon to create contract documents
    build a report - using erb and weasyprint to create a nicely formatted document
