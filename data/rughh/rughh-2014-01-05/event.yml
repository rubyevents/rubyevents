description: |-
  Am 10. Januar werde ich erst einmal nach Kanada abhauen und ein wenig für [Shopify](http://www.shopify.com/) arbeiten.

  Als kleinen Abschied möchte ich euch alle gerne am Sonntag in die Brooklyn Burger Bar einladen. Die Location ist dann exklusiv für uns reserviert und das Programm wird in etwa so aussehen:

  * 18h Welcome Drinks mit Musik
  * 19h große Burger-Runde zur Selbstbedienung (Homefries/ Salat)
  * Ab 2030h Cocktails und Musik an der Bar, später kleine Snacks

  Mit *25€*, all inclusive, seid ihr dabei, der Rest geht auf mich!

  *Bis 20 Teilnehmer können sich hier anmelden, danach ist voll!*

