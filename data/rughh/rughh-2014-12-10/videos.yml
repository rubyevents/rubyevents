  description: |-
    One Pager sind der letzte Schrei. Wie aber kombiniert man eine AngularJS basierte Front End Site mit einem Content Management System? Meet Alchemy CMS. Das Rails basierte CMS bietet eine sehr flexible JSON API und ist wie geschaffen für eine Angular driven Website.

    Ich möchte ich gerne euch zeigen wie man es nutzt und warum ihr es für euer nächstes Projekt in Betracht ziehen solltet.

    Mehr Infos zu Alchemy CMS findest Du auf http://alchemy-cms.com
