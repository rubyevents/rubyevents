  title: "Datenbankoptimierung"
  date: "2012-08-08"
  video_provider: "not_recorded"
  video_id: "karsten-meier-rughh-2012-08-08"
  description: |-
    Die Magie von ActiveRecord verschleiert oft, dass im Hintergrund unnötige Datenbankoperationen ausgelöst werden. In dem Vortrag möchte ich Optimierungsmöglichkeiten wie z.B.include, join und raw-sql genauer durchleuchten. Ziel ist, dass unsere Anwendungen auch auf klassischen SQL-Datenbanken besser skalieren.
