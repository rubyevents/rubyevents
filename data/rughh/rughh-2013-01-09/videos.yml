- id: "jan-krutisch-rughh-2013-01-09"
  old_id: "rughh-event-49-topic-74"
  title: "Assets, assets, assets (my ass)"
  date: "2013-01-09"
  video_provider: "not_recorded"
  video_id: "jan-krutisch-rughh-2013-01-09"
  description: |-
    Auf einer dieser leidigen Diskussionen auf Twitter zwischen mir und dem werten Kollegen Lennart Koopmann basierend, möchten wir beide mit Euch den Sinn und Unsinn der Asset-Pipeline in Rails diskutieren. Mit folgenden Punkten:

    * Warum gibts die Asset-Pipeline
    * Wie nutzt man die Asset-Pipeline, was sind sinnvolle Erweiterungen (Compass etc.)
    * Was macht bei der Asset-Pipeline ärger, warum will man das eventuell nicht
    * Was sind die Alternativen (Rake-Pipeline etc.)

    Ich bereite ein bisschen Material zur Einleitung vor, will aber ansonsten mit Euch (und vor allem Lennart) diskutieren.
  speakers:
    - Jan Krutisch

- id: "kerstin-puschke-rughh-2013-01-09"
  old_id: "rughh-event-49-topic-75"
  title: "oembed - open embed format"
  date: "2013-01-09"
  video_provider: "not_recorded"
  video_id: "kerstin-puschke-rughh-2013-01-09"
  description: |-
    [oEmbed](http://oembed.com/) is an open format for embedding media from third-party providers, e.g. videos, pictures or tweets. It turns a URL into an embeddable representation of the media content. If, for example, a link to a video is shared on a blog or social network, it can automagically be turned into an embedded video. The talk starts with a summary of oembed considering both API provider and consumer. The second part focuses on how to turn a rails app into an oembed provider.
  speakers:
    - Kerstin Puschke
