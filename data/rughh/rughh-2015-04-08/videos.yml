  description: |-
    Der Einstieg in Ruby ist relativ schwer. Wer erinnert sich noch an die ersten Versuche sein lokales System aufzusetzen? Oft wurde einem geholfen, weil man nicht weiß was man tun muss und warum. Es gibt inzwischen bereits Lösungsansätze die versuchen diese Schwierigkeiten und Hürden herabzusetzen, aber unter dem Strich bleibt es bislang noch immer schwierig als Einsteiger diesen Weg zu meistern.

    Wir (magic labs) werden in diesem Jahr an dem Thema arbeiten und versuchen mit Hilfe von bestehenden und/oder neuen Lösungsansätzen, gestützt durch viel Kommunikation mit Maintainern und Beginnern, neue Wege zu finden.
