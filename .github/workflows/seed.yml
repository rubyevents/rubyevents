name: Seed

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment to seed
        type: choice
        required: true
        default: production
        options:
          - staging
          - production

jobs:
  seed:
    name: Seed ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run db:seed:all on ${{ inputs.environment }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          destination=""

          if [ "$ENVIRONMENT" != "production" ]; then
            destination="-d $ENVIRONMENT"
          fi

          bundle exec kamal app exec --reuse "bin/rails db:seed:all" $destination
